/* ============================================================================
   ORGANIC EDITORIAL DESIGN SYSTEM — WARM SKIN-TONE & SOFT CURVES
   Designed to feel like a calm, tactile studio notebook rather than a boxy AI UI
   ============================================================================ */
:root, [data-theme="skin"] {

  --border-subtle: rgba(138, 105, 86, 0.13);
  --border-strong: rgba(138, 105, 86, 0.24);
  --accent-primary: #c47457;
  --accent-primary-hover: #b06246;
  --accent-primary-fg: #fffaf6;
  --accent-primary-bg: rgba(196, 116, 87, 0.13);
  --accent-secondary: #567a67;
  --status-success: #3f7a5c;
  --status-success-bg: rgba(63, 122, 92, 0.12);
  --status-warning: #b8732a;
  --status-warning-bg: rgba(184, 115, 42, 0.13);
  --status-danger: #c24d45;
  --status-danger-bg: rgba(194, 77, 69, 0.12);

  --shadow-hover: 0 20px 44px -12px rgba(120, 74, 48, 0.14), 0 4px 12px rgba(78, 52, 36, 0.06);
  --shadow-pill: 0 4px 14px rgba(196, 116, 87, 0.25);
  --focus-ring: 0 0 0 3px rgba(196, 116, 87, 0.35);
}

[data-theme="matcha"] {

  --bg-gradient: radial-gradient(circle at 15% 10%, #e5ede0 0%, #f5f7f2 50%, #eef2e9 100%);
  --bg-surface: rgba(255, 255, 253, 0.90);
  --bg-elevated: #e7ede2;
  --bg-subtle: #dfe7d9;
  --bg-glass: rgba(245, 247, 242, 0.84);

  --text-secondary: #46574c;

  --accent-primary-hover: #3e684f;
  --accent-primary-fg: #f8fcf9;
  --accent-primary-bg: rgba(77, 124, 96, 0.13);
  --accent-secondary: #b57c56;
  --shadow-soft: 0 14px 38px -12px rgba(38, 62, 46, 0.08), 0 2px 8px rgba(38, 62, 46, 0.04);
  --shadow-hover: 0 20px 44px -12px rgba(38, 62, 46, 0.14);
  --shadow-pill: 0 4px 14px rgba(77, 124, 96, 0.24);
  --focus-ring: 0 0 0 3px rgba(77, 124, 96, 0.35);
}

[data-theme="rose"] {
  --bg-canvas: #fdf7f6;
  --bg-gradient: radial-gradient(circle at 12% 8%, #f8e7e5 0%, #fdf7f6 52%, #f9eeec 100%);

  --bg-elevated: #f5e6e4;
  --bg-subtle: #eedbd8;
  --bg-glass: rgba(253, 247, 246, 0.84);

  --shadow-hover: 0 20px 44px -12px rgba(88, 45, 52, 0.14);
  --shadow-pill: 0 4px 14px rgba(184, 101, 113, 0.24);
  --focus-ring: 0 0 0 3px rgba(184, 101, 113, 0.35);
}

[data-theme="espresso"] {
  --bg-canvas: #191513;
  --bg-gradient: radial-gradient(circle at 15% 8%, #261f1b 0%, #191513 55%, #14110f 100%);

  --bg-elevated: #2e2622;

  --accent-primary-hover: #eba68d;

  --accent-secondary: #83ad95;

  --status-success-bg: rgba(111, 194, 150, 0.14);
  --status-warning: #efb567;
  --status-warning-bg: rgba(239, 181, 103, 0.14);
  --status-danger: #f0827b;
  --status-danger-bg: rgba(240, 130, 123, 0.14);
  --status-info: #85b4d9;
  --status-info-bg: rgba(133, 180, 217, 0.14);
  --shadow-soft: 0 16px 40px -12px rgba(0, 0, 0, 0.45);
  --shadow-hover: 0 22px 48px -12px rgba(0, 0, 0, 0.65);
  --shadow-pill: 0 4px 16px rgba(223, 146, 118, 0.25);
  --focus-ring: 0 0 0 3px rgba(223, 146, 118, 0.4);
}

:root {
  --font-sans: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-serif: "Newsreader", "Georgia", "Cambria", serif;
  --font-mono: "JetBrains Mono", "Fira Code", Consolas, monospace;
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --radius-pill: 999px;
  --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
  animation-duration: 0.01ms !important;
  transition-duration: 0.01ms !important;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  max-width: 100%;
  overflow-x: hidden;
}

body {
  font-family: var(--font-sans);
  background: var(--bg-canvas);
  background-image: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-primary);
  line-height: 1.65;
  font-size: 15.5px;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  transition: background-color 420ms var(--ease-smooth), color 320ms var(--ease-smooth);
}

a {
  color: var(--accent-primary);
  text-decoration: underline;
  text-underline-offset: 3px;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.skip-link {
  position: absolute;
  top: -100px;
  left: 20px;
  background: var(--accent-primary);
  color: var(--accent-primary-fg);
  font-weight: 700;
  padding: 10px 18px;
  border-radius: var(--radius-pill);
  z-index: 9999;
}
.skip-link:focus {
  top: 14px;
}

/* ============================================================================
   TOP FLOATING HORIZONTAL NAVIGATION & PALETTE HEADER
   ============================================================================ */
.top-header {
  position: sticky;
  top: 0;
  z-index: 150;
  background: var(--bg-glass);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border-subtle);
  padding: 12px 24px;
  transition: background 320ms var(--ease-smooth);
}

.header-inner {
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.header-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
  width: 100%;
}

.header-nav-row {
  display: flex;
  justify-content: center;
  width: 100%;
}

.brand-cluster {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-orb {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  color: var(--accent-primary-fg);
  font-weight: 800;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-pill);
}

.brand-name {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.02em;
}

.brand-tag {
  font-size: 12px;
  color: var(--text-muted);
}

/* Horizontal Pill Tab Bar with Smooth Gliding Active State */
.horiz-tab-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 5px;
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-pill);
  overflow-x: auto;
  max-width: 100%;
  min-width: 0;
  scrollbar-width: none;
}
.horiz-tab-bar::-webkit-scrollbar {
  display: none;
}

.tab-pill-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13.5px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: color 240ms var(--ease-spring), background-color 260ms var(--ease-spring), transform 200ms var(--ease-spring), box-shadow 260ms var(--ease-spring);
}

.tab-pill-btn:hover {
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.35);
}

.tab-pill-btn.active {
  background: var(--accent-primary);
  color: var(--accent-primary-fg);
  box-shadow: var(--shadow-pill);
  transform: translateY(-1px);
}

.tab-count {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 1px 7px;
  border-radius: var(--radius-pill);
  background: rgba(0, 0, 0, 0.08);
  color: inherit;
}

.tab-pill-btn.active .tab-count {
  background: rgba(255, 255, 255, 0.22);
}

/* Right Actions & Palette Drawer Trigger */
.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  max-width: 100%;
  min-width: 0;
}

.palette-swatches {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  background: var(--bg-elevated);
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-subtle);
}

.swatch-btn {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 200ms var(--ease-spring), border-color 200ms var(--ease-spring);
}

.swatch-btn:hover {
  transform: scale(1.14);
}

.swatch-btn.active {
  border-color: var(--text-primary);
  transform: scale(1.12);
}

/* Settings Popover Drawer */
.settings-popover {
  position: fixed;
  top: 72px;
  right: 24px;
  width: 340px;
  max-width: calc(100vw - 32px);
  background: var(--bg-surface);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-md);
  padding: 20px;
  box-shadow: var(--shadow-hover);
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  transform: translateY(-10px) scale(0.98);
  transition: opacity 240ms var(--ease-spring), transform 240ms var(--ease-spring);
}

.settings-popover.open {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}

/* ============================================================================
   MAIN CONTAINER & ULTRA-SMOOTH VIEW TRANSITIONS
   ============================================================================ */
.main-content {
  max-width: 1240px;
  width: 100%;
  margin: 0 auto;
  padding: 28px 24px 80px;
  min-width: 0;
}

@keyframes viewGlideIn {
  0% {
    opacity: 0;
    transform: translateY(14px) scale(0.992);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes cardFloatIn {
  0% {
    opacity: 0;
    transform: translateY(16px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

.view-stage {
  animation: viewGlideIn 380ms var(--ease-spring) both;
}

/* Segmented Sub-Tab Bar inside Views */
.subtab-bar {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px;
  background: var(--bg-elevated);
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-subtle);
  margin-bottom: 22px;
  flex-wrap: wrap;
}

.subtab-btn {
  padding: 7px 16px;
  border-radius: var(--radius-pill);
  border: none;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 240ms var(--ease-spring);
}

.subtab-btn.active {
  background: var(--bg-surface);
  color: var(--text-primary);
  box-shadow: var(--shadow-soft);
}

/* Organic Hero & Panels */
.hero-sanctuary {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  padding: 32px 36px;
  box-shadow: var(--shadow-soft);
  margin-bottom: 24px;
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: 28px;
  align-items: center;
}

.hero-sanctuary > * {
  min-width: 0;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 14px;
  border-radius: var(--radius-pill);
  background: var(--accent-primary-bg);
  color: var(--accent-primary);
  font-size: 12.5px;
  font-weight: 700;
  margin-bottom: 12px;
}

.hero-title {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.025em;
  line-height: 1.25;
  color: var(--text-primary);
}

.hero-subtitle {
  color: var(--text-secondary);
  font-size: 15px;
  margin-top: 10px;
  max-width: 62ch;
}

.spotlight-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 22px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: transform 280ms var(--ease-spring), box-shadow 280ms var(--ease-spring);
}

.spotlight-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-hover);
}

/* Rhythm Quick Chips */
.rhythm-chip-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.rhythm-chip {
  padding: 8px 15px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 220ms var(--ease-spring);
}

.rhythm-chip:hover {
  border-color: var(--accent-primary);
  color: var(--text-primary);
  transform: translateY(-1px);
}

.rhythm-chip.active {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
  color: var(--accent-primary-fg);
  box-shadow: var(--shadow-pill);
}

/* Soft Cards & Grids */
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}

.page-title {
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.28;
}

.page-desc {
  color: var(--text-secondary);
  font-size: 14.5px;
  margin-top: 6px;
  max-width: 72ch;
}

.grid-4 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 20px;
  margin-bottom: 24px;
}

.panel {
  min-width: 0;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 22px 24px;
  box-shadow: var(--shadow-soft);
  transition: transform 280ms var(--ease-spring), box-shadow 280ms var(--ease-spring), border-color 240ms var(--ease-spring);
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-subtle);
  flex-wrap: wrap;
}

.panel-title {
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}

.stat-value {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 800;
  line-height: 1.2;
  margin-top: 6px;
}

.stat-label {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.stat-sub {
  font-size: 12.5px;
  color: var(--text-secondary);
  margin-top: 6px;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border-subtle);
  background: var(--bg-elevated);
  white-space: nowrap;
}

.pill-mono {
  font-family: var(--font-mono);
}

.pill-success {
  border-color: rgba(63, 122, 92, 0.3);
  background: var(--status-success-bg);
  color: var(--status-success);
}

.pill-warning {
  border-color: rgba(184, 115, 42, 0.3);
  background: var(--status-warning-bg);
  color: var(--status-warning);
}

.pill-info {
  border-color: rgba(77, 114, 143, 0.3);
  background: var(--status-info-bg);
  color: var(--status-info);
}

.pill-danger {
  border-color: rgba(194, 77, 69, 0.3);
  background: var(--status-danger-bg);
  color: var(--status-danger);
}

/* Soft Tactile Buttons */
.btn, .ctrl-btn, .ctrl-select {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 8px 18px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-strong);
  background: var(--bg-surface);
  color: var(--text-primary);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 220ms var(--ease-spring), background-color 220ms var(--ease-spring), border-color 220ms var(--ease-spring), box-shadow 220ms var(--ease-spring);
}

.ctrl-select {
  border-radius: var(--radius-sm);
  padding: 8px 14px;
}

.btn:hover:not(:disabled), .ctrl-btn:hover:not(:disabled), .ctrl-select:hover:not(:disabled) {
  border-color: var(--accent-primary);
  transform: translateY(-1px);
  box-shadow: var(--shadow-soft);
}

.btn:active:not(:disabled) {
  transform: translateY(0);
}

.btn:disabled {
  opacity: 0.48;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
  color: var(--accent-primary-fg);
  box-shadow: var(--shadow-pill);
}

.btn-primary:hover:not(:disabled) {
  background: var(--accent-primary-hover);
  border-color: var(--accent-primary-hover);
}

.btn-success {
  background: var(--status-success);
  border-color: var(--status-success);
  color: #ffffff;
}

/* Filter Bar & Lesson Cards */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-soft);
}

.search-input {
  flex: 1 1 240px;
  min-height: 42px;
  padding: 9px 16px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-strong);
  background: var(--bg-canvas);
  font-size: 14px;
}

.lesson-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 18px;
}

.lesson-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 20px 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 14px;
  box-shadow: var(--shadow-soft);
  animation: cardFloatIn 360ms var(--ease-spring) both;

  border-bottom: none;

}

  font-weight: 800;

  margin-bottom: 12px;

, "PROJECT-05"]}, {"id": "GATE-6", "title": "Gate 6 — Sẵn sàng ứng tuyển", "question": "Có thể chứng minh năng lực và giới hạn thật, không chỉ kể tên công nghệ?", "verification_example": "Trình diễn project, giải thích một bug khó, trình bày test, trade-off, giới hạn và đóng góp cá nhân.", "criteria": ["Có một dự án chuyên môn giải thích được sâu ở mức junior.", "Có README, test, demo hoặc hướng dẫn chạy.", "Có thể trình bày một bug khó, cách debug, quyết định và trade-off.", "Có thể giải một số bài DSA cơ bản theo quy trình và giải thích kiến thức nền tảng.", "Biết rõ điểm mạnh, điểm yếu và kế hoạch bổ sung; không tuyên bố biết công nghệ chỉ vì đã xem tutorial."], "recovery_lessons": ["DSA-029", "SE-008", "EN-014", "PROJECT-07"]}], "lessons": [{"id": "CPP-001", "sort": 1, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C0 — Làm quen với việc lập trình", "sem": "HK1", "sup": false, "title": "Máy tính, chương trình và lệnh", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-002"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "2e95cd30258d750f", "substeps": [], "sec": {"exp": "<p>Máy tính nhận dữ liệu, thực hiện các bước đã được định nghĩa và tạo kết quả. “Chương trình” là những chỉ dẫn đủ chính xác để máy thực hiện; “thuật toán” là cách giải vấn đề, có thể mô tả bằng ngôn ngữ thường trước khi viết code.</p>", "ex": "<p>Tính tổng hai số: input là <code class=\"inline-code\">a</code> và <code class=\"inline-code\">b</code>; xử lý là <code class=\"inline-code\">sum = a + b</code>; output là <code class=\"inline-code\">sum</code>. Với <code class=\"inline-code\">a=3, b=5</code>, kết quả 8.</p>", "clar": "<p>Máy tính không tự hiểu ý định mơ hồ như “tính cho hợp lý”; quy tắc phải chỉ rõ. Cùng chương trình nhưng input khác có thể cho output khác.</p>", "ext": "<p>Mô hình input–process–output cũng xuất hiện trong hàm, API và pipeline dữ liệu.</p>", "check": "<p>Với chương trình đổi độ C sang độ F, hãy nêu input, công thức xử lý và output.</p>", "sync": "<ul>\n<li><strong>Mục tiêu:</strong> phân biệt phần cứng, hệ điều hành, chương trình và dữ liệu đầu vào/đầu ra ở mức trực quan.</li>\n<li><strong>Học:</strong> chương trình là tập lệnh; input → xử lý → output; cùng dữ liệu và quy tắc thì kết quả có thể dự đoán.</li>\n<li><strong>Thực hành:</strong> mô tả thuật toán pha nước/ tính tổng theo 3 bước input-process-output.</li>\n<li><strong>Đạt khi:</strong> tự xác định được input, process, output của 3 tình huống đời thường.</li>\n</ul>"}}, {"id": "CPP-002", "sort": 2, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C0 — Làm quen với việc lập trình", "sem": "HK1", "sup": false, "title": "Mã nguồn, compiler và executable", "estStatus": "not_estimated", "depStatus": "reviewed", "reqPrereqs": ["CPP-001"], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-003"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "a98651c68ddf72c8", "substeps": [], "sec": {"exp": "<p>Mã nguồn là văn bản người viết; compiler kiểm tra và dịch mã nguồn C++ thành dạng máy có thể chạy (thường qua các bước tiền xử lý, biên dịch, liên kết); executable là chương trình đã tạo. IDE hỗ trợ viết/build/debug nhưng không đồng nghĩa với compiler.</p>", "ex": "<p><code class=\"inline-code\">hello.cpp</code> chứa mã C++; compiler tạo chương trình chạy được. Nếu thiếu dấu <code class=\"inline-code\">;</code>, build có thể thất bại trước khi chương trình chạy.</p>", "clar": "<p>Compile error xảy ra khi tạo chương trình; runtime error xảy ra khi đang chạy; logic bug là chạy được nhưng kết quả sai. Đừng gọi cả ba là “lỗi compiler”.</p>", "ext": "<p>Build system như CMake tổ chức việc build nhiều file, nhưng người mới chỉ cần hiểu quy trình nguồn → build → chạy.</p>", "check": "<p>Nếu cửa sổ hiện lỗi trước khi có output nào, thông tin nào cần đọc trước?</p>", "sync": "<ul>\n<li><strong>Tiên quyết:</strong> CPP-001.</li>\n<li><strong>Học:</strong> file mã nguồn <code class=\"inline-code\">.cpp</code>; compiler dịch mã; chương trình thực thi; khác nhau giữa viết, biên dịch và chạy.</li>\n<li><strong>Thực hành:</strong> nhận diện file nguồn, lỗi biên dịch và kết quả khi chạy một ví dụ.</li>\n<li><strong>Đạt khi:</strong> kể đúng các bước từ code đến output, không nhầm compiler với IDE.</li>\n</ul>"}}, {"id": "CPP-003", "sort": 3, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C0 — Làm quen với việc lập trình", "sem": "HK1", "sup": false, "title": "Cài/ mở môi trường và tạo project đầu tiên", "estStatus": "not_estimated", "depStatus": "reviewed", "reqPrereqs": ["CPP-002"], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-004"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "904b77e13d9d88f6", "substeps": [], "sec": {"exp": "<p>Môi trường phát triển gồm trình soạn thảo/IDE, compiler và cấu hình build. Một project cần được lưu ở vị trí xác định, có thể mở lại và chạy lại bằng quy trình lặp lại.</p>", "ex": "<p>Tạo project <code class=\"inline-code\">hello</code>, thêm <code class=\"inline-code\">main.cpp</code>, build, run, sửa dòng in và build lại. Cuối cùng đóng IDE rồi mở project từ thư mục đã lưu.</p>", "clar": "<p>Một lần chạy thành công bằng nút “Run” không có nghĩa project đã lưu đúng hoặc máy đã cấu hình tái lập. Không ép một IDE nếu trường đã dùng môi trường khác.</p>", "ext": "<p>Ghi lại phiên bản compiler và lệnh build trong README khi project lớn hơn.</p>", "check": "<p>Bạn có thể mở lại project sau khi khởi động lại máy mà không làm theo video không?</p>", "sync": "<ul>\n<li><strong>Học:</strong> chọn đúng compiler/IDE theo máy và trường; tạo file; build/run; lưu file đúng thư mục.</li>\n<li><strong>Thực hành:</strong> tạo project nhỏ và chạy được chương trình mẫu do trường dùng.</li>\n<li><strong>Đạt khi:</strong> có thể tự mở lại project, biên dịch và chạy mà không cần video hướng dẫn.</li>\n<li><strong>Ghi chú:</strong> không ép một IDE cụ thể; ưu tiên môi trường giảng viên đang dùng.</li>\n</ul>"}}, {"id": "CPP-004", "sort": 4, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C0 — Làm quen với việc lập trình", "sem": "HK1", "sup": false, "title": "`main`, câu lệnh, dấu chấm phẩy và ngoặc", "estStatus": "not_estimated", "depStatus": "reviewed", "reqPrereqs": ["CPP-003"], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-005"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f6c8a2e11efe810f", "substeps": [], "sec": {"exp": "<p>Hàm <code class=\"inline-code\">main</code> là điểm bắt đầu thông thường của chương trình C++. Dấu <code class=\"inline-code\">{}</code> xác định khối; nhiều câu lệnh kết thúc bằng <code class=\"inline-code\">;</code>. C++ phân biệt chữ hoa và chữ thường.</p>", "ex": "<p><code class=\"inline-code\">int main() { std::cout &lt;&lt; \"Hi\"; return 0; }</code> là dạng tối thiểu quen thuộc; bỏ <code class=\"inline-code\">;</code> sau biểu thức thường gây lỗi cú pháp.</p>", "clar": "<p>Ngoặc tròn <code class=\"inline-code\">()</code> dùng trong khai báo/gọi hàm và điều kiện; ngoặc nhọn <code class=\"inline-code\">{}</code> bao khối; dấu <code class=\"inline-code\">;</code> kết thúc câu lệnh. Compiler thường chỉ vị trí phát hiện lỗi, không phải lúc nào cũng đúng chính xác nơi gây lỗi.</p>", "ext": "<p>Đọc thông báo lỗi từ dòng đầu tiên có ích thường hiệu quả hơn sửa nhiều dòng ngẫu nhiên.</p>", "check": "<p>Trong một chương trình ngắn, chỉ ra đâu là <code class=\"inline-code\">main</code>, khối lệnh và các dấu kết thúc câu lệnh.</p>", "sync": "<ul>\n<li><strong>Học:</strong> hàm <code class=\"inline-code\">main</code>, khối <code class=\"inline-code\">{}</code>, câu lệnh kết thúc bằng <code class=\"inline-code\">;</code>, phân biệt chữ hoa/chữ thường.</li>\n<li><strong>Thực hành:</strong> sửa 5 lỗi cú pháp nhỏ.</li>\n<li><strong>Đạt khi:</strong> xác định được vị trí lỗi ngoặc/<code class=\"inline-code\">;</code> cơ bản và hiểu thông báo compiler ở mức đầu tiên.</li>\n</ul>"}}, {"id": "CPP-005", "sort": 5, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C0 — Làm quen với việc lập trình", "sem": "HK1", "sup": false, "title": "In ra màn hình với `std::cout`", "estStatus": "not_estimated", "depStatus": "reviewed", "reqPrereqs": ["CPP-004"], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-007"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f82e6c397c414b5e", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">std::cout</code> ghi dữ liệu ra output chuẩn. <code class=\"inline-code\">&lt;&lt;</code> đưa giá trị vào luồng; ký tự xuống dòng thường được viết là <code class=\"inline-code\">\\n</code> trong chuỗi C++. <code class=\"inline-code\">#include &lt;iostream&gt;</code> khai báo các thành phần luồng nhập/xuất tiêu chuẩn.</p>", "ex": "<p><code class=\"inline-code\">std::cout &lt;&lt; \"Total: \" &lt;&lt; 8 &lt;&lt; '\\n';</code> in <code class=\"inline-code\">Total: 8</code> rồi xuống dòng. Nhiều phép <code class=\"inline-code\">&lt;&lt;</code> được thực hiện theo thứ tự biểu thức.</p>", "clar": "<p><code class=\"inline-code\">std::cout</code> không tự thêm khoảng trắng hay xuống dòng. Thiếu header hoặc viết sai <code class=\"inline-code\">std</code> có thể khiến chương trình không compile.</p>", "ext": "<p>Định dạng số thập phân có thể học sau bằng <code class=\"inline-code\">&lt;iomanip&gt;</code>; ban đầu ưu tiên output dễ đọc và đúng yêu cầu.</p>", "check": "<p>Dự đoán output của hai lệnh <code class=\"inline-code\">cout</code> có và không có ký tự xuống dòng <code class=\"inline-code\">\\n</code>.</p>", "sync": "<ul>\n<li><strong>Học:</strong> <code class=\"inline-code\">#include &lt;iostream&gt;</code>, <code class=\"inline-code\">std::cout</code>, <code class=\"inline-code\">&lt;&lt;</code>, <code class=\"inline-code\">\\n</code>.</li>\n<li><strong>Thực hành:</strong> in tên project, ba dòng văn bản, số nguyên và phép tính đơn giản.</li>\n<li><strong>Quiz:</strong> dự đoán thứ tự output; tìm lỗi thiếu header/cú pháp.</li>\n<li><strong>Đạt khi:</strong> tự viết chương trình in output đúng định dạng.</li>\n</ul>"}}, {"id": "CPP-006", "sort": 6, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C0 — Làm quen với việc lập trình", "sem": "HK1", "sup": false, "title": "Comment, tên biến và định dạng code", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "8c599195881daead", "substeps": [], "sec": {"exp": "<p>Comment giúp giải thích lý do, giả định hay quyết định không hiển nhiên; tên biến nên nói dữ liệu có ý nghĩa gì. Định dạng nhất quán giảm chi phí đọc code.</p>", "ex": "<p>Thay <code class=\"inline-code\">double x;</code> bằng <code class=\"inline-code\">double averageScore;</code> khi biến lưu điểm trung bình. Comment “tăng i lên 1” thường thừa nếu ngay dưới là <code class=\"inline-code\">++i</code>.</p>", "clar": "<p>Comment có thể sai lệch nếu code thay đổi mà comment không cập nhật. Tên biến rõ tốt hơn comment dài giải thích một dòng code khó đọc.</p>", "ext": "<p>Dùng formatter tự động ở giai đoạn sau, nhưng formatter không thể biến logic sai thành đúng.</p>", "check": "<p>Đọc một đoạn code 10 dòng: có biến nào tên quá mơ hồ và comment nào đã dư thừa?</p>", "sync": "<ul>\n<li><strong>Học:</strong> <code class=\"inline-code\">//</code>, comment giải thích lý do, tên biến mô tả ý nghĩa, thụt lề nhất quán.</li>\n<li><strong>Thực hành:</strong> đổi tên <code class=\"inline-code\">a</code>, <code class=\"inline-code\">b</code>, <code class=\"inline-code\">c</code> thành tên diễn tả dữ liệu; xóa comment thừa.</li>\n<li><strong>Đạt khi:</strong> bạn khác có thể đọc code ngắn mà không cần hỏi ý nghĩa từng biến.</li>\n</ul>"}}, {"id": "CPP-007", "sort": 7, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C1 — Dữ liệu, biến và biểu thức", "sem": "HK1", "sup": false, "title": "Biến là gì; khai báo và gán", "estStatus": "not_estimated", "depStatus": "reviewed", "reqPrereqs": ["CPP-005"], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "db9ad0b45480f6ec", "substeps": [], "sec": {"exp": "<p>Biến là tên gắn với một vùng lưu trữ/giá trị theo kiểu dữ liệu. Khai báo giới thiệu biến; khởi tạo cung cấp giá trị ban đầu; phép gán cập nhật giá trị hiện có.</p>", "ex": "<p><code class=\"inline-code\">int count = 2; count = count + 1;</code> làm giá trị <code class=\"inline-code\">count</code> chuyển từ 2 sang 3. Vế phải được tính trước khi gán vào vế trái.</p>", "clar": "<p><code class=\"inline-code\">=</code> là phép gán; <code class=\"inline-code\">==</code> là so sánh bằng. Biến chưa được khởi tạo cục bộ kiểu số không nên bị đọc như thể có giá trị mặc định đáng tin cậy.</p>", "ext": "<p>Chọn tên theo đơn vị (ví dụ <code class=\"inline-code\">durationSeconds</code>) giúp tránh lỗi nhầm đơn vị.</p>", "check": "<p>Sau ba phép gán, hãy trace chính xác giá trị biến tại mỗi bước.</p>", "sync": "<ul>\n<li><strong>Tiên quyết:</strong> CPP-005.</li>\n<li><strong>Học:</strong> biến có tên/kiểu/giá trị; khai báo, khởi tạo, gán lại; <code class=\"inline-code\">=</code> là gán chứ không phải so sánh.</li>\n<li><strong>Thực hành:</strong> lưu tuổi, điểm số, số lượng rồi in ra.</li>\n<li><strong>Đạt khi:</strong> phân biệt khai báo, khởi tạo và cập nhật giá trị.</li>\n</ul>"}}, {"id": "CPP-008", "sort": 8, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C1 — Dữ liệu, biến và biểu thức", "sem": "HK1", "sup": false, "title": "Kiểu `int`, `double`, `char`, `bool`", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "6c85d8bfc8c156d1", "substeps": [], "sec": {"exp": "<p>Kiểu dữ liệu giới hạn cách diễn giải và các phép toán hợp lệ: <code class=\"inline-code\">int</code> cho số nguyên, <code class=\"inline-code\">double</code> cho số thực dấu phẩy động, <code class=\"inline-code\">char</code> cho một đơn vị ký tự, <code class=\"inline-code\">bool</code> cho true/false.</p>", "ex": "<p>Lưu số lượng quyển sách trong <code class=\"inline-code\">int</code>; điểm trung bình như 7.25 có thể dùng <code class=\"inline-code\">double</code>; trạng thái mượn/trả có thể dùng <code class=\"inline-code\">bool</code>.</p>", "clar": "<p><code class=\"inline-code\">double</code> không biểu diễn chính xác mọi số thập phân; <code class=\"inline-code\">char</code> không tương đương với một chuỗi Unicode hoàn chỉnh. Với tiền bạc, lựa chọn kiểu còn phụ thuộc yêu cầu chính xác.</p>", "ext": "<p>Khi cần tiền chính xác theo đơn vị nhỏ, có thể lưu số nguyên xu/đồng nhỏ nhất thay vì tính tiền bằng floating-point.</p>", "check": "<p>Kiểu nào phù hợp cho số lượng sách, trung bình điểm và trạng thái còn hàng?</p>", "sync": "<ul>\n<li><strong>Học:</strong> dữ liệu nguyên, số thực, ký tự, đúng/sai; chọn kiểu phù hợp.</li>\n<li><strong>Thực hành:</strong> mô hình hóa số lượng hàng, giá, ký tự phân loại và trạng thái.</li>\n<li><strong>Đạt khi:</strong> giải thích được vì sao số tiền/điểm trung bình không nên luôn lưu bằng <code class=\"inline-code\">int</code>.</li>\n</ul>"}}, {"id": "CPP-009", "sort": 9, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C1 — Dữ liệu, biến và biểu thức", "sem": "HK1", "sup": false, "title": "`std::string` và dữ liệu văn bản", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "31bd515d6c839447", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">std::string</code> giữ chuỗi văn bản và có thể ghép với chuỗi khác bằng <code class=\"inline-code\">+</code>. <code class=\"inline-code\">char</code> biểu diễn một đơn vị ký tự, còn <code class=\"inline-code\">string</code> là chuỗi có độ dài thay đổi.</p>", "ex": "<p><code class=\"inline-code\">std::string name = \"An\"; std::string greeting = \"Hello, \" + name;</code> tạo <code class=\"inline-code\">Hello, An</code>.</p>", "clar": "<p>Đừng dùng <code class=\"inline-code\">char</code> để giữ cả họ tên. Trong UTF-8, một ký tự tiếng Việt có thể chiếm nhiều byte; <code class=\"inline-code\">std::string::size()</code> đếm đơn vị byte, không nhất thiết đếm ký tự người dùng nhìn thấy.</p>", "ext": "<p>Đọc/đếm Unicode đúng cần hiểu encoding và thư viện phù hợp; chưa cần mở rộng này ở bài đầu.</p>", "check": "<p>Vì sao <code class=\"inline-code\">std::string</code> phù hợp cho tên người hơn <code class=\"inline-code\">char</code>?</p>", "sync": "<ul>\n<li><strong>Học:</strong> chuỗi ký tự, khai báo <code class=\"inline-code\">std::string</code>, nối chuỗi ở mức cơ bản.</li>\n<li><strong>Thực hành:</strong> tạo lời chào có chứa tên; in câu gồm nhiều dữ liệu.</li>\n<li><strong>Đạt khi:</strong> xử lý được input văn bản đơn giản và phân biệt char với string.</li>\n</ul>"}}, {"id": "CPP-010", "sort": 10, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C1 — Dữ liệu, biến và biểu thức", "sem": "HK1", "sup": false, "title": "Nhập dữ liệu với `std::cin`", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "df1590e6834e77cb", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">std::cin</code> đọc dữ liệu từ input chuẩn; toán tử <code class=\"inline-code\">&gt;&gt;</code> thường tách dữ liệu theo khoảng trắng. Input từ người dùng có thể sai định dạng, nên sau này cần kiểm tra trạng thái đọc.</p>", "ex": "<p>Khi nhập <code class=\"inline-code\">12 5</code>, <code class=\"inline-code\">std::cin &gt;&gt; a &gt;&gt; b;</code> đọc hai số vào hai biến theo thứ tự.</p>", "clar": "<p><code class=\"inline-code\">cin &gt;&gt; name</code> thường dừng ở khoảng trắng đầu tiên, nên không đọc đủ họ tên có dấu cách. Nếu đọc sai kiểu, trạng thái stream có thể lỗi và cần xử lý thay vì cứ tiếp tục dùng biến.</p>", "ext": "<p><code class=\"inline-code\">getline</code> phù hợp khi cần đọc cả dòng; bài CPP-032 giải quyết phối hợp <code class=\"inline-code\">&gt;&gt;</code> và <code class=\"inline-code\">getline</code>.</p>", "check": "<p>Nếu nhập “Nguyen Van A” bằng <code class=\"inline-code\">cin &gt;&gt; name</code>, biến nhận được phần nào?</p>", "sync": "<ul>\n<li><strong>Học:</strong> luồng nhập; <code class=\"inline-code\">&gt;&gt;</code>; lưu input vào biến; input là dữ liệu cần kiểm tra.</li>\n<li><strong>Thực hành:</strong> hỏi tên, tuổi, hai số rồi in kết quả.</li>\n<li><strong>Đạt khi:</strong> chương trình nhận input và trả output đúng; giải thích được thứ tự nhập.</li>\n</ul>"}}, {"id": "CPP-011", "sort": 11, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C1 — Dữ liệu, biến và biểu thức", "sem": "HK1", "sup": false, "title": "Toán tử số học", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-013"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "e0dc1cfe89527450", "substeps": [], "sec": {"exp": "<p>Toán tử số học thực hiện phép cộng, trừ, nhân, chia và phần dư. Với hai toán hạng nguyên, phép <code class=\"inline-code\">/</code> cho thương nguyên theo quy tắc C++; phần lẻ bị bỏ theo hướng về 0.</p>", "ex": "<p><code class=\"inline-code\">5 / 2</code> cho 2; <code class=\"inline-code\">5.0 / 2</code> cho 2.5; <code class=\"inline-code\">5 % 2</code> cho 1. Khi đổi 367 giây: phút là <code class=\"inline-code\">367 / 60 = 6</code>, giây còn lại là <code class=\"inline-code\">367 % 60 = 7</code>.</p>", "clar": "<p>Chia cho 0 là không hợp lệ. Dùng ngoặc để thể hiện thứ tự mong muốn; khi số nguyên có dấu bị tràn, hành vi có thể không xác định trong C++, nên đừng dựa vào “quay vòng”.</p>", "ext": "<p>Kiểm tra miền giá trị của dữ liệu trước phép toán; kiểu số rộng hơn không tự giải quyết mọi nguy cơ tràn.</p>", "check": "<p>Tính bằng tay <code class=\"inline-code\">7/2</code>, <code class=\"inline-code\">7.0/2</code>, <code class=\"inline-code\">7%2</code> và giải thích sự khác nhau.</p>", "sync": "<ul>\n<li><strong>Học:</strong> <code class=\"inline-code\">+ - * / %</code>; thứ tự phép toán; chia nguyên và chia số thực.</li>\n<li><strong>Thực hành:</strong> chuyển giây thành phút/giây; tính trung bình; kiểm tra số chẵn/lẻ.</li>\n<li><strong>Lỗi thường gặp:</strong> dùng <code class=\"inline-code\">int</code> cho phép chia cần phần thập phân; chia cho 0.</li>\n<li><strong>Đạt khi:</strong> dự đoán đúng kết quả ít nhất 8/10 biểu thức và nêu được khi nào cần <code class=\"inline-code\">double</code>.</li>\n</ul>"}}, {"id": "CPP-012", "sort": 12, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C1 — Dữ liệu, biến và biểu thức", "sem": "HK1", "sup": false, "title": "Ép kiểu và giới hạn kiểu dữ liệu", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-013"], "verStatus": "reviewed_against_source", "srcRef": "Audited & patched in Verification Master v1.2 (AUD-003..008)", "hash": "e75128a85b7139cc", "substeps": [], "sec": {"exp": "<p>Ép kiểu chuyển một giá trị sang kiểu khác; chuyển đổi có thể mất thông tin. Chuyển từ số thực sang số nguyên bỏ phần lẻ theo quy tắc chuyển đổi, không tự làm tròn gần nhất.</p>", "ex": "<p><code class=\"inline-code\">static_cast&lt;int&gt;(3.9)</code> cho 3; <code class=\"inline-code\">static_cast&lt;double&gt;(5) / 2</code> cho 2.5.</p>", "clar": "<p>Ép kiểu không sửa dữ liệu sai về mặt nghiệp vụ. <code class=\"inline-code\">static_cast&lt;int&gt;(3.9)</code> cho <code class=\"inline-code\">3</code> vì phần lẻ bị cắt về phía 0; đây không phải làm tròn. <code class=\"inline-code\">5 / 2</code> với hai toán hạng nguyên cho <code class=\"inline-code\">2</code>, và gán kết quả đó vào <code class=\"inline-code\">double</code> không khôi phục phần lẻ; dùng <code class=\"inline-code\">5.0 / 2</code> hoặc chuyển đổi một toán hạng trước phép chia. Không thực hiện signed integer overflow. Chuyển floating-point sang kiểu nguyên khi giá trị sau khi cắt không thể biểu diễn trong kiểu đích có thể gây undefined behavior theo quy tắc C++; đừng mô tả đây chỉ là kết quả “không như mong muốn”. Chuyển số nguyên sang kiểu unsigned áp dụng quy tắc đồng dư modulo 2^N theo độ rộng kiểu đích; quy tắc này khác với signed integer overflow và khác với chuyển floating-point ngoài miền đích.</p>", "ext": "<p>Phân biệt conversion, rounding và validation: chúng là ba việc khác nhau. Khi cần giới hạn, kiểm tra bằng <code class=\"inline-code\">std::numeric_limits&lt;T&gt;</code> và kiểm tra trước khi cast; không dựa vào một kết quả chạy trên một compiler để khẳng định hành vi undefined behavior luôn giống nhau. Chốt chuẩn C++ theo yêu cầu lớp/compiler thực tế.</p>", "check": "<p>Vì sao <code class=\"inline-code\">5 / 2</code> không cho 2.5 dù gán kết quả vào biến <code class=\"inline-code\">double</code>?</p>", "sync": "<ul>\n<li><strong>Học:</strong> chuyển đổi ngầm/tường minh ở mức nhập môn; mất phần thập phân; tràn số nguyên cần tránh.</li>\n<li><strong>Thực hành:</strong> so sánh <code class=\"inline-code\">5 / 2</code> với <code class=\"inline-code\">5.0 / 2</code>; thử chuyển <code class=\"inline-code\">double</code> sang <code class=\"inline-code\">int</code>.</li>\n<li><strong>Đạt khi:</strong> nhận ra trường hợp phép tính cho kết quả bất ngờ do kiểu dữ liệu.</li>\n</ul>"}}, {"id": "CPP-013", "sort": 13, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C1 — Dữ liệu, biến và biểu thức", "sem": "HK1", "sup": false, "title": "So sánh và biểu thức đúng/sai", "estStatus": "not_estimated", "depStatus": "reviewed", "reqPrereqs": ["CPP-011", "CPP-012"], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-014", "CPP-015", "CPP-020", "CPP-021"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "e487c6bc3f9e66fe", "substeps": [], "sec": {"exp": "<p>Các toán tử so sánh tạo kết quả đúng/sai: bằng, khác, nhỏ hơn, nhỏ hơn hoặc bằng, lớn hơn, lớn hơn hoặc bằng. Kết quả thường dùng trong <code class=\"inline-code\">if</code> và vòng lặp.</p>", "ex": "<p><code class=\"inline-code\">score &gt;= 5.0</code> kiểm tra điểm đạt ngưỡng 5.0 theo quy ước ví dụ.</p>", "clar": "<p><code class=\"inline-code\">score = 5</code> thay đổi biến; <code class=\"inline-code\">score == 5</code> kiểm tra bằng nhau. Với số thực, so sánh bằng tuyệt đối có thể không thích hợp vì sai số biểu diễn.</p>", "ext": "<p>Nên đặt biểu thức gần với câu nghiệp vụ, ví dụ <code class=\"inline-code\">isEligible</code>, để dễ đọc.</p>", "check": "<p>Viết biểu thức cho “tuổi ít nhất 18 và nhỏ hơn 65”.</p>", "sync": "<ul>\n<li><strong>Học:</strong> <code class=\"inline-code\">==</code>, <code class=\"inline-code\">!=</code>, <code class=\"inline-code\">&lt;</code>, <code class=\"inline-code\">&lt;=</code>, <code class=\"inline-code\">&gt;</code>, <code class=\"inline-code\">&gt;=</code>; kết quả Boolean.</li>\n<li><strong>Thực hành:</strong> kiểm tra đủ tuổi, điểm qua môn, hai số bằng nhau hay không.</li>\n<li><strong>Đạt khi:</strong> không nhầm <code class=\"inline-code\">=</code> với <code class=\"inline-code\">==</code>; viết được điều kiện đúng với yêu cầu tiếng Việt.</li>\n</ul>"}}, {"id": "CPP-014", "sort": 14, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C1 — Dữ liệu, biến và biểu thức", "sem": "HK1", "sup": false, "title": "Toán tử logic `&&`, `||`, `!`", "estStatus": "not_estimated", "depStatus": "reviewed", "reqPrereqs": ["CPP-013"], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-015", "CPP-020"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "56cad027fc2e0962", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">&amp;&amp;</code> là AND (cả hai vế đúng), <code class=\"inline-code\">||</code> là OR (ít nhất một vế đúng), <code class=\"inline-code\">!</code> đảo đúng/sai. C++ có short-circuit: ở một số biểu thức, vế sau không cần được đánh giá khi kết quả đã rõ.</p>", "ex": "<p>Điểm hợp lệ trong <code class=\"inline-code\">[0,10]</code>: <code class=\"inline-code\">score &gt;= 0 &amp;&amp; score &lt;= 10</code>. Nếu cần điểm đạt và bài đã nộp: <code class=\"inline-code\">passed &amp;&amp; submitted</code>.</p>", "clar": "<p>Dùng ngoặc khi kết hợp <code class=\"inline-code\">&amp;&amp;</code> với <code class=\"inline-code\">||</code> để biểu hiện ý định. Short-circuit quan trọng nếu vế phải có thao tác chỉ an toàn khi vế trái đúng, ví dụ kiểm tra pointer khác null trước khi dùng.</p>", "ext": "<p>Không viết biểu thức logic dài tới mức khó đọc; tách biến Boolean có tên khi giúp làm rõ.</p>", "check": "<p>Biểu thức <code class=\"inline-code\">x &gt;= 0 &amp;&amp; x &lt;= 10</code> đúng với x=0, x=10, x=11 như thế nào?</p>", "sync": "<ul>\n<li><strong>Học:</strong> AND, OR, NOT; bảng chân trị; ngoặc trong biểu thức kết hợp.</li>\n<li><strong>Thực hành:</strong> kiểm tra một số nằm trong khoảng; kiểm tra điều kiện nhiều ràng buộc.</li>\n<li><strong>Đạt khi:</strong> chuyển được 5 điều kiện bằng lời thành biểu thức đúng và giải thích từng vế.</li>\n</ul>"}}, {"id": "CPP-015", "sort": 15, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C2 — Điều kiện và luồng chương trình", "sem": "HK1", "sup": false, "title": "`if` căn bản", "estStatus": "not_estimated", "depStatus": "reviewed", "reqPrereqs": ["CPP-013", "CPP-014"], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-016", "CPP-026"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "fe399e58a6250f4a", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">if</code> thực hiện một khối khi điều kiện chuyển thành <code class=\"inline-code\">true</code>. Điều kiện sai thì bỏ qua khối. Đây là nền tảng để mô hình hóa quy tắc nghiệp vụ.</p>", "ex": "<p><code class=\"inline-code\">if (temperature &lt; 0) { std::cout &lt;&lt; \"Freezing\"; }</code> chỉ in khi nhiệt độ âm.</p>", "clar": "<p>Một nhánh chưa được test vẫn có thể sai. Khi viết điều kiện, thử cả trường hợp đúng lẫn sai, đặc biệt ngay tại ranh giới.</p>", "ext": "<p>Tránh dấu <code class=\"inline-code\">;</code> ngay sau <code class=\"inline-code\">if (condition)</code> vì nó tạo câu lệnh rỗng và làm thay đổi ý nghĩa.</p>", "check": "<p>Viết <code class=\"inline-code\">if</code> để in “đạt” khi điểm ít nhất 5.</p>", "sync": "<ul>\n<li><strong>Tiên quyết:</strong> CPP-013.</li>\n<li><strong>Học:</strong> chương trình rẽ nhánh; điều kiện true/false; khối lệnh.</li>\n<li><strong>Thực hành:</strong> xác định số dương/âm hoặc thông báo đạt/chưa đạt.</li>\n<li><strong>Đạt khi:</strong> tự viết <code class=\"inline-code\">if</code> và test cả hai nhánh.</li>\n</ul>"}}, {"id": "CPP-016", "sort": 16, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C2 — Điều kiện và luồng chương trình", "sem": "HK1", "sup": false, "title": "`if/else if/else`", "estStatus": "not_estimated", "depStatus": "reviewed", "reqPrereqs": ["CPP-015"], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "c5bac58e934a46ba", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">if/else if/else</code> chọn nhánh đầu tiên có điều kiện đúng; các nhánh sau được bỏ qua. Vì vậy thứ tự kiểm tra rất quan trọng khi điều kiện bao trùm nhau.</p>", "ex": "<p>Phân loại điểm: nếu <code class=\"inline-code\">score &gt;= 8</code> là tốt; else if <code class=\"inline-code\">score &gt;= 5</code> là đạt; else là chưa đạt.</p>", "clar": "<p>Nếu kiểm tra <code class=\"inline-code\">score &gt;= 5</code> trước <code class=\"inline-code\">score &gt;= 8</code>, mức điểm cao cũng bị xếp vào nhánh đạt. Hãy sắp xếp từ điều kiện cụ thể/cao xuống thấp khi logic yêu cầu.</p>", "ext": "<p>Bảng decision table với cột điều kiện và kết quả hữu ích trước khi code quy tắc nhiều mức.</p>", "check": "<p>Điểm 9 sẽ đi vào nhánh nào nếu <code class=\"inline-code\">score &gt;= 5</code> đứng trước <code class=\"inline-code\">score &gt;= 8</code>?</p>", "sync": "<ul>\n<li><strong>Học:</strong> nhiều trường hợp loại trừ nhau; thứ tự điều kiện; nhánh mặc định.</li>\n<li><strong>Thực hành:</strong> đổi điểm số thành mức xếp loại; phân loại tuổi.</li>\n<li><strong>Đạt khi:</strong> chọn thứ tự điều kiện không làm nhánh quan trọng bị che khuất.</li>\n</ul>"}}, {"id": "CPP-017", "sort": 17, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C2 — Điều kiện và luồng chương trình", "sem": "HK1", "sup": false, "title": "Điều kiện lồng nhau và điều kiện phức hợp", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "eb95fdf055eff698", "substeps": [], "sec": {"exp": "<p>Điều kiện lồng nhau đặt một quyết định bên trong một quyết định khác. Chỉ dùng khi quyết định thứ hai thực sự phụ thuộc vào quyết định thứ nhất; nếu không, biểu thức kết hợp có thể dễ đọc hơn.</p>", "ex": "<p>Chỉ kiểm tra mật khẩu sau khi biết tên tài khoản không rỗng; hoặc kiểm tra tháng trước khi kiểm tra số ngày của tháng.</p>", "clar": "<p>Lồng nhiều tầng tăng khó khăn khi đọc và test; trạng thái hợp lệ phải được xác định rõ. Ví dụ lịch hợp lệ đầy đủ còn cần quy tắc năm nhuận, không chỉ kiểm tra ngày 1–31.</p>", "ext": "<p>Tách hàm validation theo từng quy tắc khi logic phình lớn.</p>", "check": "<p>Nêu một lý do hợp lý để dùng điều kiện lồng và một dấu hiệu nên tái cấu trúc.</p>", "sync": "<ul>\n<li><strong>Học:</strong> khi nào cần lồng; khi nào biểu thức logic dễ đọc hơn; tránh nesting quá sâu.</li>\n<li><strong>Thực hành:</strong> kiểm tra ngày hợp lệ ở mức đơn giản hoặc đăng nhập giả lập.</li>\n<li><strong>Đạt khi:</strong> giải thích được vì sao một nhánh được chạy.</li>\n</ul>"}}, {"id": "CPP-018", "sort": 18, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C2 — Điều kiện và luồng chương trình", "sem": "HK1", "sup": false, "title": "`switch` (nếu phù hợp với nội dung trường)", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "dad2d6b267d7de68", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">switch</code> chọn nhánh dựa trên một biểu thức có giá trị phù hợp với switch. <code class=\"inline-code\">case</code> là giá trị cụ thể; <code class=\"inline-code\">break</code> tránh rơi sang case tiếp theo trong các dạng thông thường; <code class=\"inline-code\">default</code> xử lý giá trị còn lại.</p>", "ex": "<p>Menu: <code class=\"inline-code\">switch (choice)</code> có các case 1, 2 và <code class=\"inline-code\">default</code>. Nếu người dùng nhập 9, nhánh default báo lựa chọn không hợp lệ.</p>", "clar": "<p><code class=\"inline-code\">switch</code> không thay thế mọi <code class=\"inline-code\">if</code>; điều kiện khoảng như <code class=\"inline-code\">score &gt;= 8</code> thường dùng if. Thiếu <code class=\"inline-code\">break</code> có thể gây fall-through có chủ ý hoặc ngoài ý muốn.</p>", "ext": "<p>Với enum, switch có thể giúp bao phủ các trạng thái đã đặt tên.</p>", "check": "<p>Khi nào <code class=\"inline-code\">switch</code> dễ đọc hơn chuỗi <code class=\"inline-code\">if/else if</code>?</p>", "sync": "<ul>\n<li><strong>Học:</strong> nhiều trường hợp dựa trên một giá trị; <code class=\"inline-code\">break</code>; trường hợp mặc định.</li>\n<li><strong>Thực hành:</strong> menu chọn phép tính hoặc ngày trong tuần.</li>\n<li><strong>Đạt khi:</strong> dùng <code class=\"inline-code\">switch</code> khi phù hợp và nhận diện được lỗi fall-through cơ bản.</li>\n</ul>"}}, {"id": "CPP-019", "sort": 19, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C2 — Điều kiện và luồng chương trình", "sem": "HK1", "sup": false, "title": "Trace chương trình bằng tay", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "717aaf7e84f41fe2", "substeps": [], "sec": {"exp": "<p>Trace là theo dõi giá trị biến và nhánh theo đúng trình tự thực thi mà không đoán. Bảng trace có thể gồm bước, giá trị biến, điều kiện và output phát sinh.</p>", "ex": "<p>Với <code class=\"inline-code\">x=1; x=x+2; x=x*3;</code>, trace lần lượt là 1 → 3 → 9; output cuối phụ thuộc câu lệnh in ở đâu.</p>", "clar": "<p>Không nhảy từ dòng đầu tới kết quả cuối. Phải tính từng phép gán và đánh giá điều kiện bằng giá trị tại thời điểm đó.</p>", "ext": "<p>Trace là kỹ năng dùng khi debug loop, recursion, thuật toán và concurrency sau này.</p>", "check": "<p>Tạo bảng trace cho ba phép gán liên tiếp và giải thích từng thay đổi.</p>", "sync": "<ul>\n<li><strong>Học:</strong> bảng theo dõi giá trị biến theo từng dòng; dự đoán nhánh.</li>\n<li><strong>Thực hành:</strong> trace 5 chương trình ngắn có điều kiện.</li>\n<li><strong>Đạt khi:</strong> theo được trạng thái biến mà không chạy chương trình.</li>\n</ul>"}}, {"id": "CPP-020", "sort": 20, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C3 — Vòng lặp", "sem": "HK1", "sup": false, "title": "Vòng `while`", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["CPP-013", "CPP-014"], "recBg": [], "unlocks": ["CPP-022"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f47c0c3976090e77", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">while</code> kiểm tra điều kiện trước mỗi lượt; khi điều kiện sai thì dừng. Phần thân phải tiến dần tới điều kiện dừng nếu muốn kết thúc.</p>", "ex": "<p><code class=\"inline-code\">int i=1; while(i&lt;=3){ cout&lt;&lt;i; ++i; }</code> in 1, 2, 3.</p>", "clar": "<p>Quên cập nhật <code class=\"inline-code\">i</code> có thể tạo vòng lặp vô hạn. Nếu điều kiện sai ngay từ đầu, thân vòng không chạy lần nào.</p>", "ext": "<p>Dùng vòng lặp khi số vòng phụ thuộc dữ liệu hoặc điều kiện dừng; luôn xác định invariant đơn giản.</p>", "check": "<p>Nếu bỏ <code class=\"inline-code\">++i</code> trong ví dụ, điều gì xảy ra và vì sao?</p>", "sync": "<ul>\n<li><strong>Học:</strong> điều kiện lặp, thân vòng, thay đổi biến để kết thúc.</li>\n<li><strong>Thực hành:</strong> đếm từ 1 đến n; cộng các số nhập vào theo điều kiện kết thúc.</li>\n<li><strong>Đạt khi:</strong> không tạo vòng lặp vô hạn trong bài mẫu và chỉ ra điều kiện dừng.</li>\n</ul>"}}, {"id": "CPP-021", "sort": 21, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C3 — Vòng lặp", "sem": "HK1", "sup": false, "title": "Vòng `for`", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["CPP-013"], "recBg": [], "unlocks": ["CPP-023", "CPP-024", "DSA-001"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "1049f8c25b6c13b1", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">for</code> gom bước khởi tạo, điều kiện và cập nhật vào một cấu trúc. Nó phù hợp khi biến lặp và tiến trình cập nhật có thể diễn tả rõ.</p>", "ex": "<p><code class=\"inline-code\">for(int i=1; i&lt;=n; ++i) sum += i;</code> cộng các số từ 1 tới n khi n≥1 và <code class=\"inline-code\">sum</code> được khởi tạo đúng.</p>", "clar": "<p>Điều kiện <code class=\"inline-code\">i&lt;n</code> và <code class=\"inline-code\">i&lt;=n</code> khác nhau một lượt. Off-by-one là lỗi thường gặp; viết bảng giá trị i giúp phát hiện.</p>", "ext": "<p>Nếu cần lặp qua từng phần tử container, range-based for thường ít rủi ro chỉ số hơn.</p>", "check": "<p>Với <code class=\"inline-code\">i=0; i&lt;4; ++i</code>, vòng chạy bao nhiêu lần và i nhận giá trị nào?</p>", "sync": "<ul>\n<li><strong>Học:</strong> khởi tạo, điều kiện, bước cập nhật; khi biết số lần lặp.</li>\n<li><strong>Thực hành:</strong> in bảng cửu chương; tính tổng từ 1 đến n.</li>\n<li><strong>Đạt khi:</strong> giải thích được mỗi phần của vòng <code class=\"inline-code\">for</code> và xác định đúng số lần chạy.</li>\n</ul>"}}, {"id": "CPP-022", "sort": 22, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C3 — Vòng lặp", "sem": "HK1", "sup": false, "title": "`do-while`, `break`, `continue`", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["CPP-020"], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "75709c3549efddff", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">do-while</code> kiểm tra điều kiện sau thân nên chạy ít nhất một lần. <code class=\"inline-code\">break</code> thoát vòng hiện tại; <code class=\"inline-code\">continue</code> chuyển sang lượt kế tiếp theo quy tắc của vòng.</p>", "ex": "<p>Menu cần hiện ít nhất một lần có thể dùng <code class=\"inline-code\">do { showMenu(); readChoice(); } while(choice != 0);</code>.</p>", "clar": "<p><code class=\"inline-code\">continue</code> trong vòng <code class=\"inline-code\">for</code> vẫn dẫn tới bước cập nhật trước lượt tiếp; trong <code class=\"inline-code\">while</code> thì quay lại kiểm tra điều kiện. Mã rõ ràng thường tốt hơn lạm dụng nhảy luồng.</p>", "ext": "<p>Với input không hợp lệ, cân nhắc thông báo và chiến lược đọc lại thay vì chỉ continue im lặng.</p>", "check": "<p>Vì sao menu thường là ví dụ phù hợp cho <code class=\"inline-code\">do-while</code>?</p>", "sync": "<ul>\n<li><strong>Học:</strong> chạy ít nhất một lần; thoát sớm; bỏ qua một vòng; dùng có chủ đích.</li>\n<li><strong>Thực hành:</strong> menu lặp cho đến khi chọn thoát; bỏ qua giá trị không hợp lệ.</li>\n<li><strong>Đạt khi:</strong> không dùng <code class=\"inline-code\">break/continue</code> để che giấu logic khó hiểu.</li>\n</ul>"}}, {"id": "CPP-023", "sort": 23, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C3 — Vòng lặp", "sem": "HK1", "sup": false, "title": "Vòng lặp lồng nhau", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["CPP-021"], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "00a700691f0fb5fa", "substeps": [], "sec": {"exp": "<p>Vòng lặp lồng nhau chạy vòng trong cho mỗi lượt của vòng ngoài. Tổng số lần lặp thường là tích số lượt nếu giới hạn cố định và không có break.</p>", "ex": "<p>Hai vòng mỗi vòng 3 lượt tạo 3×3 = 9 cặp (i,j). Dùng để in bảng nhân hoặc duyệt mọi cặp chỉ số.</p>", "clar": "<p>Một vòng lồng nhau không mặc nhiên là sai, nhưng với n lượt ở cả hai tầng, công việc có thể tăng theo n². Kiểm tra xem có thể tránh duyệt cặp không cần thiết hay không.</p>", "ext": "<p>Số vòng phụ thuộc dữ liệu có thể không là tích đơn giản; trace vài lượt đầu/cuối trước.</p>", "check": "<p>Nếu hai vòng độc lập mỗi vòng chạy n lần, độ lớn số cặp là bao nhiêu?</p>", "sync": "<ul>\n<li><strong>Học:</strong> vòng ngoài/ trong; số lần chạy; bảng, hình chữ nhật, tổ hợp đơn giản.</li>\n<li><strong>Thực hành:</strong> in bảng nhân và mẫu ký tự.</li>\n<li><strong>Đạt khi:</strong> tính được số lần lặp của ví dụ đơn giản và tránh vòng lặp thừa.</li>\n</ul>"}}, {"id": "CPP-024", "sort": 24, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C3 — Vòng lặp", "sem": "HK1", "sup": false, "title": "Bộ đếm, tổng tích lũy, min/max", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["CPP-021"], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "3ebe0e10920127a4", "substeps": [], "sec": {"exp": "<p>Counter đếm sự kiện; accumulator tích lũy kết quả; min/max lưu giá trị tốt nhất thấy tới hiện tại; sentinel là giá trị đặc biệt báo kết thúc input theo quy ước.</p>", "ex": "<p>Đọc n điểm: khởi tạo <code class=\"inline-code\">sum=0</code>, <code class=\"inline-code\">count=0</code>; cập nhật min/max khi nhận điểm đầu tiên rồi so sánh các điểm sau.</p>", "clar": "<p>Không khởi tạo min bằng 0 nếu tất cả số có thể dương và cần min thực tế; cách an toàn đơn giản là dùng phần tử đầu hoặc trạng thái “chưa có dữ liệu”. Không tính trung bình khi count=0.</p>", "ext": "<p>Các khái niệm này tạo nền cho streaming statistics và phân tích log.</p>", "check": "<p>Bạn xử lý thế nào nếu danh sách đầu vào rỗng?</p>", "sync": "<ul>\n<li><strong>Học:</strong> accumulator, counter, sentinel value; khởi tạo hợp lý.</li>\n<li><strong>Thực hành:</strong> đọc n điểm, tính tổng/trung bình/min/max.</li>\n<li><strong>Đạt khi:</strong> xử lý đúng trường hợp n nhỏ và không quên khởi tạo.</li>\n</ul>"}}, {"id": "CPP-025", "sort": 25, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C3 — Vòng lặp", "sem": "HK1", "sup": false, "title": "Phân rã đề bài thành thuật toán", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-026"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "9f5189c520e11659", "substeps": [], "sec": {"exp": "<p>Trước khi code, chuyển đề thành input, output, constraints, bước giải và ca kiểm tra. Pseudocode tập trung vào logic mà không buộc cú pháp C++.</p>", "ex": "<p>Bài tiền thừa: input số tiền đã trả và giá; xử lý kiểm tra tiền trả đủ, rồi trừ giá; output tiền thừa hoặc thông báo thiếu tiền.</p>", "clar": "<p>Một thuật toán có thể sai dù cú pháp sau này đúng. Xác định dữ liệu hợp lệ, đơn vị, ranh giới và trường hợp không thể xử lý ngay từ đầu.</p>", "ext": "<p>Brute force là cách giải đơn giản để lấy mốc đúng trước khi tối ưu.</p>", "check": "<p>Viết pseudocode cho tìm số lớn nhất trong 3 số và nêu ít nhất ba test.</p>", "sync": "<ul>\n<li><strong>Học:</strong> viết lại đề theo input/output/constraints; pseudocode; chia bước; chọn test.</li>\n<li><strong>Thực hành:</strong> 3 bài chưa code: tiền thừa, điểm trung bình, phân loại tam giác ở phạm vi đơn giản.</li>\n<li><strong>Đạt khi:</strong> đưa ra thuật toán từng bước và ít nhất 3 test trước khi lập trình.</li>\n</ul>"}}, {"id": "CPP-026", "sort": 26, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C4 — Hàm và tái sử dụng", "sem": "HK1", "sup": false, "title": "Hàm đầu tiên", "estStatus": "not_estimated", "depStatus": "reviewed", "reqPrereqs": ["CPP-015", "CPP-025"], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-028", "DSA-001", "CPP-051"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "817fb8f5f44d381c", "substeps": [], "sec": {"exp": "<p>Hàm gom một tác vụ dưới tên có thể gọi lại. Việc tách hàm giảm lặp và cho phép kiểm tra một phần logic độc lập.</p>", "ex": "<p><code class=\"inline-code\">int square(int x) { return x*x; }</code> có thể gọi bằng <code class=\"inline-code\">square(4)</code> để lấy 16.</p>", "clar": "<p>Một hàm có thể được khai báo trước định nghĩa, nhưng người mới nên hiểu chữ ký và điểm gọi trước khi học tách nhiều file. Tránh hàm quá dài làm nhiều việc không liên quan.</p>", "ext": "<p>Hàm thuần (pure function) có cùng input thì cùng output và không đổi trạng thái bên ngoài, dễ test hơn.</p>", "check": "<p>Phần nào trong chương trình tính điểm nên tách thành hàm riêng?</p>", "sync": "<ul>\n<li><strong>Tiên quyết:</strong> CPP-015 đến CPP-025.</li>\n<li><strong>Học:</strong> hàm đặt tên cho một tác vụ; khai báo/định nghĩa; gọi hàm.</li>\n<li><strong>Thực hành:</strong> tách chương trình tính toán thành các hàm nhỏ.</li>\n<li><strong>Đạt khi:</strong> chỉ ra được đoạn logic nào nên được tách thành hàm.</li>\n</ul>"}}, {"id": "CPP-027", "sort": 27, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C4 — Hàm và tái sử dụng", "sem": "HK1", "sup": false, "title": "Tham số và giá trị trả về", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-028", "CPP-029", "CPP-030", "CPP-051"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "de74f49791e976ca", "substeps": [], "sec": {"exp": "<p>Tham số là tên trong định nghĩa hàm; argument là giá trị truyền khi gọi. Hàm có kiểu trả về sẽ đưa kết quả qua <code class=\"inline-code\">return</code>; <code class=\"inline-code\">void</code> biểu thị không trả một giá trị theo cách thông thường.</p>", "ex": "<p><code class=\"inline-code\">double average(double a, double b){ return (a+b)/2.0; }</code> được gọi bằng <code class=\"inline-code\">average(6,8)</code> và cho 7.0.</p>", "clar": "<p><code class=\"inline-code\">return</code> cũng kết thúc hàm ở điểm đó. Đừng in kết quả bên trong hàm nếu yêu cầu là trả kết quả để nơi gọi tự quyết định dùng thế nào.</p>", "ext": "<p>Tách tính toán khỏi input/output giúp hàm dễ tái sử dụng và test.</p>", "check": "<p>Phân biệt parameter và argument trong <code class=\"inline-code\">maxOfTwo(4, 7)</code>.</p>", "sync": "<ul>\n<li><strong>Học:</strong> parameter/argument; <code class=\"inline-code\">return</code>; <code class=\"inline-code\">void</code>; không lạm dụng biến toàn cục.</li>\n<li><strong>Thực hành:</strong> viết <code class=\"inline-code\">maxOfTwo</code>, <code class=\"inline-code\">isEven</code>, <code class=\"inline-code\">calculateAverage</code>.</li>\n<li><strong>Đạt khi:</strong> viết hàm có input rõ và test được độc lập.</li>\n</ul>"}}, {"id": "CPP-028", "sort": 28, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C4 — Hàm và tái sử dụng", "sem": "HK1", "sup": false, "title": "Phạm vi biến và lifetime nhập môn", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["CPP-026", "CPP-027"], "recBg": [], "unlocks": ["CPP-051"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "4e305db67b41733b", "substeps": [], "sec": {"exp": "<p>Scope là vùng mà tên biến có thể được truy cập; lifetime là khoảng thời gian đối tượng còn tồn tại. Với biến local thông thường, lifetime kết thúc khi rời khỏi block chứa nó.</p>", "ex": "<p>Biến <code class=\"inline-code\">int local = 3;</code> khai báo trong một block không dùng trực tiếp được sau dấu <code class=\"inline-code\">}</code> của block đó.</p>", "clar": "<p>Scope và lifetime liên quan nhưng không giống nhau. Trả về tham chiếu/pointer đến local đã hết lifetime tạo lỗi nghiêm trọng.</p>", "ext": "<p>RAII về sau tận dụng lifetime của object để tự giải phóng tài nguyên.</p>", "check": "<p>Vì sao không được trả tham chiếu tới biến local của hàm?</p>", "sync": "<ul>\n<li><strong>Học:</strong> biến local; phạm vi trong <code class=\"inline-code\">{}</code>; tránh trả về tham chiếu đến biến local.</li>\n<li><strong>Thực hành:</strong> sửa code dùng biến ngoài phạm vi.</li>\n<li><strong>Đạt khi:</strong> giải thích được vì sao một biến không truy cập được ngoài khối.</li>\n</ul>"}}, {"id": "CPP-029", "sort": 29, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C4 — Hàm và tái sử dụng", "sem": "HK1", "sup": false, "title": "Truyền theo giá trị và `const` reference", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["CPP-027"], "recBg": [], "unlocks": ["CPP-051"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "8d6ca2ef4d5f36e3", "substeps": [], "sec": {"exp": "<p>Truyền theo giá trị tạo bản sao tham số; truyền qua tham chiếu cho phép hàm làm việc với đối tượng gốc. <code class=\"inline-code\">const T&amp;</code> cho phép đọc đối tượng mà không sao chép toàn bộ và ngăn sửa qua tham chiếu đó.</p>", "ex": "<p><code class=\"inline-code\">void print(const std::string&amp; s)</code> tránh copy chuỗi chỉ để đọc; <code class=\"inline-code\">void increment(int x)</code> chỉ đổi bản sao của x bên trong hàm.</p>", "clar": "<p><code class=\"inline-code\">const</code> không khiến toàn bộ chương trình bất biến; nó hạn chế sửa thông qua đường truy cập đó. Với kiểu nhỏ như int, truyền giá trị thường đơn giản và hiệu quả.</p>", "ext": "<p>Không tối ưu hóa chữ ký hàm một cách máy móc; dựa vào kiểu, kích thước và semantics.</p>", "check": "<p>Khi nào <code class=\"inline-code\">const std::string&amp;</code> hữu ích hơn truyền string by value?</p>", "sync": "<ul>\n<li><strong>Học:</strong> copy dữ liệu; tham chiếu; ý niệm tránh sao chép dữ liệu lớn; <code class=\"inline-code\">const</code> chống sửa ngoài ý muốn.</li>\n<li><strong>Thực hành:</strong> truyền số nguyên, chuỗi nhỏ/lớn vào hàm; so sánh hai chữ ký hàm.</li>\n<li><strong>Đạt khi:</strong> hiểu khác biệt đầu vào theo giá trị và tham chiếu ở mức nhập môn.</li>\n</ul>"}}, {"id": "CPP-030", "sort": 30, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C4 — Hàm và tái sử dụng", "sem": "HK1", "sup": false, "title": "Tách hàm, hợp đồng và unit thinking", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["CPP-027"], "recBg": [], "unlocks": ["CPP-051"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "594b60ad2cc5eedd", "substeps": [], "sec": {"exp": "<p>Hợp đồng hàm nêu điều kiện đầu vào và kết quả được đảm bảo. Unit thinking nghĩa là đặt hàm sao cho có thể kiểm tra riêng bằng input/output rõ ràng.</p>", "ex": "<p><code class=\"inline-code\">isValidScore(0)</code> và <code class=\"inline-code\">isValidScore(10)</code> phải đúng theo miền [0,10]; <code class=\"inline-code\">isValidScore(-1)</code> phải sai.</p>", "clar": "<p>Không được ẩn phụ thuộc quan trọng vào biến toàn cục hoặc thứ tự gọi hàm. Một hàm nên có trách nhiệm chính dễ diễn tả bằng một câu.</p>", "ext": "<p>Precondition/postcondition và assertion có thể dùng để làm hợp đồng rõ hơn ở giai đoạn sau.</p>", "check": "<p>Viết hợp đồng bằng lời cho hàm tính trung bình của danh sách điểm.</p>", "sync": "<ul>\n<li><strong>Học:</strong> hàm nhận gì, đảm bảo trả gì, điều kiện hợp lệ, một hàm một trách nhiệm chính.</li>\n<li><strong>Thực hành:</strong> tái cấu trúc chương trình điểm số thành hàm nhập/kiểm tra/tính/in.</li>\n<li><strong>Đạt khi:</strong> kiểm tra từng hàm riêng và chương trình không phụ thuộc thứ tự ẩn khó hiểu.</li>\n</ul>"}}, {"id": "CPP-031", "sort": 31, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C5 — Chuỗi, mảng và vector", "sem": "HK1", "sup": false, "title": "Truy cập và duyệt `std::string`", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-033"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "d338a9ae7a6256cf", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">std::string</code> cho phép lấy độ dài và truy cập ký tự bằng chỉ số bắt đầu từ 0. Vòng duyệt hợp lệ phải tôn trọng giới hạn chỉ số.</p>", "ex": "<p>Với <code class=\"inline-code\">string s=\"cat\"</code>, các vị trí theo byte là 0:<code class=\"inline-code\">c</code>, 1:<code class=\"inline-code\">a</code>, 2:<code class=\"inline-code\">t</code>; độ dài là 3.</p>", "clar": "<p><code class=\"inline-code\">s[s.size()]</code> nằm ngoài các ký tự hợp lệ; truy cập bằng <code class=\"inline-code\">operator[]</code> ngoài giới hạn không được đảm bảo an toàn. Với tiếng Việt UTF-8, ví dụ ký tự ASCII không phản ánh đủ cấu trúc Unicode.</p>", "ext": "<p>Các hàm như <code class=\"inline-code\">find</code>, <code class=\"inline-code\">substr</code> hữu ích sau khi đã hiểu chỉ số và giới hạn.</p>", "check": "<p>Chuỗi rỗng có thể truy cập <code class=\"inline-code\">s[0]</code> một cách an toàn không?</p>", "sync": "<ul>\n<li><strong>Học:</strong> <code class=\"inline-code\">size()</code>, chỉ số bắt đầu từ 0, truy cập ký tự; kiểm tra chỉ số.</li>\n<li><strong>Thực hành:</strong> đếm ký tự hoặc đếm nguyên âm theo bộ ký tự được xác định.</li>\n<li><strong>Đạt khi:</strong> hiểu lỗi off-by-one và thử chuỗi rỗng.</li>\n</ul>"}}, {"id": "CPP-032", "sort": 32, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C5 — Chuỗi, mảng và vector", "sem": "HK1", "sup": false, "title": "Đọc một dòng với `getline`", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "c40ac60e454b2cce", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">cin &gt;&gt; x</code> thường đọc một token đến khoảng trắng; <code class=\"inline-code\">getline</code> đọc cả dòng đến newline. Sau khi <code class=\"inline-code\">&gt;&gt;</code> đọc số, ký tự xuống dòng có thể còn lại và khiến <code class=\"inline-code\">getline</code> kế tiếp nhận ngay dòng rỗng.</p>", "ex": "<p>Sau <code class=\"inline-code\">cin &gt;&gt; age</code>, có thể dùng <code class=\"inline-code\">std::cin.ignore(std::numeric_limits&lt;std::streamsize&gt;::max(), '\\n');</code> trước <code class=\"inline-code\">getline</code> và include <code class=\"inline-code\">&lt;limits&gt;</code> khi muốn bỏ phần còn lại của dòng.</p>", "clar": "<p><code class=\"inline-code\">std::ws</code> là lựa chọn khác nhưng bỏ qua mọi khoảng trắng đầu dòng; điều đó có thể không phù hợp nếu khoảng trắng đầu là dữ liệu có ý nghĩa. Chọn xử lý theo input mong muốn.</p>", "ext": "<p>Tách input parse/validation thành hàm giúp xử lý nhập sai rõ ràng hơn.</p>", "check": "<p>Vì sao <code class=\"inline-code\">getline</code> có thể nhận chuỗi rỗng ngay sau <code class=\"inline-code\">cin &gt;&gt; number</code>?</p>", "sync": "<ul>\n<li><str
