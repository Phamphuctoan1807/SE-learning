t": "<p>Tạo một biến thể mới từ ví dụ, viết giả định và kiểm tra bằng lời giải độc lập hoặc test có thể lặp lại. Đối chiếu một giáo trình đại học hoặc tài liệu chính thức được liệt kê trong hồ sơ nguồn.</p>", "check": "<p>Tự giải thích khái niệm chính không nhìn nội dung, làm ví dụ khác số liệu/tình huống và nêu một trường hợp không áp dụng được.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-PS-003</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-PS-002</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Dùng bảng 2×2 để phân biệt P(A|B) với P(B|A), và độc lập với quy tắc nhân đếm.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">supplemental; needs course mapping</code>; chưa có nghĩa là đã kiểm thử/duyệt bởi giảng viên.</li>\n</ul>"}}, {"id": "SUP-PS-004", "sort": 324, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK3", "sup": true, "title": "Lấy mẫu, suy luận và hồi quy ở mức nhập môn", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": [], "recBg": ["SUP-PS-001", "SUP-PS-003"], "unlocks": [], "verStatus": "supplemental_needs_course_mapping", "srcRef": "SE_Verification_and_Sources_MA003_final_20261011.md", "hash": "79298aeccd604d17", "substeps": [], "sec": {"exp": "<p>Sai số lấy mẫu, khoảng tin cậy/kiểm định theo đề cương, tương quan khác nhân quả, hồi quy tuyến tính căn bản.</p>", "ex": "<p>Một khảo sát tự nguyện trên mạng có thể thiên lệch vì người tự chọn tham gia khác người không tham gia. Nếu trong mẫu hai biến cùng tăng, đó là tương quan; để kết luận nhân quả cần thiết kế/phân tích mạnh hơn và xử lý các biến gây nhiễu.</p>", "clar": "<p>Đây là module bổ sung. Không coi nó là yêu cầu chính thức của UIT nếu chưa đối chiếu đề cương đúng khóa/học kỳ. Với công thức, thuật toán hoặc hành vi phụ thuộc môi trường, kiểm tra điều kiện áp dụng trước khi kết luận.</p>", "ext": "<p>Tạo một biến thể mới từ ví dụ, viết giả định và kiểm tra bằng lời giải độc lập hoặc test có thể lặp lại. Đối chiếu một giáo trình đại học hoặc tài liệu chính thức được liệt kê trong hồ sơ nguồn.</p>", "check": "<p>Tự giải thích khái niệm chính không nhìn nội dung, làm ví dụ khác số liệu/tình huống và nêu một trường hợp không áp dụng được.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-PS-004</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-PS-001/SUP-PS-003</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Nêu giới hạn kết luận từ một mẫu nhỏ; không kết luận nhân quả chỉ từ tương quan.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">supplemental; needs course mapping</code>; chưa có nghĩa là đã kiểm thử/duyệt bởi giảng viên.</li>\n</ul>"}}, {"id": "SUP-DM-001", "sort": 325, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK2", "sup": true, "title": "Loop invariant và tính đúng của thuật toán", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": [], "recBg": ["DM-006", "DM-007", "DSA-002"], "unlocks": [], "verStatus": "supplemental_needs_course_mapping", "srcRef": "SE_Verification_and_Sources_MA003_final_20261011.md", "hash": "ec7e5665eb55d4f0", "substeps": [], "sec": {"exp": "<p>Một invariant phải đúng trước và sau các bước; liên hệ khởi tạo, bảo toàn, kết thúc.</p>", "ex": "<p>Trong thuật toán cộng mảng a[0..n−1], invariant trước vòng lặp ở chỉ số i có thể là: <code class=\"inline-code\">sum = a[0]+...+a[i−1]</code>. Khởi đầu i=0 thì tổng phần rỗng là 0; mỗi vòng cộng a[i] rồi tăng i, invariant vẫn giữ; khi i=n thì sum là tổng toàn mảng.</p>", "clar": "<p>Đây là module bổ sung. Không coi nó là yêu cầu chính thức của UIT nếu chưa đối chiếu đề cương đúng khóa/học kỳ. Với công thức, thuật toán hoặc hành vi phụ thuộc môi trường, kiểm tra điều kiện áp dụng trước khi kết luận.</p>", "ext": "<p>Tạo một biến thể mới từ ví dụ, viết giả định và kiểm tra bằng lời giải độc lập hoặc test có thể lặp lại. Đối chiếu một giáo trình đại học hoặc tài liệu chính thức được liệt kê trong hồ sơ nguồn.</p>", "check": "<p>Tự giải thích khái niệm chính không nhìn nội dung, làm ví dụ khác số liệu/tình huống và nêu một trường hợp không áp dụng được.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-DM-001</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">DM-006/DM-007/DSA-002</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Viết invariant đơn giản cho vòng lặp tính tổng hoặc tìm phần tử.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">supplemental; needs course mapping</code>; chưa có nghĩa là đã kiểm thử/duyệt bởi giảng viên.</li>\n</ul>"}}, {"id": "SUP-DM-002", "sort": 326, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK2", "sup": true, "title": "Chứng minh phản chứng và phản đảo", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": [], "recBg": ["DM-006"], "unlocks": [], "verStatus": "supplemental_needs_course_mapping", "srcRef": "SE_Verification_and_Sources_MA003_final_20261011.md", "hash": "86e6b972f8e8044b", "substeps": [], "sec": {"exp": "<p>Phân biệt chứng minh trực tiếp, phản chứng và phản đảo; không coi ví dụ là chứng minh tổng quát.</p>", "ex": "<p>Mệnh đề “nếu n² chẵn thì n chẵn” có thể chứng minh bằng phản đảo: giả sử n lẻ, viết n=2k+1; khi đó n²=4k²+4k+1=2(2k²+2k)+1 là số lẻ. Vì vậy nếu n² chẵn thì n không thể lẻ, tức n chẵn.</p>", "clar": "<p>Đây là module bổ sung. Không coi nó là yêu cầu chính thức của UIT nếu chưa đối chiếu đề cương đúng khóa/học kỳ. Với công thức, thuật toán hoặc hành vi phụ thuộc môi trường, kiểm tra điều kiện áp dụng trước khi kết luận.</p>", "ext": "<p>Tạo một biến thể mới từ ví dụ, viết giả định và kiểm tra bằng lời giải độc lập hoặc test có thể lặp lại. Đối chiếu một giáo trình đại học hoặc tài liệu chính thức được liệt kê trong hồ sơ nguồn.</p>", "check": "<p>Tự giải thích khái niệm chính không nhìn nội dung, làm ví dụ khác số liệu/tình huống và nêu một trường hợp không áp dụng được.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-DM-002</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">DM-006</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Viết một lập luận ngắn, chỉ rõ giả sử và mâu thuẫn.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">supplemental; needs course mapping</code>; chưa có nghĩa là đã kiểm thử/duyệt bởi giảng viên.</li>\n</ul>"}}, {"id": "SUP-DM-003", "sort": 327, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK2", "sup": true, "title": "Phân tích truy hồi cho đệ quy", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": [], "recBg": ["DM-009", "DSA-016", "DSA-017"], "unlocks": [], "verStatus": "supplemental_needs_course_mapping", "srcRef": "SE_Verification_and_Sources_MA003_final_20261011.md",         { id: 1, request_id: "req_boot_001", actor_user_id: "system", actor_role: "admin", action: "CONTENT_IMPORT_PUBLISH", target_entity: "3_master_files", details: "Imported 343/343 lessons, 25/25 ENQ, 12/12 ENDIAG, 0 cycles.", created_at: "2026-10-14T23:45:00+07:00" }

  function loadPersistedState() {
    const def = getDefaultState();
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") {
          return {
            ...def,
            ...parsed,
            filters: { ...def.filters, ...(parsed.filters || {}) },
            progressByUser: { ...def.progressByUser, ...(parsed.progressByUser || {}) },
            notesByUser: { ...def.notesByUser, ...(parsed.notesByUser || {}) },
            errorJournalByUser: { ...def.errorJournalByUser, ...(parsed.errorJournalByUser || {}) },
            weeklyPlanByUser: { ...def.weeklyPlanByUser, ...(parsed.weeklyPlanByUser || {}) },
            auditLogs: Array.isArray(parsed.auditLogs) ? parsed.auditLogs : def.auditLogs
          };
        }
      }
    } catch (e) {}
    return def;
  }

  let state = loadPersistedState();
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function applyPalette(paletteName) {
    state.palette = paletteName || "skin";
    document.documentElement.setAttribute("data-theme", state.palette);
    document.querySelectorAll(".swatch-btn").forEach(btn => {
      btn.classList.toggle("active", btn.getAttribute("data-palette") === state.palette);
    });
    saveState();
  }

  function currentUser() {
    return ACCOUNTS[state.currentUserKey] || null;
  }

  function showToast(msg, type = "info") {
    const container = document.getElementById("toastContainer");
    if (!container) return;
    const el = document.createElement("div");
    el.className = "toast";
    if (type === "error") el.style.borderColor = "var(--status-danger)";
    if (type === "success") el.style.borderColor = "var(--status-success)";
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => el.remove(), 3800);
  }

  function escapeHtml(str) {
    return String(str || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function sanitizeUserMarkdown(md) {
    const escaped = escapeHtml(md);
    return escaped
      .replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .split("\n").join("<br/>");
  }

  function getUserProgressMap(uid) {
    if (!uid) return {};
    if (!state.progressByUser[uid]) state.progressByUser[uid] = {};
    return state.progressByUser[uid];
  }

  function getLessonProgress(uid, lessonId) {
    const map = getUserProgressMap(uid);
    return map[lessonId] || {
      status: "not_started",
      university_override: false,
      skipped_at_uni: false,
      skip_reason: "",
      skip_confirmed_at: null,
      substeps_completed: [],
      practice_evidence: "",
      self_explanation: "",
      ai_verified: false,
      prediction_entered: "",
      next_review_due_at: null
    };
  }

  function collectTransitiveReviewedPrereqs(lessonId) {
    const visited = new Map();
    const queue = [];
    const startLes = LESSON_MAP.get(lessonId);
    if (!startLes) return [];
    (startLes.reqPrereqs || []).forEach(pid => queue.push(pid));
    while (queue.length > 0) {
      const pid = queue.shift();
      if (!visited.has(pid) && LESSON_MAP.has(pid)) {
        const pLes = LESSON_MAP.get(pid);
        visited.set(pid, pLes);
        (pLes.reqPrereqs || []).forEach(grandPid => {
          if (!visited.has(grandPid)) queue.push(grandPid);
        });
      }
    }
    return Array.from(visited.values()).sort((a, b) => a.sort - b.sort).map(x => x.id);
  }

  function collectTransitiveDownstreamDependents(rootIds) {
    const rootSet = new Set(rootIds);
    const visited = new Map();
    const queue = [...rootIds];
    while (queue.length > 0) {
      const curId = queue.shift();
      PLATFORM_DATA.lessons.forEach(l => {
        if ((l.reqPrereqs || []).includes(curId) && !rootSet.has(l.id) && !visited.has(l.id)) {
          visited.set(l.id, l);
          queue.push(l.id);
        }
      });
    }
    return Array.from(visited.values()).sort((a, b) => a.sort - b.sort).map(x => x.id);
  }

  function evaluateUnlock(lesson, uid) {
    const progMap = getUserProgressMap(uid);
    const curProg = getLessonProgress(uid, lesson.id);
    const missingReviewed = [];
    const missingProvisional = [];
    const seenReviewed = new Set();

    (lesson.reqPrereqs || []).forEach(pid => {
      const pStatus = (progMap[pid] && progMap[pid].status) || "not_started";
      if (pStatus !== "completed" && pStatus !== "mastered") {
        missingReviewed.push(pid);
        seenReviewed.add(pid);
      }
    });

    collectTransitiveReviewedPrereqs(lesson.id).forEach(aid => {
      const aStatus = (progMap[aid] && progMap[aid].status) || "not_started";
      if (aStatus !== "completed" && aStatus !== "mastered" && !seenReviewed.has(aid)) {
        missingReviewed.push(aid);
        seenReviewed.add(aid);
      }
    });

    (lesson.provPrereqs || []).forEach(pid => {
      const pStatus = (progMap[pid] && progMap[pid].status) || "not_started";
      if (pStatus !== "completed" && pStatus !== "mastered") {
        missingProvisional.push(pid);
      }
    });

    const isSkippedAtUni = !!curProg.skipped_at_uni;
    const hasUpstreamGap = missingReviewed.length > 0 && (curProg.status === "completed" || curProg.status === "mastered" || curProg.status === "in_progress");
    const isLocked = missingReviewed.length > 0 && !isSkippedAtUni && !curProg.university_override;

    return {
      isLocked,
      universityOverride: !!curProg.university_override,
      skippedAtUni: isSkippedAtUni,
      hasUpstreamGap,
      missingReviewed,
      missingProvisional
    };
  }

  function buildKnowledgeBridgeForLesson(lesson, uid) {
    if (!uid) return [];
    const progMap = getUserProgressMap(uid);
    const candidateIds = new Set();

    (lesson.reqPrereqs || []).forEach(pid => candidateIds.add(pid));
    collectTransitiveReviewedPrereqs(lesson.id).forEach(pid => candidateIds.add(pid));
    (lesson.provPrereqs || []).forEach(pid => candidateIds.add(pid));

    const sameSubjPrev = PLATFORM_DATA.lessons
      .filter(l => l.subj === lesson.subj && l.sort < lesson.sort)
      .slice(-3);
    sameSubjPrev.forEach(l => candidateIds.add(l.id));

    const bridgeItems = [];
    Array.from(candidateIds).forEach(cid => {
      if (cid === lesson.id) return;
      const p = progMap[cid];
      if (p && p.skipped_at_uni && (p.status === "completed" || p.status === "mastered")) {
        const lObj = LESSON_MAP.get(cid);
        if (lObj) {
          bridgeItems.push({
            id: lObj.id,
            sort: lObj.sort,
            title: lObj.title,
            sem: lObj.sem,
            subj: lObj.subj,
            skipReason: p.skip_reason || "Đã học ở trường",
            expHtml: lObj.sec.exp,
            syncHtml: lObj.sec.sync,
            checkHtml: lObj.sec.check
          });
        }
      }
    });

    return bridgeItems.sort((a, b) => a.sort - b.sort);
  }

  function computeMetrics(uid) {
    const progMap = getUserProgressMap(uid);
    let inProgress = 0, needsReview = 0, completed = 0, skippedUni = 0, mastered = 0, upstreamGaps = 0;
    PLATFORM_DATA.lessons.forEach(l => {
      const p = progMap[l.id];
      const st = (p && p.status) || "not_started";
      if (st === "in_progress") inProgress++;
      else if (st === "needs_review") needsReview++;
      else if (st === "completed") {
        completed++;
        if (p && p.skipped_at_uni) skippedUni++;
      } else if (st === "mastered") mastered++;

      const u = evaluateUnlock(l, uid);
      if (u.hasUpstreamGap) upstreamGaps++;
    });
    const total = PLATFORM_DATA.lessons.length;
    const notStarted = total - (inProgress + needsReview + completed + mastered);
    return { total, notStarted, inProgress, needsReview, completed, skippedUni, genuineCompleted: completed - skippedUni, mastered, upstreamGaps };
  }

  function findNextActiveLessonId(uid, preferredSubj = null) {
    const progMap = getUserProgressMap(uid);
    if (preferredSubj) {
      const pUp = preferredSubj.toUpperCase();
      for (const l of PLATFORM_DATA.lessons) {
        if (l.subj === pUp || l.pfx === pUp) {
          const st = (progMap[l.id] && progMap[l.id].status) || "not_started";
          if (st !== "completed" && st !== "mastered") return l.id;
        }
      }
    }
    const trackOrder = ["CPP", "DSA", "MATH", "ARCH", "SUP", "DB", "OS", "NET", "SE", "TEST", "SEC", "DEV", "TOOL", "EN", "DM", "BE", "FE", "SYS", "DATA", "PROJECT"];
    for (const code of trackOrder) {
      for (const l of PLATFORM_DATA.lessons) {
        if (l.subj === code) {
          const st = (progMap[l.id] && progMap[l.id].status) || "not_started";
          if (st !== "completed" && st !== "mastered") return l.id;
        }
      }
    }
    for (const l of PLATFORM_DATA.lessons) {
      const st = (progMap[l.id] && progMap[l.id].status) || "not_started";
      if (st !== "completed" && st !== "mastered") return l.id;
    }
    return "PROJECT-07";
  }

  /* ==========================================================================
     UNIVERSITY PRIOR-LEARNING SKIP & UNSKIP ENGINE + MODAL
     ========================================================================== */
  function resolveTargetLessonsForSpec(spec) {
    const ids = new Set();
    if (spec.lessonIds && Array.isArray(spec.lessonIds)) {
      spec.lessonIds.forEach(id => { if (LESSON_MAP.has(id)) ids.add(id); });
    }
    if (spec.subjectCode) {
      const sc = spec.subjectCode.toUpperCase();
      PLATFORM_DATA.lessons.forEach(l => {
        if (l.subj === sc || l.pfx === sc) ids.add(l.id);
      });
    }
    if (spec.semesterId) {
      const sem = spec.semesterId.toUpperCase();
      PLATFORM_DATA.lessons.forEach(l => {
        if (l.sem === sem) ids.add(l.id);
      });
    }
    if (spec.fromLessonId && spec.toLessonId) {
      const lStart = LESSON_MAP.get(spec.fromLessonId.toUpperCase());
      const lEnd = LESSON_MAP.get(spec.toLessonId.toUpperCase());
      if (lStart && lEnd) {
        const lo = Math.min(lStart.sort, lEnd.sort);
        const hi = Math.max(lStart.sort, lEnd.sort);
        const sameSubj = lStart.subj === lEnd.subj;
        PLATFORM_DATA.lessons.forEach(l => {
          if (l.sort >= lo && l.sort <= hi && (!sameSubj || l.subj === lStart.subj)) {
            ids.add(l.id);
          }
        });
      }
    }
    return Array.from(ids).map(id => LESSON_MAP.get(id)).filter(Boolean).sort((a, b) => a.sort - b.sort);
  }

  function executeUniversitySkip({
    lessonIds = [],
    subjectCode = "",
    semesterId = "",
    fromLessonId = "",
    toLessonId = "",
    confirmedLearnedAtUni = false,
    skipReason = "Đã học ở trường UIT",
    cascadePrerequisites = true
  }) {
    const user = currentUser();
    if (!user) {
      showToast("Vui lòng đăng nhập để sử dụng tính năng Bỏ qua vì đã học ở trường.", "error");
      return { ok: false, error: "UNAUTHENTICATED" };
    }
    if (!confirmedLearnedAtUni) {
      showToast("Chặn skip tự do! Bạn bắt buộc phải tích xác nhận 'Đã học ở trường' trước khi bỏ qua.", "error");
      return { ok: false, error: "SKIP_CONFIRMATION_REQUIRED" };
    }
    const cleanReason = String(skipReason || "").trim();
    if (cleanReason.length < 3) {
      showToast("Vui lòng nhập tên môn học hoặc lý do đã học ở trường (tối thiểu 3 ký tự).", "error");
      return { ok: false, error: "VALIDATION_ERROR" };
    }

    const baseLessons = resolveTargetLessonsForSpec({ lessonIds, subjectCode, semesterId, fromLessonId, toLessonId });
    if (baseLessons.length === 0) {
      showToast("Không tìm thấy bài học nào trong phạm vi đã chọn.", "error");
      return { ok: false, error: "EMPTY_SELECTION" };
    }

    const targetMap = new Map();
    baseLessons.forEach(l => targetMap.set(l.id, l));
    const cascadedIds = [];

    if (cascadePrerequisites) {
      baseLessons.forEach(l => {
        collectTransitiveReviewedPrereqs(l.id).forEach(pid => {
          if (!targetMap.has(pid) && LESSON_MAP.has(pid)) {
            targetMap.set(pid, LESSON_MAP.get(pid));
            cascadedIds.push(pid);
          }
        });
      });
    }

    const allTargets = Array.from(targetMap.values()).sort((a, b) => a.sort - b.sort);
    const progMap = getUserProgressMap(user.id);
    const nowIso = new Date().toISOString();
    const skippedNow = [];
    const preservedGenuine = [];

    allTargets.forEach(l => {
      const cur = progMap[l.id];
      if (cur && (cur.status === "completed" || cur.status === "mastered") && !cur.skipped_at_uni) {
        preservedGenuine.push(l.id);
        return;
      }
      const allSubsteps = (l.substeps || []).map(s => s.substep_id);
      progMap[l.id] = {
        ...(cur || {}),
        status: "completed",
        university_override: true,
        skipped_at_uni: true,
        skip_reason: cleanReason,
        skip_confirmed_at: nowIso,
        substeps_completed: allSubsteps,
        practice_evidence: (cur && cur.practice_evidence) || "",
        self_explanation: (cur && cur.self_explanation) || "",
        ai_verified: !!(cur && cur.ai_verified),
        prediction_entered: (cur && cur.prediction_entered) || "",
        next_review_due_at: null
      };
      skippedNow.push(l.id);
    });

    const nextActiveId = findNextActiveLessonId(user.id, subjectCode || (baseLessons[0] && baseLessons[0].subj));
    if (skippedNow.includes(state.activeLessonId) && state.activeView !== "reader") {
      state.activeLessonId = nextActiveId;
    }

    state.auditLogs.unshift({
      id: Date.now(),
      request_id: "req_skip_" + Date.now(),
      actor_user_id: user.id,
      actor_role: user.role,
      action: "UNIVERSITY_SKIP_CONFIRMED",
      target_entity: subjectCode || semesterId || (skippedNow[0] || "batch"),
      details: `Skipped ${skippedNow.length} lessons (Cascaded prereqs: ${cascadedIds.length}, Preserved genuine: ${preservedGenuine.length}).`,
      created_at: nowIso
    });

    saveState();
    updateTopTelemetry();
    renderMainView();

    showToast(
      `🎓 Đã xác nhận học ở trường cho ${skippedNow.length} bài học` +
      (cascadedIds.length ? ` (gồm ${cascadedIds.length} bài tiên quyết)` : "") +
      `. Bài tiếp theo: ${nextActiveId}.`,
      "success"
    );

    return {
      ok: true,
      skippedCount: skippedNow.length,
      skippedIds: skippedNow,
      cascadedPrereqIds: cascadedIds,
      preservedGenuineIds: preservedGenuine,
      nextRecommendedLessonId: nextActiveId
    };
  }

  function executeUniversityUnskip({
    lessonIds = [],
    subjectCode = "",
    semesterId = "",
    fromLessonId = "",
    toLessonId = "",
    cascadeDownstream = false
  }) {
    const user = currentUser();
    if (!user) {
      showToast("Vui lòng đăng nhập để thực hiện bỏ skip (hoàn tác).", "error");
      return { ok: false, error: "UNAUTHENTICATED" };
    }

    const baseLessons = resolveTargetLessonsForSpec({ lessonIds, subjectCode, semesterId, fromLessonId, toLessonId });
    if (baseLessons.length === 0) {
      showToast("Không tìm thấy bài học nào để bỏ skip.", "error");
      return { ok: false, error: "EMPTY_SELECTION" };
    }

    const targetIds = new Set(baseLessons.map(l => l.id));
    const cascadedDownstreamIds = [];
    if (cascadeDownstream) {
      collectTransitiveDownstreamDependents(Array.from(targetIds)).forEach(did => {
        if (!targetIds.has(did)) {
          targetIds.add(did);
          cascadedDownstreamIds.push(did);
        }
      });
    }

    const progMap = getUserProgressMap(user.id);
    const unskippedIds = [];
    const preservedGenuineIds = [];

    Array.from(targetIds).forEach(lid => {
      const cur = progMap[lid];
      if (!cur) return;
      if (!cur.skipped_at_uni) {
        if (cur.status !== "not_started") preservedGenuineIds.push(lid);
        return;
      }
      const hasManualWork = Boolean((cur.prediction_entered && cur.prediction_entered.trim()) || (cur.practice_evidence && cur.practice_evidence.trim()));
      progMap[lid] = {
        ...cur,
        status: hasManualWork ? "in_progress" : "not_started",
        university_override: false,
        skipped_at_uni: false,
        skip_reason: "",
        skip_confirmed_at: null,
        substeps_completed: []
      };
      unskippedIds.push(lid);
    });

    const downstreamIds = collectTransitiveDownstreamDependents(unskippedIds);
    const reLockedLessons = [];
    const gapWarnings = [];
    downstreamIds.forEach(did => {
      const dLes = LESSON_MAP.get(did);
      if (!dLes) return;
      const u = evaluateUnlock(dLes, user.id);
      if (u.isLocked) reLockedLessons.push(did);
      if (u.hasUpstreamGap) {
        gapWarnings.push({
          lessonId: did,
          missingUpstream: u.missingReviewed
        });
      }
    });

    const nextActiveId = findNextActiveLessonId(user.id, subjectCode || (baseLessons[0] && baseLessons[0].subj));
    saveState();
    updateTopTelemetry();
    renderMainView();

    if (unskippedIds.length === 0) {
      showToast("Không có bài nào đang ở trạng thái 'Bỏ qua vì học ở trường' trong phạm vi này.", "info");
    } else if (gapWarnings.length > 0) {
      showToast(
        `↩️ Đã bỏ skip ${unskippedIds.length} bài. Lưu ý: Có ${gapWarnings.length} bài phía sau (${gapWarnings.map(g => g.lessonId).slice(0, 3).join(", ")}) cần ôn lại tiên quyết gốc!`,
        "info"
      );
    } else {
      showToast(
        `↩️ Đã bỏ skip (khôi phục học lại) cho ${unskippedIds.length} bài học. Bắt đầu từ: ${nextActiveId}.`,
        "success"
      );
    }

    return {
      ok: true,
      unskippedCount: unskippedIds.length,
      unskippedIds,
      cascadedDownstreamIds,
      preservedGenuineIds,
      reLockedLessons,
      gapWarnings,
      nextRecommendedLessonId: nextActiveId
    };
  }

  function buildWeeklyPlanItems(uid) {
    const plan = (uid && state.weeklyPlanByUser[uid]) || {
      hours_budget: 5,
      mode: "normal",
      university_priority_subject: "MA006 Giải tích & IT012 Kiến trúc máy tính",
      exam_date: ""
    };
    const nextCpp = findNextActiveLessonId(uid, "CPP");
    const upStr = (plan.university_priority_subject || "").toUpperCase();
    let uniPref = "MATH";
    if (upStr.includes("ARCH") || upStr.includes("IT012")) uniPref = "ARCH";
    else if (upStr.includes("MA003") || upStr.includes("ĐSTT") || upStr.includes("SUP")) uniPref = "SUP";
    else if (upStr.includes("DSA") || upStr.includes("IT003")) uniPref = "DSA";
    else if (upStr.includes("DB") || upStr.includes("IT004")) uniPref = "DB";

    const uniTarget = findNextActiveLessonId(uid, uniPref);
    const enTarget = findNextActiveLessonId(uid, "EN");

    const maxMin = plan.hours_budget * 60;
    const items = [];
    if (plan.hours_budget === 0 || plan.mode === "exam") {
      if (maxMin >= 20) {
        items.push({
          tag: "Duy trì mùa thi (Tùy chọn)",
          lessonId: enTarget,
          minutes: Math.min(20, maxMin),
          desc: "Làm 5 câu quiz tiếng Anh nhanh hoặc xem lại ghi chú. Được phép chọn nghỉ hoàn toàn tuần này mà không tạo nợ bài học."
        });
      }
    } else if (plan.mode === "return_after_break") {
      const m1 = Math.min(35, maxMin);
      if (m1 > 0) {
        items.push({
          tag: "Chẩn đoán quay lại sau nghỉ (≥2 tuần)",
          lessonId: nextCpp,
          minutes: m1,
          desc: "Ôn 3–5 câu hồi tưởng không nhìn tài liệu và trace 1 ví dụ ngắn tại " + nextCpp + ". Không học bù các tuần đã nghỉ."
        });
      }
      if (maxMin - m1 >= 25) {
        items.push({
          tag: "Ôn tiên quyết phục hồi",
          lessonId: uniTarget,
          minutes: Math.min(45, maxMin - m1),
          desc: "Ôn lại bài nền tảng tiếp theo (" + uniTarget + ") sau các bài đã học ở trường."
        });
      }
    } else if (plan.mode === "busy" || plan.hours_budget <= 3) {
      const m1 = Math.min(45, maxMin);
      if (m1 > 0) {
        items.push({
          tag: "Một bước nhỏ duy trì nhịp",
          lessonId: nextCpp,
          minutes: m1,
          desc: "Đọc phần Giải thích và dự đoán kết quả ví dụ của bài " + nextCpp + ". Không ép hoàn thành nguyên bài nặng."
        });
      }
      if (maxMin - m1 >= 15) {
        items.push({
          tag: "English Lab ngắn",
          lessonId: enTarget,
          minutes: Math.min(20, maxMin - m1),
          desc: "Ôn 5 từ vựng code cơ bản tại " + enTarget + "."
        });
      }
    } else {
      const mainMin = Math.floor(maxMin * 0.50);
      const uniMin = Math.floor(maxMin * 0.25);
      const enMin = 25;
      const revMin = maxMin - (mainMin + uniMin + enMin);
      items.push(
        {
          tag: "Mục tiêu học mới chính duy nhất",
          lessonId: nextCpp,
          minutes: mainMin,
          desc: "Học sâu bài " + nextCpp + " (tự động nối tiếp sau các bài bạn đã học ở trường): Đọc giải thích → dự đoán output → tự làm bài cấp B."
        },
        {
          tag: "Củng cố môn đại học ưu tiên",
          lessonId: uniTarget,
          minutes: uniMin,
          desc: "Ưu tiên theo môn đang học trên lớp (" + escapeHtml(plan.university_priority_subject || "Giải tích / Kiến trúc máy tính") + ") tại bài " + uniTarget + "."
        },
        {
          tag: "English Lab tương tác",
          lessonId: enTarget,
          minutes: enMin,
          desc: "Làm quiz 5 câu nhanh (ẩn đáp án trước khi nộp) và ôn thuật ngữ tại " + enTarget + "."
        },
        {
          tag: "Ôn cách quãng & Nhật ký lỗi",
          lessonId: nextCpp,
          minutes: revMin,
          desc: "Ôn bài cũ theo nhịp 1–3–7 ngày và ghi nguyên nhân gốc vào Nhật ký lỗi."
        }
      );
    }

    return { plan, nextCpp, uniTarget, enTarget, maxMin, totalMin: items.reduce((s, x) => s + x.minutes, 0), items };
  }

  function renderRoadmapView(container) {
    const user = currentUser();
    const uid = user ? user.id : null;
    const f = state.filters;

    const filtered = PLATFORM_DATA.lessons.filter(l => {
      if (f.q) {
        const qLow = f.q.toLowerCase();
        const matchId = l.id.toLowerCase().includes(qLow);
        const matchTitle = l.title.toLowerCase().includes(qLow);
        const matchStage = (l.stage || "").toLowerCase().includes(qLow);
        const matchBody = ((l.sec && l.sec.exp) || "").toLowerCase().includes(qLow) || ((l.sec && l.sec.sync) || "").toLowerCase().includes(qLow);
        if (!matchId && !matchTitle && !matchStage && !matchBody) return false;
      }
      if (f.subject && l.subj !== f.subject) return false;
      if (f.semester && l.sem !== f.semester) return false;
      if (f.sup === "core" && l.sup) return false;
      if (f.sup === "sup" && !l.sup) return false;
      if (f.status) {
        const prog = getLessonProgress(uid, l.id);
        const unlock = evaluateUnlock(l, uid);
        if (f.status === "locked") {
          if (!unlock.isLocked) return false;
        } else if (f.status === "skipped_at_uni") {
          if (!prog.skipped_at_uni) return false;
        } else if (prog.status !== f.status) {
          return false;
        }
      }
      return true;
    });

    const pageSize = 24;
    const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));

        let correct = 0;
        const byId = {};
        const wrongIds = [];
        const recoverySet = new Set();

        questions.forEach(q => {
          const choice = currentQuizSelections[q.id] || "";

          if (g.is_correct) correct++;
          else {

            recoverySet.add(g.related_lesson_id);
          }
        });

        const scorePct = Math.round((correct / Math.max(1, questions.length)) * 1000) / 10;
        lastQuizGradingResult = {
          mode: activeQuizMode,
          correct,
          total: questions.length,
          scorePct,
          byId,
          wrongIds,
          recoveryLessons: Array.from(recoverySet),

        renderEnglishLabView(container);

    }

    }
    return state.gpaByUser[uid];
  }

  function parseFiniteNumber(val) {
    if (val === null || val === undefined || val === "" || typeof val === "boolean") return null;
    const n = Number(String(val).trim().replace(",", "."));
    return Number.isFinite(n) ? n : NaN;
  }

  function calculateCourseMetricsPure(course, scaleConfig) {
    const comps = course.components || [];
    const target = parseFiniteNumber(course.targetScore10) ?? 5.0;
    const minCov = (scaleConfig && scaleConfig.minGradedWeightForWarning) ?? 25.0;
    const weakTh = (scaleConfig && scaleConfig.weakThresholds) || { critical_below: 5.0, weak_below: 6.0, reinforce_below: 7.0, strong_at_least: 8.0 };

    let configuredWeight = 0;
    let gradedWeight = 0;
    let earnedWeightedPoints = 0;
    let gradedCount = 0;
    let ungradedCount = 0;

    for (const c of comps) {
      const w = parseFiniteNumber(c.weightPercent);
      const m = parseFiniteNumber(c.maxScore) ?? 10;
      if (!Number.isFinite(w) || w < 0 || w > 100 || !Number.isFinite(m) || m <= 0) {
        return { error: "Trọng số (0–100%) hoặc điểm tối đa (>0) không hợp lệ." };
      }
      if (c.status === "excused") continue;
      configuredWeight += w;
      const s = parseFiniteNumber(c.score);
      if (s !== null && c.status === "graded") {
        if (!Number.isFinite(s) || s < 0 || s > m) {
          return { error: `Điểm thành phần '${c.name}' phải nằm trong [0, ${m}].` };
        }
        const norm10 = (s / m) * 10.0;
        earnedWeightedPoints += norm10 * (w / 100.0);
        gradedWeight += w;
        gradedCount++;
      } else {
        ungradedCount++;
      }
    }

    if (configuredWeight > 100.0 + 1e-6) {
      return { error: `Tổng trọng số (${configuredWeight.toFixed(1)}%) vượt quá 100%.` };
    }

    const remainingWeight = Math.max(0, 100.0 - gradedWeight);
    const currentAverageOnGraded = gradedWeight > 0 ? (earnedWeightedPoints / (gradedWeight / 100.0)) : null;
    const isComplete100 = Math.abs(configuredWeight - 100.0) <= 1e-6 && Math.abs(gradedWeight - 100.0) <= 1e-6 && ungradedCount === 0;
    const calculatedFinalScore10 = isComplete100 ? earnedWeightedPoints : null;

    let requiredAverageOnRemaining = null;
    let targetFeasibility = "not_applicable";
    let targetMessage = "";
    if (remainingWeight > 1e-6) {
      requiredAverageOnRemaining = (target - earnedWeightedPoints) / (remainingWeight / 100.0);
      if (requiredAverageOnRemaining > 10.0) {
        targetFeasibility = "impossible_under_current_scale";
        targetMessage = `Không thể đạt mục tiêu ${target}/10 với thang điểm hiện tại (cần trung bình ${requiredAverageOnRemaining.toFixed(2)}/10 ở ${remainingWeight.toFixed(0)}% còn lại).`;
      } else if (requiredAverageOnRemaining <= 0) {
        targetFeasibility = "already_achieved";
        targetMessage = `Mục tiêu ${target}/10 đã đạt theo phần điểm hiện có (${earnedWeightedPoints.toFixed(2)} điểm tích lũy).`;
      } else {
        targetFeasibility = "achievable";
        targetMessage = `Cần đạt trung bình ${requiredAverageOnRemaining.toFixed(2)}/10 trên ${remainingWeight.toFixed(0)}% trọng số còn lại để đạt ${target}/10.`;
      }
    } else if (calculatedFinalScore10 !== null) {
      targetFeasibility = calculatedFinalScore10 >= target ? "completed_achieved" : "completed_missed";
      targetMessage = `Đã đủ 100% trọng số: đạt ${calculatedFinalScore10.toFixed(2)}/10.`;
    }

    const offScore = parseFiniteNumber(course.officialFinalScore);
    const offGp = parseFiniteNumber(course.officialGradePoint);
    const effectiveFinalScore10 = (offScore !== null && Number.isFinite(offScore)) ? offScore : calculatedFinalScore10;

    let projectedFinalScore10 = null;
    const projRem = parseFiniteNumber(course.projectedRemainingScore10);
    if (effectiveFinalScore10 === null && projRem !== null && Number.isFinite(projRem) && projRem >= 0 && projRem <= 10 && remainingWeight > 0) {
      projectedFinalScore10 = earnedWeightedPoints + projRem * (remainingWeight / 100.0);
    }

    const signalScore = effectiveFinalScore10 !== null ? effectiveFinalScore10 : currentAverageOnGraded;
    const coveragePct = offScore !== null ? 100.0 : gradedWeight;
    let weakSignal = "insufficient_data";
    let signalLabel = "Chưa đủ dữ liệu";
    if (signalScore !== null && coveragePct >= minCov) {
      if (signalScore < weakTh.critical_below) { weakSignal = "critical"; signalLabel = "Rất yếu — Cần củng cố nền tảng ngay"; }
      else if (signalScore < weakTh.weak_below) { weakSignal = "weak"; signalLabel = "Yếu — Cần kế hoạch ôn tập"; }
      else if (signalScore < weakTh.reinforce_below) { weakSignal = "reinforce"; signalLabel = "Cần luyện tập thêm"; }
      else if (signalScore >= weakTh.strong_at_least) { weakSignal = "strong"; signalLabel = "Mạnh / Vững vàng"; }
      else { weakSignal = "stable"; signalLabel = "Ổn định"; }
    }

    return {
      error: null,
      configuredWeight,
      gradedWeight,
      remainingWeight,
      gradedCount,
      ungradedCount,
      earnedWeightedPoints,
      currentAverageOnGraded,
      requiredAverageOnRemaining,
      targetFeasibility,
      targetMessage,
      calculatedFinalScore10,
      officialFinalScore10: offScore,
      officialGradePoint: offGp,
      effectiveFinalScore10,
      projectedFinalScore10,
      weakSignal,
      signalLabel
    };
  }

  function convertScore10ToGpPure(score10, bands) {
    if (score10 === null || !Number.isFinite(score10)) return { mapped: false, gradePoint: null, letterGrade: "" };
    const sorted = [...(bands || DEFAULT_GPA_BANDS)].sort((a, b) => b.minScore - a.minScore);
    for (const b of sorted) {
      if (score10 >= b.minScore && score10 <= b.maxScore + 1e-9) {
        return { mapped: true, gradePoint: Number(b.gradePoint), letterGrade: b.letterGrade || "" };
      }
    }
    return { mapped: false, gradePoint: null, letterGrade: "" };
  }

  function calculateGpaSummaryPure(courses, scaleConfig, termId = null) {
    const isConfirmed = !!(scaleConfig && scaleConfig.isConfirmedByUser);
    const bands = (scaleConfig && scaleConfig.scoreBands) || DEFAULT_GPA_BANDS;
    const repeatPolicy = (scaleConfig && scaleConfig.repeatCoursePolicy) || "highest_grade";
    const scoped = courses.filter(c => !termId || c.termId === termId);

    const eligibleActual = [];
    const eligibleProjected = [];
    const excluded = [];
    let blockedByUnconfirmedScale = false;

    scoped.forEach(c => {
      if (["withdrawn", "incomplete", "planned"].includes(c.status)) {
        excluded.push({ id: c.id, name: c.courseName, reason: `Trạng thái '${c.status}' không tính GPA` });
        return;
      }
      const cr = parseFiniteNumber(c.credits);
      if (cr === null || !Number.isFinite(cr) || cr <= 0) {
        excluded.push({ id: c.id, name: c.courseName, reason: "Thiếu hoặc số tín chỉ <= 0" });
        return;
      }
      const m = calculateCourseMetricsPure(c, scaleConfig);
      if (m.error) {
        excluded.push({ id: c.id, name: c.courseName, reason: m.error });
        return;
      }

      let gp = null;
      let letter = "";
      if (m.officialGradePoint !== null && Number.isFinite(m.officialGradePoint)) {
        gp = m.officialGradePoint;
        letter = c.officialLetterGrade || "";
      } else if (m.effectiveFinalScore10 !== null) {
        if (!isConfirmed) {
          blockedByUnconfirmedScale = true;
          excluded.push({ id: c.id, name: c.courseName, reason: "Chưa xác nhận bảng quy đổi hệ 4.0" });
        } else {
          const conv = convertScore10ToGpPure(m.effectiveFinalScore10, bands);
          if (conv.mapped) { gp = conv.gradePoint; letter = conv.letterGrade; }
          else excluded.push({ id: c.id, name: c.courseName, reason: "Điểm nằm ngoài dải quy đổi" });
        }
      } else {
        excluded.push({ id: c.id, name: c.courseName, reason: "Môn đang học (chưa đủ 100% điểm thành phần)" });
      }

      if (gp !== null) {
        eligibleActual.push({ ...c, credits: cr, gp, letter, final10: m.effectiveFinalScore10 });
        eligibleProjected.push({ ...c, credits: cr, gp, letter, final10: m.effectiveFinalScore10, isProjected: false });
      } else if (m.projectedFinalScore10 !== null) {
        const convP = convertScore10ToGpPure(m.projectedFinalScore10, bands);
        if (convP.mapped) {
          eligibleProjected.push({ ...c, credits: cr, gp: convP.gradePoint, letter: convP.letterGrade, final10: m.projectedFinalScore10, isProjected: true });
        }
      }
    });

    const filterRepeat = (list) => {
      if (repeatPolicy === "all_attempts") return list;
      const byCode = new Map();
      const out = [];
      list.forEach(item => {
        const code = String(item.courseCode || "").trim().toUpperCase();
        if (!code) { out.push(item); return; }
        if (!byCode.has(code)) byCode.set(code, []);
        byCode.get(code).push(item);
      });
      byCode.forEach(group => {
        if (group.length === 1) { out.push(group[0]); return; }
        group.sort((a, b) => repeatPolicy === "latest_attempt"
          ? ((b.attemptNumber || 1) - (a.attemptNumber || 1))
          : (b.gp - a.gp || (b.final10 || 0) - (a.final10 || 0))
        );
        out.push(group[0]);
      });
      return out;
    };

    const keptActual = filterRepeat(eligibleActual);
    const actualCredits = keptActual.reduce((s, x) => s + x.credits, 0);
    const actualGpaRaw = actualCredits > 0 ? (keptActual.reduce((s, x) => s + x.gp * x.credits, 0) / actualCredits) : null;
    const actualStatus = actualCredits > 0 ? "ready" : (blockedByUnconfirmedScale ? "scale_not_confirmed" : "insufficient_data");

    const keptProj = filterRepeat(eligibleProjected);
    const projCredits = keptProj.reduce((s, x) => s + x.credits, 0);
    const projGpaRaw = (projCredits > 0 && keptProj.some(x => x.isProjected))
      ? (keptProj.reduce((s, x) => s + x.gp * x.credits, 0) / projCredits)
      : null;

    let adaptationBand = null;
    let adaptationText = "Chưa gán mức GPA tổng thể (cần xác nhận bảng quy đổi hệ 4.0 và có ít nhất 1 môn hoàn tất điểm tổng kết). Tuy nhiên hệ thống vẫn gợi ý ôn tập theo điểm từng môn đang học bên dưới.";
    if (actualGpaRaw !== null) {
      if (actualGpaRaw >= 3.60) { adaptationBand = "excellent"; adaptationText = "Excellent (3.60–4.00): Giữ tiến độ roadmap chính; duy trì ôn ngắn cho môn nền tảng."; }
      else if (actualGpaRaw >= 3.20) { adaptationBand = "good"; adaptationText = "Good (3.20–<3.60): Giữ lộ trình, thêm buổi ôn có mục tiêu cho môn có tín hiệu yếu."; }
      else if (actualGpaRaw >= 2.50) { adaptationBand = "watch"; adaptationText = "Watch (2.50–<3.20): Tăng thời lượng phục hồi ở các môn yếu; ưu tiên bài tiên quyết."; }
      else if (actualGpaRaw >= 2.00) { adaptationBand = "risk"; adaptationText = "Risk (2.00–<2.50): Chuyển sang kế hoạch phục hồi ngắn; chia bài thành bước nhỏ."; }
      else { adaptationBand = "recovery"; adaptationText = "Recovery (<2.00): Chế độ phục hồi nền tảng cốt lõi, tạm dừng mở bài nâng cao."; }
    }

    return {
      actualGpaRaw,
      actualGpaDisplay: actualGpaRaw !== null ? actualGpaRaw.toFixed(scaleConfig.roundingDecimals || 2) : null,
      actualStatus,
      actualCredits,
      actualCoursesCount: keptActual.length,
      projGpaRaw,
      projGpaDisplay: projGpaRaw !== null ? projGpaRaw.toFixed(scaleConfig.roundingDecimals || 2) : null,
      projCredits,
      excluded,
      adaptationBand,
      adaptationText
    };
  }

  function getUserSessionsState(uid) {
    if (!uid) return { activeSession: null, history: [] };
    if (!state.studySessionsByUser) state.studySessionsByUser = {};
    if (!state.studySessionsByUser[uid]) {
      state.studySessionsByUser[uid] = {
        activeSession: null,
        lastCompletedSummary: null,
        history: [
          {
            id: "ses_demo_1",
            title: "Buổi học CPP — C++ Từ Số 0 Đến Nền Tảng Vững (CPP-001)",
            subjectCode: "CPP",
            subjectDisplay: "CPP — C++ Từ Số 0 Đến Nền Tảng Vững",
            startedAt: "2026-10-14T19:00:00+07:00",
            endedAt: "2026-10-14T19:45:00+07:00",

            durationSeconds: 2700,
            pausedSeconds: 0,

            reflectionLearned: "Phân biệt rõ mã nguồn .cpp, compiler và file thực thi; tự viết được công thức đổi độ C sang độ F.",
            reflectionConfusions: "Cần chú ý thêm lỗi thiếu dấu chấm phẩy cuối câu lệnh.",
            lessons: [
              { lessonId: "CPP-001", title: "Máy tính, chương trình và lệnh", subjectDisplay: "CPP — C++ Từ Số 0 Đến Nền Tảng Vững", evidenceBadges: ["Đã xem/mở", "Đã luyện tập", "Tự đánh giá đã hiểu"], selfAssessment: "co_the_tu_lam" }
            ],
            nextActions: ["CPP-002", "CPP-003"]
          }
        ]
      };
    }
    return state.studySessionsByUser[uid];
  }

  function recordActiveSessionLessonEvent(lessonId, eventType = "lesson_opened", extra = {}) {
    const user = currentUser();
    if (!user) return;
    const sState = getUserSessionsState(user.id);
    const act = sState.activeSession;
    if (!act || act.status !== "active") return;
    const lObj = LESSON_MAP.get(lessonId);
    if (!lObj) return;

    let item = act.lessons.find(x => x.lessonId === lessonId);
    if (!item) {
      const lbl = resolveCourseOrSubjectLabel(lObj.subj);
      item = {
        lessonId: lObj.id,
        title: lObj.title,
        subjectDisplay: lbl.display,
        evidenceBadges: ["Đã xem/mở"],
        selfAssessment: "hieu_mot_phan"
      };
      act.lessons.push(item);
    }
    if (eventType === "practice_completed" && !item.evidenceBadges.includes("Đã luyện tập")) {
      item.evidenceBadges.push("Đã luyện tập");
    }
    if (eventType === "quiz_submitted" && !item.evidenceBadges.includes("Đạt quiz")) {
      item.evidenceBadges.push(extra.scorePct >= 80 ? "Đạt quiz" : "Đã làm quiz");
    }
    saveState();
  }

  function computeStudySessionStats(uid) {
    const sState = getUserSessionsState(uid);
    const completed = (sState.history || []).filter(s => s.status === "completed");
    const totalSeconds = completed.reduce((acc, s) => acc + (Number(s.durationSeconds) || 0), 0);
    const touchedSet = new Set();
    const bySubj = {};
    completed.forEach(s => {
      bySubj[s.subjectCode] = (bySubj[s.subjectCode] || 0) + (Number(s.durationSeconds) || 0);
      (s.lessons || []).forEach(l => touchedSet.add(l.lessonId));
    });
    if (sState.activeSession && sState.activeSession.status !== "cancelled") {
      (sState.activeSession.lessons || []).forEach(l => touchedSet.add(l.lessonId));
    }
    let topSubj = "Chưa có dữ liệu";
    const entries = Object.entries(bySubj);
    if (entries.length > 0) {
      entries.sort((a, b) => b[1] - a[1]);
      topSubj = resolveCourseOrSubjectLabel(entries[0][0]).display;
    }
    const m = computeMetrics(uid);
    return {
      sessionsCount: completed.length,
      studyTimeSeconds: totalSeconds,
      studyTimeMinutes: Math.round(totalSeconds / 60),
      lessonsTouched: touchedSet.size,
      lessonsCompleted: m.completed + m.mastered,
      lessonsMastered: m.mastered,
      mostStudiedSubject: topSubj,
      activeSession: sState.activeSession
    };
  }

                <p style="margin-top:6px; color:var(--text-secondary);">
                  Theo báo cáo khả thi <code>SCHOOL_GRADE_INTEGRATION_FEASIBILITY.md</code>, cổng trường chưa cung cấp OAuth2/API đọc điểm công khai cho ứng dụng cá nhân. Để bảo vệ tài khoản sinh viên, hệ thống <strong>tuyệt đối không thu thập mật khẩu cổng trường và không cạo dữ liệu (scraping)</strong>.

      });

    const termSel = document.getElementById("gpaTermFilterSelect");
    if (termSel) {
      termSel.addEventListener("change", e => {
        gState.selectedTermId = e.target.value;
        saveState();
        renderGpaTrackerView(container);
      });

    if (quickConfirmBtn) {
      quickConfirmBtn.addEventListener("click", () => {
        scale.isConfirmedByUser = !scale.isConfirmedByUser;
        saveState();
        renderGpaTrackerView(container);
        showToast(scale.isConfirmedByUser ? "Đã xác nhận bảng quy đổi hệ 4.0! GPA thực tế đã được kích hoạt." : "Đã tắt xác nhận bảng quy đổi hệ 4.0.", "info");
      });
    }

    if (codeSel) {
      codeSel.addEventListener("change", e => {
        const info = UIT_COURSE_DICTIONARY[e.target.value];
        if (info) {
          document.getElementById("newGpaCourseName").value = info.name;
          document.getElementById("newGpaCredits").value = info.credits;
        }
      });
    }

    const saveCourseBtn = document.getElementById("saveGpaCourseBtn");
    if (saveCourseBtn) {
      saveCourseBtn.addEventListener("click", () => {
        const rawCode = document.getElementById("newGpaCourseCode").value;
        const cCode = rawCode === "CUSTOM" ? "CUSTOM" : rawCode;
        const cName = document.getElementById("newGpaCourseName").value.trim();
        const cr = parseFiniteNumber(document.getElementById("newGpaCredits").value);
        const target = parseFiniteNumber(document.getElementById("newGpaTarget").value);
        const mw = parseFiniteNumber(document.getElementById("newGpaMidWeight").value);
        const ms = parseFiniteNumber(document.getElementById("newGpaMidScore").value);
        const fw = parseFiniteNumber(document.getElementById("newGpaFinWeight").value);
        const fsRaw = document.getElementById("newGpaFinScore").value.trim();
        const fs = fsRaw === "" ? null : parseFiniteNumber(fsRaw);

        if (!cName || !Number.isFinite(cr) || cr <= 0) {
          return showToast("Vui lòng nhập tên môn và số tín chỉ > 0.", "error");
        }
        if ((mw + fw) > 100.0 + 1e-6) {
          return showToast(`Tổng trọng số (${mw + fw}%) không được vượt quá 100%!`, "error");
        }

        const dictInfo = UIT_COURSE_DICTIONARY[cCode];
        const newCourse = {
          id: "crs_" + Date.now(),
          termId: gState.selectedTermId || "term_hk1",
          courseCode: cCode,
          courseName: cName,
          credits: cr,
          status: fs !== null && Math.abs(mw + fw - 100) < 1e-6 ? "completed" : "in_progress",
          targetScore10: Number.isFinite(target) ? target : 7.0,
          projectedRemainingScore10: Number.isFinite(target) ? target : 7.0,
          officialFinalScore: null,
          officialGradePoint: null,
          officialLetterGrade: "",
          attemptNumber: 1,
          roadmapLessonIds: dictInfo ? dictInfo.lessons : [],
          mappingSource: dictInfo ? "existing_data" : "unlinked",
          components: [
            { id: "cmp_m_" + Date.now(), name: "Giữa kỳ / Quá trình", weightPercent: mw, maxScore: 10, score: ms, status: ms !== null ? "graded" : "not_graded" },
            { id: "cmp_f_" + Date.now(), name: "Cuối kỳ", weightPercent: fw, maxScore: 10, score: fs, status: fs !== null ? "graded" : "not_graded" }
          ]
        };

        const check = calculateCourseMetricsPure(newCourse, scale);
        if (check.error) return showToast(check.error, "error");

        gState.courses.unshift(newCourse);
        saveState();
        renderGpaTrackerView(container);
        showToast(`Đã lưu học phần ${cCode} — ${cName} và cập nhật dự báo GPA!`, "success");
      });
    }

    container.querySelectorAll("[data-delete-gpa-course]").forEach(btn => {
      btn.addEventListener("click", () => {
        const cid = btn.getAttribute("data-delete-gpa-course");
        gState.courses = gState.courses.filter(x => x.id !== cid);
        saveState();
        renderGpaTrackerView(container);
        showToast("Đã xóa học phần.", "info");
      });
    });

    const saveScaleBtn = document.getElementById("saveScaleConfigBtn");
    if (saveScaleBtn) {
      saveScaleBtn.addEventListener("click", () => {
        scale.isConfirmedByUser = document.getElementById("confirmScaleChk").checked;
        scale.repeatCoursePolicy = document.getElementById("repeatPolicySelect").value;
        saveState();
        renderGpaTrackerView(container);
        showToast("Đã lưu cấu hình bảng quy đổi GPA hệ 4.0!", "success");
      });
    }

    const expBtn = document.getElementById("exportGpaJsonBtn");
    if (expBtn) {
      expBtn.addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(gState, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "se_roadmap_gpa_backup.json";
        a.click();
        URL.revokeObjectURL(url);
        showToast("Đã xuất file sao lưu GPA JSON!", "success");
      });
    }
  }

        const now = new Date();
        const elapsedSec = Math.max(60, Math.round((now.getTime() - new Date(act.startedAt).getTime()) / 1000) - (act.pausedSeconds || 0));

        const completedSes = {
          ...act,
          endedAt: now.toISOString(),
          status: "completed",
          durationSeconds: elapsedSec,
          reflectionLearned: learned || "Đã hoàn thành phiên học và xem lại nội dung bài.",

    const cancelBtn = document.getElementById("cancelActiveSessionBtn");

              <input type="text" id="xssTestInput" class="form-input" value="&lt;script&gt;alert('XSS')&lt;/script&gt; [Click](javascript:alert(1)) **An toàn**" />
            </div>
            <button type="button" class="btn btn-primary" id="runXssSanitizeBtn">Chạy Sanitizer</button>
            <div style="margin-top:12px; padding:12px; background:var(--bg-canvas); border-radius:var(--radius-sm); font-size:13px;" id="xssTestOutput"></div>
          </section>
        </div>
      </div>
    `;

    const outBox = document.getElementById("idorTestOutput");
    const testAccess = (targetUid) => {
      if (!user) {
        outBox.textContent = JSON.stringify({ status: 401, error: "UNAUTHENTICATED" }, null, 2);
        return;
      }
      if (user.id !== targetUid) {
        outBox.textContent = JSON.stringify({ status: 403, error: "FORBIDDEN (IDOR Blocked)" }, null, 2);
        return;
      }
      outBox.textContent = JSON.stringify({ status: 200, owner: targetUid, notes: state.notesByUser[targetUid] || {} }, null, 2);
    };
    const b1 = document.getElementById("testIdorUser1Btn");
    if (b1) b1.addEventListener("click", () => testAccess("usr_learner_1"));
    const b2 = document.getElementById("testIdorUser2Btn");
    if (b2) b2.addEventListener("click", () => testAccess("usr_learner_2"));

    const xssBtn = document.getElementById("runXssSanitizeBtn");
    const xssOut = document.getElementById("xssTestOutput");
    if (xssBtn && xssOut) {
      const runSan = () => {
        const safe = sanitizeUserMarkdown(document.getElementById("xssTestInput").value);
        xssOut.innerHTML = `<div><strong>HTML an toàn:</strong> <code>${escapeHtml(safe)}</code></div>`;
      };
      xssBtn.addEventListener("click", runSan);
      runSan();
    }
  }

  function renderMainView() {
    const main = document.getElementById("main-workspace");
    if (!main) return;
    if (state.activeView === "dashboard") renderDashboardView(main);
    else if (state.activeView === "roadmap") renderRoadmapView(main);
    else if (state.activeView === "reader") {
      recordActiveSessionLessonEvent(state.activeLessonId, "lesson_opened");
      renderReaderView(main);
    }
    else if (state.activeView === "gpa") renderGpaTrackerView(main);
    else if (state.activeView === "sessions") renderStudySessionsView(main);
    else if (state.activeView === "english") renderEnglishLabView(main);
    else if (state.activeView === "remediation") renderRemediationView(main);
    else if (state.activeView === "projects") renderProjectsAndGatesView(main);
    else if (state.activeView === "admin") renderAdminView(main);
    else if (state.activeView === "security") renderSecurityAndApiView(main);
    else renderDashboardView(main);
  }

  document.addEventListener("click", e => {
    const navBtn = e.target.closest("[data-view]");
    if (navBtn) {
      navigateTo(navBtn.getAttribute("data-view"));
      return;
    }
    const swBtn = e.target.closest("[data-switch-view]");
    if (swBtn) {
      navigateTo(swBtn.getAttribute("data-switch-view"));
      return;
    }
    const openLes = e.target.closest("[data-open-lesson]");
    if (openLes) {
      navigateTo("reader", openLes.getAttribute("data-open-lesson"));
      return;
    }
    const filterSubj = e.target.closest("[data-filter-subj]");
    if (filterSubj) {
      state.filters.subject = filterSubj.getAttribute("data-filter-subj");
      state.filters.page = 1;
      navigateTo("roadmap");
      return;
    }
    const filterSem = e.target.closest("[data-filter-sem]");
    if (filterSem) {
      state.filters.semester = filterSem.getAttribute("data-filter-sem");
      state.filters.page = 1;
      navigateTo("roadmap");
      return;
    }
    const startSesBtn = e.target.closest("[data-start-session-subj]");
    if (startSesBtn) {
      const user = currentUser();
      if (!user) { showToast("Vui lòng đăng nhập.", "error"); return; }
      const sc = startSesBtn.getAttribute("data-start-session-subj") || "CPP";
      const lid = startSesBtn.getAttribute("data-start-session-lesson") || "CPP-001";
      const sState = getUserSessionsState(user.id);
      if (!sState.activeSession) {
        const lbl = resolveCourseOrSubjectLabel(sc);
        const lObj = LESSON_MAP.get(lid);
        sState.activeSession = {
          id: "ses_" + Date.now(),
          title: `Buổi học ôn tập ${lbl.display} (${lid})`,
          subjectCode: sc,
          subjectDisplay: lbl.display,
          startedAt: new Date().toISOString(),
          endedAt: null,
          status: "active",
          durationSeconds: 0,
          pausedSeconds: 0,
          userGoal: `Củng cố kiến thức môn ${lbl.display} từ gợi ý GPA`,
          lessons: lObj ? [{ lessonId: lObj.id, title: lObj.title, subjectDisplay: lbl.display, evidenceBadges: ["Đã xem/mở"], selfAssessment: "hieu_mot_phan" }] : []
        };
        saveState();
      }
      navigateTo("sessions");
      return;
    }
    const uniSkipLes = e.target.closest("[data-uni-skip-lesson]");
    if (uniSkipLes) {
      openUniSkipModal({ lessonIds: [uniSkipLes.getAttribute("data-uni-skip-lesson")] });
      return;
    }
    const uniSkipSubj = e.target.closest("[data-uni-skip-subj]");
    if (uniSkipSubj) {
      openUniSkipModal({ subjectCode: uniSkipSubj.getAttribute("data-uni-skip-subj") });
      return;
    }
    const uniSkipSem = e.target.closest("[data-uni-skip-sem]");
    if (uniSkipSem) {
      openUniSkipModal({ semesterId: uniSkipSem.getAttribute("data-uni-skip-sem") });
      return;
    }
    const uniUnskipLes = e.target.closest("[data-uni-unskip-lesson]");
    if (uniUnskipLes) {
      executeUniversityUnskip({ lessonIds: [uniUnskipLes.getAttribute("data-uni-unskip-lesson")] });
      return;
    }
    const uniUnskipSubj = e.target.closest("[data-uni-unskip-subj]");
    if (uniUnskipSubj) {
      executeUniversityUnskip({ subjectCode: uniUnskipSubj.getAttribute("data-uni-unskip-subj") });
      return;
    }
    const uniUnskipSem = e.target.closest("[data-uni-unskip-sem]");
    if (uniUnskipSem) {
      executeUniversityUnskip({ semesterId: uniUnskipSem.getAttribute("data-uni-unskip-sem") });
      return;
    }
    const copyBtn = e.target.closest("[data-copy-id]");
    if (copyBtn) {
      const cid = copyBtn.getAttribute("data-copy-id");
      if (navigator.clipboard) navigator.clipboard.writeText(cid).catch(() => {});
      showToast("Đã sao chép mã bài: " + cid, "success");
      return;
    }
    const swatch = e.target.closest("[data-palette]");
    if (swatch) {
      const pName = swatch.getAttribute("data-palette");
      applyPalette(pName);
      const names = { skin: "Màu Da Dịu Mắt (Warm Skin)", matcha: "Yến Mạch Trà Xanh (Matcha Oat)", rose: "Hồng Phấn Lụa (Rosewater Silk)", espresso: "Tối Cà Phê Ấm (Espresso Night)" };
      showToast("Đã chuyển sang bảng màu: " + (names[pName] || pName), "info");
      return;
    }
  });

  document.addEventListener("keydown", e => {
    if (e.key === "/" && !["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName)) {
      e.preventDefault();
      if (state.activeView !== "roadmap") navigateTo("roadmap");
      setTimeout(() => {
        const s = document.getElementById("roadmapSearchInput");
        if (s) s.focus();
      }, 40);
    } else if (e.key === "Escape") {
      const pop = document.getElementById("settingsPopover");
      if (pop) pop.classList.remove("open");
    }
  });

  const setBtn = document.getElementById("settingsToggleBtn");
  const setPop = document.getElementById("settingsPopover");
  const closeSetBtn = document.getElementById("closeSettingsBtn");
  if (setBtn && setPop) {
    setBtn.addEventListener("click", () => {
      const open = setPop.classList.toggle("open");
      setBtn.setAttribute("aria-expanded", String(open));
    });
  }
  if (closeSetBtn && setPop) {
    closeSetBtn.addEventListener("click", () => setPop.classList.remove("open"));
  }

  const roleSel = document.getElementById("roleSelect");
  if (roleSel) {
    roleSel.value = state.currentUserKey;
    roleSel.addEventListener("change", e => {
      state.currentUserKey = e.target.value;
      saveState();
      updateTopTelemetry();
      renderMainView();
      if (setPop) setPop.classList.remove("open");
      if (setBtn) setBtn.setAttribute("aria-expanded", "false");
      const u = currentUser();
      showToast("Đã chuyển phiên làm việc sang: " + (u ? u.display_name + " (" + u.role + ")" : "Khách"), "info");
    });
  }

  const motionBtn = document.getElementById("motionToggleBtn");
  if (motionBtn) {
    motionBtn.addEventListener("click", () => {
      const reduced = document.body.classList.toggle("reduce-motion");
      motionBtn.setAttribute("aria-pressed", String(reduced));
      motionBtn.textContent = "Chuyển động: " + (reduced ? "Giảm" : "Mượt");
    });
  }

  applyPalette(state.palette || "skin");
  updateTopTelemetry();
  renderMainView();
})();
</script>
</body>
</html>
