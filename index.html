I", "stage": "17. DevOps, đóng gói và vận hành", "sem": "HK6", "sup": false, "title": "Môi trường dev/test/prod", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "2952d529c31aeff7", "substeps": [], "sec": {"exp": "<p>Dev/test/prod là môi trường có mục đích và dữ liệu khác nhau. Tách cấu hình giúp giảm rủi ro khi kiểm thử hoặc phát hành.</p>", "ex": "<p>Local dùng database thử; CI dùng database ephemeral; production dùng secret và dữ liệu thật với quyền hạn chặt chẽ.</p>", "clar": "<p>Không sao chép dữ liệu production nhạy cảm vào máy cá nhân nếu chưa được phép và chưa ẩn danh phù hợp.</p>", "ext": "<p>Infrastructure as code có thể mô tả môi trường có thể tái tạo.</p>", "check": "<p>Nêu hai cấu hình không nên dùng chung giữa dev và production.</p>", "sync": "<ul>\n<li>Vì sao cấu hình và dữ liệu khác nhau; không đưa secret thật vào repo.</li>\n<li>Bài: liệt kê biến cấu hình của app.</li>\n<li>Qua: có hướng dẫn thiết lập môi trường an toàn.</li>\n</ul>"}}, {"id": "DEV-002", "sort": 233, "pfx": "DEV", "subj": "DEV", "subjName": "DevOps, Đóng Gói & Vận Hành", "cat": "Operations", "uitMap": "DevOps & CI/CD", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "17. DevOps, đóng gói và vận hành", "sem": "HK6", "sup": false, "title": "Build và artifact", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "689369027b1f88be", "substeps": [], "sec": {"exp": "<p>Build tạo artifact như executable, package hoặc bundle từ source và dependencies. Artifact cần có version và có thể truy xuất về source/build process.</p>", "ex": "<p>CI build commit cụ thể và lưu binary/container image kèm version/commit SHA.</p>", "clar": "<p>“Build thành công trên máy” không đủ nếu artifact không tái lập hoặc phụ thuộc file chưa version-control.</p>", "ext": "<p>Build reproducibility và artifact provenance quan trọng trong supply chain security.</p>", "check": "<p>Artifact là gì và vì sao nên gắn nó với commit nguồn?</p>", "sync": "<ul>\n<li>Bản build; dependency; lệnh tái lập được.</li>\n<li>Bài: chạy build từ hướng dẫn mới hoặc môi trường sạch.</li>\n<li>Qua: tránh phụ thuộc file build sót lại trên máy cá nhân.</li>\n</ul>"}}, {"id": "DEV-003", "sort": 234, "pfx": "DEV", "subj": "DEV", "subjName": "DevOps, Đóng Gói & Vận Hành", "cat": "Operations", "uitMap": "DevOps & CI/CD", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "17. DevOps, đóng gói và vận hành", "sem": "HK6", "sup": false, "title": "Docker concept và container", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "78cdac1359535705", "substeps": [], "sec": {"exp": "<p>Container đóng gói ứng dụng cùng các dependency user-space trong image, chạy cô lập qua cơ chế kernel của host; container không giống máy ảo đầy đủ.</p>", "ex": "<p>Image chứa app và runtime; container chạy với port/config được cấp. Dockerfile mô tả cách build image.</p>", "clar": "<p>Container vẫn chia sẻ kernel host và cần bảo mật; không mặc định mọi dữ liệu ghi bên trong container sẽ bền qua lần chạy.</p>", "ext": "<p>Volumes, networks, resource limits và multi-stage builds là bước sau.</p>", "check": "<p>Phân biệt image và container ở mức ý tưởng.</p>", "sync": "<ul>\n<li>Image, container, port, volume ở mức vừa sức; container không phải máy ảo đầy đủ trong mọi khía cạnh.</li>\n<li>Bài: đóng gói một app nhỏ theo tutorial chính thức rồi tự giải thích từng lệnh.</li>\n<li>Qua: biết cách build/run/stop và xem log.</li>\n</ul>"}}, {"id": "DEV-004", "sort": 235, "pfx": "DEV", "subj": "DEV", "subjName": "DevOps, Đóng Gói & Vận Hành", "cat": "Operations", "uitMap": "DevOps & CI/CD", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "17. DevOps, đóng gói và vận hành", "sem": "HK6", "sup": false, "title": "CI pipeline", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "0052a6321a1dcc0f", "substeps": [], "sec": {"exp": "<p>CI pipeline tự chạy build/test/checks khi có thay đổi, giúp phát hiện vấn đề sớm và chuẩn hóa quá trình kiểm tra.</p>", "ex": "<p>Mỗi pull request chạy format check, compile và unit tests; nếu test thất bại, báo trạng thái rõ để không merge nhầm.</p>", "clar": "<p>CI không thay code review hoặc test chất lượng; pipeline chỉ kiểm tra những bước đã cấu hình. Secret trong CI cần quản lý an toàn.</p>", "ext": "<p>Cache dependency để tăng tốc sau khi pipeline đúng và tin cậy.</p>", "check": "<p>Chọn ba bước CI tối thiểu cho project C++ nhỏ.</p>", "sync": "<ul>\n<li>Build/test tự động khi có thay đổi; failure phải đọc và xử lý.</li>\n<li>Bài: thiết lập pipeline đơn giản build và chạy test.</li>\n<li>Qua: PR không được coi là hợp lệ nếu pipeline đỏ mà không có lý do được hiểu rõ.</li>\n</ul>"}}, {"id": "DEV-005", "sort": 236, "pfx": "DEV", "subj": "DEV", "subjName": "DevOps, Đóng Gói & Vận Hành", "cat": "Operations", "uitMap": "DevOps & CI/CD", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "17. DevOps, đóng gói và vận hành", "sem": "HK6", "sup": false, "title": "Deploy và môi trường chạy", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "80b7e5c5acc88dd8", "substeps": [], "sec": {"exp": "<p>Deploy đưa artifact vào môi trường chạy; cần cấu hình, health checks, quyền, logging và cách rollback. Deploy không chỉ là copy file.</p>", "ex": "<p>Đưa một API lên staging, kiểm tra health endpoint và smoke test, sau đó mới phát hành theo quy trình.</p>", "clar": "<p>Ứng dụng có thể build thành công nhưng fail deploy do secret, port, network hoặc schema. Không ghi credential vào lệnh/log công khai.</p>", "ext": "<p>Blue-green/canary là chiến lược phát hành nâng cao.</p>", "check": "<p>Sau deploy, kiểm tra gì để xác nhận app thực sự hoạt động?</p>", "sync": "<ul>\n<li>Chọn nền tảng vừa sức; secrets/config; build/runtime logs.</li>\n<li>Bài: deploy một ứng dụng nhỏ hoặc ghi lại bước nếu hạ tầng hạn chế.</li>\n<li>Qua: có demo tái lập hoặc checklist chạy local hoàn chỉnh.</li>\n</ul>"}}, {"id": "DEV-006", "sort": 237, "pfx": "DEV", "subj": "DEV", "subjName": "DevOps, Đóng Gói & Vận Hành", "cat": "Operations", "uitMap": "DevOps & CI/CD", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "17. DevOps, đóng gói và vận hành", "sem": "HK6", "sup": false, "title": "Logging và observability nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "99260daebab88585", "substeps": [], "sec": {"exp": "<p>Logging ghi sự kiện; metrics đo đại lượng theo thời gian; tracing nối hoạt động qua thành phần. Observability giúp suy luận trạng thái từ tín hiệu được thu thập.</p>", "ex": "<p>Ghi request ID, status và latency; dashboard theo dõi error rate; tracing giúp thấy request chậm ở database hay service nào.</p>", "clar": "<p>Không log password, token hoặc nội dung nhạy cảm tùy tiện. Log hữu ích phải có ngữ cảnh nhưng không quá nhiều noise.</p>", "ext": "<p>Structured logs, alert thresholds và SLO là các bước vận hành sau.</p>", "check": "<p>Phân biệt log và metric bằng một ví dụ.</p>", "sync": "<ul>\n<li>Logs, metrics, traces ở mức khái niệm; log đúng mức và không lộ secret/PII.</li>\n<li>Bài: thêm log cho lỗi API giả lập.</li>\n<li>Qua: log giúp tìm vấn đề thay vì chỉ ghi “error”.</li>\n</ul>"}}, {"id": "DEV-007", "sort": 238, "pfx": "DEV", "subj": "DEV", "subjName": "DevOps, Đóng Gói & Vận Hành", "cat": "Operations", "uitMap": "DevOps & CI/CD", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "17. DevOps, đóng gói và vận hành", "sem": "HK6", "sup": false, "title": "Timeout, retry, idempotency và lỗi", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "b66851b929a85c1f", "substeps": [{"substep_id": "DEV-007.part-1", "title": "part-1: failure & timeout", "check": "Hiểu vì sao timeout không chứng minh server chưa xử lý request."}, {"substep_id": "DEV-007.part-2", "title": "part-2: retry policy", "check": "Giới hạn số lần retry, backoff và phân biệt thao tác đọc với thao tác ghi."}, {"substep_id": "DEV-007.part-3", "title": "part-3: idempotency", "check": "Dùng idempotency key/state để lặp request không tạo hiệu ứng trùng."}], "sec": {"exp": "<p>Timeout giới hạn chờ; retry xử lý lỗi tạm thời; idempotency đảm bảo lặp thao tác không tạo thêm hiệu ứng ngoài ý muốn theo contract. Các cơ chế này cần được thiết kế cùng nhau.</p>", "ex": "<p>Với request thanh toán, dùng idempotency key theo API contract để request lặp không tạo nhiều charge; timeout vẫn cần truy vấn trạng thái trước khi retry tùy thiết kế.</p>", "clar": "<p>Retry không sửa lỗi vĩnh viễn và có thể khuếch đại tải. Chỉ retry lỗi phù hợp, giới hạn số lần và áp backoff.</p>", "ext": "<p>Circuit breaker/rate limiting là mở rộng cho hệ thống gọi phụ thuộc hay lỗi.</p>", "check": "<p>Khi response timeout sau một POST tạo đơn, dữ kiện nào cần kiểm tra trước retry?</p>", "sync": "<ul>\n<li>Thiết kế hành vi khi dependency lỗi; retry có giới hạn; thao tác tạo dữ liệu có thể lặp cần cẩn trọng.</li>\n<li>Bài: mô tả kịch bản client gửi lại request tạo đơn hàng.</li>\n<li>Qua: đề xuất cách tránh xử lý trùng trong phạm vi dự án.</li>\n</ul>"}}, {"id": "DEV-008", "sort": 239, "pfx": "DEV", "subj": "DEV", "subjName": "DevOps, Đóng Gói & Vận Hành", "cat": "Operations", "uitMap": "DevOps & CI/CD", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "17. DevOps, đóng gói và vận hành", "sem": "HK6", "sup": false, "title": "Release, rollback và retrospective", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "22b9b730aa3a9289", "substeps": [], "sec": {"exp": "<p>Release là phát hành một phiên bản; rollback quay lại bản/ trạng thái trước khi phù hợp; retrospective rút bài học từ kết quả và quá trình.</p>", "ex": "<p>Sau release tỷ lệ lỗi tăng, có thể rollback app nhưng migration database có thể không đảo ngược đơn giản; cần kế hoạch tương thích dữ liệu.</p>", "clar": "<p>Rollback không luôn là “deploy bản cũ”; database/schema/state có thể làm điều đó nguy hiểm. Retro hướng vào hệ thống/quy trình, không đổ lỗi cá nhân.</p>", "ext": "<p>Feature flags và backward-compatible migrations hỗ trợ deploy an toàn.</p>", "check": "<p>Vì sao thay đổi schema có thể khiến rollback app khó hơn?</p>", "sync": "<ul>\n<li>Phiên bản, release notes, phương án quay lui, ghi bài học.</li>\n<li>Bài: lập checklist phát hành và review sau demo.</li>\n<li>Qua: ghi rõ rủi ro còn lại và cách xử lý nếu bản mới lỗi.</li>\n</ul>"}}, {"id": "BE-001", "sort": 240, "pfx": "BE", "subj": "BE", "subjName": "Chuyên Môn: Backend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Backend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "19. Nhánh Backend / Product Engineering (Java + Spring Boot HOẶC C# + ASP.NET Core)", "sem": "HK5", "sup": false, "title": "Ngôn ngữ stack sau khi C++ đã vững", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "d054a08568964d3e", "substeps": [], "sec": {"exp": "<p>Chọn một ngôn ngữ backend chính sau khi đã nắm nền tảng lập trình. Mục tiêu đầu tiên là cú pháp, tooling, error handling, package và cách tổ chức project của stack mới, không nhảy thẳng framework.</p>", "ex": "<p>Nếu chọn Java, viết console app và test nhỏ; nếu chọn C#, học solution/project, types và dotnet CLI trước ASP.NET Core.</p>", "clar": "<p>Không học Java và C# song song chỉ để “biết cả hai”; chọn một stack dựa chương trình trường, cơ hội thực hành và hứng thú.</p>", "ext": "<p>Sau nền tảng có thể đọc official guides của stack cụ thể.</p>", "check": "<p>Nêu lý do chọn một stack và kế hoạch thử nghiệm nhỏ trước khi cam kết.</p>", "sync": "<ul>\n<li>Kiểu dữ liệu, hàm/method, điều kiện, collection, package/project structure.</li>\n<li>Bài: CLI nhỏ đọc dữ liệu và lọc danh sách.</li>\n<li>Qua: không chỉ sao chép cú pháp; giải thích khác biệt cơ bản so với C++.</li>\n</ul>"}}, {"id": "BE-002", "sort": 241, "pfx": "BE", "subj": "BE", "subjName": "Chuyên Môn: Backend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Backend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "19. Nhánh Backend / Product Engineering (Java + Spring Boot HOẶC C# + ASP.NET Core)", "sem": "HK5", "sup": false, "title": "OOP và collection trong ngôn ngữ mới", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "527f9d20d5a989c1", "substeps": [], "sec": {"exp": "<p>OOP/collections trong ngôn ngữ mới giải quyết dữ liệu và behavior tương tự C++ nhưng semantics/runtime khác. Học lại bằng cách viết ví dụ, không giả định cú pháp tương đương 1:1.</p>", "ex": "<p>Model <code class=\"inline-code\">Book</code>, list sách, map theo ID; viết method mượn sách và unit test cho rule.</p>", "clar": "<p>Garbage collection hoặc value/reference semantics trong ngôn ngữ mới không làm biến mất khái niệm ownership, lifetime hay concurrency.</p>", "ext": "<p>So sánh cùng một bài nhỏ giữa C++ và stack mới để nhận diện khác biệt.</p>", "check": "<p>Viết cùng một thao tác collection và giải thích sự khác nhau đáng chú ý.</p>", "sync": "<ul>\n<li>Classes, interfaces, generics/collections theo ngôn ngữ; exceptions.</li>\n<li>Bài: mô hình Book/User và xử lý danh sách.</li>\n<li>Qua: hiểu interface và phân tách nghiệp vụ.</li>\n</ul>"}}, {"id": "BE-003", "sort": 242, "pfx": "BE", "subj": "BE", "subjName": "Chuyên Môn: Backend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Backend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "19. Nhánh Backend / Product Engineering (Java + Spring Boot HOẶC C# + ASP.NET Core)", "sem": "HK5", "sup": false, "title": "HTTP, JSON và API contract", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "76399b0039090b20", "substeps": [], "sec": {"exp": "<p>API contract định nghĩa endpoint, method, request, response, status, validation và semantics. Client/server có thể phát triển độc lập khi contract rõ.</p>", "ex": "<p><code class=\"inline-code\">POST /books</code> nhận title, trả ID và status theo thiết kế; thiếu title trả lỗi validation với format có cấu trúc.</p>", "clar": "<p>Không lấy model database làm API public một cách tự động; API cần xác định field required/optional và không lộ field nội bộ.</p>", "ext": "<p>OpenAPI/schema giúp tài liệu và test contract khi cần.</p>", "check": "<p>Viết contract cho endpoint đọc một quyển sách.</p>", "sync": "<ul>\n<li>Method/path/status/body; request/response; API errors.</li>\n<li>Bài: thiết kế API CRUD nhỏ bằng pseudocode trước framework.</li>\n<li>Qua: endpoint có hợp đồng rõ và lỗi có status phù hợp.</li>\n</ul>"}}, {"id": "BE-004", "sort": 243, "pfx": "BE", "subj": "BE", "subjName": "Chuyên Môn: Backend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Backend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "19. Nhánh Backend / Product Engineering (Java + Spring Boot HOẶC C# + ASP.NET Core)", "sem": "HK5", "sup": false, "title": "Framework project và dependency injection", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "af6ba519791c10df", "substeps": [], "sec": {"exp": "<p>Framework project cung cấp lifecycle và routing; dependency injection (DI) cấp đối tượng phụ thuộc từ bên ngoài thay vì tự tạo sâu trong mọi class.</p>", "ex": "<p>Service nhận repository qua constructor; test có thể truyền fake repository, production dùng implementation database.</p>", "clar": "<p>DI container giúp wiring nhưng không thay thiết kế tốt; không đăng ký mọi thứ chỉ vì framework cho phép.</p>", "ext": "<p>Làm một luồng request end-to-end trước khi thêm nhiều abstraction.</p>", "check": "<p>Vì sao inject repository giúp test service dễ hơn?</p>", "sync": "<ul>\n<li>Entry point, routing/controller/handler, service, dependency injection ở mức cần thiết.</li>\n<li>Bài: endpoint trả danh sách giả lập.</li>\n<li>Qua: theo được luồng request qua các lớp.</li>\n</ul>"}}, {"id": "BE-005", "sort": 244, "pfx": "BE", "subj": "BE", "subjName": "Chuyên Môn: Backend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Backend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "19. Nhánh Backend / Product Engineering (Java + Spring Boot HOẶC C# + ASP.NET Core)", "sem": "HK5", "sup": false, "title": "Kết nối SQL và ORM", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "1aee1773af8d4795", "substeps": [], "sec": {"exp": "<p>ORM ánh xạ object/model sang bảng/hàng, giảm code mapping nhưng cần hiểu SQL, schema và query phát sinh.</p>", "ex": "<p>Service lấy sách theo ID qua repository; xem SQL thực tế để biết có N+1 query hoặc fetch dữ liệu thừa không.</p>", "clar": "<p>ORM không loại SQL; transaction, index, constraints và query performance vẫn quan trọng. Tránh tải toàn bộ bảng để lọc trong app khi database làm được tốt hơn.</p>", "ext": "<p>Tìm hiểu migration, transaction boundaries và lazy/eager loading theo ORM đang dùng.</p>", "check": "<p>Nêu một nguy cơ nếu dùng ORM mà không quan sát query phát sinh.</p>", "sync": "<ul>\n<li>Data model, migrations, repository/data access, transaction; hiểu SQL vẫn cần dù dùng ORM.</li>\n<li>Bài: lưu và đọc đối tượng từ database thật trong môi trường học.</li>\n<li>Qua: biết kiểm tra truy vấn và tránh N+1 hoặc query ngầm khi đã học đến mức đó.</li>\n</ul>"}}, {"id": "BE-006", "sort": 245, "pfx": "BE", "subj": "BE", "subjName": "Chuyên Môn: Backend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Backend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "19. Nhánh Backend / Product Engineering (Java + Spring Boot HOẶC C# + ASP.NET Core)", "sem": "HK5", "sup": false, "title": "Validation, error handling và logging", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "2b4a624a2859994e", "substeps": [], "sec": {"exp": "<p>Validation từ chối input không hợp lệ; error handling biến lỗi thành response/log có ngữ nghĩa; logging ghi đủ context để chẩn đoán.</p>", "ex": "<p>Request có email sai định dạng trả lỗi client với field và message; lỗi database nội bộ ghi request ID và không trả stack trace.</p>", "clar": "<p>Không trả status 200 cho mọi loại lỗi; không lộ chi tiết bí mật của exception. Giữ error format nhất quán.</p>", "ext": "<p>Central exception handler/middleware tùy framework có thể chuẩn hóa response.</p>", "check": "<p>Phân biệt lỗi validation và lỗi server nội bộ về status/log.</p>", "sync": "<ul>\n<li>Kiểm tra request; chuẩn hóa lỗi; log có ngữ cảnh và không lộ secret.</li>\n<li>Bài: test payload sai/không đủ trường.</li>\n<li>Qua: lỗi không làm lộ thông tin nhạy cảm.</li>\n</ul>"}}, {"id": "BE-007", "sort": 246, "pfx": "BE", "subj": "BE", "subjName": "Chuyên Môn: Backend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Backend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "19. Nhánh Backend / Product Engineering (Java + Spring Boot HOẶC C# + ASP.NET Core)", "sem": "HK7", "sup": false, "title": "Authentication, authorization và security", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f5869df34e261025", "substeps": [], "sec": {"exp": "<p>Backend phải kiểm tra danh tính và quyền trên mỗi hành động nhạy cảm. Hash password bằng thuật toán chuyên dụng, sử dụng session/token theo threat model và hướng dẫn framework.</p>", "ex": "<p>Một user chỉ xem được dữ liệu của chính mình trừ khi role cho phép; test sửa ID trong URL để kiểm tra object-level access.</p>", "clar": "<p>Không tự thiết kế thuật toán mật mã. Authentication thành công không tự cấp quyền; kiểm tra server-side là bắt buộc.</p>", "ext": "<p>Rate limiting, account recovery và audit log là mở rộng theo rủi ro.</p>", "check": "<p>Tạo test kiểm tra user A không đọc được resource riêng của user B.</p>", "sync": "<ul>\n<li>Chọn thư viện/flow chuẩn, không tự thiết kế mật mã; role/resource permission.</li>\n<li>Bài: xác định các route cần quyền và test quyền.</li>\n<li>Qua: kiểm tra cả truy cập hợp lệ và trái phép.</li>\n</ul>"}}, {"id": "BE-008", "sort": 247, "pfx": "BE", "subj": "BE", "subjName": "Chuyên Môn: Backend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Backend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "19. Nhánh Backend / Product Engineering (Java + Spring Boot HOẶC C# + ASP.NET Core)", "sem": "HK7", "sup": false, "title": "Unit/integration test backend", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "92761cbf479353f9", "substeps": [], "sec": {"exp": "<p>Unit test kiểm tra business rules; integration test xác minh API/database/dependency làm việc cùng nhau. Chất lượng test đến từ assertions meaningful, không chỉ số lượng.</p>", "ex": "<p>Test service với fake repo cho quy tắc; integration test khởi tạo database test rồi gửi request tạo/lấy Book.</p>", "clar": "<p>Test phải độc lập và dọn dữ liệu; tránh phụ thuộc thứ tự chạy hoặc API bên ngoài không kiểm soát.</p>", "ext": "<p>Contract test/consumer-driven tests có ích khi nhiều client/service.</p>", "check": "<p>Chỉ rõ phần nào là unit và phần nào là integration trong một test suite.</p>", "sync": "<ul>\n<li>Test service, API và persistence; test dữ liệu lỗi.</li>\n<li>Bài: xây test luồng chính và một luồng lỗi.</li>\n<li>Qua: test chạy tự động.</li>\n</ul>"}}, {"id": "BE-009", "sort": 248, "pfx": "BE", "subj": "BE", "subjName": "Chuyên Môn: Backend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Backend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "19. Nhánh Backend / Product Engineering (Java + Spring Boot HOẶC C# + ASP.NET Core)", "sem": "HK7", "sup": false, "title": "Hiệu năng, pagination và cache nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "9272c437ec4713e0", "substeps": [], "sec": {"exp": "<p>Pagination giới hạn phần dữ liệu trả về; cache giữ kết quả dùng lại để giảm latency/tải khi tính hợp lệ. Đo trước khi tối ưu.</p>", "ex": "<p>API list books nhận <code class=\"inline-code\">pageSize</code> có giới hạn và trả <code class=\"inline-code\">nextCursor</code>; cache danh mục ít thay đổi nhưng invalidation được định nghĩa.</p>", "clar": "<p>Offset pagination có thể tốn trên tập dữ liệu lớn và kết quả dễ thay đổi khi dữ liệu cập nhật; cache có nguy cơ stale.</p>", "ext": "<p>Index, query plan, cache hit rate và latency percentiles là các điểm đo mở rộng.</p>", "check": "<p>Vì sao không nên trả hàng trăm nghìn bản ghi trong một response?</p>", "sync": "<ul>\n<li>Đo trước, tìm truy vấn/tầng nghẽn; pagination; cache chỉ khi có lý do.</li>\n<li>Bài: xử lý danh sách lớn và đo sự thay đổi.</li>\n<li>Qua: mô tả được phép đo, giới hạn và trade-off.</li>\n</ul>"}}, {"id": "BE-010", "sort": 249, "pfx": "BE", "subj": "BE", "subjName": "Chuyên Môn: Backend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Backend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "19. Nhánh Backend / Product Engineering (Java + Spring Boot HOẶC C# + ASP.NET Core)", "sem": "HK7", "sup": false, "title": "MVP backend", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "7ac0f34b17cf8ab9", "substeps": [], "sec": {"exp": "<p>MVP backend là phiên bản nhỏ nhưng hoàn chỉnh của một use case: contract, validation, database, tests, logs và cách chạy. “Minimum” là phạm vi nhỏ, không phải chất lượng cẩu thả.</p>", "ex": "<p>MVP thư viện: thêm/tìm sách, lưu dữ liệu, validation, API docs, integration tests và README.</p>", "clar": "<p>Giới hạn rõ những thứ chưa làm như phân quyền phức tạp hay scale production. Không tuyên bố production-ready nếu chưa có đánh giá phù hợp.</p>", "ext": "<p>Sau MVP, dùng feedback/test/performance để chọn cải tiến kế tiếp.</p>", "check": "<p>Nêu non-goals của backend MVP và điều kiện chấp nhận.</p>", "sync": "<ul>\n<li>API dùng được cho một nghiệp vụ; schema hợp lý; validation; auth nếu phạm vi cần; tests; README; demo/deployment nếu có.</li>\n<li>Qua: người học có thể trace request từ input đến database và giải thích lỗi thường gặp.</li>\n</ul>"}}, {"id": "FE-001", "sort": 250, "pfx": "FE", "subj": "FE", "subjName": "Chuyên Môn: Frontend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Frontend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "20. Nhánh Frontend Engineering", "sem": "HK5", "sup": false, "title": "HTML ngữ nghĩa", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "b901f3effeefa34a", "substeps": [], "sec": {"exp": "<p>HTML ngữ nghĩa dùng element theo vai trò nội dung: heading, nav, main, button, form. Cấu trúc semantic hỗ trợ accessibility và công cụ đọc trang.</p>", "ex": "<p>Dùng <code class=\"inline-code\">&lt;button&gt;</code> cho hành động click và <code class=\"inline-code\">&lt;a&gt;</code> cho điều hướng đến URL; không dùng <code class=\"inline-code\">&lt;div&gt;</code> cho mọi control.</p>", "clar": "<p>Semantic HTML không phải trang trí; chọn element sai có thể làm bàn phím/assistive technology khó sử dụng.</p>", "ext": "<p>Học labels, form validation và landmarks sau cấu trúc cơ bản.</p>", "check": "<p>Khi nào dùng button thay vì anchor?</p>", "sync": "<ul>\n<li>Phần tử nội dung, form, link, heading; semantics quan trọng hơn chỉ hiển thị.</li>\n<li>Bài: tạo trang HTML có form và danh sách.</li>\n<li>Qua: cấu trúc rõ, dùng phần tử phù hợp.</li>\n</ul>"}}, {"id": "FE-002", "sort": 251, "pfx": "FE", "subj": "FE", "subjName": "Chuyên Môn: Frontend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Frontend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "20. Nhánh Frontend Engineering", "sem": "HK5", "sup": false, "title": "CSS layout và responsive", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "ef7c0b557728dd2b", "substeps": [], "sec": {"exp": "<p>CSS điều khiển layout/appearance. Flexbox phù hợp bố trí một chiều; Grid phù hợp bố trí hai chiều; responsive dùng layout linh hoạt theo viewport.</p>", "ex": "<p>Dùng CSS Grid cho card responsive, <code class=\"inline-code\">minmax()</code>/<code class=\"inline-code\">auto-fit</code> khi phù hợp và test ở viewport hẹp/rộng.</p>", "clar": "<p>Không dựa duy nhất vào pixel cố định; content, zoom, font size và keyboard focus ảnh hưởng UI thật.</p>", "ext": "<p>Mobile-first và design tokens giúp giao diện nhất quán khi có nhiều component.</p>", "check": "<p>Chọn Flexbox hay Grid cho một hàng điều hướng và một lưới card, nêu lý do.</p>", "sync": "<ul>\n<li>Box model, Flexbox/Grid ở mức nhập môn, spacing, media query.</li>\n<li>Bài: tạo layout vừa màn hình điện thoại và laptop.</li>\n<li>Qua: không phụ thuộc vị trí tuyệt đối cho toàn trang.</li>\n</ul>"}}, {"id": "FE-003", "sort": 252, "pfx": "FE", "subj": "FE", "subjName": "Chuyên Môn: Frontend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Frontend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "20. Nhánh Frontend Engineering", "sem": "HK5", "sup": false, "title": "JavaScript từ biến đến hàm", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "a4b52924a149a659", "substeps": [], "sec": {"exp": "<p>JavaScript cung cấp dữ liệu, biến, điều kiện, vòng lặp, hàm và object cho hành vi web. Ngôn ngữ có coercion và semantics riêng, nên cần chú ý kiểu.</p>", "ex": "<p>Hàm <code class=\"inline-code\">total = prices.reduce(...)</code> có thể tính tổng mảng giá; trước đó học loop và function cơ bản để hiểu cách hoạt động.</p>", "clar": "<p><code class=\"inline-code\">==</code> có coercion; <code class=\"inline-code\">===</code> so sánh nghiêm ngặt hơn về kiểu và giá trị. Không copy code async/framework trước khi hiểu promise/function.</p>", "ext": "<p>Module, error handling và linting là bước sau.</p>", "check": "<p>Sự khác nhau đáng chú ý giữa <code class=\"inline-code\">==</code> và <code class=\"inline-code\">===</code> là gì?</p>", "sync": "<ul>\n<li>Kiểu dữ liệu, điều kiện, loop, function, arrays/objects; chỉ chuyển sang framework sau khi logic cơ bản vững.</li>\n<li>Bài: filter/sort danh sách trên trang.</li>\n<li>Qua: có thể debug event và dữ liệu.</li>\n</ul>"}}, {"id": "FE-004", "sort": 253, "pfx": "FE", "subj": "FE", "subjName": "Chuyên Môn: Frontend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Frontend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "20. Nhánh Frontend Engineering", "sem": "HK5", "sup": false, "title": "DOM và event", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "89b48bbf797d6224", "substeps": [], "sec": {"exp": "<p>DOM là cấu trúc đối tượng phản ánh tài liệu HTML; event thể hiện hành động như click/input/submit và handler phản ứng với event.</p>", "ex": "<p>Đăng ký handler cho form submit, <code class=\"inline-code\">preventDefault()</code> khi cần xử lý client-side, đọc giá trị field và hiển thị validation.</p>", "clar": "<p>DOM text/HTML insertion có rủi ro XSS nếu chèn input thô; ưu tiên API text an toàn hoặc encode đúng context.</p>", "ext": "<p>Event delegation hữu ích khi có nhiều phần tử động.</p>", "check": "<p>Khi submit form, vì sao đôi khi cần preventDefault?</p>", "sync": "<ul>\n<li>Chọn phần tử, sự kiện, cập nhật UI; tránh logic rối trộn toàn bộ trong callback.</li>\n<li>Bài: form thêm/xóa nhiệm vụ.</li>\n<li>Qua: xử lý input và lỗi cơ bản.</li>\n</ul>"}}, {"id": "FE-005", "sort": 254, "pfx": "FE", "subj": "FE", "subjName": "Chuyên Môn: Frontend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Frontend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "20. Nhánh Frontend Engineering", "sem": "HK5", "sup": false, "title": "Async, Promise và fetch", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "01aed0e5b4ab3327", "substeps": [], "sec": {"exp": "<p>Promise biểu diễn kết quả bất đồng bộ có thể hoàn thành hoặc thất bại; <code class=\"inline-code\">async/await</code> làm luồng xử lý dễ đọc hơn. <code class=\"inline-code\">fetch</code> gửi request nhưng cần kiểm tra response.</p>", "ex": "<p><code class=\"inline-code\">const response = await fetch(url); if (!response.ok) throw ...; const data = await response.json();</code> minh họa kiểm tra HTTP status trước parse body.</p>", "clar": "<p><code class=\"inline-code\">fetch</code> không nhất thiết reject chỉ vì HTTP 404/500; <code class=\"inline-code\">response.ok</code>/status phải được xử lý. Cần UI cho loading/error/empty state.</p>", "ext": "<p>AbortController, timeout policy và retry cần cân nhắc theo use case.</p>", "check": "<p>Tại sao phải kiểm tra <code class=\"inline-code\">response.ok</code> sau fetch?</p>", "sync": "<ul>\n<li>Bất đồng bộ, loading/error/success, API request.</li>\n<li>Bài: hiển thị dữ liệu từ API test được.</li>\n<li>Qua: xử lý response thất bại và loading state.</li>\n</ul>"}}, {"id": "FE-006", "sort": 255, "pfx": "FE", "subj": "FE", "subjName": "Chuyên Môn: Frontend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Frontend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "20. Nhánh Frontend Engineering", "sem": "HK5", "sup": false, "title": "TypeScript nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "129feda6b5b5fcab", "substeps": [], "sec": {"exp": "<p>TypeScript thêm hệ thống kiểu tĩnh lên JavaScript để phát hiện nhiều lỗi lúc phát triển. Kiểu giúp diễn đạt shape của object và contract hàm, nhưng không tự validate dữ liệu runtime.</p>", "ex": "<p>Khai báo <code class=\"inline-code\">type Book = { id: string; title: string };</code> giúp compiler cảnh báo khi code dùng trường sai.</p>", "clar": "<p>JSON từ server vẫn là input runtime; type assertion không biến dữ liệu không hợp lệ thành an toàn. Validate response khi độ tin cậy cần.</p>", "ext": "<p>Generics, discriminated unions và strict mode là bước mở rộng.</p>", "check": "<p>Vì sao khai báo TypeScript type chưa đảm bảo response API hợp lệ ở runtime?</p>", "sync": "<ul>\n<li>Types, interface/type, narrowing; lợi ích phát hiện sai lệch dữ liệu.</li>\n<li>Bài: type dữ liệu response/API và một component đơn giản.</li>\n<li>Qua: hiểu kiểu không thay thế kiểm tra dữ liệu runtime.</li>\n</ul>"}}, {"id": "FE-007", "sort": 256, "pfx": "FE", "subj": "FE", "subjName": "Chuyên Môn: Frontend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Frontend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "20. Nhánh Frontend Engineering", "sem": "HK7", "sup": false, "title": "Component framework", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "41a8a78bafcd9cdc", "substeps": [{"substep_id": "FE-007.part-1", "title": "part-1: component", "check": "Tách giao diện thành component có ranh giới rõ và key ổn định."}, {"substep_id": "FE-007.part-2", "title": "part-2: props", "check": "Truyền dữ liệu một chiều qua props và khai báo kiểu rõ ràng."}, {"substep_id": "FE-007.part-3", "title": "part-3: state, events & render lifecycle", "check": "Quản lý state tối thiểu và xử lý sự kiện theo framework đã chọn."}], "sec": {"exp": "<p>Component framework chia giao diện thành thành phần có state/props và lifecycle; framework cụ thể có quy ước khác nhau.</p>", "ex": "<p>Component <code class=\"inline-code\">BookCard</code> nhận props Book và render title/status; danh sách map mỗi record thành card với key ổn định theo ID.</p>", "clar": "<p>Không đưa toàn bộ business logic vào component UI nếu logic có thể kiểm tra độc lập. Tránh key ngẫu nhiên làm mất identity khi rerender.</p>", "ext": "<p>Accessibility, component boundaries và data fetching patterns theo framework.</p>", "check": "<p>Phân biệt props và state theo framework đã chọn.</p>", "sync": "<ul>\n<li>Chọn một framework phù hợp; component, props, state, event, rendering.</li>\n<li>Bài: tách giao diện danh sách thành component.</li>\n<li>Qua: giải thích data flow và không thêm state dư thừa.</li>\n</ul>"}}, {"id": "FE-008", "sort": 257, "pfx": "FE", "subj": "FE", "subjName": "Chuyên Môn: Frontend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Frontend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "20. Nhánh Frontend Engineering", "sem": "HK7", "sup": false, "title": "Routing và form", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "3a5816ad77681e34", "substeps": [], "sec": {"exp": "<p>Routing ánh xạ URL tới view; form thu input và cần validation, labels, error messages và trạng thái submit.</p>", "ex": "<p>Route <code class=\"inline-code\">/books/:id</code> render detail; form thêm sách kiểm tra title trước gửi request và hiển thị lỗi server nếu thất bại.</p>", "clar": "<p>Client-side validation giúp UX nhưng server vẫn là nơi xác thực dữ liệu cuối cùng. URL params cần parse/validate.</p>", "ext": "<p>Deep links, not-found route và form state management là mở rộng.</p>", "check": "<p>Nêu xử lý cho route ID không hợp lệ hoặc resource không tìm thấy.</p>", "sync": "<ul>\n<li>Điều hướng, validation, trạng thái form, accessibility cơ bản.</li>\n<li>Bài: form tạo/sửa dữ liệu và route chi tiết.</li>\n<li>Qua: keyboard focus/error messaging có thể dùng được.</li>\n</ul>"}}, {"id": "FE-009", "sort": 258, "pfx": "FE", "subj": "FE", "subjName": "Chuyên Môn: Frontend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Frontend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "20. Nhánh Frontend Engineering", "sem": "HK7", "sup": false, "title": "State, testing và API integration", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "af73680748863634", "substeps": [], "sec": {"exp": "<p>State là dữ liệu ảnh hưởng UI; API integration cần quản lý loading/error/success/empty. Testing kiểm tra hành vi người dùng thay vì implementation detail.</p>", "ex": "<p>Khi fetch sách, UI hiện loading; response rỗng hiện empty state; lỗi hiện thông báo và nút thử lại theo quy tắc.</p>", "clar": "<p>Tránh state trùng lặp không đồng bộ. Request cũ có thể về sau request mới; cần quản lý race trong UI nếu tình huống yêu cầu.</p>", "ext": "<p>Caching/data-fetching library có thể giảm boilerplate sau khi hiểu flow cơ bản.</p>", "check": "<p>Liệt kê các trạng thái UI cần xử lý khi tải danh sách sách.</p>", "sync": "<ul>\n<li>Chọn trạng thái local/shared phù hợp; test interaction quan trọng; mock API có kiểm soát.</li>\n<li>Bài: viết test cho lọc/form và xử lý lỗi mạng.</li>\n<li>Qua: test hành vi chứ không chỉ snapshot giao diện.</li>\n</ul>"}}, {"id": "FE-010", "sort": 259, "pfx": "FE", "subj": "FE", "subjName": "Chuyên Môn: Frontend Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Frontend", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "20. Nhánh Frontend Engineering", "sem": "HK7", "sup": false, "title": "Frontend MVP", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "b4f1df67fb6103f5", "substeps": [], "sec": {"exp": "<p>Frontend MVP là luồng người dùng hoàn chỉnh với semantic UI, responsive layout, API integration, validation, tests và README.</p>", "ex": "<p>Màn hình danh sách sách, tìm kiếm, tạo sách và trạng thái lỗi/empty/loading; chạy trên màn hẹp và keyboard.</p>", "clar": "<p>Một screenshot đẹp chưa chứng minh behavior. Không để API token/secret vào bundle frontend vì client có thể quan sát.</p>", "ext": "<p>Accessibility review và performance profiling là các nâng cấp sau.</p>", "check": "<p>Chọn các acceptance criteria quan trọng cho một frontend MVP.</p>", "sync": "<ul>\n<li>Dựng app nhiều trang có responsive layout, API, error/loading/empty states, accessibility cơ bản, tests và README.</li>\n<li>Qua: demo được use case hoàn chỉnh và biết giải thích trade-off.</li>\n</ul>"}}, {"id": "SYS-001", "sort": 260, "pfx": "SYS", "subj": "SYS", "subjName": "Chuyên Môn: Systems & C++ Chuyên Sâu", "cat": "Specialization", "uitMap": "Nhánh tự chọn Systems", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "21. Nhánh Systems / Performance / C++ chuyên sâu", "sem": "HK5", "sup": false, "title": "Modern C++ và RAII vững hơn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "212fa080dee22668", "substeps": [], "sec": {"exp": "<p>Modern C++ mở rộng RAII, value semantics, standard library và ownership rõ ràng để tránh quản lý tài nguyên thủ công.</p>", "ex": "<p>Dùng <code class=\"inline-code\">vector</code> và <code class=\"inline-code\">unique_ptr</code> thay vì tự <code class=\"inline-code\">new/delete</code> trong ví dụ sở hữu phù hợp.</p>", "clar": "<p>Modern C++ không phải cứ dùng tính năng mới là tốt; dùng abstraction dễ hiểu và giới hạn lifetime rõ.</p>", "ext": "<p>Core Guidelines/clang-tidy có thể hỗ trợ review nhưng không thay hiểu biết.</p>", "check": "<p>Nêu một thay đổi giúp giảm manual resource management.</p>", "sync": "<ul>\n<li>Lifetime, ownership, RAII, exception safety; tránh resource leaks.</li>\n<li>Bài: review resource handling trong một chương trình nhỏ.</li>\n<li>Qua: giải thích ai sở hữu tài nguyên và khi nào được giải phóng.</li>\n</ul>"}}, {"id": "SYS-002", "sort": 261, "pfx": "SYS", "subj": "SYS", "subjName": "Chuyên Môn: Systems & C++ Chuyên Sâu", "cat": "Specialization", "uitMap": "Nhánh tự chọn Systems", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "21. Nhánh Systems / Performance / C++ chuyên sâu", "sem": "HK5", "sup": false, "title": "Move semantics và value categories nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "42fb6e3b05f98d36", "substeps": [], "sec": {"exp": "<p>Move semantics cho phép chuyển tài nguyên từ object tạm/được phép move thay vì copy; value categories ảnh hưởng overload resolution.</p>", "ex": "<p><code class=\"inline-code\">std::move(x)</code> cast thành rvalue expression để chọn overload move nếu kiểu hỗ trợ; bản thân std::move không tự di chuyển dữ liệu.</p>", "clar": "<p>Sau move, object vẫn phải ở trạng thái hợp lệ nhưng giá trị cụ thể thường không được đảm bảo ngoài semantics của kiểu. Không dùng source object như thể chưa đổi nếu chưa biết contract.</p>", "ext": "<p>Học lvalue/rvalue references và move constructor sau khi nắm object lifetime.</p>", "check": "<p>Vì sao nói <code class=\"inline-code\">std::move</code> “cho phép move” chứ không tự thực hiện phép move?</p>", "sync": "<ul>\n<li>Copy vs move; use case; chỉ học sau khi object/lifetime đã vững.</li>\n<li>Bài: đọc/đo ví dụ truyền collection và hiểu <code class=\"inline-code\">std::move</code> không tự di chuyển nếu không có semantics phù hợp.</li>\n<li>Qua: tránh dùng move mù quáng.</li>\n</ul>"}}, {"id": "SYS-003", "sort": 262, "pfx": "SYS", "subj": "SYS", "subjName": "Chuyên Môn: Systems & C++ Chuyên Sâu", "cat": "Specialization", "uitMap": "Nhánh tự chọn Systems", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "21. Nhánh Systems / Performance / C++ chuyên sâu", "sem": "HK5", "sup": false, "title": "Build system và package", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "d5deae97d3cd5a6c", "substeps": [], "sec": {"exp": "<p>Build system mô tả target, source, dependency và cách tạo artifact. Package manager quản lý thư viện/phiên bản; hai thứ liên quan nhưng không đồng nghĩa.</p>", "ex": "<p>CMake target khai báo source và dependency thay vì viết lệnh compile dài thủ công cho từng file.</p>", "clar": "<p>Build system phải phản ánh dependencies thật; đánh dấu thiếu dependency có thể khiến build chỉ thành công trên máy cá biệt.</p>", "ext": "<p>CMake presets, package managers và reproducible builds là bước sau.</p>", "check": "<p>Lợi ích của khai báo target/dependency so với lệnh compile thủ công là gì?</p>", "sync": "<ul>\n<li>CMake ở mức project vừa; tách target, dependency và cấu hình build.</li>\n<li>Bài: dựng project nhiều file và test từ clean build.</li>\n<li>Qua: build tái lập từ README.</li>\n</ul>"}}, {"id": "SYS-004", "sort": 263, "pfx": "SYS", "subj": "SYS", "subjName": "Chuyên Môn: Systems & C++ Chuyên Sâu", "cat": "Specialization", "uitMap": "Nhánh tự chọn Systems", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "21. Nhánh Systems / Performance / C++ chuyên sâu", "sem": "HK5", "sup": false, "title": "Debugger nâng cao, sanitizer và profiler", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "e3b4b72562924c27", "substeps": [], "sec": {"exp": "<p>Sanitizer instrument chương trình để phát hiện một số lỗi runtime; profiler thu dữ liệu để xác định điểm tiêu tốn thời gian/tài nguyên; debugger theo dõi trạng thái.</p>", "ex": "<p>Chạy test với AddressSanitizer có thể phát hiện một số out-of-bounds/use-after-free; profiler xác định hàm chiếm phần lớn CPU.</p>", "clar": "<p>Sanitizer không phát hiện mọi bug; profiling chỉ có ý nghĩa khi workload đại diện và cách đo hợp lý. Không tối ưu theo cảm giác.</p>", "ext": "<p>Fuzzing và flame graph là các công cụ mở rộng.</p>", "check": "<p>Chọn tool cho ba nhu cầu: xem biến, phát hiện lỗi memory, tìm bottleneck.</p>", "sync": "<ul>\n<li>Tìm lỗi bộ nhớ/data race với công cụ phù hợp; profiling trước tối ưu.</li>\n<li>Bài: điều tra bug giả lập và ghi bằng chứng.</li>\n<li>Qua: giải thích cách chẩn đoán, không chỉ nói “đã chạy được”.</li>\n</ul>"}}, {"id": "SYS-005", "sort": 264, "pfx": "SYS", "subj": "SYS", "subjName": "Chuyên Môn: Systems & C++ Chuyên Sâu", "cat": "Specialization", "uitMap": "Nhánh tự chọn Systems", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "21. Nhánh Systems / Performance / C++ chuyên sâu", "sem": "HK5", "sup": false, "title": "Concurrency", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "bfa0b9a0b8058d21", "substeps": [{"substep_id": "SYS-005.part-1", "title": "part-1: concurrency & data race", "check": "Mô phỏng interleaving làm mất cập nhật trên biến dùng chung."}, {"substep_id": "SYS-005.part-2", "title": "part-2: mutex & critical section", "check": "Bảo vệ shared state bằng RAII lock guard."}, {"substep_id": "SYS-005.part-3", "title": "part-3: condition variable & deadlock", "check": "Phát hiện vòng chờ lock và giữ thứ tự khóa nhất quán."}], "sec": {"exp": "<p>Concurrency cho phép nhiều tác vụ tiến triển đồng thời; C++ cần kiểm soát shared state, synchronization, data races, cancellation và lifetime thread.</p>", "ex": "<p>Chia xử lý log theo chunks có thể chạy song song, nhưng tổng hợp counters phải dùng cách đồng bộ/partition an toàn.</p>", "clar": "<p>Thêm thread có thể làm chậm do overhead, contention và I/O; concurrency làm tăng độ phức tạp, chỉ dùng khi có lý do đo được.</p>", "ext": "<p>Atomics, futures, thread pools và memory model là chủ đề sâu, học theo nhu cầu.</p>", "check": "<p>Một lý do khiến thêm thread không làm chương trình nhanh hơn là gì?</p>", "sync": "<ul>\n<li>Thread, mutex, condition variable, race, deadlock; thiết kế shared state cẩn thận.</li>\n<li>Bài: tạo chương trình nhỏ rồi so sánh có/không đồng bộ trong môi trường học.</li>\n<li>Qua: có test/giải thích và biết giới hạn kết quả quan sát.</li>\n</ul>"}}, {"id": "SYS-006", "sort": 265, "pfx": "SYS", "subj": "SYS", "subjName": "Chuyên Môn: Systems & C++ Chuyên Sâu", "cat": "Specialization", "uitMap": "Nhánh tự chọn Systems", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "21. Nhánh Systems / Performance / C++ chuyên sâu", "sem": "HK5", "sup": false, "title": "Networking/OS deeper", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "02d6f8acf6758a53", "substeps": [], "sec": {"exp": "<p>Systems engineering đào sâu OS/networking: syscall, memory mapping, sockets, scheduling và resource limits. Học qua mô hình và thí nghiệm nhỏ.</p>", "ex": "<p>Viết client/server echo local hoặc đo xử lý file, sau đó dùng công cụ quan sát process, socket và error paths.</p>", "clar": "<p>Không expose server thử nghiệm ra mạng công cộng nếu chưa cấu hình bảo mật. Luôn giới hạn scope và kiểm tra error handling.</p>", "ext": "<p>Protocol framing, nonblocking I/O và backpressure là mở rộng.</p>", "check": "<p>Nêu khác biệt giữa application protocol và transport protocol.</p>", "sync": "<ul>\n<li>Socket căn bản, process/thread, memory, I/O; chỉ tiếp tục nếu hướng công việc/dự án cần.</li>\n<li>Bài: client/server tối thiểu hoặc tracing process.</li>\n<li>Qua: giải thích protocol và lifecycle tài nguyên.</li>\n</ul>"}}, {"id": "SYS-007", "sort": 266, "pfx": "SYS", "subj": "SYS", "subjName": "Chuyên Môn: Systems & C++ Chuyên Sâu", "cat": "Specialization", "uitMap": "Nhánh tự chọn Systems", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "21. Nhánh Systems / Performance / C++ chuyên sâu", "sem": "HK7", "sup": false, "title": "Benchmark và tối ưu có kiểm chứng", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "730d0ee1cd92d87d", "substeps": [], "sec": {"exp": "<p>Benchmark đo hiệu năng dưới workload, environment và phương pháp cụ thể. Tối ưu dựa profiling, thay một yếu tố và so sánh với baseline.</p>", "ex": "<p>Chạy log analyzer trên nhiều file kích thước, lặp nhiều lần, so sánh median và ghi CPU/compiler/options.</p>", "clar": "<p>Đừng lấy một lần chạy hoặc input khác nhau để tuyên bố nhanh hơn. Cache warmup, optimizer, background tasks và variance ảnh hưởng số đo.</p>", "ext": "<p>Statistical significance và hardware counters là phần nâng cao.</p>", "check": "<p>Những thông tin nào cần ghi để benchmark có thể tái lập?</p>", "sync": "<ul>\n<li>Benchmark đúng, warm-up/biến thiên và giới hạn đo; ưu tiên thuật toán/cấu trúc dữ liệu trước tối ưu vi mô.</li>\n<li>Bài: profile bottleneck, thay đổi một yếu tố, đo lại.</li>\n<li>Qua: báo cáo cả kết quả không cải thiện nếu đó là điều quan sát được.</li>\n</ul>"}}, {"id": "SYS-008", "sort": 267, "pfx": "SYS", "subj": "SYS", "subjName": "Chuyên Môn: Systems & C++ Chuyên Sâu", "cat": "Specialization", "uitMap": "Nhánh tự chọn Systems", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "21. Nhánh Systems / Performance / C++ chuyên sâu", "sem": "HK7", "sup": false, "title": "Dự án Systems", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "44e63ddbb0cfc76c", "substeps": [], "sec": {"exp": "<p>Dự án systems cần một yêu cầu đo được và kiểm tra resource/lifetime/error/performance chứ không chỉ code thấp cấp.</p>", "ex": "<p>CLI xử lý file lớn có streaming, validation, benchmark, tests và README; so sánh bounded memory với đọc toàn bộ file.</p>", "clar": "<p>Không cần “dùng pointer thô” để chứng minh biết systems. Chất lượng gồm độ đúng, xử lý lỗi, đo lường và mô tả giới hạn.</p>", "ext": "<p>Sau MVP, thêm profiling/security review dựa trên kết quả thật.</p>", "check": "<p>Nêu một tiêu chí correctness và một tiêu chí performance của dự án.</p>", "sync": "<ul>\n<li>Chọn log processor, tool CLI, server nhỏ hoặc project phù hợp. Có yêu cầu, test, memory/resource handling, benchmark và README.</li>\n<li>Qua: demo có thể tái lập và giải thích rõ lựa chọn kỹ thuật.</li>\n</ul>"}}, {"id": "DATA-001", "sort": 268, "pfx": "DATA", "subj": "DATA", "subjName": "Chuyên Môn: Data / AI Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Data/AI", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "22. Nhánh Data / AI Engineering", "sem": "HK5", "sup": false, "title": "Python từ cơ bản", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "ad5e50bc8080f3e5", "substeps": [], "sec": {"exp": "<p>Python nền tảng tương tự các ngôn ngữ khác ở control flow/hàm nhưng cú pháp và runtime khác. Luyện đọc file, xử lý lỗi và biến đổi dữ liệu thực tế.</p>", "ex": "<p>Đọc CSV nhỏ, parse cột điểm, tính average và ghi báo cáo; bỏ/ghi nhận row sai theo quy tắc.</p>", "clar": "<p>Không giả định file có mọi cột hoặc dữ liệu luôn sạch; kiểm tra lỗi parse và encoding. Virtual environment học ở bài package workflow.</p>", "ext": "<p>Type hints, unit tests và project structure sau script đầu tiên.</p>", "check": "<p>Nếu một hàng thiếu cột điểm, chương trình nên làm gì theo contract?</p>", "sync": "<ul>\n<li>Biến, kiểu, control flow, hàm, module, file, exceptions; học theo bài thực hành nhỏ.</li>\n<li>Bài: đọc CSV, thống kê và ghi kết quả.</li>\n<li>Qua: tự xử lý file và test các trường hợp không hợp lệ.</li>\n</ul>"}}, {"id": "DATA-002", "sort": 269, "pfx": "DATA", "subj": "DATA", "subjName": "Chuyên Môn: Data / AI Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Data/AI", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "22. Nhánh Data / AI Engineering", "sem": "HK5", "sup": false, "title": "Python collections và package workflow", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reviewed_against_source", "srcRef": "Audited & patched in Verification Master v1.2 (AUD-003..008)", "hash": "49a866afbfdc356a", "substeps": [], "sec": {"exp": "<p>List giữ thứ tự và duplicate; tuple thường dùng dữ liệu cố định; set giữ phần tử duy nhất; dict ánh xạ key→value. Virtual environment cô lập dependency.</p>", "ex": "<p>Đếm trạng thái bằng dict, loại ID trùng bằng set và giữ thứ tự record bằng list.</p>", "clar": "<p>Trong Python 3.7 trở lên, <code class=\"inline-code\">dict</code> bảo toàn thứ tự chèn như một bảo đảm của ngôn ngữ; cập nhật value của key đang có không làm key đổi vị trí, còn xóa rồi chèn lại key sẽ đưa key về cuối. <code class=\"inline-code\">dict</code> không tự sắp xếp key. <code class=\"inline-code\">set</code> không có bảo đảm thứ tự duyệt; không dựa vào thứ tự đó cho logic nghiệp vụ. Nếu cần thứ tự cụ thể, hãy sắp xếp rõ ràng. Không cài package vào môi trường global một cách tùy tiện.</p>", "ext": "<p>Packaging, lockfiles và reproducible runs giúp dự án chia sẻ được.</p>", "check": "<p>Chọn list/set/dict cho ba nhu cầu: giữ thứ tự, loại trùng, ánh xạ mã sang tên.</p>", "sync": "<ul>\n<li>List/dict/set/tuple, iterator cơ bản, virtual environment, dependency.</li>\n<li>Bài: nhóm dữ liệu và đóng gói script có README.</li>\n<li>Qua: có môi trường chạy tái lập.</li>\n</ul>"}}, {"id": "DATA-003", "sort": 270, "pfx": "DATA", "subj": "DATA", "subjName": "Chuyên Môn: Data / AI Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Data/AI", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "22. Nhánh Data / AI Engineering", "sem": "HK5", "sup": false, "title": "SQL và xử lý dữ liệu", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "e21b10aa6d98ed2f", "substeps": [], "sec": {"exp": "<p>SQL xử lý lọc/liên kết/tổng hợp gần nơi lưu dữ liệu; Python xử lý orchestration, kiểm tra hoặc phân tích tiếp. Kiểm tra số liệu bằng phương pháp đối chiếu.</p>", "ex": "<p>Truy vấn doanh thu theo tháng rồi đối chiếu tổng với một kiểm tra độc lập trên dataset nhỏ.</p>", "clar": "<p>NULL, duplicate joins, timezone và missing data có thể làm thống kê sai. Mỗi metric cần định nghĩa rõ.</p>", "ext": "<p>Pipeline có thể cache kết quả trung gian và theo dõi data lineage.</p>", "check": "<p>Làm sao phát hiện JOIN làm nhân đôi số hàng?</p>", "sync": "<ul>\n<li>Dùng SQL cùng Python; schema, join, group; hiểu dữ liệu thiếu và trùng.</li>\n<li>Bài: báo cáo từ dataset nhỏ.</li>\n<li>Qua: kiểm tra tính đúng của số liệu bằng truy vấn đối chiếu.</li>\n</ul>"}}, {"id": "DATA-004", "sort": 271, "pfx": "DATA", "subj": "DATA", "subjName": "Chuyên Môn: Data / AI Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Data/AI", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "22. Nhánh Data / AI Engineering", "sem": "HK5", "sup": false, "title": "Thống kê và xác suất căn bản", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "03f08608f4147a7d", "substeps": [], "sec": {"exp": "<p>Thống kê tóm tắt mô tả phân bố: mean nhạy với outlier; median là trung vị; variance/deviation mô tả độ phân tán theo định nghĩa đã chọn. Xác suất mô hình hóa bất định.</p>", "ex": "<p>Dữ liệu [1,2,2,100] có mean lớn hơn median đáng kể do outlier 100.</p>", "clar": "<p>Tương quan không tự chứng minh nhân quả; sample size, sampling bias và cách đo đều ảnh hưởng kết luận.</p>", "ext": "<p>Confidence intervals/testing nên học cùng giả định thống kê nếu đi sâu ML.</p>", "check": "<p>Trong dataset có outlier lớn, mean và median có thể khác nhau ra sao?</p>", "sync": "<ul>\n<li>Trung bình/trung vị, phương sai/độ lệch chuẩn, phân phối và xác suất cơ bản theo yêu cầu dự án.</li>\n<li>Bài: thống kê/visualize dataset nhỏ và giải thích điểm hạn chế.</li>\n<li>Qua: không kết luận nhân quả từ tương quan đơn giản.</li>\n</ul>"}}, {"id": "DATA-005", "sort": 272, "pfx": "DATA", "subj": "DATA", "subjName": "Chuyên Môn: Data / AI Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Data/AI", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "22. Nhánh Data / AI Engineering", "sem": "HK5", "sup": false, "title": "Đại số tuyến tính phục vụ ML khi cần", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "e289ca4089102605", "substeps": [], "sec": {"exp": "<p>Vector biểu diễn dãy số; matrix biểu diễn bảng số. Kích thước phải tương thích với phép toán; dot product là tổng tích các cặp thành phần tương ứng.</p>", "ex": "<p>[1,2]·[3,4]=1×3+2×4=11; matrix 2×3 nhân matrix 3×1 cho kết quả 2×1.</p>", "clar": "<p>Không thể nhân matrix nếu số cột của ma trận trái khác số hàng ma trận phải trong phép nhân chuẩn. Shape errors là lỗi phổ biến.</p>", "ext": "<p>Tối ưu đại số tuyến tính dùng thư viện số; cần hiểu shape/semantics trước khi gọi API.</p>", "check": "<p>Nêu kích thước kết quả của phép nhân matrix 2×3 với 3×4.</p>", "sync": "<ul>\n<li>Vector, ma trận, tích vô hướng, phép nhân ma trận ở mức phù hợp.</li>\n<li>Bài: tính ví dụ nhỏ bằng tay và công cụ.</li>\n<li>Qua: diễn giải được kích thước vector/matrix trong phép tính.</li>\n</ul>"}}, {"id": "DATA-006", "sort": 273, "pfx": "DATA", "subj": "DATA", "subjName": "Chuyên Môn: Data / AI Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Data/AI", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "22. Nhánh Data / AI Engineering", "sem": "HK5", "sup": false, "title": "Pipeline dữ liệu", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "adf5776eec78167c", "substeps": [], "sec": {"exp": "<p>Pipeline dữ liệu là các bước lặp lại load→validate→clean→transform→split/output. Mỗi bước nên có quy tắc, logs và cách kiểm tra chất lượng.</p>", "ex": "<p>Kiểm tra cột bắt buộc, chuẩn hóa timestamp, phát hiện duplicate ID, rồi tạo dataset sạch và báo số dòng bị loại.</p>", "clar": "<p>Không xóa row lỗi im lặng; việc clean có thể tạo bias hoặc mất thông tin. Ghi lại nguồn/giả định và version dataset.</p>", "ext": "<p>Data validation tools và lineage mở rộng khi nhiều pipeline phụ thuộc.</p>", "check": "<p>Những metrics nào nên ghi sau bước clean dữ liệu?</p>", "sync": "<ul>\n<li>Load, validate, clean, transform, split; versioning nguồn và ghi nhận giả định.</li>\n<li>Bài: pipeline có bước kiểm tra chất lượng dữ liệu.</li>\n<li>Qua: dữ liệu bất thường được phát hiện chứ không bị bỏ qua âm thầm.</li>\n</ul>"}}, {"id": "DATA-007", "sort": 274, "pfx": "DATA", "subj": "DATA", "subjName": "Chuyên Môn: Data / AI Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Data/AI", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "22. Nhánh Data / AI Engineering", "sem": "HK7", "sup": false, "title": "ML cơ bản nếu hướng yêu cầu", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "deb0d854595d49a5", "substeps": [], "sec": {"exp": "<p>ML evaluation cần tách train/validation/test theo mục đích, có baseline và metric phù hợp. Leakage xảy ra khi thông tin từ ngoài tập train/đúng thời điểm rò vào quá trình học/đánh giá.</p>", "ex": "<p>Phân loại mất cân bằng có thể cần precision/recall thay vì chỉ accuracy; baseline dự đoán lớp phổ biến làm mốc so sánh.</p>", "clar": "<p>Test set không nên dùng lặp đi lặp lại để chọn model vì lúc đó gián tiếp overfit vào test. Split phải tôn trọng dữ liệu thời gian/nhóm nếu cần.</p>", "ext": "<p>Calibration, cross-validation và error analysis là mở rộng theo loại task.</p>", "check": "<p>Vì sao baseline đơn giản cần có trước model phức tạp?</p>", "sync": "<ul>\n<li>Train/validation/test split, baseline, leakage, overfitting và metric phù hợp.</li>\n<li>Bài: so sánh baseline với model đơn giản trên dataset học tập.</li>\n<li>Qua: đánh giá trên dữ liệu phù hợp và giải thích metric.</li>\n</ul>"}}, {"id": "DATA-008", "sort": 275, "pfx": "DATA", "subj": "DATA", "subjName": "Chuyên Môn: Data / AI Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Data/AI", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "22. Nhánh Data / AI Engineering", "sem": "HK7", "sup": false, "title": "Dùng model/API một cách có trách nhiệm", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "b140385e5b2d2ad3", "substeps": [], "sec": {"exp": "<p>Tích hợp model/API cần đánh giá độ đúng theo tập test, latency, cost, privacy và failure modes. Output model có thể tự tin nhưng vẫn sai.</p>", "ex": "<p>Tạo bộ prompt/input đại diện và adversarial cases; chấm output theo rubric; log phiên bản model và latency nhưng không lưu dữ liệu nhạy cảm trái phép.</p>", "clar": "<p>Không coi output AI là ground truth hoặc đưa secrets/dữ liệu cá nhân vào dịch vụ không được phê duyệt. Bản model/provider có thể thay đổi hành vi.</p>", "ext": "<p>Versioned eval suite, human review và fallback path hữu ích khi model có ảnh hưởng sản phẩm.</p>", "check": "<p>Nêu một metric ngoài độ chính xác cần đo cho model/API.</p>", "sync": "<ul>\n<li>Đánh giá output; latency/cost; privacy; failure mode; versioning.</li>\n<li>Bài: bộ test cho model/API và phân loại lỗi.</li>\n<li>Qua: không đưa dữ liệu nhạy cảm vào tool không được phê duyệt và không coi output model là ground truth.</li>\n</ul>"}}, {"id": "DATA-009", "sort": 276, "pfx": "DATA", "subj": "DATA", "subjName": "Chuyên Môn: Data / AI Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Data/AI", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "22. Nhánh Data / AI Engineering", "sem": "HK7", "sup": false, "title": "Serving và monitoring nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "eca1fe439d4cc775", "substeps": [], "sec": {"exp": "<p>Serving đưa model/data function qua API hoặc batch job; monitoring kiểm tra service health, chất lượng dữ liệu và drift phù hợp workload.</p>", "ex": "<p>Endpoint nhận input hợp lệ, trả output có schema, ghi latency/error; pipeline batch lưu số hàng đọc và số lỗi.</p>", "clar": "<p>Model response HTTP 200 không đồng nghĩa nội dung đúng. Monitoring cần chỉ số phù hợp với định nghĩa output và có cách hành động khi lệch.</p>", "ext": "<p>Canary, drift checks và alert thresholds cần dựa baseline.</p>", "check": "<p>Phân biệt health check với quality check.</p>", "sync": "<ul>\n<li>API, batch processing, logging, drift/quality checks theo loại workload.</li>\n<li>Bài: demo pipeline hoặc endpoint đơn giản.</li>\n<li>Qua: có phương pháp phát hiện output lỗi hoặc service hỏng.</li>\n</ul>"}}, {"id": "DATA-010", "sort": 277, "pfx": "DATA", "subj": "DATA", "subjName": "Chuyên Môn: Data / AI Engineering", "cat": "Specialization", "uitMap": "Nhánh tự chọn Data/AI", "part": "PHẦN I — CHỌN NHÁNH CHUYÊN MÔN VÀ HỌC TỪNG BƯỚC", "stage": "22. Nhánh Data / AI Engineering", "sem": "HK7", "sup": false, "title": "Dự án Data/AI", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "bc298b13be3bca1f", "substeps": [], "sec": {"exp": "<p>Dự án Data/AI cần câu hỏi rõ, dataset có nguồn, pipeline tái lập, baseline và evaluation, kèm hạn chế/bias. Dự án giá trị không chỉ là notebook chạy một lần.</p>", "ex": "<p>Dự đoán một biến trên dataset học tập: ghi split, metric, baseline, kết quả, nguồn dữ liệu và trường hợp model sai.</p>", "clar": "<p>Không tuyên bố khả năng tổng quát từ dataset nhỏ hoặc rò dữ liệu; không dùng dữ liệu có quyền hạn chế mà không rõ phép sử dụng.</p>", "ext": "<p>README tái lập, data card ngắn và error analysis làm dự án đáng tin hơn.</p>", "check": "<p>Liệt kê bốn bằng chứng cần có để người khác đánh giá kết quả dự án.</p>", "sync": "<ul>\n<li>Chọn câu hỏi nhỏ, dataset phù hợp, pipeline, baseline, evaluation, README và giới hạn/thiên lệch.</li>\n<li>Qua: người học giải thích được nguồn dữ liệu, cách đánh giá và những gì không thể kết luận.</li>\n</ul>"}}, {"id": "EN-000", "sort": 278, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "23. Mục tiêu và cách dạy tiếng Anh", "sem": "HK1", "sup": false, "title": "Quiz chẩn đoán", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "c824fef8d1bd17be", "substeps": [], "sec": {"exp": "<p>Bài chẩn đoán chỉ chọn điểm bắt đầu, không phải chứng chỉ trình độ. Có các mục từ vựng, câu đơn, câu lệnh kỹ thuật và đọc hiểu ngắn; trả lời dựa trên hiểu biết hiện tại, không tra từ.</p>", "ex": "<p>Đọc “The test failed because the input was empty.” Xác định test đã làm gì, trạng thái ra sao và nguyên nhân được nêu là gì.</p>", "clar": "<p>Sai một câu không chứng minh bạn yếu tiếng Anh; có thể là thiếu vocab chuyên ngành hoặc chưa học cấu trúc câu. Chỉ dùng kết quả để gợi ý bài tiếp theo.</p>", "ext": "<p>Làm lại câu tương tự sau vài ngày; nếu nhớ đúng nghĩa trong ngữ cảnh, mới đánh dấu từ đã vững.</p>", "check": "<p>Sau quiz, phân loại câu sai thành vocab, grammar, đọc hiểu hay thuật ngữ code.</p>", "sync": "<ul>\n<li>Gồm 12 câu ngắn: từ vựng đời thường, ngữ pháp căn bản, câu lệnh kỹ thuật, đọc hiểu một đoạn 2–3 câu.</li>\n<li>Không đặt nhãn năng lực cố định như “kém/giỏi”; chỉ xác định bài nên mở.</li>\n<li>Dưới 50%: mở cụm EN-A. 50–79%: vẫn học EN-A nhưng có thể đánh dấu bài đã vững nếu vượt từng mastery gate. 80% trở lên: cho phép thử bài EN-B, nhưng vẫn yêu cầu quiz đọc hiểu kỹ thuật.</li>\n<li><strong>Học:</strong> <code class=\"inline-code\">I/you/we/they/it</code>, danh từ chỉ người/vật, động từ chỉ hành động.</li>\n</ul>"}}, {"id": "EN-001", "sort": 279, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "EN-A — Nền tảng ngôn ngữ dùng trong học tập", "sem": "HK1", "sup": false, "title": "Đại từ, danh từ và động từ thông dụng", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "79da069f62e3e0e2", "substeps": [], "sec": {"exp": "<p>Bắt đầu bằng vai trò từ trong câu: pronoun thay danh từ, noun gọi tên người/vật/ý niệm, verb biểu thị hành động/trạng thái. Trong câu kỹ thuật, chủ ngữ và động từ giúp tìm ý chính nhanh.</p>", "ex": "<p>“The compiler reports an error.” <code class=\"inline-code\">compiler</code> là noun/chủ ngữ, <code class=\"inline-code\">reports</code> là verb, <code class=\"inline-code\">an error</code> là tân ngữ.</p>", "clar": "<p>Không dịch từng từ rời; hãy xác định ai/cái gì làm gì. <code class=\"inline-code\">it</code> có thể trỏ tới program, function, tool hoặc concept đã nhắc trước đó.</p>", "ext": "<p>Lập flashcard có một câu ngữ cảnh, không chỉ một từ và nghĩa đơn lẻ.</p>", "check": "<p>Trong câu “The program reads a file”, từ nào là chủ ngữ và động từ?</p>", "sync": "<ul>\n<li><strong>Học:</strong> <code class=\"inline-code\">I/you/we/they/it</code>, danh từ chỉ người/vật, động từ chỉ hành động.</li>\n<li><strong>Bài:</strong> chọn chủ ngữ/động từ trong câu đơn và ghép từ với nghĩa.</li>\n<li><strong>Qua:</strong> đúng ít nhất 8/10 câu.</li>\n</ul>"}}, {"id": "EN-002", "sort": 280, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "EN-A — Nền tảng ngôn ngữ dùng trong học tập", "sem": "HK1", "sup": false, "title": "Cấu trúc câu đơn hiện tại", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "d1bf161ae5ec2dd5", "substeps": [], "sec": {"exp": "<p>Hiện tại đơn diễn tả sự thật/thói quen; với he/she/it hoặc chủ ngữ số ít, động từ thường thêm -s/-es. Động từ <code class=\"inline-code\">be</code> có dạng am/is/are riêng.</p>", "ex": "<p>“I write code.” nhưng “The program runs.” Phủ định: “The program does not run.” Câu hỏi: “Does the program run?”</p>", "clar": "<p>Sau <code class=\"inline-code\">does/does not</code>, động từ chính về dạng nguyên mẫu (<code class=\"inline-code\">run</code>, không phải <code class=\"inline-code\">runs</code>). “I am study” sai; có thể nói “I study” hoặc “I am studying” tùy ý nghĩa.</p>", "ext": "<p>Câu mẫu có thể mô tả behavior: “The function returns a value.”</p>", "check": "<p>Sửa câu “The function return an integer.”</p>", "sync": "<ul>\n<li><strong>Học:</strong> câu khẳng định/phủ định/câu hỏi hiện tại đơn; <code class=\"inline-code\">be</code> và động từ thường.</li>\n<li><strong>Bài:</strong> viết 5 câu mô tả lịch học/thói quen lập trình.</li>\n<li><strong>Qua:</strong> phân biệt <code class=\"inline-code\">I am study</code> với câu đúng theo cấu trúc đã học.</li>\n</ul>"}}, {"id": "EN-003", "sort": 281, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "EN-A — Nền tảng ngôn ngữ dùng trong học tập", "sem": "HK1", "sup": false, "title": "Mạo từ và danh từ số ít/số nhiều", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "da062aa0581de5ec", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">a/an</code> nói tới một danh từ đếm được số ít chưa xác định cụ thể; <code class=\"inline-code\">the</code> nói tới đối tượng đã xác định/người đọc biết. Danh từ đếm được thay đổi dạng số ít/số nhiều.</p>", "ex": "<p>“Open a file.” giới thiệu một file chưa xác định; “Close the file.” nói tới file vừa nhắc. “A function” nhưng “an error” theo âm mở đầu.</p>", "clar": "<p>Chọn a/an theo âm, không chỉ chữ cái. Một số danh từ dùng được số nhiều; information/code thường không đếm theo cách thông thường trong nghĩa kỹ thuật.</p>", "ext": "<p>Đọc cụm danh từ nguyên khối trong README: “the required compiler”, “an optional field”.</p>", "check": "<p>Điền a/an/the trong “Open ___ file, then read ___ file.” theo ngữ cảnh đã nêu.</p>", "sync": "<ul>\n<li><strong>Học:</strong> <code class=\"inline-code\">a/an/the</code>, danh từ đếm được ở mức cơ bản.</li>\n<li><strong>Bài:</strong> sửa câu mô tả file/class/function.</li>\n<li><strong>Qua:</strong> hiểu nghĩa thay đổi căn bản khi dùng thiếu/thừa mạo từ.</li>\n</ul>"}}, {"id": "EN-004", "sort": 282, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "EN-A — Nền tảng ngôn ngữ dùng trong học tập", "sem": "HK1", "sup": false, "title": "Thì quá khứ và mô tả lỗi đã xảy ra", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "408986e374ce1444", "substeps": [], "sec": {"exp": "<p>Quá khứ đơn mô tả hành động đã xảy ra ở thời điểm quá khứ. Động từ regular thường thêm -ed; irregular verb có dạng riêng. Dùng past tense khi viết bug report về lần chạy đã xảy ra.</p>", "ex": "<p>“Yesterday, I fixed the bug.” “The test failed.” “I changed the parser.”</p>", "clar": "<p><code class=\"inline-code\">did</code> đi với động từ nguyên mẫu trong câu hỏi/phủ định: “Did the test fail?”/“It did not fail.” Không viết “did failed”.</p>", "ext": "<p>Nhật ký debugging có thể ghi time, action, observed result và next step bằng câu ngắn.</p>", "check": "<p>Viết hai câu tiếng Anh về một bug bạn vừa sửa.</p>", "sync": "<ul>\n<li><strong>Học:</strong> quá khứ đơn thường gặp, mẫu câu “I changed…”, “The test failed…”.</li>\n<li><strong>Bài:</strong> ghi 4 câu nhật ký debugging.</li>\n<li><strong>Qua:</strong> có thể mô tả việc vừa làm bằng câu dễ hiểu.</li>\n</ul>"}}, {"id": "EN-005", "sort": 283, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "EN-A — Nền tảng ngôn ngữ dùng trong học tập", "sem": "HK1", "sup": false, "title": "Câu hỏi và yêu cầu trợ giúp", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "37de9239581578fc", "substeps": [], "sec": {"exp": "<p>Câu hỏi kỹ thuật tốt nêu hành vi mong đợi, hành vi thực tế và ngữ cảnh đủ để người khác giúp. Câu lịch sự không cần phức tạp.</p>", "ex": "<p>“What does this error mean?”; “Why does this function return zero for an empty list?”; “Could you explain this line?”</p>", "clar": "<p>Câu “It does not work” quá chung nếu không có output/log/steps. Câu hỏi hữu ích thường nói tên hàm, input và observed behavior.</p>", "ext": "<p>Khi hỏi AI/người hướng dẫn, cung cấp code tối thiểu tái hiện vấn đề và điều bạn đã thử; tránh gửi secret.</p>", "check": "<p>Biến “My code is broken” thành câu hỏi có input và actual output cụ thể.</p>", "sync": "<ul>\n<li><strong>Học:</strong> <code class=\"inline-code\">What does this error mean?</code>, <code class=\"inline-code\">Why does this function return...?</code>, <code class=\"inline-code\">Could you explain...?</code>.</li>\n<li><strong>Bài:</strong> viết 3 câu hỏi kỹ thuật cụ thể thay cho “It doesn't work”.</li>\n<li><strong>Qua:</strong> câu hỏi bao gồm hành vi mong muốn hoặc thông báo lỗi liên quan.</li>\n</ul>"}}, {"id": "EN-006", "sort": 284, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "EN-B — Từ vựng lập tr
