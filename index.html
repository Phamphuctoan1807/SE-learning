ong>Học:</strong> khác biệt giữa <code class=\"inline-code\">cin &gt;&gt;</code> và <code class=\"inline-code\">getline</code>; xử lý newline còn trong input stream theo tình huống.</li>\n<li><strong>Thực hành:</strong> nhập họ tên có khoảng trắng.</li>\n<li><strong>Đạt khi:</strong> đọc đúng dữ liệu có dấu cách và giải thích được lỗi bỏ qua dòng.</li>\n</ul>"}}, {"id": "CPP-033", "sort": 33, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C5 — Chuỗi, mảng và vector", "sem": "HK1", "sup": false, "title": "Mảng tĩnh", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["CPP-031"], "recBg": [], "unlocks": ["CPP-034", "SUP-PS-001"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "21d8d53d37a6d14b", "substeps": [], "sec": {"exp": "<p>Mảng lưu số phần tử cố định cùng kiểu, các phần tử được truy cập qua chỉ số bắt đầu từ 0. Duyệt mảng cần biết kích thước và không vượt biên.</p>", "ex": "<p><code class=\"inline-code\">int a[3] = {2,4,6};</code> có phần tử hợp lệ <code class=\"inline-code\">a[0]</code> đến <code class=\"inline-code\">a[2]</code>.</p>", "clar": "<p>Mảng C-style không tự kiểm tra chỉ số khi dùng <code class=\"inline-code\">[]</code>. Kích thước mảng cố định phù hợp bài nhỏ; với danh sách thay đổi theo input, vector thường thuận tiện hơn.</p>", "ext": "<p>Mảng nhiều chiều là mảng của các mảng; cần phân biệt số hàng/cột và quy tắc duyệt.</p>", "check": "<p>Với mảng 5 phần tử, chỉ số hợp lệ bắt đầu/kết thúc là gì?</p>", "sync": "<ul>\n<li><strong>Học:</strong> nhiều phần tử cùng kiểu; chỉ số; kích thước cố định; giới hạn phạm vi.</li>\n<li><strong>Thực hành:</strong> lưu n điểm trong giới hạn xác định và tính trung bình.</li>\n<li><strong>Đạt khi:</strong> duyệt đúng từ phần tử đầu đến cuối, không truy cập ngoài mảng.</li>\n</ul>"}}, {"id": "CPP-034", "sort": 34, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C5 — Chuỗi, mảng và vector", "sem": "HK1", "sup": false, "title": "`std::vector` nhập môn", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["CPP-033"], "recBg": [], "unlocks": ["CPP-035", "DSA-001"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "708b4fd2c1517dfa", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">std::vector&lt;T&gt;</code> là container lưu dãy phần tử cùng kiểu, có thể thay đổi kích thước. <code class=\"inline-code\">push_back</code> thêm phần tử cuối; <code class=\"inline-code\">size()</code> cho số phần tử đang lưu.</p>", "ex": "<p><code class=\"inline-code\">std::vector&lt;int&gt; v; v.push_back(4); v.push_back(7);</code> tạo dãy có size 2 và <code class=\"inline-code\">v[1]</code> là 7.</p>", "clar": "<p>Không truy cập <code class=\"inline-code\">v[0]</code> khi vector rỗng. Thêm phần tử có thể làm invalidated iterators/references khi vector phải cấp phát lại; điều này là chủ đề nâng cao hơn.</p>", "ext": "<p>Dùng vector mặc định cho danh sách cần phát triển động trừ khi có lý do cụ thể chọn cấu trúc khác.</p>", "check": "<p>So sánh mảng cố định và vector về kích thước, an toàn chỉ số và cách thêm phần tử.</p>", "sync": "<ul>\n<li><strong>Học:</strong> container thay đổi kích thước; <code class=\"inline-code\">push_back</code>, <code class=\"inline-code\">size</code>, truy cập; ưu tiên vector cho danh sách động.</li>\n<li><strong>Thực hành:</strong> nhập số lượng dữ liệu không biết trước theo sentinel hoặc số n.</li>\n<li><strong>Đạt khi:</strong> chọn đúng vector khi kích thước danh sách thay đổi.</li>\n</ul>"}}, {"id": "CPP-035", "sort": 35, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C5 — Chuỗi, mảng và vector", "sem": "HK1", "sup": false, "title": "Mẫu xử lý danh sách dữ liệu", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["CPP-034"], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "ac58f696239d62cf", "substeps": [], "sec": {"exp": "<p>Mẫu thao tác danh sách gồm duyệt, lọc, biến đổi, đếm và tổng hợp. Tách thao tác thành bước rõ giúp code dễ test và diễn đạt.</p>", "ex": "<p>Từ vector điểm, duyệt mỗi điểm, cộng vào sum và đếm số điểm đạt <code class=\"inline-code\">&gt;=5</code>; sau vòng lặp tính tỉ lệ nếu tổng số điểm lớn hơn 0.</p>", "clar": "<p>Khi lọc, hãy xác định có giữ nguyên thứ tự không; khi tính trung bình, không chia cho 0; khi biến đổi, tránh sửa container theo cách làm mất phần tử đang duyệt.</p>", "ext": "<p>Những mẫu này chuẩn bị cho <code class=\"inline-code\">std::algorithm</code>, lambda và xử lý dữ liệu dạng pipeline.</p>", "check": "<p>Mô tả cách đếm phần tử chẵn trong vector mà không dùng thư viện ngoài.</p>", "sync": "<ul>\n<li><strong>Học:</strong> duyệt, lọc, đếm, tổng hợp; tách logic khỏi nhập/in.</li>\n<li><strong>Thực hành:</strong> lọc các điểm đạt; đếm số lẻ; tìm min/max.</li>\n<li><strong>Đạt khi:</strong> giải được cùng một thao tác với ít nhất hai bộ dữ liệu khác nhau.</li>\n</ul>"}}, {"id": "CPP-036", "sort": 36, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C5 — Chuỗi, mảng và vector", "sem": "HK1", "sup": false, "title": "Tìm kiếm tuyến tính", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "a3aeac74ecf504f1", "substeps": [], "sec": {"exp": "<p>Tìm tuyến tính kiểm tra từng phần tử từ đầu đến cuối cho đến khi tìm thấy hoặc hết dãy. Nó không yêu cầu dữ liệu đã sắp xếp.</p>", "ex": "<p>Trong <code class=\"inline-code\">[8,3,5,3]</code>, tìm giá trị 5 trả chỉ số 2 (đánh chỉ số từ 0); tìm 7 trả trạng thái không tìm thấy.</p>", "clar": "<p>Nếu có giá trị trùng, phải xác định trả về vị trí đầu tiên, vị trí bất kỳ hay đếm tất cả. Dãy rỗng cần trả “không tìm thấy” an toàn.</p>", "ext": "<p>Thời gian trường hợp xấu nhất tăng tuyến tính theo số phần tử, O(n).</p>", "check": "<p>Nếu mục tiêu là đếm số lần giá trị 3 xuất hiện, dừng ở lần đầu có đủ không?</p>", "sync": "<ul>\n<li><strong>Học:</strong> tìm từ đầu đến cuối; trả vị trí hoặc “không tìm thấy”; dữ liệu có thể chưa sắp xếp.</li>\n<li><strong>Thực hành:</strong> tìm mã sinh viên trong vector.</li>\n<li><strong>Đạt khi:</strong> test được phần tử đầu/cuối/không có/ danh sách rỗng.</li>\n</ul>"}}, {"id": "CPP-037", "sort": 37, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C5 — Chuỗi, mảng và vector", "sem": "HK1", "sup": false, "title": "Sắp xếp và ý nghĩa thứ tự", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "1042e141a23b35e6", "substeps": [], "sec": {"exp": "<p>Sắp xếp sắp các phần tử theo một tiêu chí thứ tự; thuật toán có thể khác nhau về thời gian, bộ nhớ và tính ổn định. Với C++, <code class=\"inline-code\">std::sort</code> là lựa chọn thực tế khi đã có comparator phù hợp.</p>", "ex": "<p>Sắp xếp điểm tăng dần: <code class=\"inline-code\">[7,3,9]</code> → <code class=\"inline-code\">[3,7,9]</code>; sắp giảm dùng comparator <code class=\"inline-code\">a &gt; b</code>.</p>", "clar": "<p>Phải xác định thứ tự mong muốn và xử lý ties. <code class=\"inline-code\">std::sort</code> không bảo toàn thứ tự tương đối các phần tử bằng nhau; <code class=\"inline-code\">stable_sort</code> có semantics ổn định nhưng cũng có chi phí.</p>", "ext": "<p>Sau khi sort, có thể tìm binary nếu điều kiện thứ tự phù hợp.</p>", "check": "<p>Hãy viết tiêu chí “điểm giảm dần, nếu bằng thì mã tăng dần” bằng lời trước khi code.</p>", "sync": "<ul>\n<li><strong>Học:</strong> sắp xếp tăng/giảm; so sánh tiêu chí; phân biệt tìm kiếm và sắp xếp.</li>\n<li><strong>Thực hành:</strong> sắp xếp điểm; so sánh cách làm bằng tay với <code class=\"inline-code\">std::sort</code> sau khi đã hiểu yêu cầu.</li>\n<li><strong>Đạt khi:</strong> giải thích dữ liệu thay đổi ra sao và kiểm tra thứ tự đầu ra.</li>\n</ul>"}}, {"id": "CPP-038", "sort": 38, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C5 — Chuỗi, mảng và vector", "sem": "HK1", "sup": false, "title": "Mảng/vector hai chiều", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "98d5b57951091dc0", "substeps": [], "sec": {"exp": "<p>Mảng/vector hai chiều thường biểu diễn dữ liệu dạng hàng–cột như bảng điểm. Cần xác định kích thước mỗi chiều và dùng đúng thứ tự chỉ số.</p>", "ex": "<p>Với <code class=\"inline-code\">a[2][3]</code>, có 2 hàng, 3 cột; các chỉ số hợp lệ là hàng 0–1 và cột 0–2.</p>", "clar": "<p>Với mảng C-style, kích thước có giới hạn/điều kiện khai báo; <code class=\"inline-code\">vector&lt;vector&lt;T&gt;&gt;</code> linh hoạt hơn nhưng các hàng có thể có độ dài khác nếu chủ động tạo như vậy.</p>", "ext": "<p>Bài ma trận có thể dùng hai vòng lặp; với dữ liệu lớn cần chú ý layout và hiệu năng sau khi nắm nền tảng.</p>", "check": "<p>Trong ma trận <code class=\"inline-code\">rows × cols</code>, điều kiện vòng lặp hàng và cột nên là gì?</p>", "sync": "<ul>\n<li><strong>Học:</strong> hàng/cột; chỉ số kép; bảng điểm hoặc ma trận nhỏ.</li>\n<li><strong>Thực hành:</strong> tính tổng từng hàng và tìm giá trị lớn nhất trong ma trận.</li>\n<li><strong>Đạt khi:</strong> xác định được kích thước và duyệt đúng mọi phần tử.</li>\n</ul>"}}, {"id": "CPP-039", "sort": 39, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C6 — Debugging, test và xử lý đầu vào", "sem": "HK2", "sup": false, "title": "Ba loại lỗi: compile/runtime/logic", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f66a7b62f904dd60", "substeps": [], "sec": {"exp": "<p>Compile error ngăn tạo chương trình; runtime error xảy ra khi chạy; logic error cho kết quả sai dù chương trình chạy. Phân loại giúp chọn cách sửa đúng.</p>", "ex": "<p>Nếu thiếu <code class=\"inline-code\">}</code>, đó thường là lỗi compile; nếu mở file không tồn tại mà không xử lý, chương trình có thể báo runtime failure; nếu dùng <code class=\"inline-code\">&gt;</code> thay cho <code class=\"inline-code\">&gt;=</code>, đó có thể là logic bug.</p>", "clar": "<p>Thông báo lỗi đôi khi chỉ hậu quả đầu tiên; sửa nguyên nhân nhỏ nhất rồi build/test lại. Không thay đổi nhiều dòng cùng lúc vì khó biết điều gì khắc phục lỗi.</p>", "ext": "<p>Sanitizer và static analysis hữu ích về sau nhưng không thay thế tư duy đọc lỗi.</p>", "check": "<p>Đưa một ví dụ lỗi cho mỗi nhóm compile/runtime/logic.</p>", "sync": "<ul>\n<li><strong>Học:</strong> compiler từ chối code; chương trình lỗi khi chạy; chương trình chạy nhưng trả sai.</li>\n<li><strong>Thực hành:</strong> phân loại 9 ví dụ lỗi.</li>\n<li><strong>Đạt khi:</strong> không coi mọi lỗi đều là “lỗi cú pháp” và biết tìm thông tin hữu ích trong thông báo lỗi.</li>\n</ul>"}}, {"id": "CPP-040", "sort": 40, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C6 — Debugging, test và xử lý đầu vào", "sem": "HK2", "sup": false, "title": "Debugger và breakpoint", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "6bf16581540cb13b", "substeps": [], "sec": {"exp": "<p>Debugger cho phép tạm dừng tại breakpoint, chạy từng dòng và xem giá trị biến/call stack. Nó giúp quan sát trạng thái thay vì thêm nhiều lệnh in tùy tiện.</p>", "ex": "<p>Đặt breakpoint trước <code class=\"inline-code\">if(score &gt;= 5)</code>; chạy với score=4 và score=5, quan sát điều kiện và nhánh thực thi.</p>", "clar": "<p>Debugger chỉ quan sát một lần chạy với input cụ thể; nó không chứng minh chương trình đúng cho mọi input. Build phải có debug symbols và cấu hình phù hợp.</p>", "ext": "<p>Conditional breakpoint, watch expression và call stack có ích sau khi quen thao tác cơ bản.</p>", "check": "<p>Debugger cung cấp điều gì mà đọc output cuối không cho biết?</p>", "sync": "<ul>\n<li><strong>Học:</strong> breakpoint, step over/into, xem biến, call stack ở mức cơ bản.</li>\n<li><strong>Thực hành:</strong> tìm lỗi trong vòng lặp hoặc hàm.</li>\n<li><strong>Đạt khi:</strong> sử dụng debugger để chứng minh lúc nào giá trị biến sai.</li>\n</ul>"}}, {"id": "CPP-041", "sort": 41, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C6 — Debugging, test và xử lý đầu vào", "sem": "HK2", "sup": false, "title": "Thiết kế test và ca biên", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "d0af9785fd236626", "substeps": [], "sec": {"exp": "<p>Test là bộ input cùng kết quả kỳ vọng để kiểm tra hành vi. Ca biên nhắm vào ranh giới hoặc trạng thái dễ bị bỏ quên, như rỗng, một phần tử, min/max.</p>", "ex": "<p>Với hàm tìm kiếm: test phần tử ở đầu, ở cuối, không tồn tại và vector rỗng. Ghi rõ expected index hoặc “không tìm thấy”.</p>", "clar": "<p>“Chạy thử một lần thấy đúng” không đủ. Oracle là cách xác định kết quả mong đợi; test cần độc lập với code đang kiểm tra.</p>", "ext": "<p>Property-based testing sau này kiểm tra tính chất tổng quát, ví dụ sort xong dãy không giảm và giữ nguyên đa tập phần tử.</p>", "check": "<p>Tạo ba test cho hàm xác định số lớn hơn trong hai số, bao gồm trường hợp bằng nhau.</p>", "sync": "<ul>\n<li><strong>Học:</strong> happy path, min/max, rỗng, sai định dạng, trùng, thiếu dữ liệu.</li>\n<li><strong>Thực hành:</strong> lập bảng test cho <code class=\"inline-code\">calculateAverage</code> và chức năng tìm mã.</li>\n<li><strong>Đạt khi:</strong> không chỉ kiểm tra một ví dụ thuận lợi.</li>\n</ul>"}}, {"id": "CPP-042", "sort": 42, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C6 — Debugging, test và xử lý đầu vào", "sem": "HK2", "sup": false, "title": "Tiền điều kiện, xác thực và thông báo lỗi", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "d67a0456d7247f97", "substeps": [], "sec": {"exp": "<p>Validation kiểm tra input có phù hợp quy tắc miền hay không; thông báo lỗi cần cho biết vấn đề và cách khắc phục khi có thể. Preconditions nói hàm giả định gì trước khi chạy.</p>", "ex": "<p>Nếu điểm phải nằm trong [0,10], input 11 bị từ chối trước khi tính xếp loại.</p>", "clar": "<p>Không chỉ kiểm tra kiểu dữ liệu: số 7 có kiểu int hợp lệ nhưng có thể không hợp lệ cho trường điểm; rule phải đến từ yêu cầu nghiệp vụ.</p>", "ext": "<p>Phân biệt validation phía client để tiện dùng và validation phía server/database để bảo vệ tính toàn vẹn.</p>", "check": "<p>Đầu vào “tuổi=-3” là lỗi cú pháp hay vi phạm quy tắc dữ liệu?</p>", "sync": "<ul>\n<li><strong>Học:</strong> input ngoài dự đoán; xác minh phạm vi; trả thông báo rõ; không tiếp tục tính với dữ liệu không hợp lệ.</li>\n<li><strong>Thực hành:</strong> chặn điểm ngoài khoảng hợp lệ và xử lý chuỗi nhập không phải số theo mức học phù hợp.</li>\n<li><strong>Đạt khi:</strong> chương trình giải thích lỗi, không âm thầm cho kết quả sai.</li>\n</ul>"}}, {"id": "CPP-043", "sort": 43, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C7 — Struct, file và dự án vừa sức", "sem": "HK2", "sup": false, "title": "`struct` và gom dữ liệu liên quan", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-051"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "bc3fe7c2dec2d0c3", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">struct</code> gom các trường liên quan vào một kiểu dữ liệu do chương trình định nghĩa. Nó giúp biến dữ liệu có ý nghĩa thay vì quản lý nhiều mảng song song.</p>", "ex": "<p><code class=\"inline-code\">struct Student { std::string id; std::string name; double score; };</code> biểu diễn một sinh viên với các trường gắn cùng nhau.</p>", "clar": "<p>Trong C++, <code class=\"inline-code\">struct</code> và <code class=\"inline-code\">class</code> rất giống nhau; điểm khác mặc định quan trọng là quyền truy cập và kế thừa. Không phải mọi dữ liệu đều cần class phức tạp.</p>", "ext": "<p>Có thể lưu <code class=\"inline-code\">std::vector&lt;Student&gt;</code> để quản lý nhiều sinh viên; validation nên được định nghĩa riêng hoặc đóng gói khi cần.</p>", "check": "<p>Vì sao một vector Student thường rõ hơn ba vector riêng cho id, name, score?</p>", "sync": "<ul>\n<li><strong>Học:</strong> kiểu dữ liệu do người dùng định nghĩa; nhiều trường thông tin trong một bản ghi.</li>\n<li><strong>Thực hành:</strong> <code class=\"inline-code\">Student</code> gồm mã, tên, điểm.</li>\n<li><strong>Đạt khi:</strong> giải thích được vì sao một struct hợp lý hơn nhiều vector song song trong ví dụ nhỏ.</li>\n</ul>"}}, {"id": "CPP-044", "sort": 44, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C7 — Struct, file và dự án vừa sức", "sem": "HK2", "sup": false, "title": "`enum` và trạng thái có tên", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "150e567091aee3ba", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">enum</code> đặt tên cho một tập trạng thái hữu hạn; tên có thể làm code rõ hơn so với số nguyên hoặc chuỗi tùy ý.</p>", "ex": "<p><code class=\"inline-code\">enum class BorrowStatus { Available, Borrowed, Lost };</code> giới hạn trạng thái dự kiến trong các giá trị đặt tên.</p>", "clar": "<p><code class=\"inline-code\">enum class</code> yêu cầu viết tên phạm vi như <code class=\"inline-code\">BorrowStatus::Available</code>, giúp tránh đụng tên và chuyển kiểu ngầm ít hơn enum không-scoped.</p>", "ext": "<p>Phân biệt trạng thái hợp lệ và các chuyển trạng thái được phép, ví dụ chỉ sách Available mới được cho mượn.</p>", "check": "<p>Nêu vì sao <code class=\"inline-code\">status=2</code> khó đọc hơn <code class=\"inline-code\">BorrowStatus::Lost</code>.</p>", "sync": "<ul>\n<li><strong>Học:</strong> liệt kê giá trị trạng thái; tên có ý nghĩa hơn số rời rạc.</li>\n<li><strong>Thực hành:</strong> trạng thái sách hoặc trạng thái menu.</li>\n<li><strong>Đạt khi:</strong> dùng enum khi tập trạng thái hữu hạn và rõ nghĩa.</li>\n</ul>"}}, {"id": "CPP-045", "sort": 45, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C7 — Struct, file và dự án vừa sức", "sem": "HK2", "sup": false, "title": "Đọc file văn bản", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "7745bfa92e6c997a", "substeps": [], "sec": {"exp": "<p>Đọc file cần mở thành công, đọc từng phần theo format và phát hiện dòng thiếu/trật dữ liệu. File là input ngoài nên không được giả định luôn tồn tại hoặc hoàn hảo.</p>", "ex": "<p>Đọc từng dòng log bằng <code class=\"inline-code\">std::getline</code>; nếu file không mở được, báo lỗi và kết thúc theo đường xử lý xác định.</p>", "clar": "<p>Không dùng dữ liệu biến chưa khởi tạo khi parse thất bại. Tách đọc raw line, parse và validate giúp dễ xác định lỗi.</p>", "ext": "<p>Sau này có thể học CSV/parser chuẩn; không tự viết parser phức tạp trước khi định dạng file được xác định rõ.</p>", "check": "<p>Nếu file không mở được, chương trình cần làm gì trước khi cố đọc?</p>", "sync": "<ul>\n<li><strong>Học:</strong> <code class=\"inline-code\">ifstream</code>, mở file, đọc dòng/giá trị, kiểm tra mở file thành công.</li>\n<li><strong>Thực hành:</strong> đọc danh sách điểm từ file mẫu.</li>\n<li><strong>Đạt khi:</strong> xử lý được file thiếu hoặc sai đường dẫn.</li>\n</ul>"}}, {"id": "CPP-046", "sort": 46, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C7 — Struct, file và dự án vừa sức", "sem": "HK2", "sup": false, "title": "Ghi file và lưu dữ liệu", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "17cfd6c2a23aa623", "substeps": [], "sec": {"exp": "<p>Ghi file lưu dữ liệu để lần chạy tiếp theo dùng lại. Cần xác định format, chế độ mở, xử lý lỗi và tính toàn vẹn khi ghi.</p>", "ex": "<p>Ghi mỗi Student một dòng theo format được mô tả, sau đó đóng file; lần chạy sau đọc lại bằng cùng quy tắc.</p>", "clar": "<p>Ghi đè (<code class=\"inline-code\">trunc</code>) khác với nối thêm (<code class=\"inline-code\">app</code>). Nếu file không ghi được, không nên thông báo “lưu thành công”. Một chương trình học tập đơn giản chưa phải database có transaction.</p>", "ext": "<p>Dùng định dạng có delimiter phù hợp hoặc JSON/CSV library ở giai đoạn sau; quy tắc escape cần nghĩ tới nếu dữ liệu có dấu phân cách.</p>", "check": "<p>Sự khác nhau giữa ghi đè và ghi nối là gì?</p>", "sync": "<ul>\n<li><strong>Học:</strong> <code class=\"inline-code\">ofstream</code>, ghi dữ liệu, định dạng file đơn giản, tránh ghi đè ngoài ý muốn.</li>\n<li><strong>Thực hành:</strong> lưu và tải lại các sinh viên.</li>\n<li><strong>Đạt khi:</strong> dữ liệu còn lại sau khi đóng và mở chương trình lại.</li>\n</ul>"}}, {"id": "CPP-047", "sort": 47, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C7 — Struct, file và dự án vừa sức", "sem": "HK2", "sup": false, "title": "Phân tích dữ liệu file không đáng tin cậy", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "5f3dfa2c489b5048", "substeps": [], "sec": {"exp": "<p>File không đáng tin có thể thiếu trường, có kiểu sai, bị cắt cụt hoặc chứa giá trị ngoài miền. Parse thành công về cú pháp chưa chắc dữ liệu hợp lệ về nghiệp vụ.</p>", "ex": "<p>Một dòng <code class=\"inline-code\">ST01,An,abc</code> không thể parse điểm thành số theo format điểm; ghi nhận dòng sai thay vì tự đổi thành 0.</p>", "clar": "<p>Không bỏ qua lỗi âm thầm: kết quả báo cáo có thể sai mà người dùng không biết. Nên thống nhất bỏ dòng, dừng file hay tạo báo cáo lỗi tùy yêu cầu.</p>", "ext": "<p>Parser có thể thống kê số dòng hợp lệ, số dòng bị bỏ và lý do; đừng ghi dữ liệu nhạy cảm không cần thiết vào log.</p>", "check": "<p>Phân biệt lỗi parse với điểm số parse được nhưng nằm ngoài [0,10].</p>", "sync": "<ul>\n<li><strong>Học:</strong> dòng bị thiếu, trường sai, dữ liệu trống; tách parsing và logic nghiệp vụ.</li>\n<li><strong>Thực hành:</strong> nạp file tốt và file hỏng rồi báo lỗi phù hợp.</li>\n<li><strong>Đạt khi:</strong> một dòng hỏng không khiến chương trình tạo ra dữ liệu rác mà không thông báo.</li>\n</ul>"}}, {"id": "CPP-048", "sort": 48, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C7 — Struct, file và dự án vừa sức", "sem": "HK2", "sup": false, "title": "Dự án 1: quản lý điểm sinh viên", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "4c3e59f5fe8f1af0", "substeps": [], "sec": {"exp": "<p>Dự án quản lý điểm kết hợp input/output, vector, hàm, tìm kiếm, validation và test thành một chương trình nhỏ có mục tiêu cụ thể.</p>", "ex": "<p>Bản tối thiểu: thêm sinh viên, liệt kê, tính trung bình và tìm theo mã. Mỗi chức năng có input và kết quả mong đợi ghi trong test case.</p>", "clar": "<p>Đừng thêm GUI/database trước khi các thao tác cốt lõi đúng. Mã sinh viên trùng, danh sách rỗng và mã không tồn tại là các ca cần định nghĩa.</p>", "ext": "<p>Sau khi ổn định, thêm lưu file như một phiên bản riêng, có test cho file trống và file hỏng.</p>", "check": "<p>Hãy mô tả ba chức năng MVP và ba chức năng chưa làm trong phiên bản đầu.</p>", "sync": "<ul>\n<li><strong>Yêu cầu:</strong> thêm/xem/tìm sinh viên; tính trung bình/min/max; kiểm tra dữ liệu; lưu/tải file; chia hàm; README ngắn.</li>\n<li><strong>Phạm vi không bắt buộc:</strong> giao diện đồ họa, mạng, database.</li>\n<li><strong>Đạt khi:</strong> chức năng chính chạy được, có test tình huống bình thường/lỗi, người học giải thích được toàn bộ luồng dữ liệu.</li>\n</ul>"}}, {"id": "CPP-049", "sort": 49, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C8 — Tổ chức code và OOP", "sem": "HK2", "sup": false, "title": "Chia một chương trình thành nhiều file", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "621df6c09aeb0a45", "substeps": [], "sec": {"exp": "<p>Nhiều file giúp phân chia khai báo, định nghĩa và trách nhiệm. Header thường công bố giao diện; source file chứa triển khai; build phải biên dịch và liên kết các file cần thiết.</p>", "ex": "<p><code class=\"inline-code\">student.hpp</code> khai báo <code class=\"inline-code\">Student</code>; <code class=\"inline-code\">student.cpp</code> định nghĩa hàm; <code class=\"inline-code\">main.cpp</code> sử dụng chúng. Include guard hoặc <code class=\"inline-code\">#pragma once</code> ngăn header bị xử lý lặp trong cùng translation unit theo toolchain phù hợp.</p>", "clar": "<p>Chia file không tự làm kiến trúc tốt; mỗi file nên có lý do rõ. Định nghĩa hàm non-inline trong header có thể gây multiple-definition nếu tổ chức sai.</p>", "ext": "<p>Học build system sau khi hiểu lệnh biên dịch nhiều file thủ công.</p>", "check": "<p>Vì sao project nhiều file cần bước liên kết?</p>", "sync": "<ul>\n<li><strong>Học:</strong> header và source ở mức cần thiết; declaration/definition; include guard hoặc <code class=\"inline-code\">#pragma once</code> theo quy ước giảng dạy.</li>\n<li><strong>Thực hành:</strong> tách phần xử lý sinh viên khỏi <code class=\"inline-code\">main</code>.</li>\n<li><strong>Đạt khi:</strong> project nhiều file biên dịch được và người học giải thích được vai trò mỗi file.</li>\n</ul>"}}, {"id": "CPP-050", "sort": 50, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C8 — Tổ chức code và OOP", "sem": "HK2", "sup": false, "title": "Module, trách nhiệm và dependency", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "737d2ddc1c821fdb", "substeps": [], "sec": {"exp": "<p>Module gom các chức năng liên quan sau một giao diện; dependency là quan hệ sử dụng giữa module. Giảm phụ thuộc làm phần thay đổi ít gây ảnh hưởng dây chuyền.</p>", "ex": "<p>Module <code class=\"inline-code\">StudentRepository</code> chịu trách nhiệm lưu/tải; <code class=\"inline-code\">GradeService</code> tính điểm; phần giao diện gọi chúng thay vì tự đọc file trong mọi chức năng.</p>", "clar": "<p>Không tách module theo số lượng file hay máy móc “một hàm một file”. Trách nhiệm, thay đổi thường đi cùng nhau và mức phụ thuộc mới là tiêu chí.</p>", "ext": "<p>Dependency inversion/architecture layering có thể học sau khi có vài module thực tế.</p>", "check": "<p>Nếu đổi format file, module nào nên chịu thay đổi chính?</p>", "sync": "<ul>\n<li><strong>Học:</strong> phần nào biết phần nào; hạn chế phụ thuộc vòng; <code class=\"inline-code\">main</code> điều phối thay vì chứa mọi logic.</li>\n<li><strong>Thực hành:</strong> vẽ sơ đồ ba module của dự án.</li>\n<li><strong>Đạt khi:</strong> thêm một chức năng mới mà không sửa tuỳ tiện mọi file.</li>\n</ul>"}}, {"id": "CPP-051", "sort": 51, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C8 — Tổ chức code và OOP", "sem": "HK2", "sup": false, "title": "Class và object", "estStatus": "not_estimated", "depStatus": "reviewed", "reqPrereqs": ["CPP-026", "CPP-027", "CPP-028", "CPP-029", "CPP-030", "CPP-043"], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "7a47e3213d4f1a04", "substeps": [], "sec": {"exp": "<p>Class mô tả kiểu có dữ liệu và hành vi; object là một instance cụ thể của class. Dùng class khi cần gắn invariants và hành vi với trạng thái.</p>", "ex": "<p><code class=\"inline-code\">class Book { public: std::string title; };</code> tạo được object <code class=\"inline-code\">Book b;</code>, nhưng đây chỉ là ví dụ sơ bộ chưa bảo vệ dữ liệu.</p>", "clar": "<p>Class không phải lúc nào cũng tốt hơn struct. Nếu chỉ là nhóm dữ liệu thụ động, struct rõ ràng có thể đủ; khi có quy tắc nội tại, class encapsulation hữu ích hơn.</p>", "ext": "<p>Constructor, private fields và methods làm mô hình đối tượng an toàn hơn.</p>", "check": "<p>Phân biệt “kiểu Book” với “object b”.</p>", "sync": "<ul>\n<li><strong>Tiên quyết:</strong> CPP-043, CPP-026–030.</li>\n<li><strong>Học:</strong> class là định nghĩa; object là thực thể; dữ liệu và hàm liên quan đặt cùng nơi.</li>\n<li><strong>Thực hành:</strong> class <code class=\"inline-code\">Book</code> hoặc <code class=\"inline-code\">Student</code> có dữ liệu và thao tác đơn giản.</li>\n<li><strong>Đạt khi:</strong> phân biệt class và object bằng ví dụ, không coi class chỉ là “struct có hàm”.</li>\n</ul>"}}, {"id": "CPP-052", "sort": 52, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C8 — Tổ chức code và OOP", "sem": "HK2", "sup": false, "title": "Encapsulation và invariant", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "e971268544cc638c", "substeps": [], "sec": {"exp": "<p>Encapsulation đặt dữ liệu và thao tác hợp lệ sau giao diện kiểm soát. Invariant là điều kiện phải luôn đúng sau các thao tác công khai.</p>", "ex": "<p>Book có <code class=\"inline-code\">available</code> và phương thức <code class=\"inline-code\">borrow()</code> chỉ đổi sang Borrowed khi trạng thái hiện tại Available; người gọi không tự sửa trạng thái tùy ý.</p>", "clar": "<p>Chỉ ẩn dữ liệu mà không bảo vệ quy tắc chưa đủ. Invariant phải được kiểm tra ở mọi đường thay đổi trạng thái.</p>", "ext": "<p>Tư duy invariant cũng áp dụng cho database constraints và API validation.</p>", "check": "<p>Nêu invariant cho một tài khoản ngân hàng đơn giản.</p>", "sync": "<ul>\n<li><strong>Học:</strong> dữ liệu nội bộ; public interface; đảm bảo trạng thái luôn hợp lệ.</li>\n<li><strong>Thực hành:</strong> ngăn điểm số ngoài khoảng hợp lệ qua phương thức kiểm tra.</li>\n<li><strong>Đạt khi:</strong> giải thích được vì sao không nên cho mọi nơi sửa trực tiếp mọi trường.</li>\n</ul>"}}, {"id": "CPP-053", "sort": 53, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C8 — Tổ chức code và OOP", "sem": "HK2", "sup": false, "title": "Constructor và khởi tạo hợp lệ", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "77f892f6ef664607", "substeps": [], "sec": {"exp": "<p>Constructor thiết lập object ở trạng thái khởi tạo. Khởi tạo trực tiếp member bằng member initializer list thường rõ và tránh tạo trạng thái rỗng không hợp lệ rồi mới sửa.</p>", "ex": "<p><code class=\"inline-code\">Book(std::string title): title_(std::move(title)) {}</code> minh họa khởi tạo member; cần hiểu <code class=\"inline-code\">std::move</code> sâu hơn ở bài tương ứng trước khi dùng trong code production.</p>", "clar": "<p>Constructor không nên âm thầm tạo object vi phạm quy tắc. Nếu dữ liệu đầu vào không hợp lệ, hãy quyết định cách báo lỗi/validation có chủ đích.</p>", "ext": "<p>Constructor có thể enforce invariant; tránh constructor quá nhiều tham số khó phân biệt.</p>", "check": "<p>Vì sao khởi tạo object hợp lệ ngay từ đầu tốt hơn để trường dữ liệu ở trạng thái bất định?</p>", "sync": "<ul>\n<li><strong>Học:</strong> tạo object ở trạng thái tốt; khởi tạo member; tránh object nửa hợp lệ.</li>\n<li><strong>Thực hành:</strong> constructor nhận mã/tên và kiểm tra quy tắc cần thiết.</li>\n<li><strong>Đạt khi:</strong> mọi object mới tạo có trạng thái được định nghĩa rõ.</li>\n</ul>"}}, {"id": "CPP-054", "sort": 54, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C8 — Tổ chức code và OOP", "sem": "HK2", "sup": false, "title": "Method `const`, `static` và interface căn bản", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "01ebc8856e376255", "substeps": [{"substep_id": "CPP-054.part-1", "title": "part-1: const member functions", "check": "Ví dụ ngắn cho hàm đọc trạng thái không làm đổi dữ liệu (const ở cuối chữ ký)."}, {"substep_id": "CPP-054.part-2", "title": "part-2: static members", "check": "Phân biệt member gắn với class và member gắn với từng object."}, {"substep_id": "CPP-054.part-3", "title": "part-3: interface/design decisions", "check": "Thiết kế public interface nhỏ, rõ; không thêm static theo thói quen."}], "sec": {"exp": "<p><code class=\"inline-code\">const</code> method cam kết không sửa trạng thái quan sát được của object qua <code class=\"inline-code\">this</code>; <code class=\"inline-code\">static</code> member thuộc về lớp thay vì một object riêng. Interface là tập hành vi công khai mà caller sử dụng.</p>", "ex": "<p><code class=\"inline-code\">int size() const</code> có thể hỏi kích thước mà không thay đổi object; <code class=\"inline-code\">static int countCreated</code> nếu được thiết kế đúng có thể theo dõi số object trong lớp.</p>", "clar": "<p><code class=\"inline-code\">const</code> không có nghĩa mọi thứ mà method gọi đều bất biến trong mọi nghĩa; mutable/external state có chi tiết riêng. Static state chia sẻ nên cần thận trọng, nhất là đa luồng.</p>", "ext": "<p>Ưu tiên interface nhỏ, rõ; tránh thêm static global chỉ để chia sẻ dữ liệu tiện tay.</p>", "check": "<p>Method dùng để đọc trạng thái object nên thường có từ khóa gì ở cuối chữ ký?</p>", "sync": "<ul>\n<li><strong>Học:</strong> hàm không sửa trạng thái; member liên quan đến class; dùng vừa đủ.</li>\n<li><strong>Thực hành:</strong> method tính điểm trung bình không làm đổi dữ liệu.</li>\n<li><strong>Đạt khi:</strong> chọn đúng method đọc-only và không thêm <code class=\"inline-code\">static</code> theo thói quen.</li>\n</ul>"}}, {"id": "CPP-055", "sort": 55, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C8 — Tổ chức code và OOP", "sem": "HK2", "sup": false, "title": "Composition trước inheritance", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f4f0774f992e198e", "substeps": [], "sec": {"exp": "<p>Composition nghĩa là một object chứa/sử dụng object khác như thành phần; inheritance biểu đạt quan hệ “is-a” khi mô hình thật sự có thể thay thế cho kiểu cha. Composition thường linh hoạt hơn cho tái sử dụng.</p>", "ex": "<p><code class=\"inline-code\">Library</code> chứa <code class=\"inline-code\">vector&lt;Book&gt;</code> là composition: thư viện có các sách. Không nên tạo <code class=\"inline-code\">Library : public Book</code> vì “thư viện là một quyển sách” không đúng mô hình.</p>", "clar": "<p>Inheritance chỉ để chia sẻ code có thể dẫn tới mô hình sai và coupling mạnh. Nếu không cần đa hình kiểu cha, composition thường đơn giản hơn.</p>", "ext": "<p>Dependency injection sau này cho phép thay thành phần bằng implementation khác mà không cần kế thừa sâu.</p>", "check": "<p>Hãy phân biệt quan hệ “has-a” và “is-a” bằng ví dụ.</p>", "sync": "<ul>\n<li><strong>Học:</strong> một object chứa/sử dụng object khác; quan hệ “có một” và “là một”.</li>\n<li><strong>Thực hành:</strong> thư viện có danh sách sách; sinh viên có thông tin liên quan.</li>\n<li><strong>Đạt khi:</strong> mô hình được quan hệ đơn giản và giải thích lựa chọn.</li>\n</ul>"}}, {"id": "CPP-056", "sort": 56, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C8 — Tổ chức code và OOP", "sem": "HK2", "sup": false, "title": "Inheritance và polymorphism nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "9856dbd3ee4611e0", "substeps": [], "sec": {"exp": "<p>Inheritance tạo quan hệ kiểu dẫn xuất–cơ sở; polymorphism cho phép gọi cùng interface nhưng hành vi phụ thuộc loại thực tế của object, thường qua virtual methods.</p>", "ex": "<p><code class=\"inline-code\">Shape</code> có <code class=\"inline-code\">virtual double area() const = 0;</code>, <code class=\"inline-code\">Circle</code> triển khai area. Gọi qua <code class=\"inline-code\">Shape&amp;</code> có thể chạy implementation của Circle khi dispatch ảo đúng.</p>", "clar": "<p>Đối tượng polymorphic thường cần destructor ảo nếu bị xóa qua pointer tới base. Dùng kế thừa chỉ khi substitutability hợp lý; không áp dụng chỉ để “đỡ viết code”.</p>", "ext": "<p>Học slicing, ownership và interface abstract sau khi hiểu object/lifetime.</p>", "check": "<p>Vì sao Circle có thể được dùng ở nơi mong đợi Shape, còn Library không thể là Book?</p>", "sync": "<ul>\n<li><strong>Điều kiện:</strong> chỉ học khi class, constructor và composition đã vững.</li>\n<li><strong>Học:</strong> quan hệ kế thừa; hàm virtual/override ở ví dụ nhỏ; rủi ro thiết kế quá sâu.</li>\n<li><strong>Thực hành:</strong> mô hình hai loại thông báo hoặc tài khoản có hành vi chung.</li>\n<li><strong>Đạt khi:</strong> biết đây là công cụ có điều kiện, không áp dụng inheritance cho mọi quan hệ.</li>\n</ul>"}}, {"id": "CPP-057", "sort": 57, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C8 — Tổ chức code và OOP", "sem": "HK2", "sup": false, "title": "Vector chứa object và tách nghiệp vụ", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "2cd723a7414629d5", "substeps": [], "sec": {"exp": "<p>Container chứa object cho phép quản lý nhiều thực thể cùng kiểu và áp dụng thao tác chung. Tách nghiệp vụ khỏi lưu trữ và giao diện giúp mỗi phần dễ test.</p>", "ex": "<p><code class=\"inline-code\">vector&lt;Book&gt; books</code>; hàm <code class=\"inline-code\">findBookById</code> tìm theo mã; chức năng “mượn sách” kiểm tra trạng thái trước khi cập nhật.</p>", "clar": "<p>Nếu lấy reference tới phần tử vector rồi push thêm làm vector reallocate, reference có thể mất hiệu lực. Tránh giữ reference lâu qua thao tác có khả năng thay đổi container.</p>", "ext": "<p>Khi cần ownership đa hình phức tạp, cân nhắc container smart pointer sau khi nắm lifetime.</p>", "check": "<p>Tại sao nên đặt quy tắc mượn/trả trong hàm nghiệp vụ thay vì lặp lại ở nhiều menu?</p>", "sync": "<ul>\n<li><strong>Học:</strong> danh sách object; hàm quản lý collection; tránh nhồi tất cả vào class duy nhất.</li>\n<li><strong>Thực hành:</strong> thêm/tìm/cập nhật sách trong hệ thống quản lý thư viện.</li>\n<li><strong>Đạt khi:</strong> thêm chức năng mà logic dữ liệu và giao diện dòng lệnh không dính chặt quá mức.</li>\n</ul>"}}, {"id": "CPP-058", "sort": 58, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C8 — Tổ chức code và OOP", "sem": "HK2", "sup": false, "title": "Dự án 2: quản lý thư viện", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "b76079b572d26a87", "substeps": [], "sec": {"exp": "<p>Quản lý thư viện ghép model sách, các thao tác nghiệp vụ, tìm kiếm, lưu dữ liệu và test. Mục tiêu là code dễ mở rộng quy tắc hơn dự án quản lý điểm đầu tiên.</p>", "ex": "<p>MVP: thêm sách có mã duy nhất, liệt kê, tìm theo mã, mượn/trả và lưu file. Test mượn sách đã mượn phải từ chối.</p>", "clar": "<p>Viết quy tắc nghiệp vụ trước: mã có duy nhất không, sách mất xử lý thế nào, có cho xóa sách đang mượn không. Không thêm inheritance nếu composition đủ.</p>", "ext": "<p>Sơ đồ class/module và quyết định thiết kế ngắn giúp thấy rõ trade-offs.</p>", "check": "<p>Chọn ba invariant cho Book/Library và cách test mỗi invariant.</p>", "sync": "<ul>\n<li><strong>Yêu cầu:</strong> sách, người mượn hoặc trạng thái mượn; thêm/tìm/cập nhật; lưu file; kiểm tra trạng thái hợp lệ; menu rõ ràng; README; lịch sử Git có ý nghĩa.</li>\n<li><strong>Đạt khi:</strong> ít nhất 5 ca test nghiệp vụ; không thể mượn một sách đang không sẵn có nếu rule dự án cấm; người học giải thích được cấu trúc lớp và giới hạn hiện tại.</li>\n</ul>"}}, {"id": "CPP-059", "sort": 59, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C9 — STL, cấu trúc dữ liệu và thuật toán", "sem": "HK3", "sup": false, "title": "`std::vector`, iterator và range-based loop", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "a8bc38b4da83a4df", "substeps": [], "sec": {"exp": "<p>Iterator là đối tượng chỉ vị trí trong container và cho phép duyệt theo giao thức chuẩn. Range-based for đơn giản hóa duyệt mọi phần tử; <code class=\"inline-code\">const auto&amp;</code> đọc mà không copy khi phù hợp.</p>", "ex": "<p><code class=\"inline-code\">for (const auto&amp; x : v) { std::cout &lt;&lt; x; }</code> đọc từng phần tử vector mà không sao chép từng giá trị.</p>", "clar": "<p>Iterator có thể bị invalidated khi container thay đổi; quy tắc khác nhau theo container. Không dùng iterator sau khi thao tác làm nó mất hiệu lực.</p>", "ext": "<p>Học iterator categories và algorithms sau khi hiểu duyệt cơ bản.</p>", "check": "<p>Với vòng lặp chỉ đọc vector lớn, vì sao <code class=\"inline-code\">const auto&amp;</code> có thể hợp lý?</p>", "sync": "<ul>\n<li><strong>Học:</strong> duyệt collection; iterator là cách trỏ qua phần tử; dùng cú pháp đơn giản và an toàn.</li>\n<li><strong>Thực hành:</strong> lọc danh sách điểm bằng vòng lặp và range-based loop.</li>\n<li><strong>Đạt khi:</strong> hiểu <code class=\"inline-code\">size()</code> là số phần tử và không dùng chỉ số vượt biên.</li>\n</ul>"}}, {"id": "CPP-060", "sort": 60, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C9 — STL, cấu trúc dữ liệu và thuật toán", "sem": "HK3", "sup": false, "title": "`<algorithm>`: `sort`, `find`, `count`, `min_element`", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "51b8816014381c81", "substeps": [], "sec": {"exp": "<p>Các thuật toán chuẩn tái sử dụng thao tác phổ biến mà không phải tự viết vòng lặp mỗi lần. Chọn iterator range đúng, thường <code class=\"inline-code\">[begin, end)</code> gồm begin nhưng không gồm end.</p>", "ex": "<p><code class=\"inline-code\">std::find(v.begin(), v.end(), target)</code> trả iterator tới mục đầu tiên bằng target hoặc <code class=\"inline-code\">v.end()</code> nếu không thấy; <code class=\"inline-code\">count</code> đếm số lần xuất hiện.</p>", "clar": "<p><code class=\"inline-code\">sort</code> yêu cầu comparator tạo thứ tự phù hợp; <code class=\"inline-code\">min_element</code> trả iterator, không phải trực tiếp trả giá trị. Kiểm tra range rỗng trước khi dereference.</p>", "ext": "<p>Lambda cho comparator giúp mô tả tiêu chí riêng; hãy học sau khi hiểu hàm/iterator.</p>", "check": "<p><code class=\"inline-code\">find</code> báo không tìm thấy bằng cách nào?</p>", "sync": "<ul>\n<li><strong>Học:</strong> thư viện chuẩn thay cho tự viết lại mọi thuật toán; điều kiện sử dụng; comparator đơn giản.</li>\n<li><strong>Thực hành:</strong> sắp xếp sách theo tên/điểm theo thứ tự.</li>\n<li><strong>Đạt khi:</strong> chọn đúng thuật toán chuẩn và viết test cho kết quả.</li>\n</ul>"}}, {"id": "CPP-061", "sort": 61, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C9 — STL, cấu trúc dữ liệu và thuật toán", "sem": "HK3", "sup": false, "title": "`map`, `set`, `unordered_map`", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "19e7ea442848c945", "substeps": [{"substep_id": "CPP-061.part-1", "title": "part-1: std::map", "check": "Ánh xạ key→value giữ thứ tự key theo comparator."}, {"substep_id": "CPP-061.part-2", "title": "part-2: std::set", "check": "Lưu tập các key duy nhất có thứ tự."}, {"substep_id": "CPP-061.part-3", "title": "part-3: std::unordered_map và hashing trade-offs", "check": "So sánh uniqueness, ordering, lookup assumptions và hành vi chèn ngầm của operator[]."}], "sec": {"exp": "<p><code class=\"inline-code\">map</code> ánh xạ key→value theo thứ tự key; <code class=\"inline-code\">set</code> lưu các key duy nhất có thứ tự; <code class=\"inline-code\">unordered_map</code> dùng hashing và không cam kết thứ tự duyệt.</p>", "ex": "<p>Đếm số lỗi theo loại: <code class=\"inline-code\">unordered_map&lt;string,int&gt; counts; ++counts[\"WARN\"];</code>. Nếu cần khóa duyệt theo thứ tự, <code class=\"inline-code\">map</code> có thể phù hợp hơn.</p>", "clar": "<p>Hash container thường có chi phí trung bình gần O(1) cho thao tác cơ bản, nhưng trường hợp xấu có thể khác; <code class=\"inline-code\">operator[]</code> có thể chèn key mặc định khi chưa có.</p>", "ext": "<p>Chọn container theo truy vấn, thứ tự, unique-key và tính chất hiệu năng; không chỉ theo thói quen.</p>", "check": "<p>Muốn duyệt key theo thứ tự tăng, <code class=\"inline-code\">map</code> hay <code class=\"inline-code\">unordered_map</code> phù hợp hơn?</p>", "sync": "<ul>\n<li><strong>Học:</strong> key-value, tập phần tử duy nhất, hash table trực quan; so sánh khi nào cần tra cứu nhanh/giữ thứ tự.</li>\n<li><strong>Thực hành:</strong> đếm tần suất từ hoặc nhóm lỗi trong log.</li>\n<li><strong>Đạt khi:</strong> nêu được trade-off căn bản chứ không chọn cấu trúc theo cảm tính.</li>\n</ul>"}}, {"id": "CPP-062", "sort": 62, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C9 — STL, cấu trúc dữ liệu và thuật toán", "sem": "HK3", "sup": false, "title": "Stack và queue qua bài toán", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "5a8cfe0f51046b50", "substeps": [], "sec": {"exp": "<p>Stack là LIFO (vào sau ra trước); queue là FIFO (vào trước ra trước). Cấu trúc này mô hình hóa thứ tự xử lý, không chỉ là loại container.</p>", "ex": "<p>Stack: mở ngoặc rồi đóng ngoặc tương ứng; queue: khách được phục vụ theo thứ tự đến.</p>", "clar": "<p>Pop trên container rỗng là lỗi logic/tiền điều kiện không hợp lệ; kiểm tra empty trước khi đọc top/front hoặc lấy phần tử.</p>", "ext": "<p>Stack hỗ trợ call stack/DFS; queue hỗ trợ BFS và xử lý công việc.</p>", "check": "<p>Cấu trúc nào phù hợp hàng chờ quầy thanh toán và cấu trúc nào phù hợp undo gần nhất?</p>", "sync": "<ul>\n<li><strong>Học:</strong> LIFO/FIFO; thao tác chính; ví dụ undo, hàng đợi tác vụ.</li>\n<li><strong>Thực hành:</strong> mô phỏng hàng chờ hoặc kiểm tra ngoặc bằng stack ở mức phù hợp.</li>\n<li><strong>Đạt khi:</strong> chọn cấu trúc dựa trên hành vi cần thiết.</li>\n</ul>"}}, {"id": "CPP-063", "sort": 63, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C9 — STL, cấu trúc dữ liệu và thuật toán", "sem": "HK3", "sup": false, "title": "Đệ quy (recursion) từ trace đến code", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "0953a9ca6a32a027", "substeps": [], "sec": {"exp": "<p>Đệ quy là hàm tự gọi chính nó để xử lý phiên bản nhỏ hơn của bài toán. Cần base case dừng và recursive case làm bài toán tiến về base case.</p>", "ex": "<p><code class=\"inline-code\">factorial(n)</code>: base case <code class=\"inline-code\">n&lt;=1</code> trả 1 theo định nghĩa bài học; ngược lại trả <code class=\"inline-code\">n * factorial(n-1)</code>. Chỉ dùng n không âm trong ví dụ.</p>", "clar": "<p>Thiếu base case hoặc không giảm n có thể đệ quy mãi đến lỗi stack. Bài toán lớn không phải lúc nào cũng thích hợp cho recursion.</p>", "ext": "<p>Trace call stack trước khi code; so sánh iterative và recursive khi quan trọng.</p>", "check": "<p>Với factorial(3), thứ tự lời gọi và giá trị trả về là gì?</p>", "sync": "<ul>\n<li><strong>Điều kiện:</strong> hàm, điều kiện và vòng lặp đã vững.</li>\n<li><strong>Học:</strong> base case, recursive case, mỗi lời gọi có trạng thái riêng; nguy cơ thiếu base case.</li>\n<li><strong>Thực hành:</strong> đếm ngược, tổng dãy, duyệt cây mẫu sau này.</li>\n<li><strong>Đạt khi:</strong> vẽ được chuỗi lời gọi và giải thích điều kiện dừng.</li>\n</ul>"}}, {"id": "CPP-064", "sort": 64, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C9 — STL, cấu trúc dữ liệu và thuật toán", "sem": "HK3", "sup": false, "title": "Độ phức tạp Big-O nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "74e8d8221c6adbfd", "substeps": [], "sec": {"exp": "<p>Big-O mô tả tốc độ tăng của lượng công việc/bộ nhớ theo kích thước input, bỏ qua hệ số và chi tiết bậc thấp khi xét tăng trưởng tiệm cận.</p>", "ex": "<p>Duyệt n phần tử là O(n); hai vòng lặp độc lập lồng nhau n×n thường O(n²); chia phạm vi đôi mỗi lượt cho mô hình O(log n).</p>", "clar": "<p>Big-O không cho biết chính xác thời gian bằng giây, và O(n) chưa chắc nhanh hơn mọi O(log n) trên input rất nhỏ do hằng số. Xác định n là kích thước nào.</p>", "ext": "<p>Phân biệt worst-case, average-case và amortized analysis ở thời điểm phù hợp.</p>", "check": "<p>Cho ba ví dụ code, xác định số lần lặp tăng tuyến tính, bậc hai hay logarithmic.</p>", "sync": "<ul>\n<li><strong>Học:</strong> đo xu hướng tăng của thao tác theo n; O(1), O(n), O(n²), O(log n) ở ví dụ trực quan.</li>\n<li><strong>Thực hành:</strong> đếm số lần chạy của vòng lặp đơn/ lồng nhau và tìm kiếm tuyến tính.</li>\n<li><strong>Đạt khi:</strong> so sánh được hai cách làm và hiểu Big-O không phải thời gian giây chính xác.</li>\n</ul>"}}, {"id": "CPP-065", "sort": 65, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C9 — STL, cấu trúc dữ liệu và thuật toán", "sem": "HK3", "sup": false, "title": "Binary search và tiền điều kiện", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f632e462229053fc", "substeps": [], "sec": {"exp": "<p>Binary search loại bỏ khoảng tìm kiếm theo một nửa mỗi bước, nhưng yêu cầu thứ tự/điều kiện đơn điệu phù hợp. Nó tìm trên vùng đã sắp xếp hoặc miền predicate đơn điệu.</p>", "ex": "<p>Dãy <code class=\"inline-code\">[2,4,7,9,12]</code>: tìm 9, kiểm tra mid=7; vì 9 lớn hơn 7, bỏ nửa trái; tiếp tục bên phải.</p>", "clar": "<p>Dùng binary search trên dãy chưa sắp xếp không đúng. Phải nhất quán cập nhật biên và tránh off-by-one; thuật toán có thể tìm bất kỳ vị trí khớp nếu có duplicate, trừ khi code xác định lower/upper bound.</p>", "ext": "<p>Trong C++ ưu tiên kiểm tra <code class=\"inline-code\">std::binary_search</code>, <code class=\"inline-code\">lower_bound</code> sau khi hiểu điều kiện.</p>", "check": "<p>Điều gì đảm bảo ta được quyền bỏ nửa dãy sau mỗi so sánh?</p>", "sync": "<ul>\n<li><strong>Điều kiện:</strong> mảng/vector, vòng lặp và thứ tự tăng/giảm.</li>\n<li><strong>Học:</strong> chỉ áp dụng khi dữ liệu có thứ tự thích hợp; thu hẹp khoảng tìm kiếm.</li>\n<li><strong>Thực hành:</strong> trace từng bước trên dãy số đã sắp xếp; so sánh với linear search.</li>\n<li><strong>Đạt khi:</strong> giải thích điều kiện tiên quyết và test trường hợp không tìm thấy.</li>\n</ul>"}}, {"id": "CPP-066", "sort": 66, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C9 — STL, cấu trúc dữ liệu và thuật toán", "sem": "HK3", "sup": false, "title": "Pointer từ trực quan đến sử dụng có giới hạn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-068"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "00022e57bb7a313c", "substeps": [], "sec": {"exp": "<p>Pointer lưu địa chỉ tới một object hoặc biểu thị không có object bằng null pointer. Dereference (<code class=\"inline-code\">*p</code>) truy cập object được trỏ tới, chỉ hợp lệ khi pointer trỏ tới object còn sống và phù hợp.</p>", "ex": "<p><code class=\"inline-code\">int x=7; int<em> p=&amp;x;</code> nghĩa p giữ địa chỉ của x; <code class=\"inline-code\"></em>p</code> đọc giá trị 7. <code class=\"inline-code\">int* p=nullptr;</code> phải được kiểm tra trước khi dereference.</p>", "clar": "<p>Pointer có thể dangling, null hoặc trỏ sai; địa chỉ không tự đảm bảo object còn sống. Không dùng raw pointer như mặc định để quản lý ownership trong code hiện đại.</p>", "ext": "<p>Reference, smart pointer và span/view có semantics khác nhau; học đúng mục đích thay vì chỉ nhớ cú pháp <code class=\"inline-code\">*</code> và <code class=\"inline-code\">&amp;</code>.</p>", "check": "<p>Sự khác nhau giữa giá trị <code class=\"inline-code\">p</code>, địa chỉ <code class=\"inline-code\">&amp;x</code> và giá trị <code class=\"inline-code\">*p</code> là gì?</p>", "sync": "<ul>\n<li><strong>Điều kiện:</strong> biến, địa chỉ, reference và lifetime cơ bản.</li>\n<li><strong>Học:</strong> địa chỉ bộ nhớ và giá trị được lưu; <code class=\"inline-code\">&amp;</code> và <code class=\"inline-code\">*</code> có ngữ cảnh khác nhau; null; dangling pointer là gì.</li>\n<li><strong>Thực hành:</strong> đọc ví dụ rất nhỏ có pointer; chỉ ra pointer nào hợp lệ/không hợp lệ.</li>\n<li><strong>Đạt khi:</strong> mô tả được rủi ro; không yêu cầu quản lý <code class=\"inline-code\">new/delete</code> thủ công như cách mặc định.</li>\n</ul>"}}, {"id": "CPP-067", "sort": 67, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C9 — STL, cấu trúc dữ liệu và thuật toán", "sem": "HK3", "sup": false, "title": "Stack, heap, lifetime và RAII", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["CPP-068"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "e223277fead859d5", "substeps": [{"substep_id": "CPP-067.part-1", "title": "part-1: lifetime & storage duration", "check": "Hiểu khi nào object được tạo/hủy và không giữ tham chiếu tới object đã hết đời."}, {"substep_id": "CPP-067.part-2", "title": "part-2: ownership", "check": "Xác định rõ thành phần nào chịu trách nhiệm giải phóng tài nguyên."}, {"substep_id": "CPP-067.part-3", "title": "part-3: RAII", "check": "Gắn vòng đời tài nguyên (bộ nhớ, file, lock) vào destructor của object chuẩn."}], "sec": {"exp": "<p>Stack và heap mô tả các vùng/cơ chế quản lý bộ nhớ theo mô hình phổ biến; lifetime phụ thuộc object/storage duration. RAII gắn quyền sở hữu tài nguyên vào lifetime object để tự giải phóng trong destructor.</p>", "ex": "<p>Một <code class=\"inline-code\">std::vector&lt;int&gt;</code> local được hủy khi ra khỏi scope và tự giải phóng phần bộ nhớ mình quản lý. Không cần gọi <code class=\"inline-code\">free</code> thủ công.</p>", "clar": "<p>Không phải mọi biến local đều “nằm trên stack” theo cam kết tuyệt đối của chuẩn; stack/heap là mô hình triển khai phổ biến. Bug xảy ra khi dùng resource sau khi lifetime kết thúc hoặc quên giải phóng tài nguyên thủ công.</p>", "ext": "<p>RAII áp dụng cho file, lock, socket và nhiều tài nguyên khác, không riêng memory.</p>", "check": "<p>Vì sao RAII an toàn hơn tự gọi giải phóng ở nhiều nhánh return?</p>", "sync": "<ul>\n<li><strong>Học:</strong> thời gian sống của object; tài nguyên phải được giải phóng; RAII gắn vòng đời tài nguyên với object.</li>\n<li><strong>Thực hành:</strong> mô tả khi object local được tạo/hủy; hiểu ý niệm quản lý file/tài nguyên qua object chuẩn.</li>\n<li><strong>Đạt khi:</strong> nhận ra vì sao lifetime quan trọng và không giữ tham chiếu đến object đã hết đời.</li>\n</ul>"}}, {"id": "CPP-068", "sort": 68, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C9 — STL, cấu trúc dữ liệu và thuật toán", "sem": "HK3", "sup": false, "title": "Smart pointer ở mức khái niệm", "estStatus": "not_estimated", "depStatus": "reviewed", "reqPrereqs": ["CPP-066", "CPP-067"], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "a94dc497bd1aa7b4", "substeps": [], "sec": {"exp": "<p>Smart pointer diễn đạt ownership: <code class=\"inline-code\">unique_ptr</code> cho một chủ sở hữu độc quyền; <code class=\"inline-code\">shared_ptr</code> chia sẻ ownership qua reference counting; <code class=\"inline-code\">weak_ptr</code> quan sát ownership chia sẻ mà không kéo dài lifetime.</p>", "ex": "<p><code class=\"inline-code\">auto p = std::make_unique&lt;Book&gt;();</code> sở hữu một Book; không copy unique_ptr, nhưng có thể move ownership.</p>", "clar": "<p>Dùng shared_ptr không phải lựa chọn mặc định cho mọi pointer; vòng tham chiếu shared_ptr có thể giữ object sống mãi. Raw pointer/reference thường dùng để quan sát không sở hữu khi lifetime đã được đảm bảo.</p>", "ext": "<p>Bắt đầu với <code class=\"inline-code\">unique_ptr</code>; chọn shared ownership khi mô hình thực sự cần nhiều chủ sở hữu.</p>", "check": "<p>Loại smart pointer nào biểu diễn một chủ sở hữu duy nhất?</p>", "sync": "<ul>\n<li><strong>Điều kiện:</strong> CPP-066–067.</li>\n<li><strong>Học:</strong> <code class=\"inline-code\">unique_ptr</code> và <code class=\"inline-code\">shared_ptr</code> giải quyết các mô hình sở hữu khác nhau; không lạm dụng <code class=\"inline-code\">shared_ptr</code>.</li>\n<li><strong>Thực hành:</strong> đọc/giải thích ví dụ nhỏ; nếu course chưa cần thì chỉ cần hiểu khái niệm.</li>\n<li><strong>Đạt khi:</strong> biết ưu tiên quản lý tài nguyên tự động và có thể giải thích ownership cơ bản.</li>\n</ul>"}}, {"id": "CPP-069", "sort": 69, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C9 — STL, cấu trúc dữ liệu và thuật toán", "sem": "HK3", "sup": false, "title": "Exception và báo lỗi phù hợp", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "466aa986dc13483b", "substeps": [], "sec": {"exp": "<p>Exception truyền tín hiệu thất bại ngoài đường trả kết quả bình thường. Dùng exception cho lỗi/điều kiện bất thường phù hợp; với validation thường xuyên hoặc input người dùng, kết quả tường minh có thể rõ hơn.</p>", "ex": "<p>Mở file thất bại: chương trình có thể trả trạng thái lỗi có mô tả; code dùng API ném exception thì cần catch ở tầng thích hợp hoặc để exception truyền tới nơi có thể xử lý.</p>", "clar": "<p>Không nuốt exception bằng catch rỗng. Khi exception bị ném, stack unwinding hủy các object RAII trong phạm vi rời khỏi.</p>", "ext": "<p><code class=\"inline-code\">expected</code>/result types có thể biểu diễn lỗi tường minh trong thiết kế hiện đại, nhưng không phải tính năng thư viện chuẩn thống nhất ở mọi chuẩn C++.</p>", "check": "<p>Vì sao <code class=\"inline-code\">catch (...) {}</code> rồi giả vờ thành công là nguy hiểm?</p>", "sync": "<ul>\n<li><strong>Học:</strong> lỗi bất thường; exception không thay thế mọi kiểm tra input; không nuốt lỗi im lặng.</li>\n<li><strong>Thực hành:</strong> xử lý file không mở được hoặc phân tích dữ liệu lỗi bằng cách phù hợp với bài học.</li>\n<li><strong>Đạt khi:</strong> đường đi lỗi có thông tin hữu ích và tài nguyên vẫn được quản lý đúng.</li>\n</ul>"}}, {"id": "CPP-070", "sort": 70, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C9 — STL, cấu trúc dữ liệu và thuật toán", "sem": "HK3", "sup": false, "title": "Template và generic code nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "4dcc65c9573c3d63", "substeps": [], "sec": {"exp": "<p>Template cho phép viết hàm/kiểu làm việc với nhiều kiểu dữ liệu khi các kiểu đáp ứng những thao tác cần thiết. Compiler tạo specialization phù hợp khi được dùng.</p>", "ex": "<p><code class=\"inline-code\">template&lt;class T&gt; T larger(T a,T b){ return a &lt; b ? b : a; }</code> có thể dùng cho kiểu có phép so sánh <code class=\"inline-code\">&lt;</code> hợp lệ.</p>", "clar": "<p>Template không có nghĩa “chấp nhận mọi kiểu”; thao tác bên trong vẫn phải hợp lệ. Lỗi template có thể dài và khó đọc, nên học sau khi nắm hàm và kiểu dữ liệu.</p>", "ext": "<p>Concepts trong C++20 giúp ràng buộc yêu cầu kiểu rõ hơn; là mở rộng, không phải điều kiện cơ bản.</p>", "check": "<p>Một template hàm có thể tổng quát theo kiểu nào và giới hạn bởi điều gì?</p>", "sync": "<ul>\n<li><strong>Điều kiện:</strong> hàm, kiểu dữ liệu và STL đã vững.</li>\n<li><strong>Học:</strong> ý tưởng tái sử dụng logic cho nhiều kiểu; đọc template của STL; chưa cần template metaprogramming.</li>\n<li><strong>Thực hành:</strong> đọc một hàm template đơn giản và dự đoán kiểu đầu vào/đầu ra.</li>\n<li><strong>Đạt khi:</strong> hiểu mục tiêu generic programming mà không cần viết template nâng cao.</li>\n</ul>"}}, {"id": "CPP-071", "sort": 71, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C9 — STL, cấu trúc dữ liệu và thuật toán", "sem": "HK3", "sup": false, "title": "Warning, formatter, build và code review cơ bản", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "0c33b478511b3a1e", "substeps": [], "sec": {"exp": "<p>Compiler warning chỉ ra khả năng lỗi hoặc code đáng ngờ; formatter thống nhất phong cách; build tái lập; code review kiểm tra chất lượng trước khi tích hợp.</p>", "ex": "<p>Bật warning thích hợp và xử lý cảnh báo conversion; chạy formatter; gửi diff nhỏ để người khác review thay vì một commit rất lớn.</p>", "clar": "<p>Không phải mọi warning đều vô hại, nhưng warning cũng không tự chứng minh có bug. Không tắt hàng loạt warning để làm build “xanh” mà không hiểu nguyên nhân.</p>", "ext": "<p>CI có thể tự build/test/format check khi project trưởng thành.</p>", "check": "<p>Trước khi merge, bạn sẽ kiểm tra những gì ngoài chuyện code biên dịch?</p>", "sync": "<ul>\n<li><strong>Học:</strong> cảnh báo compiler; quy ước style; diff; build lặp lại được; không tắt cảnh báo chỉ để hết đỏ.</li>\n<li><strong>Thực hành:</strong> bật cảnh báo phù hợp với môi trường, sửa warning đơn giản và xem diff.</li>\n<li><strong>Đạt khi:</strong> project build từ hướng dẫn README và thay đổi được ghi nhận rõ.</li>\n</ul>"}}, {"id": "CPP-072", "sort": 72, "pfx": "CPP", "subj": "CPP", "subjName": "C++ Từ Số 0 Đến Nền Tảng Vững", "cat": "Core Programming", "uitMap": "IT001 (Nhập môn lập trình) / IT002 (OOP)", "part": "PHẦN A — C++ TỪ SỐ 0 ĐẾN NỀN TẢNG LẬP TRÌNH VỮNG", "stage": "Giai đoạn C9 — STL, cấu trúc dữ liệu và thuật toán", "sem": "HK3", "sup": false, "title": "Dự án 3: log analyzer C++", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "09406e6e9894c763", "substeps": [], "sec": {"exp": "<p>Log analyzer nhận file văn bản, parse sự kiện, tổng hợp số liệu và tạo báo cáo; dự án yêu cầu kết hợp độ đúng, xử lý input lỗi và đo hiệu năng có kiểm soát.</p>", "ex": "<p>Với log có <code class=\"inline-code\">timestamp level message</code>, đếm mỗi mức INFO/WARN/ERROR bằng map; bỏ hoặc ghi nhận dòng thiếu trường theo quy tắc đã tài liệu hóa.</p>", "clar": "<p>Định dạng log phải được mô tả; benchmark cần cùng input, đo lặp lại và tránh kết luận từ một lần chạy. Bắt buộc báo lỗi file không mở được và dữ liệu xấu.</p>", "ext": "<p>Có thể thêm lọc theo thời gian, top message và so sánh vector-scan với unordered_map khi nền tảng đã vững.</p>", "check": "<p>Ngoài output đúng, hai tiêu chí nào chứng tỏ analyzer có chất lượng?</p>", "sync": "<ul>\n<li><strong>Yêu cầu:</strong> đọc file log; xử lý dòng lỗi định dạng; nhóm lỗi theo loại/endpoint; tính số lượng; tìm top mục phổ biến; test parser; đo thời gian trên nhiều kích thước dữ liệu; ghi cách đo và giới hạn của phép đo.</li>\n<li><strong>Đạt khi:</strong> có thể giải thích cấu trúc dữ liệu được chọn, kết quả đúng qua test và ý nghĩa của số đo hiệu năng.</li>\n<li>Move semantics và rvalue references ở mức vừa sức.</li>\n<li>Templates sâu hơn, concepts, generic constraints.</li>\n</ul>"}}, {"id": "MATH-000", "sort": 73, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "6. Chiến lược học Giải tích khi đang hổng nền tảng", "sem": "HK1", "sup": false, "title": "Bài chẩn đoán nền tảng", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "fe5e493993ede0fe", "substeps": [], "sec": {"exp": "<p>Bài chẩn đoán xác định lỗ hổng chứ không chấm năng lực con người. Làm thử không xem lời giải, ghi cả loại lỗi: số học, biến đổi, đọc đề hay thiếu khái niệm.</p>", "ex": "<p>Chẩn đoán có thể gồm rút gọn phân số, giải <code class=\"inline-code\">2x+3=11</code>, đọc <code class=\"inline-code\">f(2)</code> từ công thức và tính một giới hạn đơn giản nếu đã học.</p>", "clar": "<p>Sai câu do quên kiến thức khác với sai do bất cẩn; cần ghi lý do thay vì chỉ chép đáp án. Không cần học lại phần đã làm ổn định.</p>", "ext": "<p>Lặp lại các câu tương tự sau vài ngày để kiểm tra khả năng tự nhớ, không chỉ nhớ đáp án.</p>", "check": "<p>Hãy ghi mỗi lỗi vào một nhóm và chọn bài tiên quyết tương ứng.</p>", "sync": "<ul>\n<li><strong>Nhiệm vụ:</strong> 12–15 câu ngắn gồm phân số, dấu âm, lũy thừa, phương trình bậc nhất, phân tích nhân tử, hàm số, góc/lượng giác và đọc đồ thị.</li>\n<li><strong>Đầu ra:</strong> bản đồ lỗi theo nhóm: số học, biến đổi đại số, hàm số, lượng giác.</li>\n<li><strong>Quy tắc:</strong> nếu sai một nhóm, mở bài sửa nhóm đó; không gán nhãn “yếu toán” chung chung.</li>\n<li><strong>Học:</strong> quy đồng, rút gọn, dấu ngoặc và ưu tiên phép tính.</li>\n</ul>"}}, {"id": "MATH-001", "sort": 74, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-A — Đại số tiên quyết", "sem": "HK1", "sup": false, "title": "Phân số, dấu âm và thứ tự phép tính", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-LA-001"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "6f8ede64bf75c201", "substeps": [], "sec": {"exp": "<p>Phân số biểu diễn thương của tử và mẫu với mẫu khác 0. Dấu âm và thứ tự phép toán quyết định kết quả; ưu tiên ngoặc để tránh nhập nhằng.</p>", "ex": "<p><code class=\"inline-code\">-2 + 3×4 = 10</code>, vì nhân trước cộng sau. <code class=\"inline-code\">1/2 + 1/3 = 5/6</code> sau khi quy đồng.</p>", "clar": "<p><code class=\"inline-code\">-(a+b)</code> khác <code class=\"inline-code\">-a+b</code>; chia cho 0 không xác định. Trong biểu thức số học, đừng làm tròn giữa chừng nếu chưa được yêu cầu.</p>", "ext": "<p>Luyện phép toán với phân số và số âm trước khi rút gọn biểu thức có biến.</p>", "check": "<p>Tính <code class=\"inline-code\">-3 + 2×5</code> và giải thích thứ tự thao tác.</p>", "sync": "<ul>\n<li><strong>Học:</strong> quy đồng, rút gọn, dấu ngoặc và ưu tiên phép tính.</li>\n<li><strong>Bài:</strong> 10 biểu thức có phân số/dấu âm; phải ghi các bước trung gian.</li>\n<li><strong>Qua bài:</strong> đúng ít nhất 8/10 và giải thích được một lỗi đã mắc.</li>\n</ul>"}}, {"id": "MATH-002", "sort": 75, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-A — Đại số tiên quyết", "sem": "HK1", "sup": false, "title": "Lũy thừa và căn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "d7b4232cd76a5115", "substeps": [], "sec": {"exp": "<p>Lũy thừa là phép nhân lặp theo số mũ nguyên dương; căn bậc hai là số không âm có bình phương bằng số đã cho trong tập số thực. Quy tắc số mũ có điều kiện áp dụng.</p>", "ex": "<p><code class=\"inline-code\">2^3=8</code>; <code class=\"inline-code\">sqrt(25)=5</code>. <code class=\"inline-code\">x^2=9</code> có hai nghiệm thực <code class=\"inline-code\">x=±3</code>, không chỉ 3.</p>", "clar": "<p><code class=\"inline-code\">(a+b)^2</code> không bằng <code class=\"inline-code\">a^2+b^2</code>; <code class=\"inline-code\">sqrt(x^2)=|x|</code> trên số thực. Với số mũ âm, cần cơ số khác 0.</p>", "ext": "<p>Hiểu quy tắc lũy thừa hỗ trợ rút gọn biểu thức và logarithm.</p>", "check": "<p>Giải thích vì sao <code class=\"inline-code\">sqrt(16)=4</code> nhưng nghiệm của <code class=\"inline-code\">x²=16</code> là ±4.</p>", "sync": "<ul>\n<li><strong>Học:</strong> quy tắc lũy thừa, số mũ âm, căn bậc hai; điều kiện xác định.</li>\n<li><strong>Bài:</strong> đơn giản hóa biểu thức rồi thay giá trị kiểm tra.</li>\n<li><strong>Qua bài:</strong> không áp dụng quy tắc sai điều kiện.</li>\n</ul>"}}, {"id": "MATH-003", "sort": 76, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-A — Đại số tiên quyết", "sem": "HK1", "sup": false, "title": "Biểu thức đại số và phân tích nhân tử", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["MATH-014", "SUP-LA-001"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "805b006cc5c43782", "substeps": [], "sec": {"exp": "<p>Biểu thức đại số mô tả quan hệ bằng biến. Phân tích nhân tử viết một biểu thức thành tích các nhân tử để nhìn thấy nghiệm, rút gọn hoặc xác định điều kiện.</p>", "ex": "<p><code class=\"inline-code\">x²-9=(x-3)(x+3)</code>; <code class=\"inline-code\">2x+6=2(x+3)</code>.</p>", "clar": "<p>Không được chia cả hai vế cho biểu thức có thể bằng 0 mà không xét trường hợp đó. Chỉ khử nhân tử trong phân thức khi điều kiện mẫu cho phép.</p>", "ext": "<p>Factorization là công cụ hữu ích với giới hạn dạng 0/0 và giải phương trình.</p>", "check": "<p>Phân tích <code class=\"inline-code\">x²+5x+6</code> thành nhân tử và kiểm tra bằng khai triển.</p>", "sync": "<ul>\n<li><strong>Học:</strong> khai triển, đặt nhân tử chung, hằng đẳng thức cơ bản, phân tích biểu thức.</li>\n<li><strong>Bài:</strong> đưa bi
