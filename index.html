ểu thức về dạng thuận tiện để rút gọn/giải phương trình.</li>\n<li><strong>Qua bài:</strong> làm được cả chiều khai triển và phân tích ngược.</li>\n</ul>"}}, {"id": "MATH-004", "sort": 77, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-A — Đại số tiên quyết", "sem": "HK1", "sup": false, "title": "Phương trình và bất phương trình bậc nhất", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["MATH-014"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "2ed107abed073c6b", "substeps": [], "sec": {"exp": "<p>Phương trình tìm giá trị khiến hai biểu thức bằng nhau; bất phương trình tìm miền giá trị thỏa điều kiện. Cộng/trừ hai vế giữ chiều; nhân/chia với số âm đảo chiều bất phương trình.</p>", "ex": "<p><code class=\"inline-code\">2x+3=11</code> cho <code class=\"inline-code\">x=4</code>; <code class=\"inline-code\">-2x&lt;6</code> tương đương <code class=\"inline-code\">x&gt;-3</code>.</p>", "clar": "<p>Phải thực hiện cùng phép toán lên hai vế. Không đảo chiều bất phương trình khi chia số dương.</p>", "ext": "<p>Biểu diễn nghiệm trên trục số giúp kiểm tra bất phương trình.</p>", "check": "<p>Giải <code class=\"inline-code\">3x-2≤7</code> và <code class=\"inline-code\">-x&gt;4</code>.</p>", "sync": "<ul>\n<li><strong>Học:</strong> phép biến đổi tương đương, đổi chiều bất đẳng thức khi nhân/chia số âm.</li>\n<li><strong>Bài:</strong> giải, kiểm tra nghiệm bằng thay ngược.</li>\n<li><strong>Qua bài:</strong> biết tự kiểm tra nghiệm thay vì chỉ chép chuỗi phép biến đổi.</li>\n</ul>"}}, {"id": "MATH-005", "sort": 78, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-A — Đại số tiên quyết", "sem": "HK1", "sup": false, "title": "Phương trình bậc hai", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["MATH-014"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "56641c78f8d22bd1", "substeps": [], "sec": {"exp": "<p>Phương trình bậc hai có dạng <code class=\"inline-code\">ax²+bx+c=0</code>, với <code class=\"inline-code\">a≠0</code>. Biệt thức <code class=\"inline-code\">Δ=b²−4ac</code> xác định số nghiệm thực phân biệt trong trường hợp hệ số thực.</p>", "ex": "<p>Với <code class=\"inline-code\">x²−5x+6=0</code>, phân tích thành <code class=\"inline-code\">(x−2)(x−3)=0</code> nên x=2 hoặc 3.</p>", "clar": "<p>Nếu <code class=\"inline-code\">a=0</code>, phương trình không còn là bậc hai. Cần kiểm tra nghiệm khi biến đổi có thể tạo nghiệm ngoại lai.</p>", "ext": "<p>Đồ thị parabol giải thích giao điểm với trục x và vai trò của Δ.</p>", "check": "<p>Giải <code class=\"inline-code\">x²−4=0</code> và nêu cả hai nghiệm.</p>", "sync": "<ul>\n<li><strong>Học:</strong> phân tích nhân tử, công thức nghiệm, biệt thức; kiểm tra dạng bài nào thuận tiện.</li>\n<li><strong>Bài:</strong> giải theo hai cách khi có thể.</li>\n<li><strong>Qua bài:</strong> nêu được điều kiện và kiểm chứng nghiệm.</li>\n</ul>"}}, {"id": "MATH-006", "sort": 79, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-A — Đại số tiên quyết", "sem": "HK1", "sup": false, "title": "Phân thức đại số", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["MATH-014"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "7cbdb9273d63c5f7", "substeps": [], "sec": {"exp": "<p>Phân thức đại số là thương của đa thức và đa thức khác 0. Rút gọn bằng cách phân tích tử/mẫu nhưng luôn giữ điều kiện mẫu khác 0 của biểu thức ban đầu.</p>", "ex": "<p><code class=\"inline-code\">(x²−1)/(x−1) = (x−1)(x+1)/(x−1) = x+1</code>, nhưng chỉ với <code class=\"inline-code\">x≠1</code>.</p>", "clar": "<p>Biểu thức rút gọn có thể xác định tại x=1 trong khi biểu thức ban đầu thì không; không được quên miền xác định ban đầu.</p>", "ext": "<p>Đây là kỹ năng then chốt để tính các giới hạn dạng bất định 0/0.</p>", "check": "<p>Rút gọn <code class=\"inline-code\">(x²−4)/(x−2)</code> và nêu điều kiện.</p>", "sync": "<ul>\n<li><strong>Học:</strong> rút gọn phân thức; điều kiện mẫu khác 0; quy đồng.</li>\n<li><strong>Bài:</strong> rút gọn biểu thức và ghi điều kiện xác định trước khi khử nhân tử.</li>\n<li><strong>Qua bài:</strong> không làm mất điều kiện của biểu thức ban đầu.</li>\n</ul>"}}, {"id": "MATH-007", "sort": 80, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-B — Hàm số, đồ thị và lượng giác", "sem": "HK1", "sup": false, "title": "Khái niệm hàm và ký hiệu `f(x)`", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["MATH-014"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "88f6b57d859df29d", "substeps": [], "sec": {"exp": "<p>Hàm số ánh xạ mỗi input trong miền xác định tới đúng một output. <code class=\"inline-code\">f(x)</code> là ký hiệu giá trị hàm tại x; x là đầu vào chứ không phải tên của một phép nhân.</p>", "ex": "<p>Nếu <code class=\"inline-code\">f(x)=2x+1</code>, thì <code class=\"inline-code\">f(3)=7</code>; input 3 được thế vào biểu thức của hàm.</p>", "clar": "<p>Miền xác định giới hạn các input hợp lệ. Một công thức có mẫu x không xác định ở x=0; mỗi output không nhất thiết có duy nhất một input.</p>", "ext": "<p>Tư duy hàm tương tự function trong lập trình nhưng hàm toán học nhấn mạnh quan hệ input-output.</p>", "check": "<p>Với <code class=\"inline-code\">g(x)=x²</code>, tính <code class=\"inline-code\">g(-2)</code> và xác định vì sao đầu vào là -2.</p>", "sync": "<ul>\n<li><strong>Học:</strong> đầu vào/đầu ra; miền xác định; giá trị hàm; một đầu vào có một đầu ra.</li>\n<li><strong>Bài:</strong> tính <code class=\"inline-code\">f(2)</code>, tìm đầu vào từ bảng đơn giản, đọc miền xác định.</li>\n<li><strong>Qua bài:</strong> phân biệt <code class=\"inline-code\">f(2)</code> với <code class=\"inline-code\">f × 2</code> và xác định đúng input/output.</li>\n</ul>"}}, {"id": "MATH-008", "sort": 81, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-B — Hàm số, đồ thị và lượng giác", "sem": "HK1", "sup": false, "title": "Đồ thị và biến thiên", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["MATH-014"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "4c4e11486ff5ecca", "substeps": [], "sec": {"exp": "<p>Đồ thị biểu diễn các cặp <code class=\"inline-code\">(x,f(x))</code>. Tính tăng/giảm cho biết output thay đổi như thế nào khi input thay đổi trong một khoảng; cần phân biệt điểm với khoảng.</p>", "ex": "<p>Với <code class=\"inline-code\">f(x)=2x</code>, khi x tăng từ 1 lên 2, f tăng từ 2 lên 4. Đồ thị là đường thẳng đi qua gốc có độ dốc dương.</p>", "clar": "<p>Đồ thị minh họa hành vi nhưng cần lưu ý thang trục và miền vẽ. “Tăng” trong khoảng nói đến quan hệ giữa các giá trị x, không chỉ một cặp điểm.</p>", "ext": "<p>Đồ thị là cầu nối trực quan đến giới hạn, đạo hàm và tối ưu.</p>", "check": "<p>Quan sát một đồ thị, nêu khoảng hàm tăng và khoảng hàm giảm.</p>", "sync": "<ul>\n<li><strong>Học:</strong> trục tọa độ, giao điểm, tăng/giảm qua đồ thị ở mức trực quan.</li>\n<li><strong>Bài:</strong> đọc giá trị, điểm giao và khoảng tăng/giảm từ đồ thị.</li>\n<li><strong>Qua bài:</strong> giải thích được cách lấy thông tin thay vì đoán từ hình.</li>\n</ul>"}}, {"id": "MATH-009", "sort": 82, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-B — Hàm số, đồ thị và lượng giác", "sem": "HK1", "sup": false, "title": "Hàm tuyến tính và hàm bậc hai", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["MATH-014"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "42a07aa8a5a37812", "substeps": [], "sec": {"exp": "<p>Hàm tuyến tính <code class=\"inline-code\">mx+b</code> có đồ thị đường thẳng với hệ số góc m. Hàm bậc hai <code class=\"inline-code\">ax²+bx+c</code> có đồ thị parabol khi a khác 0; dấu của a quyết định hướng mở.</p>", "ex": "<p><code class=\"inline-code\">f(x)=2x+1</code> tăng 2 đơn vị theo y khi x tăng 1; <code class=\"inline-code\">g(x)=x²</code> có đỉnh tại (0,0).</p>", "clar": "<p>Hệ số góc không phải lúc nào cũng là giá trị y; b là giao điểm trục y của đường tuyến tính. Với parabol tổng quát, đỉnh không nhất thiết ở x=0.</p>", "ext": "<p>Viết lại bậc hai theo dạng đỉnh giúp đọc cực trị dễ hơn.</p>", "check": "<p>Với <code class=\"inline-code\">f(x)=-3x+4</code>, nêu hệ số góc và giao điểm y.</p>", "sync": "<ul>\n<li><strong>Học:</strong> hệ số góc, giao trục; parabol, đỉnh ở mức theo chương trình.</li>\n<li><strong>Bài:</strong> vẽ phác và tìm giao điểm đơn giản.</li>\n<li><strong>Qua bài:</strong> liên kết công thức với hình dạng đồ thị.</li>\n</ul>"}}, {"id": "MATH-010", "sort": 83, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-B — Hàm số, đồ thị và lượng giác", "sem": "HK1", "sup": false, "title": "Hàm hợp và hàm ngược nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["MATH-014"], "verStatus": "reviewed_against_source", "srcRef": "Audited & patched in Verification Master v1.2 (AUD-003..008)", "hash": "84793b06ce1b607e", "substeps": [], "sec": {"exp": "<p>Hàm hợp thực hiện hàm trong trước rồi mới áp dụng hàm ngoài: <code class=\"inline-code\">(f∘g)(x)=f(g(x))</code>. Hàm ngược đảo chiều ánh xạ khi hàm đơn ánh trên miền được chọn. Cụ thể, nếu <code class=\"inline-code\">f: D → C</code> đơn ánh thì hàm ngược xác định từ <code class=\"inline-code\">f(D)</code> về <code class=\"inline-code\">D</code>; muốn miền xác định của hàm ngược là toàn bộ <code class=\"inline-code\">C</code> thì <code class=\"inline-code\">f</code> phải song ánh từ <code class=\"inline-code\">D</code> tới <code class=\"inline-code\">C</code>.</p>", "ex": "<p>Nếu <code class=\"inline-code\">g(x)=x+1</code>, <code class=\"inline-code\">f(u)=u²</code>, thì <code class=\"inline-code\">(f∘g)(2)=f(3)=9</code>.</p>", "clar": "<p>Thứ tự hợp hàm quan trọng: <code class=\"inline-code\">f(g(x))</code> không nói chung bằng <code class=\"inline-code\">g(f(x))</code>. Ví dụ <code class=\"inline-code\">f(x)=x²</code> không có hàm ngược đơn trị trên toàn bộ R; nếu giới hạn miền thành <code class=\"inline-code\">x ≥ 0</code> và tập đích là <code class=\"inline-code\">[0,∞)</code>, hàm ngược là <code class=\"inline-code\">√x</code>. Luôn nói rõ domain, codomain và image/range khi xác định hàm ngược.</p>", "ext": "<p>Hàm hợp chuẩn bị cho chain rule của đạo hàm.</p>", "check": "<p>Với f(x)=3x và g(x)=x−2, tính f(g(5)) và g(f(5)).</p>", "sync": "<ul>\n<li><strong>Học:</strong> thao tác hàm theo lớp; điều kiện để hiểu hàm ngược; thứ tự thực hiện.</li>\n<li><strong>Bài:</strong> xác định hàm hợp từ hai hàm đơn giản.</li>\n<li><strong>Qua bài:</strong> không đảo sai thứ tự hàm hợp.</li>\n</ul>"}}, {"id": "MATH-011", "sort": 84, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-B — Hàm số, đồ thị và lượng giác", "sem": "HK1", "sup": false, "title": "Góc, radian và lượng giác căn bản", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "13154c289abde913", "substeps": [], "sec": {"exp": "<p>Radian đo góc theo tỉ số độ dài cung/bán kính; <code class=\"inline-code\">π</code> rad = 180°. Lượng giác liên hệ góc với tỉ số cạnh hoặc tọa độ trên đường tròn đơn vị.</p>", "ex": "<p>90° = π/2 rad; sin(π/2)=1, cos(π/2)=0.</p>", "clar": "<p>Nhiều công thức giải tích dùng radian; đạo hàm của sin x có dạng chuẩn khi x đo bằng radian. Đừng đưa độ vào biểu thức mà không đổi đơn vị.</p>", "ext": "<p>Đường tròn đơn vị giải thích dấu sin/cos theo từng góc phần tư.</p>", "check": "<p>Đổi 60° sang radian và xác định dấu của sin(150°).</p>", "sync": "<ul>\n<li><strong>Học:</strong> độ/radian, vòng tròn lượng giác theo yêu cầu môn, sin/cos/tan.</li>\n<li><strong>Bài:</strong> chuyển đơn vị góc và đọc giá trị góc quen thuộc.</li>\n<li><strong>Qua bài:</strong> biết đơn vị góc khi dùng công thức.</li>\n</ul>"}}, {"id": "MATH-012", "sort": 85, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-B — Hàm số, đồ thị và lượng giác", "sem": "HK1", "sup": false, "title": "Đồng nhất thức lượng giác và đồ thị", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "349b9aa979022422", "substeps": [], "sec": {"exp": "<p>Đồng nhất thức lượng giác là đẳng thức đúng trên miền xác định phù hợp, ví dụ <code class=\"inline-code\">sin²x+cos²x=1</code>. Đồ thị cho thấy tính tuần hoàn và vị trí các giá trị.</p>", "ex": "<p>Nếu <code class=\"inline-code\">sin x=3/5</code> và x thuộc góc phần tư I, thì <code class=\"inline-code\">cos x=4/5</code> từ đồng nhất thức và điều kiện dấu.</p>", "clar": "<p>Không lấy căn rồi bỏ qua dấu; sin/cos có dấu tùy góc. Khi chia cho một biểu thức lượng giác, kiểm tra khi nào mẫu bằng 0.</p>", "ext": "<p>Các identity có thể biến đổi biểu thức, nhưng trong chứng minh nên biến một vế có kiểm soát.</p>", "check": "<p>Nếu sin x = 0.6 và cos x dương, tính cos x.</p>", "sync": "<ul>\n<li><strong>Học:</strong> đồng nhất thức cần cho lớp; chu kỳ và đồ thị sin/cos ở mức phù hợp.</li>\n<li><strong>Bài:</strong> rút gọn biểu thức và nhận dạng đồ thị.</li>\n<li><strong>Qua bài:</strong> phân biệt đồng nhất thức với phương trình lượng giác cụ thể.</li>\n</ul>"}}, {"id": "MATH-013", "sort": 86, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-B — Hàm số, đồ thị và lượng giác", "sem": "HK1", "sup": false, "title": "Hàm mũ và logarithm", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "05309b1b0d46345e", "substeps": [], "sec": {"exp": "<p>Hàm mũ <code class=\"inline-code\">a^x</code> mô tả tăng/giảm theo lũy thừa khi <code class=\"inline-code\">a&gt;0, a≠1</code>; logarithm là hàm ngược của hàm mũ trên miền hợp lệ. <code class=\"inline-code\">ln</code> là log cơ số e.</p>", "ex": "<p><code class=\"inline-code\">log₂(8)=3</code> vì <code class=\"inline-code\">2³=8</code>; <code class=\"inline-code\">ln(e²)=2</code>.</p>", "clar": "<p>Log của số không dương không xác định trong số thực; cơ số log phải dương và khác 1. Quy tắc log chỉ áp dụng trên miền xác định phù hợp.</p>", "ext": "<p>Logarithm biến tích thành tổng và xuất hiện trong mô hình tăng trưởng cũng như độ phức tạp thuật toán.</p>", "check": "<p>Giải <code class=\"inline-code\">log₃(27)=x</code>.</p>", "sync": "<ul>\n<li><strong>Học:</strong> quy tắc mũ, logarit; điều kiện đối số log dương; đổi cơ số nếu môn yêu cầu.</li>\n<li><strong>Bài:</strong> giải biểu thức/ phương trình cơ bản, nêu điều kiện xác định.</li>\n<li><strong>Qua bài:</strong> không lấy log của giá trị không hợp lệ và kiểm tra được kết quả.</li>\n</ul>"}}, {"id": "MATH-014", "sort": 87, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-C — Giới hạn và đạo hàm", "sem": "HK1", "sup": false, "title": "Ý tưởng giới hạn", "estStatus": "not_estimated", "depStatus": "reviewed", "reqPrereqs": ["MATH-007", "MATH-008", "MATH-009", "MATH-010", "MATH-003", "MATH-004", "MATH-005", "MATH-006"], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "09e38c7d79949642", "substeps": [], "sec": {"exp": "<p>Giới hạn mô tả giá trị mà f(x) tiến gần khi x tiến gần a; không nhất thiết f(a) phải bằng giới hạn hoặc thậm chí xác định tại a.</p>", "ex": "<p>Với <code class=\"inline-code\">f(x)=(x²−1)/(x−1)</code>, khi x≠1 ta rút gọn thành x+1, nên khi x→1 giới hạn là 2 dù biểu thức gốc không xác định tại 1.</p>", "clar": "<p>Giới hạn không phải chỉ là thế số; dạng 0/0 không phải giá trị 0 mà là dạng cần biến đổi/đánh giá.</p>", "ext": "<p>Có thể dùng bảng giá trị/đồ thị để hiểu trực quan trước khi áp dụng định lý hình thức.</p>", "check": "<p>Nếu f(a) không xác định, giới hạn tại a có thể tồn tại không? Cho ví dụ.</p>", "sync": "<ul>\n<li><strong>Tiên quyết:</strong> MATH-007–010 và MATH-003–006.</li>\n<li><strong>Học:</strong> giá trị hàm khi đầu vào tiến gần một điểm; giới hạn không nhất thiết bằng giá trị hàm tại điểm đó.</li>\n<li><strong>Bài:</strong> ước lượng từ bảng/đồ thị trước, sau đó tính ví dụ đại số đơn giản.</li>\n<li><strong>Qua bài:</strong> diễn đạt được “tiến gần” và phân biệt giới hạn với thế trực tiếp.</li>\n</ul>"}}, {"id": "MATH-015", "sort": 88, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-C — Giới hạn và đạo hàm", "sem": "HK1", "sup": false, "title": "Giới hạn trái/phải và tính liên tục", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "10d77d55e2fd98c6", "substeps": [], "sec": {"exp": "<p>Giới hạn trái xét x tiến từ nhỏ hơn a; giới hạn phải xét từ lớn hơn a. Giới hạn hai phía tồn tại hữu hạn khi hai giới hạn một phía bằng nhau. Tính liên tục tại điểm còn đòi f(a) xác định và bằng giới hạn.</p>", "ex": "<p>Với hàm <code class=\"inline-code\">f(x)=1</code> khi x&lt;0 và <code class=\"inline-code\">f(x)=2</code> khi x≥0, giới hạn trái tại 0 là 1, phải là 2 nên giới hạn hai phía không tồn tại.</p>", "clar": "<p>Giới hạn tồn tại không tự bảo đảm hàm liên tục; phải kiểm tra giá trị tại điểm.</p>", "ext": "<p>Gián đoạn có thể là nhảy, khử được hoặc vô hạn ở mức nhập môn.</p>", "check": "<p>Nêu ba điều kiện để f liên tục tại a.</p>", "sync": "<ul>\n<li><strong>Học:</strong> giới hạn một phía; điều kiện liên tục theo cách trình bày của lớp.</li>\n<li><strong>Bài:</strong> nhận diện hàm có gián đoạn qua đồ thị và tính ví dụ cơ bản.</li>\n<li><strong>Qua bài:</strong> biết phải kiểm tra hai phía khi cần.</li>\n</ul>"}}, {"id": "MATH-016", "sort": 89, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-C — Giới hạn và đạo hàm", "sem": "HK1", "sup": false, "title": "Kỹ thuật giới hạn cơ bản", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "7f73c67772062f4b", "substeps": [], "sec": {"exp": "<p>Kỹ thuật giới hạn dựa trên cấu trúc biểu thức: thế trực tiếp khi hợp lệ, phân tích nhân tử, quy đồng hoặc dùng các định lý phù hợp. Chọn kỹ thuật sau khi nhận diện dạng.</p>", "ex": "<p><code class=\"inline-code\">lim(x→2)(x²−4)/(x−2)</code>: dạng 0/0, phân tích <code class=\"inline-code\">(x−2)(x+2)</code>, rút gọn rồi giới hạn bằng 4.</p>", "clar": "<p>Rút gọn chỉ hợp lệ trên miền mà biểu thức ban đầu xác định; đang lấy giới hạn nên xét lân cận điểm, không khẳng định biểu thức gốc có giá trị tại điểm.</p>", "ext": "<p>Các dạng nâng cao như L’Hôpital chỉ học nếu chương trình đã giới thiệu và đáp ứng điều kiện định lý.</p>", "check": "<p>Với mỗi bài giới hạn, hãy nói vì sao chọn thế trực tiếp hay biến đổi.</p>", "sync": "<ul>\n<li><strong>Học:</strong> thế trực tiếp, phân tích nhân tử, quy đồng hoặc nhân liên hợp tùy nội dung trường.</li>\n<li><strong>Bài:</strong> phân loại bài theo dạng vô định rồi chọn thao tác hợp lý.</li>\n<li><strong>Qua bài:</strong> giải thích được tại sao thao tác được phép.</li>\n</ul>"}}, {"id": "MATH-017", "sort": 90, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-C — Giới hạn và đạo hàm", "sem": "HK2", "sup": false, "title": "Đạo hàm là tốc độ thay đổi", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "da71bb7d49168ec4", "substeps": [], "sec": {"exp": "<p>Đạo hàm là giới hạn của tốc độ thay đổi trung bình khi khoảng thay đổi tiến về 0. Hình học tương ứng là độ dốc tiếp tuyến tại điểm nếu đạo hàm tồn tại.</p>", "ex": "<p>Với <code class=\"inline-code\">f(x)=x²</code>, tốc độ thay đổi trung bình từ x đến x+h là <code class=\"inline-code\">((x+h)²−x²)/h=2x+h</code>; khi h→0 được <code class=\"inline-code\">f'(x)=2x</code>.</p>", "clar": "<p>Đạo hàm tại điểm không phải là chênh lệch giá trị giữa hai điểm cách xa. Hàm có góc nhọn có thể không có đạo hàm tại đó.</p>", "ext": "<p>Đạo hàm dùng cho tối ưu, vận tốc tức thời và phân tích độ nhạy.</p>", "check": "<p>Giải thích ý nghĩa của f'(3)=6 cho đồ thị f(x)=x².</p>", "sync": "<ul>\n<li><strong>Học:</strong> độ dốc tiếp tuyến và tốc độ thay đổi; định nghĩa qua giới hạn nếu đề cương yêu cầu.</li>\n<li><strong>Bài:</strong> đọc hệ số góc từ đồ thị và so sánh tại các điểm.</li>\n<li><strong>Qua bài:</strong> giải thích ý nghĩa đạo hàm bằng lời, không chỉ thuộc công thức.</li>\n</ul>"}}, {"id": "MATH-018", "sort": 91, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-C — Giới hạn và đạo hàm", "sem": "HK2", "sup": false, "title": "Quy tắc đạo hàm cơ bản", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "23f8267ee66cb06d", "substeps": [], "sec": {"exp": "<p>Quy tắc cơ bản gồm đạo hàm hằng số bằng 0, đạo hàm x^n là <code class=\"inline-code\">n x^(n−1)</code> trên miền phù hợp, quy tắc tổng và nhân với hằng số.</p>", "ex": "<p><code class=\"inline-code\">d/dx(3x²−4x+7)=6x−4</code>; hằng số 7 biến mất vì không đổi theo x.</p>", "clar": "<p>Quy tắc lũy thừa ở dạng này có điều kiện miền khi số mũ không nguyên; học theo tập hàm đã học. Luôn giữ biến đang lấy đạo hàm.</p>", "ext": "<p>Kiểm tra kết quả bằng ước lượng độ dốc/đồ thị khi có thể.</p>", "check": "<p>Tính đạo hàm của <code class=\"inline-code\">5x³+2x−9</code>.</p>", "sync": "<ul>\n<li><strong>Học:</strong> hằng số, lũy thừa, tổng/hiệu; dùng đúng giả thiết.</li>\n<li><strong>Bài:</strong> mỗi quy tắc có ví dụ đơn, rồi bài phối hợp.</li>\n<li><strong>Qua bài:</strong> đạt 8/10 và có thể nói mình dùng quy tắc nào.</li>\n</ul>"}}, {"id": "MATH-019", "sort": 92, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-C — Giới hạn và đạo hàm", "sem": "HK2", "sup": false, "title": "Tích, thương và hàm hợp (chain rule)", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "04932f7dd60ae2bd", "substeps": [], "sec": {"exp": "<p>Quy tắc tích, thương và chain rule xử lý tổ hợp hàm. Với hợp <code class=\"inline-code\">f(g(x))</code>, đạo hàm là <code class=\"inline-code\">f'(g(x))g'(x)</code> khi các đạo hàm tồn tại.</p>", "ex": "<p><code class=\"inline-code\">d/dx (x²+1)³ = 3(x²+1)²·2x = 6x(x²+1)²</code>.</p>", "clar": "<p>Không bỏ đạo hàm của hàm bên trong chain rule. Quy tắc thương cần mẫu khác 0 ở vùng xét.</p>", "ext": "<p>Vẽ cây thành phần hàm trước khi đạo hàm biểu thức lồng nhau.</p>", "check": "<p>Với <code class=\"inline-code\">y=(3x+1)²</code>, phần “hàm ngoài” và “hàm trong” là gì?</p>", "sync": "<ul>\n<li><strong>Học:</strong> nhận diện hàm bên trong/bên ngoài; quy tắc tích/thương nếu lớp yêu cầu.</li>\n<li><strong>Bài:</strong> gạch lớp hàm trước khi đạo hàm.</li>\n<li><strong>Qua bài:</strong> làm đúng bài dạng cơ bản, không học thuộc mẫu mà không xác định cấu trúc.</li>\n</ul>"}}, {"id": "MATH-020", "sort": 93, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-C — Giới hạn và đạo hàm", "sem": "HK2", "sup": false, "title": "Đạo hàm lượng giác, mũ và logarit", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "8b0faae33244638d", "substeps": [], "sec": {"exp": "<p>Các hàm sin, cos, exp và log có đạo hàm riêng tiêu chuẩn trên miền xác định. Các quy tắc vẫn kết hợp với chain rule khi đối số không chỉ là x.</p>", "ex": "<p><code class=\"inline-code\">d/dx sin(2x)=2cos(2x)</code>; <code class=\"inline-code\">d/dx e^(3x)=3e^(3x)</code>; <code class=\"inline-code\">d/dx ln x=1/x</code> khi x&gt;0.</p>", "clar": "<p>Đạo hàm <code class=\"inline-code\">sin x = cos x</code> theo công thức chuẩn giả định góc radian. Đạo hàm ln x là 1/x trên miền x&gt;0 trong giải tích thực thông thường.</p>", "ext": "<p>Bảng công thức chỉ hữu ích khi biết áp dụng chain/product/quotient rule đúng.</p>", "check": "<p>Tính đạo hàm của <code class=\"inline-code\">cos(5x)</code> và giải thích hệ số 5.</p>", "sync": "<ul>\n<li><strong>Học:</strong> các công thức trong đề cương; kiểm tra đơn vị góc theo ngữ cảnh.</li>\n<li><strong>Bài:</strong> bài ngắn riêng từng họ hàm rồi bài kết hợp.</li>\n<li><strong>Qua bài:</strong> chọn đúng công thức và kiểm tra điều kiện.</li>\n</ul>"}}, {"id": "MATH-021", "sort": 94, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-C — Giới hạn và đạo hàm", "sem": "HK2", "sup": false, "title": "Ứng dụng đạo hàm", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "e9e3f446e7a96829", "substeps": [], "sec": {"exp": "<p>Đạo hàm mô tả độ dốc và giúp tìm điểm tới hạn; để xác định cực đại/cực tiểu cần phân tích dấu đạo hàm, miền xác định và có thể so sánh biên.</p>", "ex": "<p>Nếu f′ đổi từ dương sang âm qua điểm tới hạn, đó là dấu hiệu cực đại địa phương; vẫn phải kiểm tra điều kiện và miền bài toán.</p>", "clar": "<p>f′(x)=0 không bảo đảm điểm đó là cực trị; ví dụ hàm có thể tiếp tục tăng qua điểm dốc ngang. Cực trị địa phương khác cực trị toàn cục.</p>", "ext": "<p>Ứng dụng: tối đa hóa diện tích, giảm chi phí; mô hình phải có đơn vị và ràng buộc thực tế.</p>", "check": "<p>Vì sao nghiệm f′=0 chỉ là ứng viên chứ chưa đủ kết luận cực đại?</p>", "sync": "<ul>\n<li><strong>Học:</strong> điểm tới hạn, cực trị, tăng giảm; tối ưu hóa theo đề cương.</li>\n<li><strong>Bài:</strong> giải bài toán tối ưu bằng bước: biến → hàm mục tiêu → miền → đạo hàm → kiểm tra.</li>\n<li><strong>Qua bài:</strong> giải thích biến mô hình đại diện điều gì và kiểm tra điều kiện biên.</li>\n</ul>"}}, {"id": "MATH-022", "sort": 95, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-D — Tích phân", "sem": "HK2", "sup": false, "title": "Nguyên hàm và tích phân bất định", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f052ea0033c87a94", "substeps": [], "sec": {"exp": "<p>Nguyên hàm F của f thỏa <code class=\"inline-code\">F'=f</code>. Tích phân bất định biểu diễn họ nguyên hàm, nên cộng hằng số <code class=\"inline-code\">C</code>.</p>", "ex": "<p><code class=\"inline-code\">∫ 2x dx = x² + C</code>, vì đạo hàm của x²+C là 2x.</p>", "clar": "<p>Đừng quên C trong tích phân bất định. Công thức tích phân lũy thừa dạng x^n có trường hợp riêng n=-1.</p>", "ext": "<p>Có thể kiểm tra nguyên hàm bằng cách lấy đạo hàm lại.</p>", "check": "<p>Tính <code class=\"inline-code\">∫ 3x² dx</code> rồi kiểm tra bằng đạo hàm.</p>", "sync": "<ul>\n<li><strong>Tiên quyết:</strong> đạo hàm cơ bản.</li>\n<li><strong>Học:</strong> tích phân là họ nguyên hàm; hằng số <code class=\"inline-code\">C</code>; kiểm tra bằng đạo hàm.</li>\n<li><strong>Bài:</strong> tìm nguyên hàm đơn giản rồi đạo hàm lại.</li>\n<li><strong>Qua bài:</strong> tự kiểm chứng bằng phép đạo hàm.</li>\n</ul>"}}, {"id": "MATH-023", "sort": 96, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-D — Tích phân", "sem": "HK2", "sup": false, "title": "Tích phân xác định và diện tích có dấu", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "6a2bbf2c99538e8a", "substeps": [], "sec": {"exp": "<p>Tích phân xác định tổng hợp đại lượng tích lũy trên khoảng; hình học thường tương ứng diện tích có dấu giữa đồ thị và trục x. Phần dưới trục đóng góp âm.</p>", "ex": "<p>Với <code class=\"inline-code\">f(x)=x</code> trên [0,2], <code class=\"inline-code\">∫₀² x dx=2</code>; diện tích là tam giác đáy 2, cao 2, bằng 2.</p>", "clar": "<p>Tích phân không luôn bằng tổng diện tích hình học dương nếu hàm âm một phần; cần chia khoảng hoặc lấy trị tuyệt đối tùy ý nghĩa bài toán.</p>", "ext": "<p>Tích phân có thể mô tả quãng đường từ vận tốc nếu biết dấu và cách diễn giải.</p>", "check": "<p>Phân biệt diện tích có dấu và tổng diện tích hình học khi đồ thị cắt trục x.</p>", "sync": "<ul>\n<li><strong>Học:</strong> cận, ý nghĩa diện tích có dấu, tổng tích lũy theo phạm vi khóa học.</li>\n<li><strong>Bài:</strong> đọc miền tích phân từ hình và tính bài cơ bản.</li>\n<li><strong>Qua bài:</strong> không nhầm tích phân có dấu với diện tích hình học luôn dương.</li>\n</ul>"}}, {"id": "MATH-024", "sort": 97, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-D — Tích phân", "sem": "HK2", "sup": false, "title": "Định lý cơ bản của Giải tích", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "d8f3fd5a0f383d82", "substeps": [], "sec": {"exp": "<p>Định lý cơ bản của Giải tích kết nối đạo hàm và tích phân. Nếu F là nguyên hàm của f trên khoảng phù hợp, tích phân xác định bằng <code class=\"inline-code\">F(b)-F(a)</code>.</p>", "ex": "<p><code class=\"inline-code\">∫₁³ 2x dx = [x²]₁³ = 9−1 = 8</code>.</p>", "clar": "<p>Áp dụng cần điều kiện phù hợp như tính liên tục của f trên khoảng theo phiên bản định lý được học. Luôn thay cả cận trên và cận dưới.</p>", "ext": "<p>Định lý giải thích vì sao tìm nguyên hàm giúp tính tích phân xác định.</p>", "check": "<p>Tính <code class=\"inline-code\">∫₀² 3 dx</code> bằng một nguyên hàm.</p>", "sync": "<ul>\n<li><strong>Học:</strong> mối liên hệ đạo hàm/tích phân; áp dụng theo đề cương.</li>\n<li><strong>Bài:</strong> tính tích phân xác định bằng nguyên hàm và đánh giá kết quả.</li>\n<li><strong>Qua bài:</strong> giải thích vai trò của cận dưới/cận trên.</li>\n</ul>"}}, {"id": "MATH-025", "sort": 98, "pfx": "MATH", "subj": "MATH", "subjName": "Giải Tích & Đại Số Tiên Quyết", "cat": "Mathematics", "uitMap": "MA006 (Giải tích)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "Cụm MATH-D — Tích phân", "sem": "HK2", "sup": false, "title": "Kỹ thuật tích phân theo chương trình trường", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "d0ba65df2a7a7968", "substeps": [{"substep_id": "MATH-025.part-1", "title": "part-1: chọn kỹ thuật theo đề cương lớp xác nhận", "check": "Đối chiếu đề cương lớp trước khi chọn đổi biến/từng phần/phân thức."}, {"substep_id": "MATH-025.part-2", "title": "part-2: ví dụ mẫu có kiểm tra", "check": "Trình bày biến đổi vi phân/cận và kiểm tra lại bằng đạo hàm."}, {"substep_id": "MATH-025.part-3", "title": "part-3: bài tập hỗn hợp", "check": "Nhận diện dạng tích phân và giải thích lý do chọn phương pháp."}], "sec": {"exp": "<p>Kỹ thuật tích phân mở rộng phụ thuộc đề cương trường: đổi biến, từng phần, phân tích phân thức hay tích phân lượng giác. Trước mỗi kỹ thuật cần kiểm tra cấu trúc và điều kiện áp dụng.</p>", "ex": "<p>Đổi biến: <code class=\"inline-code\">∫ 2x cos(x²) dx</code>, đặt u=x², du=2x dx, thành <code class=\"inline-code\">∫ cos u du = sin u + C</code>.</p>", "clar": "<p>Đổi biến phải thay đổi đúng cả vi phân và cận (với tích phân xác định). Không chọn kỹ thuật chỉ theo mẫu nhớ máy móc.</p>", "ext": "<p>Mỗi kỹ thuật nên gắn với một tín hiệu nhận diện và một bài kiểm tra bằng đạo hàm.</p>", "check": "<p>Trong tích phân có <code class=\"inline-code\">g'(x)·h(g(x))</code>, kỹ thuật nào có thể phù hợp?</p>", "sync": "<ul>\n<li><strong>Học:</strong> đổi biến, từng phần hoặc kỹ thuật khác chỉ khi chương trình yêu cầu.</li>\n<li><strong>Bài:</strong> phân loại bài, giải thích lựa chọn kỹ thuật trước khi tính.</li>\n<li><strong>Qua bài:</strong> nhận diện đúng dạng và kiểm tra bằng đạo hàm hoặc xấp xỉ khi phù hợp.</li>\n<li>Mỗi lời giải sai cần chỉ rõ dòng sai đầu tiên, không chỉ đưa đáp án đúng.</li>\n</ul>"}}, {"id": "DM-001", "sort": 99, "pfx": "DM", "subj": "DM", "subjName": "Toán Rời Rạc", "cat": "Mathematics", "uitMap": "MA004 (Cấu trúc rời rạc)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "7. Toán rời rạc cho Khoa học máy tính", "sem": "HK2", "sup": false, "title": "Mệnh đề và giá trị đúng/sai", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["DM-003", "DM-004", "SUP-DM-004"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f236fb58a82c9610", "substeps": [], "sec": {"exp": "<p>Mệnh đề là câu có giá trị đúng hoặc sai xác định; câu hỏi hay mệnh lệnh thường không phải mệnh đề.</p>", "ex": "<p>“7 là số nguyên tố” là mệnh đề đúng; “x&gt;3” chưa có giá trị chân lý xác định khi chưa biết x hay lượng hóa x.</p>", "clar": "<p>Trong logic, đúng/sai không nhất thiết dựa vào cảm giác; phải dùng định nghĩa và giả thiết.</p>", "ext": "<p>Mệnh đề kết hợp tạo nền cho điều kiện trong code và chứng minh.</p>", "check": "<p>Vì sao “x &gt; 2” chưa tự là mệnh đề có giá trị xác định khi x chưa được gán?</p>", "sync": "<ul>\n<li><strong>Học:</strong> mệnh đề, phủ định, AND/OR, kéo theo và tương đương ở mức nhập môn.</li>\n<li><strong>Bài:</strong> chuyển câu tiếng Việt thành biểu thức logic.</li>\n<li><strong>Đạt:</strong> lập bảng chân trị cho biểu thức nhỏ và giải thích một phản ví dụ.</li>\n</ul>"}}, {"id": "DM-002", "sort": 100, "pfx": "DM", "subj": "DM", "subjName": "Toán Rời Rạc", "cat": "Mathematics", "uitMap": "MA004 (Cấu trúc rời rạc)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "7. Toán rời rạc cho Khoa học máy tính", "sem": "HK2", "sup": false, "title": "Bảng chân trị và tương đương logic", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["DM-003", "SUP-DM-004"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "53bbf87bbc67673b", "substeps": [], "sec": {"exp": "<p>Bảng chân trị liệt kê giá trị của biểu thức logic cho mọi tổ hợp đầu vào. Hai biểu thức tương đương logic khi kết quả giống nhau với mọi tổ hợp.</p>", "ex": "<p><code class=\"inline-code\">p &amp;&amp; true</code> tương đương p; <code class=\"inline-code\">!(p &amp;&amp; q)</code> tương đương <code class=\"inline-code\">!p || !q</code> theo định luật De Morgan.</p>", "clar": "<p>Đừng suy ra tương đương chỉ từ một ví dụ. Với n biến Boolean, bảng đầy đủ có 2^n dòng.</p>", "ext": "<p>Bảng chân trị hữu ích kiểm tra điều kiện phức tạp và mạch logic.</p>", "check": "<p>Lập bảng chân trị của <code class=\"inline-code\">p || !p</code>.</p>", "sync": "<ul>\n<li><strong>Học:</strong> kiểm tra mọi tổ hợp giá trị; De Morgan theo chương trình.</li>\n<li><strong>Bài:</strong> xác định hai biểu thức tương đương hay không.</li>\n<li><strong>Đạt:</strong> không suy luận chỉ dựa trên một trường hợp.</li>\n</ul>"}}, {"id": "DM-003", "sort": 101, "pfx": "DM", "subj": "DM", "subjName": "Toán Rời Rạc", "cat": "Mathematics", "uitMap": "MA004 (Cấu trúc rời rạc)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "7. Toán rời rạc cho Khoa học máy tính", "sem": "HK2", "sup": false, "title": "Lượng từ `for all` và `exists`", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["DM-001", "DM-002"], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "c99e32445e6514ae", "substeps": [], "sec": {"exp": "<p>Lượng từ ∀ nghĩa là “với mọi”; ∃ nghĩa là “tồn tại ít nhất một”. Miền xét phải rõ vì thay miền sẽ thay đổi ý nghĩa mệnh đề.</p>", "ex": "<p>“Với mọi số nguyên n, n+0=n” đúng; “tồn tại số nguyên n sao cho n²=2” sai.</p>", "clar": "<p>Phủ định của ∀ thường thành ∃ với vị từ phủ định, và ngược lại: <code class=\"inline-code\">not (for all x P(x))</code> là <code class=\"inline-code\">exists x not P(x)</code>.</p>", "ext": "<p>Lượng từ xuất hiện trong đặc tả, logic và chứng minh độ đúng.</p>", "check": "<p>Hãy viết phủ định của “mọi sinh viên đều đạt điểm 5”.</p>", "sync": "<ul>\n<li><strong>Học:</strong> “với mọi” và “tồn tại”; miền xét; phủ định lượng từ.</li>\n<li><strong>Bài:</strong> viết/đọc phát biểu có miền số xác định.</li>\n<li><strong>Đạt:</strong> phủ định đúng một phát biểu có lượng từ.</li>\n</ul>"}}, {"id": "DM-004", "sort": 102, "pfx": "DM", "subj": "DM", "subjName": "Toán Rời Rạc", "cat": "Mathematics", "uitMap": "MA004 (Cấu trúc rời rạc)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "7. Toán rời rạc cho Khoa học máy tính", "sem": "HK2", "sup": false, "title": "Tập hợp và phép toán tập", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["DM-001"], "recBg": [], "unlocks": ["DM-005"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "ab08a43839dc2e16", "substeps": [], "sec": {"exp": "<p>Tập hợp là tập các phần tử phân biệt; ∪ là hợp, ∩ là giao, \\ là hiệu theo quy ước. Quan hệ phần tử <code class=\"inline-code\">∈</code> khác quan hệ tập con <code class=\"inline-code\">⊆</code>.</p>", "ex": "<p>A={1,2}, B={2,3}; A∪B={1,2,3}; A∩B={2}.</p>", "clar": "<p>Phần tử trùng không được đếm nhiều lần trong một tập. Nên nêu rõ vũ trụ xét khi lấy phần bù.</p>", "ext": "<p>Set tương ứng về ý tưởng với <code class=\"inline-code\">std::set</code> nhưng toán học và implementation có khác biệt.</p>", "check": "<p>Nếu A={a,b}, B={b,c}, tính A\\B.</p>", "sync": "<ul>\n<li><strong>Học:</strong> phần tử, tập con, hợp, giao, hiệu, tích Descartes.</li>\n<li><strong>Bài:</strong> biểu diễn tập nhỏ bằng liệt kê và hình Venn.</li>\n<li><strong>Đạt:</strong> tính đúng phép toán trên các ví dụ hữu hạn.</li>\n</ul>"}}, {"id": "DM-005", "sort": 103, "pfx": "DM", "subj": "DM", "subjName": "Toán Rời Rạc", "cat": "Mathematics", "uitMap": "MA004 (Cấu trúc rời rạc)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "7. Toán rời rạc cho Khoa học máy tính", "sem": "HK2", "sup": false, "title": "Hàm, quan hệ và tính chất", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["DM-004"], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "812b97a8a6198819", "substeps": [], "sec": {"exp": "<p>Hàm/ánh xạ gán mỗi phần tử miền đúng một phần tử đích; quan hệ là tập cặp có thể không đáp ứng tính chất hàm. Tính đơn ánh, toàn ánh, song ánh mô tả đặc tính ánh xạ.</p>", "ex": "<p><code class=\"inline-code\">f(x)=2x</code> trên số nguyên là đơn ánh; <code class=\"inline-code\">g(x)=x²</code> trên số thực không đơn ánh vì g(2)=g(-2).</p>", "clar": "<p>Tính chất phụ thuộc miền và codomain. Một hàm có thể không đơn ánh trên miền rộng nhưng trở thành đơn ánh khi giới hạn miền.</p>", "ext": "<p>Quan hệ/hàm chuẩn bị cho hàm ngược, cơ sở dữ liệu và ánh xạ giữa kiểu dữ liệu.</p>", "check": "<p>Cho ví dụ hàm không đơn ánh và giải thích hai đầu vào có cùng output.</p>", "sync": "<ul>\n<li><strong>Học:</strong> miền xác định/đích, đơn ánh/toàn ánh/song ánh; phản xạ/đối xứng/bắc cầu theo chương trình.</li>\n<li><strong>Bài:</strong> phân loại ví dụ và phản ví dụ.</li>\n<li><strong>Đạt:</strong> dùng định nghĩa để biện minh, không chỉ đoán tên.</li>\n</ul>"}}, {"id": "DM-006", "sort": 104, "pfx": "DM", "subj": "DM", "subjName": "Toán Rời Rạc", "cat": "Mathematics", "uitMap": "MA004 (Cấu trúc rời rạc)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "7. Toán rời rạc cho Khoa học máy tính", "sem": "HK2", "sup": false, "title": "Cách viết chứng minh cơ bản", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["DM-007", "SUP-DM-001", "SUP-DM-002"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "c81783ac324bc988", "substeps": [], "sec": {"exp": "<p>Chứng minh là chuỗi lập luận hợp lý đưa từ giả thiết tới kết luận. Chọn phương pháp phù hợp: chứng minh trực tiếp, phản chứng hoặc phản ví dụ để bác bỏ mệnh đề tổng quát.</p>", "ex": "<p>Để bác bỏ “mọi số nguyên tố đều lẻ”, phản ví dụ là số 2. Một phản ví dụ đủ bác bỏ mệnh đề phổ quát.</p>", "clar": "<p>Ví dụ kiểm thử không thay thế chứng minh cho mọi input; ngược lại, phản ví dụ có thể chứng minh khẳng định tổng quát sai.</p>", "ext": "<p>Kỹ năng lập luận hỗ trợ chứng minh thuật toán đúng thay vì chỉ chạy vài test.</p>", "check": "<p>Một phản ví dụ có thể bác bỏ mệnh đề “mọi phần tử của dãy đều dương” như thế nào?</p>", "sync": "<ul>\n<li><strong>Học:</strong> giả thiết, kết luận, chứng minh trực tiếp, phản ví dụ.</li>\n<li><strong>Bài:</strong> chứng minh một mệnh đề nhỏ hoặc bác bỏ nó bằng phản ví dụ.</li>\n<li><strong>Đạt:</strong> phân biệt ví dụ minh họa với chứng minh tổng quát.</li>\n</ul>"}}, {"id": "DM-007", "sort": 105, "pfx": "DM", "subj": "DM", "subjName": "Toán Rời Rạc", "cat": "Mathematics", "uitMap": "MA004 (Cấu trúc rời rạc)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "7. Toán rời rạc cho Khoa học máy tính", "sem": "HK2", "sup": false, "title": "Quy nạp toán học", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["DM-006"], "recBg": [], "unlocks": ["SUP-DM-001"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "2cf7b75e8ab4c210", "substeps": [], "sec": {"exp": "<p>Quy nạp chứng minh mệnh đề với n nguyên từ mốc: base case, giả thiết quy nạp và bước chứng minh n→n+1.</p>", "ex": "<p>Chứng minh tổng 1+…+n=n(n+1)/2: kiểm tra n=1; giả sử đúng n rồi cộng n+1 và biến đổi về công thức cho n+1.</p>", "clar": "<p>Phải chứng minh base case và bước quy nạp; chỉ kiểm tra vài n đầu không đủ. Giả thiết quy nạp chỉ dùng theo điều đã giả định.</p>", "ext": "<p>Quy nạp xuất hiện trong đệ quy, cấu trúc cây và chứng minh thuật toán.</p>", "check": "<p>Nêu ba phần bắt buộc trong một chứng minh quy nạp.</p>", "sync": "<ul>\n<li><strong>Học:</strong> bước cơ sở, giả thiết quy nạp, bước quy nạp.</li>\n<li><strong>Bài:</strong> chứng minh công thức tổng đơn giản.</li>\n<li><strong>Đạt:</strong> nêu rõ đủ ba thành phần, không bỏ bước cơ sở.</li>\n</ul>"}}, {"id": "DM-008", "sort": 106, "pfx": "DM", "subj": "DM", "subjName": "Toán Rời Rạc", "cat": "Mathematics", "uitMap": "MA004 (Cấu trúc rời rạc)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "7. Toán rời rạc cho Khoa học máy tính", "sem": "HK2", "sup": false, "title": "Đếm và tổ hợp cơ bản", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["DM-010", "SUP-PS-002", "SUP-DM-005"], "verStatus": "reviewed_against_source", "srcRef": "Audited & patched in Verification Master v1.2 (AUD-003..008)", "hash": "dd086fbedbb88ae6", "substeps": [], "sec": {"exp": "<p>Quy tắc đếm xử lý các lựa chọn; quy tắc nhân dùng khi quy trình có nhiều bước và số lựa chọn hợp lệ ở từng bước được xác định. Nếu mọi nhánh có cùng số lựa chọn ở mỗi bước, có thể nhân trực tiếp các số đó; nếu số lựa chọn thay đổi theo lựa chọn trước, cần phân nhánh hoặc tính từng trường hợp. Đây không phải giả định độc lập xác suất. Hoán vị/chỉnh hợp/tổ hợp còn phụ thuộc thứ tự và việc có cho lặp hay không.</p>", "ex": "<p>Mã PIN 3 chữ số, mỗi vị trí có 10 lựa chọn và cho phép lặp có 10³ khả năng.</p>", "clar": "<p>Nếu không cho lặp thì số lựa chọn giảm từng bước; nếu thứ tự không quan trọng, không dùng công thức hoán vị như thể thứ tự quan trọng.</p>", "ext": "<p>Đếm là nền cho xác suất, phân tích khả năng kiểm thử và độ phức tạp.</p>", "check": "<p>Có bao nhiêu chuỗi 2 ký tự từ {A,B,C} nếu cho phép lặp và có tính thứ tự?</p>", "sync": "<ul>\n<li><strong>Học:</strong> quy tắc cộng/nhân, hoán vị/tổ hợp theo lớp.</li>\n<li><strong>Bài:</strong> mô hình hóa số cách chọn/sắp xếp.</li>\n<li><strong>Đạt:</strong> xác định được thứ tự có quan trọng hay không.</li>\n</ul>"}}, {"id": "DM-009", "sort": 107, "pfx": "DM", "subj": "DM", "subjName": "Toán Rời Rạc", "cat": "Mathematics", "uitMap": "MA004 (Cấu trúc rời rạc)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "7. Toán rời rạc cho Khoa học máy tính", "sem": "HK2", "sup": false, "title": "Dãy, truy hồi và quy nạp trên cấu trúc", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["DM-011", "SUP-DM-003"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "c6c674f666f35e60", "substeps": [], "sec": {"exp": "<p>Dãy xác định thứ tự phần tử; truy hồi mô tả phần tử bằng các phần tử trước. Truy hồi cần base case cùng quy tắc tính tiếp theo.</p>", "ex": "<p>Fibonacci: F0=0, F1=1, Fn=F(n−1)+F(n−2) khi n≥2.</p>", "clar": "<p>Một truy hồi không đủ nếu thiếu base case. Phải chú ý chỉ số và số phần tử được định nghĩa.</p>", "ext": "<p>Truy hồi dẫn tới phân tích recursion và quy hoạch động.</p>", "check": "<p>Tính F2, F3, F4 từ định nghĩa.</p>", "sync": "<ul>\n<li><strong>Học:</strong> recurrence; định nghĩa đệ quy; liên hệ với thuật toán.</li>\n<li><strong>Bài:</strong> truy vết dãy truy hồi nhỏ.</li>\n<li><strong>Đạt:</strong> biết điều kiện ban đầu và cách sinh số hạng.</li>\n</ul>"}}, {"id": "DM-010", "sort": 108, "pfx": "DM", "subj": "DM", "subjName": "Toán Rời Rạc", "cat": "Mathematics", "uitMap": "MA004 (Cấu trúc rời rạc)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "7. Toán rời rạc cho Khoa học máy tính", "sem": "HK2", "sup": false, "title": "Đồ thị và cây", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["DM-008"], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "4a9f96d97757189c", "substeps": [], "sec": {"exp": "<p>Đồ thị gồm đỉnh và cạnh; cây là đồ thị liên thông không chu trình (trong khái niệm cây vô hướng cơ bản). Đồ thị biểu diễn quan hệ kết nối.</p>", "ex": "<p>Mạng bạn bè: đỉnh là người, cạnh biểu diễn quan hệ. Một cây có n đỉnh thì có n−1 cạnh khi n≥1 trong định nghĩa cây hữu hạn vô hướng.</p>", "clar": "<p>Đồ thị có hướng khác vô hướng; cạnh có trọng số khác cạnh không trọng số. Đừng gọi mọi mạng có nhiều nhánh là cây nếu có chu trình.</p>", "ext": "<p>Biểu diễn bằng adjacency list hoặc matrix tùy số cạnh và truy vấn.</p>", "check": "<p>Một đồ thị có chu trình có phải cây theo định nghĩa cơ bản không?</p>", "sync": "<ul>\n<li><strong>Học:</strong> đỉnh/cạnh, bậc, đường đi, chu trình, cây, tính liên thông.</li>\n<li><strong>Bài:</strong> mô hình hóa bản đồ/quan hệ bằng đồ thị.</li>\n<li><strong>Đạt:</strong> đọc được biểu diễn đồ thị và giải thích thuộc tính cơ bản.</li>\n</ul>"}}, {"id": "DM-011", "sort": 109, "pfx": "DM", "subj": "DM", "subjName": "Toán Rời Rạc", "cat": "Mathematics", "uitMap": "MA004 (Cấu trúc rời rạc)", "part": "PHẦN B — TOÁN, GIẢI TÍCH VÀ TOÁN RỜI RẠC", "stage": "7. Toán rời rạc cho Khoa học máy tính", "sem": "HK2", "sup": false, "title": "Big-O ở góc nhìn toán học", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["DM-009"], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "65fe5685eab671fc", "substeps": [], "sec": {"exp": "<p>Big-O phân loại tăng trưởng khi kích thước input lớn dần. Đây là cách mô tả tiệm cận, không phải đơn vị thời gian đo thực nghiệm.</p>", "ex": "<p>Nếu thuật toán làm <code class=\"inline-code\">3n²+2n+1</code> thao tác, bậc tăng trưởng chi phối là O(n²).</p>", "clar": "<p>Bỏ hệ số/hạng thấp không có nghĩa chúng không ảnh hưởng thời gian thực tế ở kích thước nhỏ. Cần xác định input size.</p>", "ext": "<p>So sánh Big-O cùng benchmark: lý thuyết cho xu hướng, đo đạc cho môi trường cụ thể.</p>", "check": "<p>Vì sao <code class=\"inline-code\">100n</code> vẫn là O(n), không phải O(100n) theo cách viết phổ biến?</p>", "sync": "<ul>\n<li><strong>Học:</strong> tăng trưởng; so sánh tuyến tính, logarit, bình phương, hàm mũ ở mức cần thiết.</li>\n<li><strong>Bài:</strong> sắp xếp tốc độ tăng và ước lượng ảnh hưởng của n.</li>\n<li><strong>Đạt:</strong> hiểu chỉ là mô tả tăng trưởng, không phải benchmark chính xác.</li>\n</ul>"}}, {"id": "ARCH-001", "sort": 110, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Bit, byte và đơn vị dữ liệu", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["ARCH-002", "ARCH-003"], "verStatus": "reviewed_against_source", "srcRef": "Audited & patched in Verification Master v1.2 (AUD-003..008)", "hash": "8c87be7ee09b2c26", "substeps": [], "sec": {"exp": "<p>Bit là đơn vị nhị phân 0/1. Trong mô hình máy tính hiện đại dùng ở môn nhập môn, một octet có 8 bit và bài tập thường giả định <code class=\"inline-code\">1 byte = 8 bit</code>. Với C/C++ portable code, kích thước byte được phản ánh bởi <code class=\"inline-code\">CHAR_BIT</code>; không khẳng định mọi implementation C++ đều có byte đúng 8 bit. Đơn vị dữ liệu có thể biểu diễn ký tự, số hoặc một phần lệnh.</p>", "ex": "<p>Theo giả định 8-bit của bài, 2 byte = 16 bit. Một word phụ thuộc kiến trúc; 32-bit/64-bit là ví dụ thường gặp chứ không phải quy tắc duy nhất.</p>", "clar": "<p>Đừng nhầm bit với byte (b vs B). Trong portable C/C++, <code class=\"inline-code\">CHAR_BIT</code> cho biết số bit trong một byte. Dung lượng và tốc độ truyền có thể dùng quy ước thập phân hoặc nhị phân khác nhau.</p>", "ext": "<p>Nhị phân, hex và kích thước word giúp đọc địa chỉ, mask và biểu diễn số.</p>", "check": "<p>16 bit có bao nhiêu byte nếu 1 byte = 8 bit?</p>", "sync": "<ul>\n<li><strong>Học:</strong> bit là 0/1; byte thường gồm 8 bit; phân biệt bit/byte và các bội số theo quy ước môn học.</li>\n<li><strong>Bài:</strong> số bit cần cho các trạng thái; so sánh MB/MiB nếu lớp đề cập.</li>\n<li><strong>Qua:</strong> không nhầm b với B và giải được bài dung lượng đơn giản.</li>\n</ul>"}}, {"id": "ARCH-002", "sort": 111, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Chuyển đổi nhị phân sang thập phân", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["ARCH-001"], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "e753a5e34f4db985", "substeps": [], "sec": {"exp": "<p>Giá trị nhị phân dùng trọng số lũy thừa của 2. Từ phải sang trái, vị trí lần lượt có trọng số 2⁰, 2¹, 2²…</p>", "ex": "<p><code class=\"inline-code\">1011₂ = 1×8 + 0×4 + 1×2 + 1×1 = 11₁₀</code>.</p>", "clar": "<p>Chỉ nhân bit 1 với trọng số tương ứng; bit 0 đóng góp 0. Chỉ số cơ số giúp tránh nhầm <code class=\"inline-code\">1011</code> giữa hệ 2 và hệ 10.</p>", "ext": "<p>Chuyển đổi nhị phân hỗ trợ hiểu mask, địa chỉ và số học máy.</p>", "check": "<p>Đổi <code class=\"inline-code\">11010₂</code> sang thập phân.</p>", "sync": "<ul>\n<li><strong>Học:</strong> giá trị theo lũy thừa của 2.</li>\n<li><strong>Bài:</strong> chuyển số nhị phân 4–8 bit thành thập phân, ghi trọng số từng bit.</li>\n<li><strong>Qua:</strong> đúng ít nhất 8/10 và trình bày được các trọng số.</li>\n</ul>"}}, {"id": "ARCH-003", "sort": 112, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Chuyển thập phân sang nhị phân", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["ARCH-001"], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "9afd03d7cc8cfd4f", "substeps": [], "sec": {"exp": "<p>Đổi số nguyên thập phân sang nhị phân có thể chia liên tiếp cho 2 và đọc số dư từ dưới lên, hoặc phân tích tổng lũy thừa của 2.</p>", "ex": "<p>13 chia 2 cho số dư lần lượt 1,0,1,1 từ dưới lên đọc được <code class=\"inline-code\">1101₂</code>.</p>", "clar": "<p>Phải đọc số dư theo thứ tự ngược với thứ tự tạo ra. Số 0 cần biểu diễn bằng <code class=\"inline-code\">0</code>, không là chuỗi rỗng.</p>", "ext": "<p>Với số thực nhị phân, quy trình khác; trước hết thành thạo số nguyên.</p>", "check": "<p>Chuyển 22 sang nhị phân và kiểm tra ngược bằng trọng số.</p>", "sync": "<ul>\n<li><strong>Học:</strong> chia 2 lấy dư hoặc phân tích tổng lũy thừa.</li>\n<li><strong>Bài:</strong> chuyển số nguyên không âm nhỏ.</li>\n<li><strong>Qua:</strong> kiểm tra ngược nhị phân → thập phân.</li>\n</ul>"}}, {"id": "ARCH-004", "sort": 113, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Hệ thập lục phân", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "1844848a540d40d5", "substeps": [], "sec": {"exp": "<p>Hex dùng 16 ký hiệu 0–9 và A–F; một chữ số hex tương ứng đúng 4 bit. Nó viết gọn chuỗi nhị phân dài.</p>", "ex": "<p><code class=\"inline-code\">0x2F</code> = <code class=\"inline-code\">2×16+15</code> = 47; <code class=\"inline-code\">0xA0</code> là <code class=\"inline-code\">1010 0000₂</code>.</p>", "clar": "<p>A–F biểu diễn giá trị 10–15. Tiền tố <code class=\"inline-code\">0x</code> thường dùng trong code, nhưng cách ghi phụ thuộc ngôn ngữ/công cụ.</p>", "ext": "<p>Hex hữu ích cho địa chỉ, byte, bitmask và dump bộ nhớ.</p>", "check": "<p>Đổi <code class=\"inline-code\">1111 0010₂</code> thành hex.</p>", "sync": "<ul>\n<li><strong>Học:</strong> chữ số 0–9/A–F; mỗi chữ số hex tương ứng 4 bit.</li>\n<li><strong>Bài:</strong> binary ↔ hex và hex ↔ decimal trong các ví dụ nhỏ.</li>\n<li><strong>Qua:</strong> chuyển đổi được không nhầm A–F.</li>\n</ul>"}}, {"id": "ARCH-005", "sort": 114, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Phép toán nhị phân và tràn số", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "cb91979ab0064499", "substeps": [], "sec": {"exp": "<p>Phép cộng nhị phân theo quy tắc cơ số 2; số bit cố định có thể không đủ biểu diễn kết quả, gây overflow/tràn theo quy tắc của biểu diễn được dùng.</p>", "ex": "<p>Với 4 bit unsigned, 1111₂ là 15; cộng 0001₂ tạo kết quả 10000₂ cần 5 bit. Nếu chỉ giữ 4 bit thấp còn 0000 và carry ra ngoài.</p>", "clar": "<p>Carry-out và signed overflow không đồng nghĩa. Với ngôn ngữ như C++, signed integer overflow không được phép giả định là wraparound.</p>", "ext": "<p>Phân biệt số học modular phần cứng với quy tắc ngôn ngữ lập trình.</p>", "check": "<p>Cộng 0111₂ và 0001₂ trên 4 bit; xác định carry và bit kết quả.</p>", "sync": "<ul>\n<li><strong>Học:</strong> cộng nhị phân; số bit hữu hạn; carry và overflow trực quan.</li>\n<li><strong>Bài:</strong> cộng các số bit nhỏ và chỉ ra trường hợp vượt miền biểu diễn.</li>\n<li><strong>Qua:</strong> phân biệt carry với overflow ở các ví dụ trong chương trình.</li>\n</ul>"}}, {"id": "ARCH-006", "sort": 115, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Số nguyên có dấu và bù hai", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "9987a7ceb2424fbf", "substeps": [], "sec": {"exp": "<p>Bù hai biểu diễn số nguyên có dấu trong n bit; giá trị thường nằm trong <code class=\"inline-code\">−2^(n−1)</code> đến <code class=\"inline-code\">2^(n−1)−1</code>. Số âm được tạo từ đảo bit rồi cộng 1 trong quy tắc n bit.</p>", "ex": "<p>Trong 8 bit, +5 là <code class=\"inline-code\">00000101</code>; đảo <code class=\"inline-code\">11111010</code>, cộng 1 được <code class=\"inline-code\">11111011</code> biểu diễn −5.</p>", "clar": "<p>Miền signed lệch: có một giá trị âm nhiều hơn giá trị dương. Tràn xảy ra khi kết quả toán học ra ngoài miền biểu diễn.</p>", "ext": "<p>Bù hai giúp hiểu phép cộng/so sánh ở mức bit.</p>", "check": "<p>Với 8 bit, nêu miền số nguyên có dấu và biểu diễn −1.</p>", "sync": "<ul>\n<li><strong>Học:</strong> biểu diễn số âm bằng two's complement; đảo bit + 1; miền biểu diễn với n bit.</li>\n<li><strong>Bài:</strong> mã hóa và giải mã số dương/âm 8 bit.</li>\n<li><strong>Qua:</strong> tự kiểm tra miền số và phát hiện tràn khi cộng.</li>\n</ul>"}}, {"id": "ARCH-007", "sort": 116, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Số thực dấu phẩy động", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "74617d33745048d7", "substeps": [], "sec": {"exp": "<p>Floating-point biểu diễn gần đúng nhiều số thực bằng dấu, exponent và significand/fraction. Một số thập phân hữu hạn trong cơ số 10 có thể không biểu diễn chính xác bằng nhị phân.</p>", "ex": "<p>Trong nhiều hệ binary floating point, <code class=\"inline-code\">0.1 + 0.2</code> có thể không bằng chính xác <code class=\"inline-code\">0.3</code> do biểu diễn gần đúng.</p>", "clar": "<p>Không kết luận mọi phép tính double đều sai; sai số thường nhỏ nhưng cần phù hợp mục tiêu. Khi so sánh kết quả đo lường, có thể dùng tolerance có lý do.</p>", "ext": "<p>Tìm hiểu rounding, precision, underflow/overflow khi bài yêu cầu; IEEE 754 rất phổ biến nhưng chi tiết phụ thuộc định dạng.</p>", "check": "<p>Vì sao không nên luôn so sánh kết quả double bằng <code class=\"inline-code\">==</code> trong bài toán số gần đúng?</p>", "sync": "<ul>\n<li><strong>Học:</strong> dấu, phần mũ, phần trị theo mô hình; độ chính xác hữu hạn và sai số làm tròn.</li>\n<li><strong>Bài:</strong> giải thích vì sao một số thập phân không biểu diễn chính xác nhị phân.</li>\n<li><strong>Qua:</strong> nêu được khác biệt giữa “sai do code” và sai số biểu diễn.</li>\n</ul>"}}, {"id": "ARCH-008", "sort": 117, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Đại số Boolean", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "b5d603db8809f06a", "substeps": [], "sec": {"exp": "<p>Đại số Boolean thao tác trên giá trị true/false; NOT đảo, AND cần cả hai đúng, OR cần ít nhất một đúng.</p>", "ex": "<p><code class=\"inline-code\">A AND NOT B</code> đúng chỉ khi A=1 và B=0.</p>", "clar": "<p>Phép toán Boolean logic khác phép cộng số thông thường. Ký hiệu <code class=\"inline-code\">+</code>, <code class=\"inline-code\">·</code>, gạch trên có thể thay đổi theo giáo trình.</p>", "ext": "<p>Boolean algebra rút gọn mạch logic và giúp hiểu điều kiện trong code.</p>", "check": "<p>Tạo bảng chân trị cho <code class=\"inline-code\">A OR (NOT A)</code>.</p>", "sync": "<ul>\n<li><strong>Học:</strong> AND, OR, NOT; bảng chân trị; biểu thức Boolean.</li>\n<li><strong>Bài:</strong> tính đầu ra của biểu thức từ đầu vào 0/1.</li>\n<li><strong>Qua:</strong> tạo bảng chân trị đầy đủ cho biểu thức nhỏ.</li>\n</ul>"}}, {"id": "ARCH-009", "sort": 118, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Cổng logic và mạch tổ hợp", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "bd3f8ecc80d84aac", "substeps": [], "sec": {"exp": "<p>Cổng logic thực hiện phép Boolean trên tín hiệu bit. Mạch tổ hợp output phụ thuộc input hiện tại, không lưu trạng thái trước đó.</p>", "ex": "<p>AND gate cho output 1 chỉ khi hai input đều 1; XOR cho 1 khi hai input khác nhau.</p>", "clar": "<p>Truth table phải bao phủ mọi tổ hợp input. Không nhầm mạch tổ hợp với mạch tuần tự có bộ nhớ.</p>", "ext": "<p>Kết hợp cổng tạo adder, comparator, mux và các thành phần datapath.</p>", "check": "<p>Với cổng XOR, output ra sao khi input 0,0; 0,1; 1,1?</p>", "sync": "<ul>\n<li><strong>Học:</strong> AND/OR/NOT/XOR và kết nối cổng; mạch tổ hợp không giữ trạng thái.</li>\n<li><strong>Bài:</strong> vẽ mạch đơn giản từ biểu thức và tính output.</li>\n<li><strong>Qua:</strong> lần được input qua từng cổng.</li>\n</ul>"}}, {"id": "ARCH-010", "sort": 119, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Mạch tuần tự, clock và trạng thái", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "a637972603a88b3c", "substeps": [], "sec": {"exp": "<p>Mạch tuần tự có trạng thái; output có thể phụ thuộc input hiện tại và trạng thái trước đó. Clock giúp đồng bộ việc cập nhật trạng thái trong thiết kế đồng bộ phổ biến.</p>", "ex": "<p>Một đèn bật/tắt lưu trạng thái: mỗi xung clock có thể đảo trạng thái nếu tín hiệu enable bật.</p>", "clar": "<p>Không phải mọi mạch tuần tự đều thay đổi chỉ ở cạnh clock; phân biệt mô hình thiết kế đang học. Setup/hold timing là chủ đề sâu hơn.</p>", "ext": "<p>State machine mô hình hóa bộ điều khiển và giao thức đơn giản.</p>", "check": "<p>Vì sao mạch sequential có thể nhớ giá trị từ chu kỳ trước?</p>", "sync": "<ul>\n<li><strong>Học:</strong> khác biệt tổ hợp/tuần tự; trạng thái được giữ; ý tưởng clock.</li>\n<li><strong>Bài:</strong> mô tả tại sao mạch có bộ nhớ khác mạch chỉ tính kết quả đầu vào hiện tại.</li>\n<li><strong>Qua:</strong> giải thích được khái niệm trạng thái mà không cần thuộc cấu tạo cổng chi tiết.</li>\n</ul>"}}, {"id": "ARCH-011", "sort": 120, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Flip-flop, register và bộ đếm", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "39cd51aca2969cfe", "substeps": [], "sec": {"exp": "<p>Flip-flop lưu một bit trạng thái; register là nhóm bit lưu một giá trị; counter là mạch trạng thái đếm theo xung/tín hiệu.</p>", "ex": "<p>Register 8 bit có thể giữ một giá trị nhị phân 8 bit; counter tăng 1 mỗi clock khi enable.</p>", "clar": "<p>Register không đồng nghĩa với một biến C++: register vật lý nằm trong datapath, còn compiler có thể ánh xạ biến khác nhau.</p>", "ext": "<p>Registers giữ toán hạng, địa chỉ và trạng thái tạm trong CPU.</p>", "check": "<p>Có bao nhiêu trạng thái bit khác nhau mà 4 bit có thể biểu diễn?</p>", "sync": "<ul>\n<li><strong>Học:</strong> register lưu nhiều bit; cập nhật theo tín hiệu; bộ đếm là trạng thái tuần tự.</li>\n<li><strong>Bài:</strong> mô phỏng register 4 bit qua vài nhịp clock.</li>\n<li><strong>Qua:</strong> theo dõi được trạng thái trước/sau.</li>\n</ul>"}}, {"id": "ARCH-012", "sort": 121, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Địa chỉ bộ nhớ và RAM", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "10bb25e152a4d92b", "substeps": [], "sec": {"exp": "<p>RAM lưu dữ liệu có thể đọc/ghi trong khi hệ thống chạy; địa chỉ xác định vị trí/đơn vị dữ liệu. Không gian địa chỉ phụ thuộc kiến trúc và cơ chế ánh xạ.</p>", "ex": "<p>Nếu địa chỉ byte tăng 1, nó thường trỏ tới byte kế tiếp trong mô hình byte-addressed memory.</p>", "clar": "<p>Địa chỉ ảo của process không nhất thiết bằng địa chỉ vật lý RAM. RAM volatile thường mất nội dung khi tắt nguồn, khác lưu trữ lâu dài.</p>", "ext": "<p>Memory hierarchy tối ưu tốc độ, dung lượng và giá thành.</p>", "check": "<p>Phân biệt địa chỉ ảo, địa chỉ vật lý và nội dung ở địa chỉ.</p>", "sync": "<ul>\n<li><strong>Học:</strong> ô nhớ, địa chỉ, dữ liệu; load/store trực quan; dung lượng và số địa chỉ.</li>\n<li><strong>Bài:</strong> với số bit địa chỉ cho trước, tính số địa chỉ có thể biểu diễn.</li>\n<li><strong>Qua:</strong> không nhầm địa chỉ với dữ liệu chứa tại địa chỉ.</li>\n</ul>"}}, {"id": "ARCH-013", "sort": 122, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "ALU và datapath", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["ARCH-018"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "a90ebcb0461e82b8", "substeps": [], "sec": {"exp": "<p>ALU thực hiện phép toán số học/logic; datapath là đường đi các giá trị giữa registers, ALU và bộ nhớ dưới sự điều khiển của control unit.</p>", "ex": "<p>Một lệnh cộng có thể đọc hai register, đưa giá trị vào ALU, ghi kết quả trở lại register đích.</p>", "clar": "<p>ALU không tự quyết định toàn bộ chương trình; tín hiệu điều khiển xác định phép toán và nguồn/đích dữ liệu.</p>", "ext": "<p>Sơ đồ datapath giúp liên hệ lệnh assembly với hoạt động phần cứng.</p>", "check": "<p>Vẽ luồng dữ liệu cho phép cộng hai register.</p>", "sync": "<ul>\n<li><strong>Học:</strong> ALU thực hiện phép toán; thanh ghi cung cấp dữ liệu; tín hiệu điều khiển chọn thao tác.</li>\n<li><strong>Bài:</strong> vẽ đường đi của hai toán hạng qua ALU đến kết quả.</li>\n<li><strong>Qua:</strong> trả lời được khối nào nhận input, thực hiện biến đổi, đưa output cho đâu.</li>\n</ul>"}}, {"id": "ARCH-014", "sort": 123, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Tập lệnh và assembly nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["ARCH-018"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "fd0b17713a03bec3", "substeps": [], "sec": {"exp": "<p>Instruction set architecture (ISA) định nghĩa tập lệnh, registers và semantics mà phần mềm nhìn thấy; assembly là cách ghi lệnh gần với ISA.</p>", "ex": "<p>Một lệnh cộng minh họa có thể là <code class=\"inline-code\">ADD R1, R2, R3</code> theo cú pháp kiến trúc cụ thể; ý nghĩa chính xác phụ thuộc ISA.</p>", "clar": "<p>Không có một cú pháp assembly duy nhất cho mọi CPU. Lệnh assembly biểu diễn thao tác kiến trúc, compiler có thể sinh nhiều lệnh khác nhau.</p>", "ext": "<p>So sánh RISC/CISC ở mức khái niệm nếu nằm trong đề cương trường.</p>", "check": "<p>Vì sao chương trình assembly cho hai ISA khác nhau không nhất thiết chạy được chéo?</p>", "sync": "<ul>\n<li><strong>Học:</strong> instruction là lệnh máy; opcode/operand ở mức khái niệm; assembly gần với tập lệnh hơn C++.</li>\n<li><strong>Bài:</strong> đọc vài lệnh giả lập <code class=\"inline-code\">LOAD</code>, <code class=\"inline-code\">ADD</code>, <code class=\"inline-code\">STORE</code>.</li>\n<li><strong>Qua:</strong> lần được thay đổi register/bộ nhớ trong chuỗi lệnh nhỏ.</li>\n</ul>"}}, {"id": "ARCH-015", "sort": 124, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Fetch–decode–execute", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["ARCH-018"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "31455e4100ca6f14", "substeps": [], "sec": {"exp": "<p>Mô hình fetch–decode–execute mô tả CPU lấy lệnh, giải mã ý nghĩa, thực thi rồi cập nhật trạng thái theo ISA. CPU thực tế có nhiều tối ưu phức tạp hơn mô hình tuần tự.</p>", "ex": "<p>PC chỉ tới địa chỉ lệnh kế tiếp; CPU fetch lệnh, decode toán tử/toán hạng rồi thực hiện phép cộng hoặc load/store tương ứng.</p>", "clar": "<p>Không phải mọi lệnh thực thi một chu kỳ; pipeline, cache miss và vi kiến trúc ảnh hưởng thời gian. Mô hình đơn giản là nền tảng chứ không phải ảnh chụp mọi CPU.</p>", "ext": "<p>Liên hệ program counter, instruction register và branch trong ví dụ nhỏ.</p>", "check": "<p>Kể đúng thứ tự ba bước cơ bản và vai trò của PC.</p>", "sync": "<ul>\n<li><strong>Học:</strong> lấy lệnh, giải mã, thực hiện; program counter ở mức trực quan; vòng đời lệnh.</li>\n<li><strong>Bài:</strong> trace 3–5 lệnh đơn giản và thay đổi PC/register.</li>\n<li><strong>Qua:</strong> giải thích được vì sao CPU không “hiểu trực tiếp” mã C++ nguồn.</li>\n</ul>"}}, {"id": "ARCH-016", "sort": 125, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "CPU, xung nhịp và hiệu năng", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["ARCH-018"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "8fbdbcb2773a300a", "substeps": [], "sec": {"exp": "<p>Clock rate là số chu kỳ mỗi giây nhưng không một mình quyết định hiệu năng. Thời gian chạy còn phụ thuộc số lệnh, CPI/IPC, bộ nhớ, workload và kiến trúc.</p>", "ex": "<p>Hai CPU có xung khác nhau có thể chạy workload A nhanh/chậm khác nhau vì số chu kỳ mỗi lệnh và cache khác nhau.</p>", "clar": "<p>GHz cao hơn không luôn nghĩa là máy nhanh hơn. Benchmark cần cùng workload và đo đạc phù hợp; công suất/nhiệt cũng có thể ảnh hưởng.</p>", "ext": "<p>Phương trình CPU time thường mô tả bằng instruction count × cycles per instruction × cycle time.</p>", "check": "<p>Nêu hai yếu tố ngoài GHz có thể ảnh hưởng thời gian chạy.</p>", "sync": "<ul>\n<li><strong>Học:</strong> clock không đơn giản bằng số lệnh/giây; hiệu năng phụ thuộc lệnh, dữ liệu, bộ nhớ và thực thi.</li>\n<li><strong>Bài:</strong> so sánh hai tình huống có cùng xung nhịp nhưng công việc khác nhau.</li>\n<li><strong>Qua:</strong> tránh kết luận CPU nhanh hơn chỉ dựa trên một thông số.</li>\n</ul>"}}, {"id": "ARCH-017", "sort": 126, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Phân cấp bộ nhớ và cache", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "da7731011e8ceacc", "substeps": [], "sec": {"exp": "<p>Bộ nhớ phân cấp gồm registers, cache, RAM và lưu trữ với tốc độ/dung lượng/chi phí khác nhau. Cache giữ bản sao dữ liệu có khả năng dùng lại để giảm độ trễ trung bình.</p>", "ex": "<p>Duyệt mảng tuần tự thường tận dụng locality tốt hơn truy cập ngẫu nhiên vào nhiều vị trí rời rạc.</p>", "clar": "<p>Cache hit/miss ảnh hưởng thời gian; cache không thay thế RAM bền vững. Dữ liệu trong cache có thể được quản lý nhất quán theo giao thức cụ thể.</p>", "ext": "<p>Spatial/temporal locality giúp giải thích vì sao layout và access pattern ảnh hưởng hiệu năng.</p>", "check": "<p>Phân biệt temporal locality và spatial locality bằng ví dụ.</p>", "sync": "<ul>\n<li><strong>Học:</strong> register/cache/RAM/storage; độ trễ, dung lượng và chi phí; locality.</li>\n<li><strong>Bài:</strong> giải thích bằng ví dụ lặp trên mảng vì sao truy cập liên tiếp có thể tận dụng locality.</li>\n<li><strong>Qua:</strong> phân biệt cache hit/miss và mô tả trade-off cơ bản.</li>\n</ul>"}}, {"id": "ARCH-018", "sort": 127, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & C
