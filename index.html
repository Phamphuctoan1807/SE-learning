, "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "0c5eff1fd4232bc7", "substeps": [], "sec": {"exp": "<p>JOIN kết hợp hàng từ bảng theo điều kiện liên kết. INNER JOIN chỉ giữ cặp có match; LEFT JOIN giữ mọi hàng bên trái và điền NULL ở cột bên phải khi không match.</p>", "ex": "<p>Student JOIN Borrowing cho sinh viên có lượt mượn; LEFT JOIN cho phép liệt kê cả sinh viên chưa mượn sách.</p>", "clar": "<p>Sai điều kiện JOIN có thể tạo nhiều hàng ngoài ý muốn hoặc Cartesian product. Kết quả phụ thuộc cardinality của quan hệ.</p>", "ext": "<p>Chú ý filter ở WHERE với cột bên phải có thể vô tình loại hàng NULL của LEFT JOIN.</p>", "check": "<p>Muốn hiển thị tất cả sinh viên kể cả chưa mượn, chọn loại JOIN nào?</p>", "sync": "<ul>\n<li>Bài: ghép người mượn với sách; so sánh INNER JOIN và LEFT JOIN.</li>\n<li>Đạt: dự đoán được chuyện gì xảy ra khi không có bản ghi phù hợp.</li>\n</ul>"}}, {"id": "DB-010", "sort": 179, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK4", "sup": false, "title": "Ràng buộc dữ liệu", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "7820944639ac1bc0", "substeps": [], "sec": {"exp": "<p>Constraint bảo vệ quy tắc ở tầng dữ liệu: NOT NULL, UNIQUE, CHECK, foreign key. Nó ngăn dữ liệu sai kể cả khi có nhiều client khác nhau ghi vào database.</p>", "ex": "<p><code class=\"inline-code\">CHECK(score &gt;= 0 AND score &lt;= 10)</code> bảo vệ miền điểm trong schema nếu DBMS hỗ trợ và constraint được áp dụng.</p>", "clar": "<p>Validation ở ứng dụng giúp thông báo sớm, nhưng DB constraint bảo vệ tính toàn vẹn cuối cùng. Constraint không thay thế phân quyền hoặc xác thực.</p>", "ext": "<p>Các constraint cần được test như một phần hợp đồng dữ liệu.</p>", "check": "<p>Tại sao validation chỉ ở giao diện có thể chưa đủ?</p>", "sync": "<ul>\n<li>Bài: <code class=\"inline-code\">NOT NULL</code>, <code class=\"inline-code\">UNIQUE</code>, <code class=\"inline-code\">CHECK</code>, foreign key theo hệ quản trị dùng.</li>\n<li>Đạt: chỉ ra quy tắc nào nên được đảm bảo ở tầng database.</li>\n</ul>"}}, {"id": "DB-011", "sort": 180, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK4", "sup": false, "title": "Thiết kế schema và chuẩn hóa nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "8bae0367034e902b", "substeps": [], "sec": {"exp": "<p>Schema là mô hình các bảng, cột, khóa và quan hệ. Chuẩn hóa nhập môn giảm lặp dữ liệu gây bất thường khi insert/update/delete.</p>", "ex": "<p>Nếu tên tác giả được lặp trong mọi hàng Book và tác giả đổi tên, dữ liệu có thể lệch; tách Author và liên kết bằng author_id nếu quan hệ phù hợp.</p>", "clar": "<p>Không phải càng nhiều bảng càng tốt; mô hình phải theo cardinality và yêu cầu truy vấn. Chuẩn hóa có đánh đổi với độ phức tạp join.</p>", "ext": "<p>Thiết kế schema bắt đầu bằng entity, thuộc tính, quan hệ, sau đó kiểm tra các thao tác thường dùng.</p>", "check": "<p>Đưa ví dụ một bất thường cập nhật do dữ liệu lặp.</p>", "sync": "<ul>\n<li>Bài: phát hiện lặp thông tin và tách bảng với khóa phù hợp.</li>\n<li>Đạt: nêu được một bất thường cập nhật do thiết kế dữ liệu kém.</li>\n</ul>"}}, {"id": "DB-012", "sort": 181, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK4", "sup": false, "title": "Index và chi phí truy vấn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "387e1bba35e1fe4f", "substeps": [], "sec": {"exp": "<p>Index là cấu trúc phụ giúp định vị hàng nhanh hơn cho truy vấn phù hợp, đổi lại cần dung lượng và chi phí duy trì khi ghi dữ liệu.</p>", "ex": "<p>Index trên <code class=\"inline-code\">Student(id)</code> giúp lookup theo id nếu đó là đường truy vấn phổ biến; index trên mọi cột không mặc nhiên tốt hơn.</p>", "clar": "<p>Index không bảo đảm query nhanh trong mọi trường hợp; planner có thể chọn scan nếu phù hợp. Kiểu index và hành vi phụ thuộc DBMS.</p>", "ext": "<p>Dùng EXPLAIN/EXPLAIN ANALYZE theo DBMS để đo, cẩn thận vì ANALYZE có thể thực thi query.</p>", "check": "<p>Nêu hai chi phí của việc tạo quá nhiều index.</p>", "sync": "<ul>\n<li>Bài: giải thích index như mục tra cứu; thử EXPLAIN nếu có môi trường.</li>\n<li>Đạt: hiểu index có chi phí cập nhật/dung lượng, không phải thêm index vào mọi cột.</li>\n</ul>"}}, {"id": "DB-013", "sort": 182, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK4", "sup": false, "title": "Transaction và ACID ở mức cần dùng", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "c2e23c0f6428f7e3", "substeps": [{"substep_id": "DB-013.part-1", "title": "part-1: transaction", "check": "Gom nhiều thao tác thành một đơn vị logic."}, {"substep_id": "DB-013.part-2", "title": "part-2: commit / rollback", "check": "Xác định điểm commit và rollback khi bước trung gian thất bại."}, {"substep_id": "DB-013.part-3", "title": "part-3: ACID qua ví dụ", "check": "Ví dụ riêng cho Atomicity, Consistency, Isolation, Durability và ghi rõ DBMS."}], "sec": {"exp": "<p>Transaction gom các thao tác thành đơn vị logic có thể commit hoặc rollback. ACID mô tả atomicity, consistency, isolation, durability ở nhiều hệ quản trị với chi tiết triển khai riêng.</p>", "ex": "<p>Chuyển tiền: trừ tài khoản A và cộng B cần cùng thành công; nếu bước thứ hai thất bại, không muốn chỉ hoàn thành nửa nghiệp vụ.</p>", "clar": "<p>Transaction không tự làm mọi race condition biến mất; isolation level ảnh hưởng hiện tượng đồng thời. Durability phụ thuộc hệ thống lưu trữ và cấu hình.</p>", "ext": "<p>Hiểu rollback, isolation và retry trước khi xử lý giao dịch trong app thực tế.</p>", "check": "<p>Trong nghiệp vụ cập nhật hai bảng, vì sao commit giữa hai bước có thể nguy hiểm?</p>", "sync": "<ul>\n<li>Bài: mô phỏng nghiệp vụ cần cập nhật nhiều bảng; xác định điểm commit/rollback.</li>\n<li>Đạt: giải thích nguy cơ trạng thái nửa hoàn thành.</li>\n</ul>"}}, {"id": "DB-014", "sort": 183, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK4", "sup": false, "title": "SQL injection và truy vấn tham số hóa", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SEC-004"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "75a4b8f682b9328b", "substeps": [], "sec": {"exp": "<p>SQL injection xảy ra khi input không tin cậy bị ghép vào câu SQL như cú pháp. Parameterized query truyền giá trị tách khỏi cấu trúc câu lệnh, giảm nguy cơ input đổi nghĩa truy vấn.</p>", "ex": "<p>Dùng <code class=\"inline-code\">WHERE username = ?</code> với parameter thay vì tạo chuỗi <code class=\"inline-code\">\"...\" + userInput + \"...\"</code>. Cú pháp placeholder phụ thuộc driver.</p>", "clar": "<p>Escaping thủ công dễ sai; parameterization là lựa chọn chuẩn cho dữ liệu. Tên bảng/cột động thường không thể bind như value và phải whitelist nếu cần.</p>", "ext": "<p>Kết hợp parameterization với quyền database tối thiểu.</p>", "check": "<p>Vì sao đặt input vào parameter an toàn hơn nối trực tiếp chuỗi SQL?</p>", "sync": "<ul>\n<li>Bài: so sánh nối chuỗi SQL với parameterized query ở ví dụ giả lập.</li>\n<li>Đạt: hiểu input người dùng không nên được ghép trực tiếp vào câu SQL.</li>\n</ul>"}}, {"id": "DB-015", "sort": 184, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK4", "sup": false, "title": "Migration, seed data và backup căn bản", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "22e654d1611804e6", "substeps": [], "sec": {"exp": "<p>Migration ghi lại các thay đổi cấu trúc theo phiên bản; seed data tạo dữ liệu ban đầu; backup hỗ trợ phục hồi. Chúng giúp dựng môi trường giống nhau giữa máy dev/test.</p>", "ex": "<p>Migration tạo bảng Book rồi migration sau thêm <code class=\"inline-code\">status</code>; seed thêm vài sách mẫu; backup cần có quy trình khôi phục được thử nghiệm.</p>", "clar": "<p>Backup chỉ có ích nếu restore thành công. Migration cần được version control và có chiến lược khi thay đổi không tương thích.</p>", "ext": "<p>Trong production, backup/restore và migration cần kế hoạch, quyền và kiểm tra riêng.</p>", "check": "<p>Khác biệt giữa backup và seed data là gì?</p>", "sync": "<ul>\n<li>Bài: ghi lại thay đổi schema; tạo dữ liệu mẫu; mô tả cách khôi phục.</li>\n<li>Đạt: thành viên khác có thể dựng database từ hướng dẫn.</li>\n</ul>"}}, {"id": "DB-016", "sort": 185, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK4", "sup": false, "title": "Mini project SQL", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "00f1707bdce3cb6c", "substeps": [], "sec": {"exp": "<p>Mini project kiểm tra SQL bằng schema và truy vấn có yêu cầu nghiệp vụ; kết quả phải được đối chiếu dữ liệu mẫu và giải thích giả định.</p>", "ex": "<p>Tạo Student, Book, Borrowing và Author; viết query tìm sách đang mượn, thống kê số lượt mượn mỗi sinh viên và danh sách sách chưa mượn.</p>", "clar": "<p>Không tính là đúng chỉ vì query chạy; cần dữ liệu cover edge cases và output expected. Ghi DBMS dùng vì cú pháp có khác biệt.</p>", "ext": "<p>README lưu schema, migration/seed, query mẫu, kết quả và hạn chế.</p>", "check": "<p>Chọn một query JOIN + GROUP BY và lập dữ liệu nhỏ kiểm chứng bằng tay.</p>", "sync": "<ul>\n<li>Thiết kế database cho quản lý thư viện hoặc đơn hàng; ít nhất 4 bảng khi hợp lý; có khóa; 10 truy vấn bao gồm join/grouping; ghi giải thích schema và các giả định.</li>\n<li>Qua: kết quả truy vấn được kiểm tra trên dữ liệu mẫu, không chỉ tồn tại cú pháp.</li>\n</ul>"}}, {"id": "OS-001", "sort": 186, "pfx": "OS", "subj": "OS", "subjName": "Hệ Điều Hành", "cat": "Computer Systems", "uitMap": "IT007 (Hệ điều hành)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "12. Hệ điều hành (OS)", "sem": "HK4", "sup": false, "title": "OS làm gì", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "9835da1f0ec04f7b", "substeps": [], "sec": {"exp": "<p>Hệ điều hành quản lý tài nguyên phần cứng và cung cấp dịch vụ cho chương trình: process, bộ nhớ, file, thiết bị và quyền. Kernel là phần lõi chạy với đặc quyền cao hơn user code.</p>", "ex": "<p>Khi bạn mở chương trình, OS tạo/thiết lập process, cấp tài nguyên và điều phối CPU.</p>", "clar": "<p>OS không chỉ là giao diện desktop; hệ điều hành không có GUI vẫn có thể chạy process và cung cấp service.</p>", "ext": "<p>Các abstraction của OS giúp nhiều chương trình cùng dùng phần cứng an toàn hơn.</p>", "check": "<p>Nêu ba loại tài nguyên OS phải quản lý.</p>", "sync": "<ul>\n<li>Vai trò quản lý CPU, bộ nhớ, file và thiết bị; user program so với kernel ở mức trực quan.</li>\n<li>Bài: vẽ luồng mở/chạy một chương trình.</li>\n</ul>"}}, {"id": "OS-002", "sort": 187, "pfx": "OS", "subj": "OS", "subjName": "Hệ Điều Hành", "cat": "Computer Systems", "uitMap": "IT007 (Hệ điều hành)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "12. Hệ điều hành (OS)", "sem": "HK4", "sup": false, "title": "Process và program", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "182866f57996a2f4", "substeps": [], "sec": {"exp": "<p>Program là mã/chương trình được lưu; process là một instance đang thực thi với trạng thái, bộ nhớ và tài nguyên. Có thể có nhiều process dùng cùng một executable.</p>", "ex": "<p>Mở hai cửa sổ của cùng ứng dụng có thể tạo một hoặc nhiều process tùy ứng dụng và kiến trúc; không đồng nhất tên chương trình với PID.</p>", "clar": "<p>Process có thể kết thúc, treo hoặc bị OS dừng; executable file vẫn có thể còn trên đĩa.</p>", "ext": "<p>Process isolation là nền tảng an toàn và quản lý lỗi.</p>", "check": "<p>Một executable có thể được chạy nhiều lần tạo nhiều process không?</p>", "sync": "<ul>\n<li>Program là nội dung; process là chương trình đang thực thi với trạng thái/tài nguyên.</li>\n<li>Bài: phân biệt nhiều process chạy cùng chương trình.</li>\n</ul>"}}, {"id": "OS-003", "sort": 188, "pfx": "OS", "subj": "OS", "subjName": "Hệ Điều Hành", "cat": "Computer Systems", "uitMap": "IT007 (Hệ điều hành)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "12. Hệ điều hành (OS)", "sem": "HK4", "sup": false, "title": "Thread", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "9cd8ab9575b4ce2f", "substeps": [], "sec": {"exp": "<p>Thread là đơn vị thực thi trong một process. Các thread của cùng process thường chia sẻ không gian địa chỉ/tài nguyên, nhưng mỗi thread có execution state và stack riêng.</p>", "ex": "<p>Ứng dụng có thread giao diện và thread tải dữ liệu; nếu cập nhật dữ liệu chia sẻ, cần nghĩ tới đồng bộ.</p>", "clar": "<p>Concurrency là các tác vụ có tiến độ xen kẽ; parallelism là thực thi cùng lúc trên nhiều đơn vị xử lý. Hai khái niệm liên quan nhưng không đồng nghĩa.</p>", "ext": "<p>Chỉ học tạo thread sau khi hiểu race condition và synchronization.</p>", "check": "<p>Thread trong cùng process thường chia sẻ loại tài nguyên nào?</p>", "sync": "<ul>\n<li>Thread trong process; chia sẻ một số tài nguyên; đồng thời/concurrency không có nghĩa luôn chạy song song.</li>\n<li>Bài: giải thích ví dụ app UI và worker.</li>\n</ul>"}}, {"id": "OS-004", "sort": 189, "pfx": "OS", "subj": "OS", "subjName": "Hệ Điều Hành", "cat": "Computer Systems", "uitMap": "IT007 (Hệ điều hành)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "12. Hệ điều hành (OS)", "sem": "HK4", "sup": false, "title": "Scheduling và context switch", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "5d9a59c796769736", "substeps": [], "sec": {"exp": "<p>Scheduler quyết định thread/process nào được cấp CPU. Context switch lưu/khôi phục trạng thái để chuyển thực thi, có chi phí nhất định.</p>", "ex": "<p>Hai tác vụ A/B có thể được scheduler cho chạy xen kẽ mỗi lát thời gian, tạo cảm giác đồng thời trên một core.</p>", "clar": "<p>Một thread “đã runnable” không có nghĩa đang chạy; scheduler chính sách khác nhau theo OS/workload. Context switch không nhất thiết chỉ xảy ra khi hết time slice.</p>", "ext": "<p>Fairness, latency, throughput và priority là các tiêu chí đánh đổi.</p>", "check": "<p>Context switch giúp đạt được điều gì và có chi phí gì?</p>", "sync": "<ul>\n<li>CPU time, chuyển ngữ cảnh, fairness/latency ở mức khái niệm.</li>\n<li>Bài: trace lịch chạy đơn giản.</li>\n</ul>"}}, {"id": "OS-005", "sort": 190, "pfx": "OS", "subj": "OS", "subjName": "Hệ Điều Hành", "cat": "Computer Systems", "uitMap": "IT007 (Hệ điều hành)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "12. Hệ điều hành (OS)", "sem": "HK4", "sup": false, "title": "Race condition", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f2dceb750d1d2bee", "substeps": [], "sec": {"exp": "<p>Race condition xảy ra khi kết quả phụ thuộc vào thứ tự thực thi tương đối của các thao tác, thường khi nhiều luồng dùng shared state mà không đồng bộ đúng.</p>", "ex": "<p>Hai thread cùng đọc <code class=\"inline-code\">count=0</code>, mỗi thread cộng 1 rồi ghi; kết quả cuối có thể 1 thay vì 2 nếu các bước xen kẽ mất cập nhật.</p>", "clar": "<p>Một lần chạy cho kết quả đúng không chứng minh không có race. Data race trong C++ là vấn đề nghiêm trọng và có thể dẫn tới undefined behavior.</p>", "ext": "<p>Mutex/atomic và thiết kế giảm shared mutable state là công cụ giải quyết khác nhau.</p>", "check": "<p>Trace cách hai phép tăng có thể làm mất một cập nhật.</p>", "sync": "<ul>\n<li>Kết quả phụ thuộc vào thứ tự interleaving; shared state.</li>\n<li>Bài: phân tích tăng biến dùng chung trong hai thread giả lập.</li>\n</ul>"}}, {"id": "OS-006", "sort": 191, "pfx": "OS", "subj": "OS", "subjName": "Hệ Điều Hành", "cat": "Computer Systems", "uitMap": "IT007 (Hệ điều hành)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "12. Hệ điều hành (OS)", "sem": "HK4", "sup": false, "title": "Mutex, lock và deadlock nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "be86b1bde92d14c8", "substeps": [], "sec": {"exp": "<p>Mutex/lock bảo vệ critical section để các thread không cùng thực thi vùng dữ liệu không an toàn theo một protocol. Deadlock có thể xảy ra khi các thread chờ tài nguyên lẫn nhau theo điều kiện thích hợp.</p>", "ex": "<p>Thread A giữ Lock1 chờ Lock2, thread B giữ Lock2 chờ Lock1 — tạo vòng chờ.</p>", "clar": "<p>Lock phải được mở trong mọi đường thực thi; RAII lock guard giảm rủi ro quên unlock. Thêm mutex không đúng nơi có thể vẫn sai hoặc làm deadlock.</p>", "ext": "<p>Thứ tự khóa nhất quán và giảm vùng critical section giúp hạ nguy cơ.</p>", "check": "<p>Vẽ dependency wait-for hai thread để giải thích deadlock.</p>", "sync": "<ul>\n<li>Đồng bộ; critical section; deadlock là tình huống chờ lẫn nhau theo điều kiện phù hợp.</li>\n<li>Bài: xác định shared data và cách bảo vệ.</li>\n</ul>"}}, {"id": "OS-007", "sort": 192, "pfx": "OS", "subj": "OS", "subjName": "Hệ Điều Hành", "cat": "Computer Systems", "uitMap": "IT007 (Hệ điều hành)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "12. Hệ điều hành (OS)", "sem": "HK4", "sup": false, "title": "Bộ nhớ ảo và không gian địa chỉ", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "0c6d570237e5cd36", "substeps": [], "sec": {"exp": "<p>Bộ nhớ ảo cung cấp cho mỗi process một không gian địa chỉ riêng; OS và phần cứng ánh xạ sang bộ nhớ vật lý/page khi cần. Nó hỗ trợ cô lập và quản lý bộ nhớ.</p>", "ex": "<p>Hai process có thể dùng địa chỉ ảo cùng số nhưng được ánh xạ tới trang vật lý khác nhau.</p>", "clar": "<p>Địa chỉ ảo không tự đại diện vị trí vật lý; truy cập trang không hợp lệ có thể sinh fault. Virtual memory không nghĩa mọi dữ liệu đều đang nằm trong RAM.</p>", "ext": "<p>Paging, page fault và TLB mở rộng giải thích hiệu năng memory access.</p>", "check": "<p>Vì sao hai process không nên được tự do đọc địa chỉ bộ nhớ của nhau?</p>", "sync": "<ul>\n<li>Process có view địa chỉ; mapping; không coi địa chỉ ảo là địa chỉ RAM trực tiếp.</li>\n<li>Bài: giải thích ý nghĩa cô lập bộ nhớ ở mức khái niệm.</li>\n</ul>"}}, {"id": "OS-008", "sort": 193, "pfx": "OS", "subj": "OS", "subjName": "Hệ Điều Hành", "cat": "Computer Systems", "uitMap": "IT007 (Hệ điều hành)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "12. Hệ điều hành (OS)", "sem": "HK4", "sup": false, "title": "Stack, heap và lỗi bộ nhớ", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "71611ebd33a4db21", "substeps": [], "sec": {"exp": "<p>Stack thường chứa frame lời gọi/hạng mục lifetime ngắn; heap dùng cho cấp phát động theo mô hình phổ biến. Các lỗi gồm leak, use-after-free, buffer overflow và dangling reference/pointer.</p>", "ex": "<p>Nếu trả pointer tới biến local đã hết lifetime, caller có thể đọc vùng nhớ không còn hợp lệ. Dùng vector/unique_ptr giúp tự quản lý lifetime trong các mẫu phù hợp.</p>", "clar": "<p>Stack/heap là cách triển khai phổ biến, không phải quy tắc tuyệt đối cho vị trí mọi object. Lỗi memory có thể không tái hiện ổn định.</p>", "ext": "<p>Sanitizer giúp phát hiện một số lỗi trong lúc test; ownership rõ ràng giúp ngăn lỗi từ thiết kế.</p>", "check": "<p>Phân biệt memory leak với use-after-free.</p>", "sync": "<ul>\n<li>Liên hệ với C++ lifetime; use-after-free, leak, buffer overflow ở mức ý niệm.</li>\n<li>Bài: xác định bug tiềm năng từ snippet nhỏ.</li>\n</ul>"}}, {"id": "OS-009", "sort": 194, "pfx": "OS", "subj": "OS", "subjName": "Hệ Điều Hành", "cat": "Computer Systems", "uitMap": "IT007 (Hệ điều hành)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "12. Hệ điều hành (OS)", "sem": "HK4", "sup": false, "title": "File system và quyền", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "da00290056886444", "substeps": [], "sec": {"exp": "<p>Filesystem tổ chức file/directory và metadata; quyền quyết định user/process được phép đọc, ghi hoặc thực thi. Path và current directory ảnh hưởng việc mở file.</p>", "ex": "<p>Chương trình mở <code class=\"inline-code\">data/input.csv</code> nhưng chạy từ thư mục khác nên path tương đối không tìm đúng file.</p>", "clar": "<p>Permission denied khác file not found; không xử lý bằng quyền root một cách mặc định. Quy tắc permission tùy OS/filesystem.</p>", "ext": "<p>Atomic rename, file locks và journaling là phần sâu hơn khi cần độ bền dữ liệu.</p>", "check": "<p>Hai nguyên nhân khác nhau khiến lệnh đọc file thất bại là gì?</p>", "sync": "<ul>\n<li>File/directory, metadata, quyền; xử lý đường dẫn; liên hệ I/O.</li>\n<li>Bài: mô tả điều xảy ra khi chương trình không có quyền đọc file.</li>\n</ul>"}}, {"id": "OS-010", "sort": 195, "pfx": "OS", "subj": "OS", "subjName": "Hệ Điều Hành", "cat": "Computer Systems", "uitMap": "IT007 (Hệ điều hành)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "12. Hệ điều hành (OS)", "sem": "HK4", "sup": false, "title": "System call và I/O", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "55d7a3aed3b88ffd", "substeps": [], "sec": {"exp": "<p>System call là giao diện để chương trình yêu cầu kernel thực hiện thao tác được bảo vệ như I/O, process hoặc memory mapping. Thư viện có thể bọc system calls.</p>", "ex": "<p>Hàm thư viện đọc file có thể cuối cùng gọi OS để yêu cầu dữ liệu từ hệ thống file/thiết bị.</p>", "clar": "<p>Không phải mọi hàm thư viện đều là system call trực tiếp; một số xử lý hoàn toàn ở user space hoặc dùng buffering.</p>", "ext": "<p>User/kernel mode và chi phí chuyển qua ranh giới giải thích một phần overhead.</p>", "check": "<p>Phân biệt API thư viện và system call.</p>", "sync": "<ul>\n<li>Ranh giới user/kernel; chương trình yêu cầu OS thực hiện thao tác.</li>\n<li>Bài: sơ đồ mở/đọc/đóng file.</li>\n</ul>"}}, {"id": "OS-011", "sort": 196, "pfx": "OS", "subj": "OS", "subjName": "Hệ Điều Hành", "cat": "Computer Systems", "uitMap": "IT007 (Hệ điều hành)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "12. Hệ điều hành (OS)", "sem": "HK4", "sup": false, "title": "Ôn tập OS bằng tình huống", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "838abaf07c6c08bc", "substeps": [], "sec": {"exp": "<p>Bài tình huống đòi ghép process, thread, memory, filesystem và tool diagnostics. Chẩn đoán tốt bắt đầu bằng triệu chứng có thể quan sát được, rồi loại trừ giả thuyết.</p>", "ex": "<p>App treo: kiểm tra CPU/memory, logs, lock waits và I/O; “chậm” có thể do CPU-bound, I/O-bound hoặc deadlock.</p>", "clar": "<p>Không kết luận nguyên nhân chỉ từ một dấu hiệu. Thu thập log/metrics phù hợp và tái hiện có kiểm soát.</p>", "ext": "<p>Viết incident note ngắn: symptom, impact, evidence, suspected cause, next action.</p>", "check": "<p>Phân biệt race condition, deadlock và process bị chờ I/O.</p>", "sync": "<ul>\n<li>Phân tích chậm chương trình, process treo, race condition, thiếu quyền file.</li>\n<li>Đạt: phân biệt được các nguyên nhân và công cụ chẩn đoán cơ bản.</li>\n</ul>"}}, {"id": "NET-001", "sort": 197, "pfx": "NET", "subj": "NET", "subjName": "Mạng Máy Tính & Giao Thức Web", "cat": "Computer Systems", "uitMap": "IT005 (Nhập môn mạng máy tính)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "13. Mạng máy tính và web", "sem": "HK4", "sup": false, "title": "Client, server và request/response", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "c919367bdb38a35a", "substeps": [], "sec": {"exp": "<p>Client khởi tạo request; server nhận, xử lý và trả response. Đây là mô hình logic, không phải lời gọi hàm chia sẻ bộ nhớ trực tiếp trong cùng process.</p>", "ex": "<p>Browser gửi HTTP request lấy trang; server trả status, headers và body.</p>", "clar": "<p>Một request có thể qua DNS, TCP/TLS, proxy/load balancer trước app; mô hình ban đầu cố ý bỏ chi tiết này.</p>", "ext": "<p>Ghi trace một thao tác end-to-end để tìm điểm lỗi.</p>", "check": "<p>Phân biệt client, server, request và response.</p>", "sync": "<ul>\n<li>Xây mental model trước framework: client gửi yêu cầu, server xử lý/trả phản hồi.</li>\n<li>Bài: vẽ luồng khi trình duyệt lấy trang.</li>\n</ul>"}}, {"id": "NET-002", "sort": 198, "pfx": "NET", "subj": "NET", "subjName": "Mạng Máy Tính & Giao Thức Web", "cat": "Computer Systems", "uitMap": "IT005 (Nhập môn mạng máy tính)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "13. Mạng máy tính và web", "sem": "HK4", "sup": false, "title": "IP và port", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "a752b1558f79d9ad", "substeps": [], "sec": {"exp": "<p>IP xác định địa chỉ giao tiếp ở tầng mạng; port phân biệt dịch vụ/endpoint transport trên một host. <code class=\"inline-code\">localhost</code> thường chỉ chính máy hiện tại.</p>", "ex": "<p><code class=\"inline-code\">localhost:3000</code> thường nghĩa kết nối đến cổng 3000 trên máy đang chạy client, nếu có server lắng nghe ở đó.</p>", "clar": "<p>Port 3000 không phải địa chỉ máy; firewall, bind address và container networking có thể làm service chưa truy cập được dù app chạy.</p>", "ext": "<p>Phân biệt public/private IP và NAT khi cần triển khai.</p>", "check": "<p>Trong <code class=\"inline-code\">localhost:8080</code>, phần nào là host, phần nào là port?</p>", "sync": "<ul>\n<li>Địa chỉ máy/endpoint và cổng dịch vụ ở mức khái niệm.</li>\n<li>Bài: phân tích <code class=\"inline-code\">localhost:3000</code> và một địa chỉ từ ví dụ.</li>\n</ul>"}}, {"id": "NET-003", "sort": 199, "pfx": "NET", "subj": "NET", "subjName": "Mạng Máy Tính & Giao Thức Web", "cat": "Computer Systems", "uitMap": "IT005 (Nhập môn mạng máy tính)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "13. Mạng máy tính và web", "sem": "HK4", "sup": false, "title": "DNS", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "ee2cd650bd8a2f74", "substeps": [], "sec": {"exp": "<p>DNS phân giải tên miền thành record cần cho việc kết nối; kết quả có thể cache ở trình duyệt, hệ điều hành hoặc resolver.</p>", "ex": "<p>Browser cần địa chỉ cho <code class=\"inline-code\">example.com</code>; resolver hỏi cache/servers rồi trả record phù hợp.</p>", "clar": "<p>DNS không phải lúc nào chỉ trả một IPv4; có thể có IPv6, nhiều record, CDN và cache. DNS resolve xong chưa đảm bảo server app hoạt động.</p>", "ext": "<p>TTL và cache giải thích vì sao thay DNS không phản ánh tức thời ở mọi client.</p>", "check": "<p>DNS giúp client làm gì trước khi kết nối tới tên miền?</p>", "sync": "<ul>\n<li>Tên miền được phân giải tới thông tin mạng; cache/độ trễ ở mức trực quan.</li>\n<li>Bài: trace câu chuyện nhập domain đến khi kết nối được tạo.</li>\n</ul>"}}, {"id": "NET-004", "sort": 200, "pfx": "NET", "subj": "NET", "subjName": "Mạng Máy Tính & Giao Thức Web", "cat": "Computer Systems", "uitMap": "IT005 (Nhập môn mạng máy tính)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "13. Mạng máy tính và web", "sem": "HK4", "sup": false, "title": "TCP và UDP", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "72a38c571dca73df", "substeps": [], "sec": {"exp": "<p>TCP cung cấp luồng byte tin cậy, có thứ tự trong một kết nối; UDP gửi datagram không cung cấp cùng bộ đảm bảo giao nhận/thứ tự ở tầng giao thức này.</p>", "ex": "<p>Tải file thường cần dữ liệu đủ và đúng thứ tự nên TCP phù hợp; ứng dụng real-time có thể dùng UDP và tự xử lý mất gói khi cần.</p>", "clar": "<p>UDP không tự động nhanh hơn trong mọi ứng dụng; cần xét congestion control, reliability, overhead và semantics cấp ứng dụng.</p>", "ext": "<p>QUIC chạy trên UDP nhưng xây thêm cơ chế tin cậy/bảo mật; học sau nếu cần web networking sâu.</p>", "check": "<p>Tại sao “UDP nhanh hơn TCP” là khẳng định quá đơn giản?</p>", "sync": "<ul>\n<li>Đặc điểm kết nối/tin cậy/độ trễ ở mức tổng quan; không nói UDP luôn nhanh hơn hoặc TCP phù hợp mọi trường hợp.</li>\n<li>Bài: chọn giao thức theo tình huống và nêu đánh đổi.</li>\n</ul>"}}, {"id": "NET-005", "sort": 201, "pfx": "NET", "subj": "NET", "subjName": "Mạng Máy Tính & Giao Thức Web", "cat": "Computer Systems", "uitMap": "IT005 (Nhập môn mạng máy tính)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "13. Mạng máy tính và web", "sem": "HK4", "sup": false, "title": "HTTP request/response", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "8a8d5ff09aeea8bf", "substeps": [], "sec": {"exp": "<p>HTTP request gồm method, target/path, headers và có thể body; response gồm status code, headers và có thể body. Đây là giao thức ứng dụng phổ biến cho web/API.</p>", "ex": "<p><code class=\"inline-code\">GET /books/1</code> hỏi tài nguyên sách; server có thể trả JSON và status 200 nếu xử lý thành công.</p>", "clar": "<p>Request không phải lời gọi hàm trực tiếp; network có latency, timeout và lỗi. GET theo semantics nên an toàn về ý định đọc, không nên dùng để thay đổi trạng thái.</p>", "ext": "<p>Đọc raw request/response giúp debug trước khi dùng framework.</p>", "check": "<p>Nêu thành phần của một HTTP request cơ bản.</p>", "sync": "<ul>\n<li>Method, URL, headers, body, status code; request không phải “hàm gọi trực tiếp” trong process khác.</li>\n<li>Bài: đọc request/response minh họa.</li>\n</ul>"}}, {"id": "NET-006", "sort": 202, "pfx": "NET", "subj": "NET", "subjName": "Mạng Máy Tính & Giao Thức Web", "cat": "Computer Systems", "uitMap": "IT005 (Nhập môn mạng máy tính)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "13. Mạng máy tính và web", "sem": "HK4", "sup": false, "title": "Mã trạng thái HTTP và lỗi", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "de7193a7abddf960", "substeps": [], "sec": {"exp": "<p>Status code diễn đạt kết quả tổng quát của request: 2xx thành công, 3xx chuyển hướng, 4xx vấn đề phía request/client, 5xx lỗi xử lý phía server theo semantics HTTP.</p>", "ex": "<p>400 có thể báo request không hợp lệ; 401 liên quan thiếu/xác thực chưa hợp lệ; 403 nghĩa không được phép; 404 tài nguyên không tìm thấy theo server; 500 lỗi server.</p>", "clar": "<p>Không dùng mã status tùy tiện; ý nghĩa cụ thể phụ thuộc status và API contract. 401/403 cần phân biệt authentication/authorization theo ngữ cảnh.</p>", "ext": "<p>Log thêm request ID và lỗi nội bộ an toàn; không lộ stack trace/secret cho client production.</p>", "check": "<p>Chọn nhóm status hợp lý cho lỗi validation và lỗi server.</p>", "sync": "<ul>\n<li>Nhóm mã trạng thái; hiểu ý nghĩa chung của lỗi client/server.</li>\n<li>Bài: phân loại tình huống và quyết định nội dung cần ghi log.</li>\n</ul>"}}, {"id": "NET-007", "sort": 203, "pfx": "NET", "subj": "NET", "subjName": "Mạng Máy Tính & Giao Thức Web", "cat": "Computer Systems", "uitMap": "IT005 (Nhập môn mạng máy tính)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "13. Mạng máy tính và web", "sem": "HK4", "sup": false, "title": "JSON và serialization", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "b58847d526660676", "substeps": [], "sec": {"exp": "<p>Serialization chuyển cấu trúc dữ liệu trong chương trình thành định dạng truyền/lưu; deserialization parse định dạng đó thành cấu trúc. JSON có object, array, string, number, boolean và null.</p>", "ex": "<p><code class=\"inline-code\">{\"id\": 7, \"name\": \"An\"}</code> là JSON object có hai field. Parser cần kiểm tra trường tồn tại và kiểu đúng.</p>", "clar": "<p>JSON syntactically valid vẫn có thể vi phạm schema nghiệp vụ. Parse có thể thất bại do dấu phẩy/quote sai hoặc dữ liệu sai kiểu.</p>", "ext": "<p>Schema validation, versioning và backward compatibility quan trọng với API lâu dài.</p>", "check": "<p>Một JSON hợp lệ về cú pháp có thể sai về nghiệp vụ như thế nào?</p>", "sync": "<ul>\n<li>Chuyển dữ liệu thành dạng truyền/lưu; kiểu dữ liệu; parse có thể thất bại.</li>\n<li>Bài: đọc JSON và thiết kế response đơn giản.</li>\n</ul>"}}, {"id": "NET-008", "sort": 204, "pfx": "NET", "subj": "NET", "subjName": "Mạng Máy Tính & Giao Thức Web", "cat": "Computer Systems", "uitMap": "IT005 (Nhập môn mạng máy tính)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "13. Mạng máy tính và web", "sem": "HK4", "sup": false, "title": "REST API nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "954a77c825b2d978", "substeps": [], "sec": {"exp": "<p>REST là phong cách thiết kế API xoay quanh tài nguyên, semantics HTTP và contract nhất quán; không phải tên framework. Endpoint biểu diễn tài nguyên và method ý định thao tác.</p>", "ex": "<p><code class=\"inline-code\">GET /books</code> lấy danh sách, <code class=\"inline-code\">GET /books/42</code> lấy một sách, <code class=\"inline-code\">POST /books</code> có thể tạo sách theo contract, <code class=\"inline-code\">DELETE /books/42</code> yêu cầu xóa.</p>", "clar": "<p>REST không bắt buộc mọi API dùng đúng một mẫu URL; method/status/idempotency phải theo semantics và tài liệu API.</p>", "ext": "<p>Pagination, filtering, validation error format và API versioning là chủ đề mở rộng.</p>", "check": "<p>Thiết kế hai endpoint cho đọc một book và tạo book mới.</p>", "sync": "<ul>\n<li>Tài nguyên, HTTP method, status và tính nhất quán của API; REST là phong cách thiết kế, không phải framework.</li>\n<li>Bài: thiết kế endpoint cho books/tasks ở mức nhỏ.</li>\n</ul>"}}, {"id": "NET-009", "sort": 205, "pfx": "NET", "subj": "NET", "subjName": "Mạng Máy Tính & Giao Thức Web", "cat": "Computer Systems", "uitMap": "IT005 (Nhập môn mạng máy tính)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "13. Mạng máy tính và web", "sem": "HK4", "sup": false, "title": "Timeout, retry và lỗi mạng", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "671512dce0c25605", "substeps": [], "sec": {"exp": "<p>Timeout giới hạn thời gian chờ; retry gửi lại thao tác khi lỗi tạm thời có thể khắc phục. Nhưng retry cần cân nhắc việc request trước đó có thể đã được xử lý.</p>", "ex": "<p>Nếu GET status bị timeout, retry có thể an toàn hơn; nếu tạo đơn hàng bị timeout sau khi server đã tạo đơn nhưng response thất lạc, retry mù có thể tạo đơn trùng.</p>", "clar": "<p>Idempotent nghĩa lặp cùng thao tác theo semantics không tạo thêm hiệu ứng khác biệt sau lần đầu; không suy ra mọi POST đều an toàn để retry.</p>", "ext": "<p>Exponential backoff, jitter và idempotency key là mẫu nâng cao cần dùng cẩn thận.</p>", "check": "<p>Vì sao timeout không chứng minh server chưa xử lý request?</p>", "sync": "<ul>\n<li>Mạng chậm/đứt; retry không phải luôn an toàn; giới hạn số lần và timeout.</li>\n<li>Bài: phân biệt thao tác đọc an toàn với thao tác tạo đơn hàng có thể bị gửi lặp.</li>\n</ul>"}}, {"id": "NET-010", "sort": 206, "pfx": "NET", "subj": "NET", "subjName": "Mạng Máy Tính & Giao Thức Web", "cat": "Computer Systems", "uitMap": "IT005 (Nhập môn mạng máy tính)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "13. Mạng máy tính và web", "sem": "HK4", "sup": false, "title": "HTTPS và bảo vệ dữ liệu", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "bba4f76a9c56fa5e", "substeps": [], "sec": {"exp": "<p>HTTPS là HTTP được bảo vệ bằng TLS để mã hóa dữ liệu khi truyền và xác thực server theo chứng thư phù hợp. TLS không tự sửa logic ứng dụng hoặc bảo vệ dữ liệu sau khi giải mã.</p>", "ex": "<p>Form đăng nhập gửi qua HTTPS giúp giảm khả năng người quan sát mạng đọc credential trên đường truyền.</p>", "clar": "<p>Cần xác minh chứng thư/hostname đúng; không tắt kiểm tra TLS để “sửa lỗi”. HTTPS không thay authentication/authorization và kiểm soát dữ liệu ở server.</p>", "ext": "<p>TLS handshake, certificate chain và HSTS là mở rộng khi nền tảng web đã rõ.</p>", "check": "<p>HTTPS bảo vệ phần nào và không bảo đảm điều gì?</p>", "sync": "<ul>\n<li>TLS mã hóa/xác thực kết nối ở mức khái niệm; không tự triển khai mật mã.</li>\n<li>Bài: phân tích tại sao không gửi credential qua kênh không an toàn.</li>\n</ul>"}}, {"id": "NET-011", "sort": 207, "pfx": "NET", "subj": "NET", "subjName": "Mạng Máy Tính & Giao Thức Web", "cat": "Computer Systems", "uitMap": "IT005 (Nhập môn mạng máy tính)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "13. Mạng máy tính và web", "sem": "HK4", "sup": false, "title": "Cookie, session và token nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "0d22880936d688c9", "substeps": [], "sec": {"exp": "<p>Cookie là dữ liệu được browser lưu/gửi theo thuộc tính domain/path/SameSite/Secure/HttpOnly; session thường lưu trạng thái ở server và browser giữ session identifier. Token là credential dạng dữ liệu do hệ thống định nghĩa.</p>", "ex": "<p>Sau đăng nhập, server có thể cấp session cookie; browser gửi cookie phù hợp trong request tiếp theo.</p>", "clar": "<p>Authentication xác minh danh tính; authorization kiểm tra quyền. Token không tự an toàn nếu lưu hoặc truyền sai; tránh lưu credential vào nơi có thể bị script độc hại đọc.</p>", "ext": "<p>Threat model quyết định cookie/session/token và cách hết hạn, thu hồi.</p>", "check": "<p>Đăng nhập thành công và có quyền xóa dữ liệu là hai câu hỏi khác nhau thế nào?</p>", "sync": "<ul>\n<li>Duy trì trạng thái người dùng; đừng nhầm authentication với authorization.</li>\n<li>Bài: giải thích cách app nhớ người đã đăng nhập ở mức kiến trúc.</li>\n</ul>"}}, {"id": "NET-012", "sort": 208, "pfx": "NET", "subj": "NET", "subjName": "Mạng Máy Tính & Giao Thức Web", "cat": "Computer Systems", "uitMap": "IT005 (Nhập môn mạng máy tính)", "part": "PHẦN G — HỆ ĐIỀU HÀNH VÀ MẠNG MÁY TÍNH", "stage": "13. Mạng máy tính và web", "sem": "HK4", "sup": false, "title": "Quan sát request end-to-end", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "073e7293013cc5db", "substeps": [], "sec": {"exp": "<p>Quan sát end-to-end ghép browser DevTools, server logs và dữ liệu request để tìm nơi hỏng: client, network, gateway hay application.</p>", "ex": "<p>Kiểm tra request URL, method, payload, status, response body và thời gian; nối với server log bằng request ID khi có.</p>", "clar": "<p>Không ghi password, token hay dữ liệu cá nhân không cần thiết vào log. Một request lỗi trên client có thể tương ứng response từ server hoặc request chưa tới server.</p>", "ext": "<p>Metrics latency/error rate và distributed tracing hữu ích khi hệ thống nhiều service.</p>", "check": "<p>Tạo bug report API có các chi tiết quan trọng nhưng không chứa secret.</p>", "sync": "<ul>\n<li>Mở DevTools/logs nếu có; theo dõi input, status, latency, response.</li>\n<li>Bài: chẩn đoán lỗi API giả lập và viết báo cáo ngắn.</li>\n</ul>"}}, {"id": "SE-001", "sort": 209, "pfx": "SE", "subj": "SE", "subjName": "Kỹ Thuật Phần Mềm (Software Engineering)", "cat": "Software Engineering", "uitMap": "Nhập môn Công nghệ phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "14. Kỹ thuật phần mềm: biến yêu cầu thành sản phẩm có thể kiểm tra", "sem": "HK4", "sup": false, "title": "Vấn đề, người dùng và phạm vi", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-SE-001", "SUP-SE-005"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "1c0e0d42f30fe863", "substeps": [], "sec": {"exp": "<p>Yêu cầu bắt đầu từ người dùng, vấn đề và phạm vi; giải pháp kỹ thuật chỉ là một phương án. Xác định non-goals ngăn sản phẩm nở rộng vô hạn.</p>", "ex": "<p>Với thư viện, vấn đề có thể là thủ thư mất thời gian tra cứu; phạm vi đầu tiên là tìm sách theo mã, chưa cần đặt trước online.</p>", "clar": "<p>“Dùng React và PostgreSQL” nói công nghệ, không giải thích vì sao sản phẩm cần tồn tại. Hỏi ai dùng, lúc nào, khó khăn gì và cách nhận biết đã tốt hơn.</p>", "ext": "<p>Phỏng vấn người dùng, quan sát workflow và ghi giả định kiểm chứng được.</p>", "check": "<p>Viết một câu mô tả vấn đề mà không nhắc tên framework.</p>", "sync": "<ul>\n<li><strong>Học:</strong> phần mềm giải quyết vấn đề của ai; phân biệt nhu cầu với giải pháp đã chọn.</li>\n<li><strong>Bài:</strong> viết 5 câu về người dùng và khó khăn của họ cho ứng dụng quản lý thư viện.</li>\n<li><strong>Qua:</strong> không mô tả sản phẩm chỉ bằng một danh sách công nghệ.</li>\n</ul>"}}, {"id": "SE-002", "sort": 210, "pfx": "SE", "subj": "SE", "subjName": "Kỹ Thuật Phần Mềm (Software Engineering)", "cat": "Software Engineering", "uitMap": "Nhập môn Công nghệ phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "14. Kỹ thuật phần mềm: biến yêu cầu thành sản phẩm có thể kiểm tra", "sem": "HK4", "sup": false, "title": "User story và acceptance criteria", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-SE-001"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "e5d54b8173d93e48", "substeps": [], "sec": {"exp": "<p>User story mô tả nhu cầu theo góc nhìn một vai trò; acceptance criteria là điều kiện quan sát/kiểm thử để xác định tính năng đạt.</p>", "ex": "<p>“Là thủ thư, tôi muốn tìm sách theo mã để biết sách có sẵn không.” Tiêu chí: mã có kết quả thì hiển thị thông tin; mã lạ thì hiển thị trạng thái không tìm thấy.</p>", "clar": "<p>Tránh tiêu chí “nhanh, đẹp, ổn định” nếu không định nghĩa cách đo. Story là công cụ trao đổi, không thay mọi yêu cầu phi chức năng.</p>", "ext": "<p>Có thể viết criteria dạng Given–When–Then nếu nó làm kịch bản rõ hơn.</p>", "check": "<p>Viết hai acceptance criteria có thể kiểm thử cho tính năng thêm sách.</p>", "sync": "<ul>\n<li><strong>Học:</strong> mô tả ngắn nhu cầu và điều kiện chấp nhận được.</li>\n<li><strong>Bài:</strong> “Là thủ thư, tôi muốn tìm sách theo mã để…” kèm 3 tiêu chí có thể test.</li>\n<li><strong>Qua:</strong> tiêu chí đo được, không mơ hồ như “chạy tốt” hoặc “giao diện đẹp”.</li>\n</ul>"}}, {"id": "SE-003", "sort": 211, "pfx": "SE", "subj": "SE", "subjName": "Kỹ Thuật Phần Mềm (Software Engineering)", "cat": "Software Engineering", "uitMap": "Nhập môn Công nghệ phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "14. Kỹ thuật phần mềm: biến yêu cầu thành sản phẩm có thể kiểm tra", "sem": "HK4", "sup": false, "title": "Phân rã công việc", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-SE-006"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "45695308c96b375d", "substeps": [], "sec": {"exp": "<p>Phân rã biến yêu cầu lớn thành công việc nhỏ có đầu ra và phụ thuộc rõ. Ưu tiên task giúp kiểm chứng rủi ro lớn sớm.</p>", "ex": "<p>Tính năng mượn sách gồm: định nghĩa rule, schema trạng thái, hàm nghiệp vụ, endpoint/UI, test và cập nhật README.</p>", "clar": "<p>Nếu task là “làm backend” thì quá rộng, khó đo hoàn thành; task không nhất thiết phải bằng thời gian cố định nhưng phải có đầu ra kiểm tra được.</p>", "ext": "<p>Board đơn giản To do/Doing/Done đủ cho dự án học nhỏ.</p>", "check": "<p>Chẻ một task “làm tìm kiếm” thành ít nhất ba task có kết quả cụ thể.</p>", "sync": "<ul>\n<li><strong>Học:</strong> task nhỏ, dependency, ưu tiên, ước lượng thô.</li>\n<li><strong>Bài:</strong> chia tính năng “mượn sách” thành dữ liệu, rule, API/UI, test và docs.</li>\n<li><strong>Qua:</strong> các task có đầu ra kiểm tra được và không quá lớn để theo dõi.</li>\n</ul>"}}, {"id": "SE-004", "sort": 212, "pfx": "SE", "subj": "SE", "subjName": "Kỹ Thuật Phần Mềm (Software Engineering)", "cat": "Software Engineering", "uitMap": "Nhập môn Công nghệ phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "14. Kỹ thuật phần mềm: biến yêu cầu thành sản phẩm có thể kiểm tra", "sem": "HK4", "sup": false, "title": "Abstraction và module", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-SE-003"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "701e6326023562f8", "substeps": [], "sec": {"exp": "<p>Abstraction giữ lại thông tin cần dùng và giấu chi tiết không liên quan. Module gom code cùng trách nhiệm, cung cấp interface để phần khác sử dụng.</p>", "ex": "<p><code class=\"inline-code\">BookRepository.findById(id)</code> cho caller biết cách tìm sách mà không cần biết dữ liệu được đọc từ file hay database.</p>", "clar": "<p>Abstraction tốt che biến đổi có khả năng xảy ra; abstraction quá sớm có thể làm code phức tạp. Interface phải mô tả hành vi thật sự, không chỉ bọc một lời gọi vô ích.</p>", "ext": "<p>Tạo sơ đồ dependency để xem thay đổi dữ liệu sẽ tác động thành phần nào.</p>", "check": "<p>Lợi ích gì khi caller không cần biết dữ liệu đến từ file hay database?</p>", "sync": "<ul>\n<li><strong>Học:</strong> che chi tiết không cần thiết; interface; mỗi module có trách nhiệm rõ.</li>\n<li><strong>Bài:</strong> vẽ sơ đồ nhập liệu → logic nghiệp vụ → lưu dữ liệu.</li>\n<li><strong>Qua:</strong> biết module nào thay đổi khi sửa một quy tắc cụ thể.</li>\n</ul>"}}, {"id": "SE-005", "sort": 213, "pfx": "SE", "subj": "SE", "subjName": "Kỹ Thuật Phần Mềm (Software Engineering)", "cat": "Software Engineering", "uitMap": "Nhập môn Công nghệ phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "14. Kỹ thuật phần mềm: biến yêu cầu thành sản phẩm có thể kiểm tra", "sem": "HK6", "sup": false, "title": "Cohesion, coupling và separation of concerns", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-SE-003"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "dd3e542eff4c5577", "substeps": [], "sec": {"exp": "<p>Cohesion cao nghĩa là các phần trong module cùng phục vụ một mục tiêu; coupling thấp nghĩa là module ít phụ thuộc chi tiết bên trong nhau. Separation of concerns phân chia trách nhiệm.</p>", "ex": "<p>Tách đọc input, kiểm tra rule mượn sách và ghi file khỏi một hàm menu dài.</p>", "clar": "<p>Không cần tách mọi dòng thành một class riêng; mục tiêu là giảm thay đổi dây chuyền và tăng kiểm thử.</p>", "ext": "<p>Refactor một module sau khi nhận diện lý do thay đổi của nó.</p>", "check": "<p>Nếu đổi cách lưu dữ liệu, phần tính xếp loại điểm có nên phải sửa không? Vì sao?</p>", "sync": "<ul>\n<li><strong>Học:</strong> module nên gom việc liên quan; giảm phụ thuộc không cần thiết.</li>\n<li><strong>Bài:</strong> refactor một hàm làm nhập/xử lý/file/in thành vài phần rõ ràng.</li>\n<li><strong>Qua:</strong> giải thích được lợi ích và không tách hàm quá vụn vô nghĩa.</li>\n</ul>"}}, {"id": "SE-006", "sort": 214, "pfx": "SE", "subj": "SE", "subjName": "Kỹ Thuật Phần Mềm (Software Engineering)", "cat": "Software Engineering", "uitMap": "Nhập môn Công nghệ phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "14. Kỹ thuật phần mềm: biến yêu cầu thành sản phẩm có thể kiểm tra", "sem": "HK6", "sup": false, "title": "Đọc code và code review", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-SE-004"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "8a68cb14a5378ea0", "substeps": [], "sec": {"exp": "<p>Code review đánh giá correctness, clarity, tests, security và maintainability bằng phản hồi cụ thể, lịch sự. Review không nhằm chấm người viết.</p>", "ex": "<p>Nhận xét “Điều kiện bỏ qua mã rỗng chưa có test; thêm test empty ID” dễ hành động hơn “code dở”.</p>", "clar": "<p>Review nên theo diff và mục tiêu, phân biệt blocker với gợi ý. Không review chỉ theo style mà bỏ lỗi logic.</p>", "ext": "<p>Checklist review nhẹ có thể bao gồm contract, error paths, edge cases, tests và scope.</p>", "check": "<p>Viết hai comment review cụ thể, có bằng chứng và hướng sửa.</p>", "sync": "<ul>\n<li><strong>Học:</strong> review logic, readability, tests, security; góp ý về code thay vì công kích tác giả.</li>\n<li><strong>Bài:</strong> đọc diff mẫu và viết 3 nhận xét có lý do.</li>\n<li><strong>Qua:</strong> ít nhất một nhận xét về correctness và một về maintainability.</li>\n</ul>"}}, {"id": "SE-007", "sort": 215, "pfx": "SE", "subj": "SE", "subjName": "Kỹ Thuật Phần Mềm (Software Engineering)", "cat": "Software Engineering", "uitMap": "Nhập môn Công nghệ phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "14. Kỹ thuật phần mềm: biến yêu cầu thành sản phẩm có thể kiểm tra", "sem": "HK6", "sup": false, "title": "Refactoring", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "9e1a3adce8fd89ef", "substeps": [], "sec": {"exp": "<p>Refactoring thay đổi cấu trúc bên trong mà giữ hành vi bên ngoài. Test chạy trước/sau giúp phát hiện thay đổi ngẫu nhiên về behavior.</p>", "ex": "<p>Tách một đoạn tính điểm trung bình thành hàm nhưng giữ output và quy tắc validation y hệt; chạy lại toàn bộ test.</p>", "clar": "<p>Nếu vừa thay cấu trúc vừa thêm feature, lỗi dễ khó truy nguyên. Refactor không đồng nghĩa code ngắn hơn bằng mọi giá.</p>", "ext": "<p>Refactor theo bước nhỏ: test xanh → một thay đổi → test lại → review diff.</p>", "check": "<p>Nêu điểm khác nhau giữa refactor và thêm feature.</p>", "sync": "<ul>\n<li><strong>Học:</strong> cải thiện cấu trúc mà giữ behavior; test giúp phát hiện thay đổi ngoài ý muốn.</li>\n<li><strong>Bài:</strong> đổi tên, tách hàm, loại bỏ lặp; chạy test trước/sau.</li>\n<li><strong>Qua:</strong> giải thích refactor khác với thêm feature ở đâu.</li>\n</ul>"}}, {"id": "SE-008", "sort": 216, "pfx": "SE", "subj": "SE", "subjName": "Kỹ Thuật Phần Mềm (Software Engineering)", "cat": "Software Engineering", "uitMap": "Nhập môn Công nghệ phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "14. Kỹ thuật phần mềm: biến yêu cầu thành sản phẩm có thể kiểm tra", "sem": "HK6", "sup": false, "title": "Tài liệu kỹ thuật và ADR", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-SE-003"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "6c75f3983fbcfb59", "substeps": [], "sec": {"exp": "<p>README hướng dẫn mục đích/cách chạy; ADR ghi một quyết định kiến trúc, bối cảnh, lựa chọn khác và lý do. Tài liệu hữu ích trả lời câu hỏi thật của người đọc.</p>", "ex": "<p>ADR: dùng vector vì danh sách nhỏ và cần duyệt; cân nhắc map nếu tra cứu theo mã thành đường chính. Ghi cả trade-off và giả định.</p>", "clar": "<p>Tài liệu cần cập nhật khi hành vi đổi. Đừng mô tả trạng thái chưa được triển khai như một tính năng có thật.</p>", "ext": "<p>Giữ architecture diagram vừa đủ để người khác hiểu boundary chính.</p>", "check": "<p>Một ADR tốt cần ghi gì ngoài lựa chọn cuối cùng?</p>", "sync": "<ul>\n<li><strong>Học:</strong> README, setup, limitations, architecture decision record (ADR) ở mức nhỏ.</li>\n<li><strong>Bài:</strong> ghi lựa chọn giữa vector và map, phương án khác và trade-off.</li>\n<li><strong>Qua:</strong> người khác biết cách chạy project và hiểu lý do của quyết định lớn.</li>\n</ul>"}}, {"id": "TEST-001", "sort": 217, "pfx": "TEST", "subj": "TEST", "subjName": "Kiểm Thử Phần Mềm (Testing)", "cat": "Quality & Security", "uitMap": "Kiểm thử phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "15. Testing — học kiểm thử từ nhỏ đến tích hợp", "sem": "HK4", "sup": false, "title": "Test case và oracle", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-SE-004"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "0ec900eea54a190c", "substeps": [], "sec": {"exp": "<p>Test case gồm điều kiện ban đầu/input, hành động và output kỳ vọng. Oracle là căn cứ độc lập để biết kết quả đúng.</p>", "ex": "<p>Cho hàm average, test [2,4] kỳ vọng 3; nếu hàm cấm danh sách rỗng thì test rỗng phải kỳ vọng lỗi/kiểu kết quả đã định nghĩa.</p>", "clar": "<p>Chạy được không đồng nghĩa đúng; expected result cần xác định trước khi quan sát actual.</p>", "ext": "<p>Test table giúp phủ miền input và dễ review.</p>", "check": "<p>Viết expected output trước khi chạy một test cho hàm <code class=\"inline-code\">isEven</code>.</p>", "sync": "<ul>\n<li>Định nghĩa input, điều kiện, output mong đợi; oracle là cách biết kết quả đúng.</li>\n<li>Bài: tạo bảng test cho hàm tính điểm trung bình.</li>\n<li>Qua: mọi test có kết quả kỳ vọng rõ.</li>\n</ul>"}}, {"id": "TEST-002", "sort": 218, "pfx": "TEST", "subj": "TEST", "subjName": "Kiểm Thử Phần Mềm (Testing)", "cat": "Quality & Security", "uitMap": "Kiểm thử phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "15. Testing — học kiểm thử từ nhỏ đến tích hợp", "sem": "HK4", "sup": false, "title": "Happy path và edge cases", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "1499d470d28c3cc4", "substeps": [], "sec": {"exp": "<p>Happy path kiểm tra đường dùng bình thường; edge cases kiểm tra ranh giới, input rỗng, trùng, lớn/nhỏ, invalid và chuyển trạng thái.</p>", "ex": "<p>Search test: target đầu, target cuối, không có target và empty list. API: request hợp lệ, thiếu field required, field sai kiểu.</p>", "clar": "<p>Edge case phải phù hợp domain; không phải nhồi cực trị vô nghĩa. Xác định behavior được mong đợi trước.</p>", "ext": "<p>Boundary-value analysis chọn giá trị ngay dưới, tại và trên ngưỡng.</p>", "check": "<p>Với ngưỡng điểm 5, chọn ba test quanh biên.</p>", "sync": "<ul>\n<li>Dữ liệu bình thường, rỗng, cực trị, sai định dạng, trùng và trạng thái không hợp lệ.</li>\n<li>Bài: test tìm kiếm và parser file.</li>\n<li>Qua: có test cho ít nhất 3 trường hợp biên phù hợp bài.</li>\n</ul>"}}, {"id": "TEST-003", "sort": 219, "pfx": "TEST", "subj": "TEST", "subjName": "Kiểm Thử Phần Mềm (Testing)", "cat": "Quality & Security", "uitMap": "Kiểm thử phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "15. Testing — học kiểm thử từ nhỏ đến tích hợp", "sem": "HK4", "sup": false, "title": "Unit test", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f425d38bc9d43495", "substeps": [], "sec": {"exp": "<p>Unit test kiểm tra một đơn vị nhỏ như hàm/class trong điều kiện kiểm soát. Unit test tốt nhanh, lặp lại được và báo lỗi rõ.</p>", "ex": "<p><code class=\"inline-code\">isValidScore(7)</code> true; <code class=\"inline-code\">isValidScore(-1)</code> false; <code class=\"inline-code\">isValidScore(10.1)</code> false theo miền [0,10].</p>", "clar": "<p>Không nên kiểm tra implementation detail vô ích; test behavior công khai. Nếu test phụ thuộc clock/network thật, nó có thể không còn là unit test cô lập.</p>", "ext": "<p>Test framework theo ngôn ngữ có thể tự chạy test trong CI.</p>", "check": "<p>Tại sao hàm tính toán thuần thường dễ unit test?</p>", "sync": "<ul>\n<li>Kiểm tra đơn vị nhỏ, tách khỏi giao diện/ngoại vi khi phù hợp.</li>\n<li>Bài: viết kiểm tra nhiều input cho hàm độc lập.</li>\n<li>Qua: test có thể chạy lại và báo rõ failure.</li>\n</ul>"}}, {"id": "TEST-004", "sort": 220, "pfx": "TEST", "subj": "TEST", "subjName": "Kiểm Thử Phần Mềm (Testing)", "cat": "Quality & Security", "uitMap": "Kiểm thử phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "15. Testing — học kiểm thử từ nhỏ đến tích hợp", "sem": "HK4", "sup": false, "title": "Integration test", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "9dc7a2bd0f7d137f", "substeps": [], "sec": {"exp": "<p>Integration test kiểm tra hai hay nhiều thành phần kết hợp, ví dụ API với repository/database hoặc parser với file.</p>", "ex": "<p>Tạo sách qua service rồi truy vấn database để xác nhận record có đúng field và response phù hợp.</p>", "clar": "<p>Test tích hợp có thể chậm và phụ thuộc môi trường; cần quản lý setup/teardown và dữ liệu để test lặp lại.</p>", "ext": "<p>Tập test phân tầng giúp cân bằng tốc độ feedback và độ tin cậy.</p>", "check": "<p>Một lỗi kết nối database nhiều khả năng được phát hiện ở unit hay integration test?</p>", "sync": "<ul>\n<li>Kiểm tra nhiều thành phần cùng hoạt động, ví dụ logic + database hoặc parser + file.</li>\n<li>Bài: test thêm dữ liệu rồi đọc lại.</li>\n<li>Qua: biết test đang kiểm tra ranh giới nào.</li>\n</ul>"}}, {"id": "TEST-005", "sort": 221, "pfx": "TEST", "subj": "TEST", "subjName": "Kiểm Thử Phần Mềm (Testing)", "cat": "Quality & Security", "uitMap": "Kiểm thử phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "15. Testing — học kiểm thử từ nhỏ đến tích hợp", "sem": "HK6", "sup": false, "title": "Regression test", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "5b171ff4a2e1ca4f", "substeps": [], "sec": {"exp": "<p>Regression test giữ lại test cho lỗi đã sửa hoặc behavior cũ để bảo đảm thay đổi mới không khiến lỗi quay lại.</p>", "ex": "<p>Sau khi sửa parser bỏ qua dòng lỗi đúng cách, thêm test cho dòng không có timestamp để ngăn bug quay lại.</p>", "clar": "<p>Chỉ thêm test sau khi đã hiểu expected behavior; không đóng băng một behavior vốn sai.</p>", "ext": "<p>Mỗi incident đáng kể nên cân nhắc test tái hiện lỗi.</p>", "check": "<p>Lý do nào khiến test bug đã sửa nên được giữ lâu dài?</p>", "sync": "<ul>\n<li>Khi sửa bug, thêm test tái hiện bug để ngăn nó quay lại.</li>\n<li>Bài: tạo test cho bug đã sửa.</li>\n<li>Qua: test thất bại trước khi sửa và qua sau khi sửa, nếu quy trình cho phép tái hiện.</li>\n</ul>"}}, {"id": "TEST-006", "sort": 222, "pfx": "TEST", "subj": "TEST", "subjName": "Kiểm Thử Phần Mềm (Testing)", "cat": "Quality & Security", "uitMap": "Kiểm thử phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "15. Testing — học kiểm thử từ nhỏ đến tích hợp", "sem": "HK6", "sup": false, "title": "Mock/stub và test dependency", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "0fa70cfe45869400", "substeps": [], "sec": {"exp": "<p>Mock là đối tượng giả lập được điều khiển để kiểm tra tương tác; stub trả phản hồi cố định. Chúng giúp cô lập dependency khi test, nhưng có thể làm test quá xa thực tế nếu lạm dụng.</p>", "ex": "<p>Stub repository trả về một Book để test validation service; integration test riêng xác nhận repository thật hoạt động.</p>", "clar": "<p>Không mock thứ cần test; mock quá nhiều chi tiết nội bộ khiến refactor vô hại làm test gãy.</p>", "ext": "<p>Chọn fake/stub/mock theo nhu cầu chứ không theo trend/framework.</p>", "check": "<p>Muốn test xử lý lỗi database mà không phụ thuộc database thật, có lựa chọn nào?</p>", "sync": "<ul>\n<li>Ý tưởng thay thế dependency khó kiểm soát; không mock mọi thứ.</li>\n<li>Bài: phân tích khi nào cần fake API/database trong test.</li>\n<li>Qua: giải thích trade-off độ cô lập với tính thực tế.</li>\n</ul>"}}, {"id": "TEST-007", "sort": 223, "pfx": "TEST", "subj": "TEST", "subjName": "Kiểm Thử Phần Mềm (Testing)", "cat": "Quality & Security", "uitMap": "Kiểm thử phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "15. Testing — học kiểm thử từ nhỏ đến tích hợp", "sem": "HK6", "sup": false, "title": "Test coverage và giới hạn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "14f9df91fc61095e", "substeps": [], "sec": {"exp": "<p>Coverage đo phần code/nhánh được test chạy qua; nó không chứng minh test có assertion tốt hoặc mọi input đều đúng.</p>", "ex": "<p>Coverage 100% dòng vẫn có thể bỏ sót trường hợp so sánh <code class=\"inline-code\">&gt;</code> thay vì <code class=\"inline-code\">&gt;=</code> nếu input biên chưa được test đúng.</p>", "clar": "<p>Coverage là tín hiệu hữu ích, không phải mục tiêu duy nhất. Một test cần kiểm tra behavior chứ không chỉ chạy dòng code.</p>", "ext": "<p>Mutation testing là mở rộng để xem test có bắt các biến đổi sai hay không.</p>", "check": "<p>Vì sao coverage 100% không bảo đảm không có bug?</p>", "sync": "<ul>\n<li>Coverage cho biết code nào được chạy, không chứng minh code đúng.</li>\n<li>Bài: tạo test cho nhánh điều kiện và nêu logic có thể sai dù coverage cao.</li>\n<li>Qua: không dùng phần trăm coverage như thước đo chất lượng duy nhất.</li>\n</ul>"}}, {"id": "TEST-008", "sort": 224, "pfx": "TEST", "subj": "TEST", "subjName": "Kiểm Thử Phần Mềm (Testing)", "cat": "Quality & Security", "uitMap": "Kiểm thử phần mềm", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "15. Testing — học kiểm thử từ nhỏ đến tích hợp", "sem": "HK6", "sup": false, "title": "Kiểm thử API/UI theo specialty", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "098d04b78bc62716", "substeps": [], "sec": {"exp": "<p>Kiểm thử API xác nhận status, schema, authorization và behavior; UI test xác nhận các luồng người dùng và trạng thái hiển thị. Chọn tầng test phù hợp vì UI test thường mong manh hơn.</p>", "ex": "<p>API test gửi POST thiếu title và kỳ vọng 400/validation response theo contract; UI test xác nhận người dùng thấy lỗi cạnh field.</p>", "clar": "<p>Không chỉ assert status 200: body, side effects, quyền và edge cases cũng có thể quan trọng.</p>", "ext": "<p>Contract testing và accessibility tests là các mở rộng theo sản phẩm.</p>", "check": "<p>Một request trái quyền cần kiểm tra status, dữ liệu trả về và side effect nào?</p>", "sync": "<ul>\n<li>Bài: gửi request với dữ liệu đúng/sai; test status, response và persistence.</li>\n<li>Qua: test luồng thành công và lỗi quan trọng.</li>\n</ul>"}}, {"id": "SEC-001", "sort": 225, "pfx": "SEC", "subj": "SEC", "subjName": "Bảo Mật Cơ Bản (Application Security)", "cat": "Quality & Security", "uitMap": "An toàn thông tin / OWASP Top 10:2025", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "16. Bảo mật cơ bản", "sem": "HK6", "sup": false, "title": "Threat modeling nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-SEC-002"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "191af967f70b9b6b", "substeps": [], "sec": {"exp": "<p>Threat modeling liệt kê tài sản cần bảo vệ, tác nhân/đe dọa, đường tấn công và biện pháp giảm rủi ro. Mục tiêu là suy nghĩ có cấu trúc, không dự đoán mọi nguy cơ hoàn hảo.</p>", "ex": "<p>Ứng dụng thư viện có tài sản: tài khoản thủ thư, dữ liệu mượn và token; đe dọa: người chưa xác thực sửa dữ liệu.</p>", "clar": "<p>Không cần bắt đầu bằng danh sách công cụ bảo mật; trước hết xác định điều gì có giá trị và ai có thể tác động.</p>", "ext": "<p>STRIDE là một khung tham khảo, không thay thế tư duy về hệ thống cụ thể.</p>", "check": "<p>Nêu tài sản, đe dọa và một biện pháp cho endpoint xóa sách.</p>", "sync": "<ul>\n<li>Hỏi: tài sản cần bảo vệ, ai có thể gây hại, bề mặt tấn công nào tồn tại?</li>\n<li>Bài: phân tích một form đăng nhập hoặc API tạo dữ liệu.</li>\n<li>Qua: nêu được rủi ro cụ thể chứ không chỉ nói “cần bảo mật”.</li>\n</ul>"}}, {"id": "SEC-002", "sort": 226, "pfx": "SEC", "subj": "SEC", "subjName": "Bảo Mật Cơ Bản (Application Security)", "cat": "Quality & Security", "uitMap": "An toàn thông tin / OWASP Top 10:2025", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "16. Bảo mật cơ bản", "sem": "HK6", "sup": false, "title": "Authentication vs authorization", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-SEC-002"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "cb565cb3f1010495", "substeps": [], "sec": {"exp": "<p>Authentication xác minh “bạn là ai”; authorization quyết định “bạn được phép làm gì”. Đăng nhập thành công không tự cho quyền admin.</p>", "ex": "<p>Một nhân viên đã đăng nhập vẫn không được phép sửa cấu hình hệ thống nếu role không có quyền đó.</p>", "clar": "<p>Ẩn nút ở UI không đủ làm kiểm soát quyền; server phải kiểm tra từng hành động quan trọng.</p>", "ext": "<p>Role-based/access-control policies cần test ở endpoint và object level.</p>", "check": "<p>Nêu test xác minh người dùng thường không xóa được dữ liệu admin.</p>", "sync": "<ul>\n<li>Xác thực là ai; phân quyền là được phép làm gì.</li>\n<li>Bài: thiết kế quyền người dùng/admin cho dự án.</li>\n<li>Qua: không cho rằng đăng nhập đồng nghĩa có mọi quyền.</li>\n</ul>"}}, {"id": "SEC-003", "sort": 227, "pfx": "SEC", "subj": "SEC", "subjName": "Bảo Mật Cơ Bản (Application Security)", "cat": "Quality & Security", "uitMap": "An toàn thông tin / OWASP Top 10:2025", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "16. Bảo mật cơ bản", "sem": "HK6", "sup": false, "title": "Input validation và output encoding", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-SEC-002"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "fc5bc64eb0c3fff0", "substeps": [], "sec": {"exp": "<p>Input validation xác nhận dữ liệu phù hợp kiểu/miền/rule; output encoding diễn giải dữ liệu an toàn trong ngữ cảnh như HTML để tránh thực thi như code.</p>", "ex": "<p>Kiểm tra title không rỗng và giới hạn độ dài; khi hiển thị title người dùng trong HTML, encode theo context thay vì chèn raw markup.</p>", "clar": "<p>Validation và encoding giải quyết rủi ro khác nhau. Không tin dữ liệu chỉ vì nó đến từ một form nội bộ hoặc database cũ.</p>", "ext": "<p>Dùng thư viện/templating có cơ chế escaping phù hợp và tuân theo hướng dẫn framework.</p>", "check": "<p>Vì sao kiểm tra độ dài input không thay thế HTML output encoding?</p>", "sync": "<ul>\n<li>Validate theo rule; tránh tin input; encoding tùy ngữ cảnh.</li>\n<li>Bài: liệt kê dữ liệu cần kiểm tra trong API.</li>\n<li>Qua: validation được kiểm tra ở tầng thích hợp và lỗi được trả rõ.</li>\n</ul>"}}, {"id": "SEC-004", "sort": 228, "pfx": "SEC", "subj": "SEC", "subjName": "Bảo Mật Cơ Bản (Application Security)", "cat": "Quality & Security", "uitMap": "An toàn thông tin / OWASP Top 10:2025", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "16. Bảo mật cơ bản", "sem": "HK6", "sup": false, "title": "SQL injection và parameterized queries", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": [], "recBg": ["DB-014"], "unlocks": ["SUP-SEC-002"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "ca5ed071cd56fe73", "substeps": [], "sec": {"exp": "<p>Parameterized query giữ cấu trúc SQL tách khỏi giá trị input. Đây là phòng vệ quan trọng chống injection, cùng với quyền DB tối thiểu.</p>", "ex": "<p>Dùng placeholder cho <code class=\"inline-code\">username</code> trong câu query; driver binding giá trị thay vì ghép nó thành cú pháp SQL.</p>", "clar": "<p>Không nối input thô vào WHERE/ORDER BY; dynamic identifiers cần whitelist vì placeholder giá trị không thể thay tên cột trong đa số driver.</p>", "ext": "<p>Test bằng input chứa dấu nháy và chuỗi độc hại an toàn trong môi trường thử để xác nhận nó được xử lý như dữ liệu.</p>", "check": "<p>Giải thích vì sao input lẽ ra chỉ là value không được phép biến thành câu lệnh.</p>", "sync": "<ul>\n<li>Liên kết với DB-014; xây câu truy vấn an toàn bằng tham số.</li>\n<li>Bài: phát hiện nguy cơ trong snippet giả lập.</li>\n<li>Qua: không nối input không tin cậy trực tiếp vào SQL.</li>\n</ul>"}}, {"id": "SEC-005", "sort": 229, "pfx": "SEC", "subj": "SEC", "subjName": "Bảo Mật Cơ Bản (Application Security)", "cat": "Quality & Security", "uitMap": "An toàn thông tin / OWASP Top 10:2025", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "16. Bảo mật cơ bản", "sem": "HK6", "sup": false, "title": "Secrets, quyền tối thiểu và cấu hình", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-SEC-001", "SUP-SEC-002"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "03e6632c7a6074c6", "substeps": [], "sec": {"exp": "<p>Secrets là token/password/private key; lưu bên ngoài source khi phù hợp, cấp quyền tối thiểu và phân biệt cấu hình theo môi trường.</p>", "ex": "<p>Dùng biến môi trường hoặc secret manager của nền tảng deploy; repo chỉ có <code class=\"inline-code\">.env.example</code> với placeholder.</p>", "clar": "<p>Biến môi trường không tự mã hóa secret; tránh in ra log, crash dump hoặc client. Nếu bị lộ, cần revoke/rotate, không chỉ xóa file.</p>", "ext": "<p>Secret management chuyên nghiệp bao gồm rotation, audit và access control.</p>", "check": "<p>Nếu API key lỡ commit công khai, các bước xử lý đầu tiên là gì?</p>", "sync": "<ul>\n<li>Không commit key/password; cấu hình theo môi trường; chỉ cấp quyền cần thiết.</li>\n<li>Bài: kiểm tra repository giả lập trước khi public.</li>\n<li>Qua: biết xử lý khi credential đã lộ theo quy trình thu hồi/rotate.</li>\n</ul>"}}, {"id": "SEC-006", "sort": 230, "pfx": "SEC", "subj": "SEC", "subjName": "Bảo Mật Cơ Bản (Application Security)", "cat": "Quality & Security", "uitMap": "An toàn thông tin / OWASP Top 10:2025", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "16. Bảo mật cơ bản", "sem": "HK6", "sup": false, "title": "Dependencies và cập nhật", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-SE-007", "SUP-SEC-001", "SUP-SEC-002"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "d8bb3caed328c0e4", "substeps": [], "sec": {"exp": "<p>Dependency đem lại chức năng nhưng cũng mang lỗ hổng, rủi ro giấy phép và chuỗi cung ứng. Chỉ thêm package cần thiết và cập nhật có kiểm thử.</p>", "ex": "<p>Ghi dependency và version lock phù hợp ecosystem; theo dõi cảnh báo vulnerability và chạy test trước khi nâng major version.</p>", "clar": "<p>Không phải nâng phiên bản tự động luôn an toàn; đọc release notes, migration notes và kiểm tra tương thích. Không bỏ qua alert chỉ vì code chưa gọi rõ tính năng dễ tổn thương.</p>", "ext": "<p>SBOM và automated dependency scanning là mở rộng khi project vận hành thật.</p>", "check": "<p>Vì sao cần biết dependency nào nằm trong ứng dụng?</p>", "sync": "<ul>\n<li>Thư viện bên thứ ba có rủi ro; pin/update có kiểm soát; đọc cảnh báo bảo mật.</li>\n<li>Bài: lập danh sách dependency và vai trò của chúng.</li>\n<li>Qua: có ý thức theo dõi và không cài package lạ tùy tiện.</li>\n</ul>"}}, {"id": "SEC-007", "sort": 231, "pfx": "SEC", "subj": "SEC", "subjName": "Bảo Mật Cơ Bản (Application Security)", "cat": "Quality & Security", "uitMap": "An toàn thông tin / OWASP Top 10:2025", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHAI", "stage": "16. Bảo mật cơ bản", "sem": "HK6", "sup": false, "title": "Web security căn bản", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-SEC-002"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "18decd355927ed95", "substeps": [{"substep_id": "SEC-007.part-1", "title": "part-1: XSS (Cross-Site Scripting)", "check": "Threat, output encoding/sanitization và test kiểm chứng."}, {"substep_id": "SEC-007.part-2", "title": "part-2: CSRF & session security", "check": "Cookie HttpOnly/SameSite/Secure, CSRF token và kiểm tra quyền tại server."}, {"substep_id": "SEC-007.part-3", "title": "part-3: transport & security configuration", "check": "HTTPS/TLS, security headers và ẩn stack trace/secret ở lỗi production."}], "sec": {"exp": "<p>Web security gồm nhiều lớp như session, CSRF, XSS, access control, HTTPS, secure headers và error handling; rủi ro phụ thuộc kiến trúc/stack.</p>", "ex": "<p>Endpoint <code class=\"inline-code\">GET /users/123</code> phải kiểm tra người gọi có quyền xem user 123, không chỉ kiểm tra đã đăng nhập.</p>", "clar": "<p>Không có checklist đơn giản bảo đảm hệ thống an toàn hoàn toàn; cần threat model, framework guidance, test và review.</p>", "ext": "<p>Học sâu theo OWASP guidance và framework cụ thể sau khi nắm HTTP/auth basics.</p>", "check": "<p>Tạo hai test kiểm tra access control object-level và dữ liệu lỗi không lộ secret.</p>", "sync": "<ul>\n<li>Khái niệm XSS, CSRF, session/token và HTTPS trong phạm vi phù hợp dự án.</li>\n<li>Bài: map một lỗi sang nguyên nhân và biện pháp giảm rủi ro.</li>\n<li>Qua: hiểu nguyên tắc, biết tra tài liệu bảo mật chính thống khi triển khai thực tế.</li>\n</ul>"}}, {"id": "DEV-001", "sort": 232, "pfx": "DEV", "subj": "DEV", "subjName": "DevOps, Đóng Gói & Vận Hành", "cat": "Operations", "uitMap": "DevOps & CI/CD", "part": "PHẦN H — KỸ THUẬT PHẦN MỀM, KIỂM THỬ, BẢO MẬT VÀ TRIỂN KHA
