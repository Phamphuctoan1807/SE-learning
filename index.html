ấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Pipeline và song song mức nhập môn", "estStatus": "not_estimated", "depStatus": "reviewed", "reqPrereqs": ["ARCH-013", "ARCH-014", "ARCH-015", "ARCH-016"], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "dfb6929c5538d40f", "substeps": [], "sec": {"exp": "<p>Pipeline chồng lấp các giai đoạn thực thi của nhiều lệnh để tăng throughput; không nhất thiết giảm latency của từng lệnh. Song song có thể xảy ra ở nhiều cấp, nhưng có giới hạn phụ thuộc dữ liệu/tài nguyên.</p>", "ex": "<p>Trong pipeline 5 giai đoạn, khi lệnh A ở execute, lệnh B có thể decode và lệnh C fetch nếu không có hazard.</p>", "clar": "<p>Data/control/structural hazards có thể gây stall/flush; không phải pipeline khiến mọi chương trình nhanh gấp số stage.</p>", "ext": "<p>Branch prediction, superscalar và multicore là mở rộng khi nền tảng đã vững.</p>", "check": "<p>Phân biệt throughput và latency trong ví dụ xử lý nhiều lệnh.</p>", "sync": "<ul>\n<li><strong>Điều kiện:</strong> ARCH-013–016.</li>\n<li><strong>Học:</strong> chồng lấp các giai đoạn; hazard khái niệm; vì sao pipeline có thể tăng throughput mà không làm mọi lệnh đơn lẻ nhanh theo cùng tỷ lệ.</li>\n<li><strong>Bài:</strong> vẽ timeline vài lệnh.</li>\n<li><strong>Qua:</strong> phân biệt latency và throughput.</li>\n</ul>"}}, {"id": "ARCH-019", "sort": 128, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "I/O và hệ thống kết nối", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "94983effa896b68d", "substeps": [], "sec": {"exp": "<p>I/O nối CPU/memory với thiết bị; hệ thống bus/interconnect chuyển dữ liệu và tín hiệu điều khiển. Thiết bị có tốc độ và giao diện khác nhau.</p>", "ex": "<p>Khi đọc file, ứng dụng gọi thư viện/OS; hệ điều hành và driver tương tác với hệ thống I/O, dữ liệu được đưa tới buffer người dùng.</p>", "clar": "<p>Không phải mọi I/O đều được CPU tự copy từng byte; DMA và buffering có thể được dùng. Mô hình chính xác phụ thuộc thiết bị/OS.</p>", "ext": "<p>Interrupts, polling và DMA là các cách tổ chức giao tiếp cần học theo môn.</p>", "check": "<p>Vì sao thời gian đọc file không chỉ phụ thuộc vào tốc độ CPU?</p>", "sync": "<ul>\n<li><strong>Học:</strong> CPU, memory, thiết bị I/O; polling/interrupt ở mức đề cương; driver như lớp phần mềm điều khiển.</li>\n<li><strong>Bài:</strong> vẽ luồng khi chương trình đọc dữ liệu từ thiết bị/ổ lưu trữ ở mức khái niệm.</li>\n<li><strong>Qua:</strong> không coi CPU là thành phần duy nhất trong hệ thống.</li>\n</ul>"}}, {"id": "ARCH-020", "sort": 129, "pfx": "ARCH", "subj": "ARCH", "subjName": "Kiến Trúc Máy Tính (Từ Bit Đến CPU)", "cat": "Computer Systems", "uitMap": "IT012 (Tổ chức & Cấu trúc Máy tính II) / IT006", "part": "PHẦN C — KIẾN TRÚC MÁY TÍNH TỪ BIT ĐẾN CPU", "stage": "8. Thứ tự bắt buộc của Kiến trúc máy tính", "sem": "HK3", "sup": false, "title": "Ôn tập tích hợp và giải đề", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "e3f65e6b01af37c4", "substeps": [], "sec": {"exp": "<p>Bài tích hợp kiểm tra bạn liên kết biểu diễn số, logic, registers, ALU, lệnh, bộ nhớ và hiệu năng thành một câu chuyện thống nhất.</p>", "ex": "<p>Trace lệnh cộng: đọc mã lệnh, decode registers, đưa operands vào ALU, ghi kết quả; sau đó nêu cache/RAM có vai trò gì nếu operand cần lấy từ bộ nhớ.</p>", "clar": "<p>Nếu bài tính số và bài sơ đồ CPU đều làm riêng được nhưng không giải thích luồng dữ liệu, cần quay lại liên kết khái niệm.</p>", "ext": "<p>Tạo sơ đồ một trang từ bit → register → ALU → CPU → memory hierarchy.</p>", "check": "<p>Chọn một lệnh đơn giản và giải thích input, biến đổi, output ở từng thành phần.</p>", "sync": "<ul>\n<li><strong>Bài:</strong> nhận một số âm, chuyển đổi biểu diễn; lần một chuỗi lệnh; giải thích register/cache/RAM trong luồng thực thi.</li>\n<li><strong>Đạt:</strong> vẽ sơ đồ đúng và giải thích bằng ngôn ngữ của bản thân.</li>\n<li><strong>Tài liệu bổ trợ:</strong> Nand2Tetris có thể giúp nhìn các lớp từ logic tới máy tính, nhưng không thay thế bài giảng và bài tập/đề thi của trường.</li>\n<li>Bộ chuyển đổi nhị phân/hex tương tác có thể làm công cụ kiểm tra, nhưng trước khi mở đáp án phải thử bằng tay.</li>\n</ul>"}}, {"id": "DSA-001", "sort": 130, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK3", "sup": false, "title": "Input, output, ràng buộc và ví dụ", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["CPP-021", "CPP-026", "CPP-034"], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "4edc0bfa4bcc8582", "substeps": [], "sec": {"exp": "<p>Một đề thuật toán cần được chuyển thành hợp đồng chính xác: input, output, giới hạn, điều kiện hợp lệ và trường hợp đặc biệt. Ví dụ là cách kiểm tra cách hiểu đề trước code.</p>", "ex": "<p>Đề tìm x trong n số: input n, dãy và x; output vị trí hoặc chỉ báo không có. Test gồm x ở đầu, cuối và không xuất hiện.</p>", "clar": "<p>Một ví dụ đơn giản chưa đủ bao phủ miền input. Nếu đề không nêu rõ dữ liệu trùng hoặc thứ tự, ghi giả định hoặc hỏi lại.</p>", "ext": "<p>Tạo test trước khi code giúp tránh vô thức thiết kế test chỉ hợp với giải pháp mình viết.</p>", "check": "<p>Viết contract cho hàm tìm kiếm trong vector.</p>", "sync": "<ul>\n<li>Đọc đề, xác định định dạng input/output, miền dữ liệu, trường hợp đặc biệt.</li>\n<li>Trước khi code phải tạo ít nhất 3 bộ test.</li>\n<li>Qua bài: diễn đạt đề bằng lời và nêu câu hỏi còn mơ hồ.</li>\n</ul>"}}, {"id": "DSA-002", "sort": 131, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK3", "sup": false, "title": "Chia nhỏ bài toán và invariant", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-DM-001"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "1f7af1bc4645f180", "substeps": [], "sec": {"exp": "<p>Chia nhỏ bài toán giảm số quyết định phải xử lý một lúc. Invariant là tính chất giữ đúng ở mỗi vòng hoặc bước, giúp lập luận vì sao kết quả cuối đúng.</p>", "ex": "<p>Trong tìm kiếm tuyến tính sau khi xét i phần tử đầu, invariant có thể là “nếu target nằm trong prefix đã xét thì đã trả về”.</p>", "clar": "<p>Invariant phải đúng trước vòng, được bảo toàn sau mỗi vòng, và khi kết thúc đủ mạnh để suy ra kết quả.</p>", "ext": "<p>Invariant thường liên hệ với chứng minh quy nạp và correctness.</p>", "check": "<p>Viết invariant cho vòng đếm số phần tử dương.</p>", "sync": "<ul>\n<li>Chia thành bước nhỏ; invariant là điều vẫn đúng trong mỗi vòng lặp.</li>\n<li>Bài: giải bài đếm phần tử bằng lời, nêu thứ đúng trước/sau mỗi vòng.</li>\n<li>Qua bài: giải thích được vì sao vòng lặp kết thúc và kết quả đúng.</li>\n</ul>"}}, {"id": "DSA-003", "sort": 132, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK3", "sup": false, "title": "Độ phức tạp thời gian và bộ nhớ", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-DSA-002"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "0a42438edb9404ea", "substeps": [], "sec": {"exp": "<p>Độ phức tạp mô tả cách tài nguyên tăng theo kích thước input; phân tích thời gian và bộ nhớ riêng biệt. Big-O thường mô tả cận trên tiệm cận, không phải thời gian thực.</p>", "ex": "<p>Duyệt n phần tử O(n); tạo ma trận n×n O(n²) ô; binary search trên dãy có thứ tự O(log n) bước.</p>", "clar": "<p>Nếu code có hai vòng chạy n lần lồng nhau thường là O(n²), nhưng vòng lồng giới hạn khác có thể phức tạp khác. Nêu điều kiện phân tích.</p>", "ext": "<p>Đo benchmark bổ sung cho phân tích, không thay thế nó.</p>", "check": "<p>Phân tích code có một vòng n và một vòng lồng m: độ lớn là gì?</p>", "sync": "<ul>\n<li>O(1), O(log n), O(n), O(n log n), O(n²); best/average/worst chỉ khi phù hợp.</li>\n<li>Bài: đếm thao tác trong vòng đơn, vòng lồng và vòng giảm một nửa.</li>\n<li>Qua bài: ước lượng tăng trưởng, không tính từng nano giây.</li>\n</ul>"}}, {"id": "DSA-004", "sort": 133, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK3", "sup": false, "title": "Mảng, vector và thao tác chi phí", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["DSA-005", "DSA-006", "SUP-DSA-002"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "a4b29418917359b3", "substeps": [], "sec": {"exp": "<p>Mảng/vector hỗ trợ truy cập theo index nhanh thường O(1); chèn/xóa ở giữa thường cần dịch phần tử, O(n). Hành vi thực tế tùy thao tác và container.</p>", "ex": "<p>Lấy <code class=\"inline-code\">v[10]</code> trực tiếp không cần duyệt 10 phần tử; chèn ở đầu vector buộc dịch các phần tử hiện có.</p>", "clar": "<p><code class=\"inline-code\">push_back</code> của vector có chi phí amortized O(1) trong mô hình chuẩn phổ biến, nhưng một lần reallocation có thể O(n).</p>", "ext": "<p>Lựa chọn cấu trúc dựa trên workload: truy cập, tìm, chèn/xóa, thứ tự và memory.</p>", "check": "<p>Nêu thao tác nào có lợi thế ở vector và thao tác nào có thể tốn O(n).</p>", "sync": "<ul>\n<li>Duyệt, truy cập theo chỉ số, chèn/xóa và dịch phần tử.</li>\n<li>Bài: so sánh tìm theo chỉ số với tìm theo giá trị.</li>\n<li>Qua bài: liên kết thao tác với chi phí và giới hạn cấu trúc.</li>\n</ul>"}}, {"id": "DSA-005", "sort": 134, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK3", "sup": false, "title": "Tìm kiếm tuyến tính", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["DSA-004"], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "31c993e82fd09a37", "substeps": [], "sec": {"exp": "<p>Linear search duyệt lần lượt cho đến khi gặp target hoặc hết dãy. Không cần sort, nhưng trường hợp xấu kiểm tra đến n phần tử.</p>", "ex": "<p>Với [4,8,2], tìm 2 cần 3 lần so sánh; tìm 4 cần 1 lần.</p>", "clar": "<p>Nếu dãy có duplicates, kết quả phụ thuộc code trả lần đầu hay lần khác. Trường hợp không tồn tại phải được biểu diễn rõ ràng.</p>", "ext": "<p>Đếm tần suất có thể mở rộng thành bảng băm nếu cần nhiều truy vấn.</p>", "check": "<p>Nêu số lần so sánh tối đa với n phần tử.</p>", "sync": "<ul>\n<li>Khi dữ liệu chưa có thứ tự; trả chỉ số/không tìm thấy.</li>\n<li>Bài: trả vị trí đầu tiên, đếm số lần xuất hiện.</li>\n<li>Qua bài: xử lý mảng rỗng và giá trị trùng.</li>\n</ul>"}}, {"id": "DSA-006", "sort": 135, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK3", "sup": false, "title": "Sắp xếp căn bản và tiêu chí", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["DSA-004"], "recBg": [], "unlocks": ["DSA-007"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "00c7fa4423204630", "substeps": [], "sec": {"exp": "<p>Sort sắp phần tử theo comparator. Các thuật toán dạy căn bản giúp hiểu ý tưởng; trong ứng dụng C++ thường ưu tiên <code class=\"inline-code\">std::sort</code> trừ khi có yêu cầu khác.</p>", "ex": "<p>Với records, comparator có thể xếp theo điểm giảm dần rồi mã tăng dần để phá hòa.</p>", "clar": "<p>Comparator cần nhất quán tạo strict weak ordering; comparator sai có thể làm kết quả không hợp lệ. Stable sort giữ thứ tự tương đối của các phần tử tương đương theo comparator.</p>", "ext": "<p>Thử sort dữ liệu đã sort ngược, dữ liệu trùng và vector rỗng.</p>", "check": "<p>Nêu tiêu chí sort trước khi viết comparator.</p>", "sync": "<ul>\n<li>Hiểu mục đích của sort và comparator; bubble/selection/insertion chỉ để học ý tưởng nếu giáo trình yêu cầu.</li>\n<li>Bài: sắp xếp theo điểm rồi theo mã; kiểm tra thứ tự.</li>\n<li>Qua bài: nhận ra tính ổn định/tiêu chí thứ tự khi cần, không bắt buộc học định nghĩa nâng cao quá sớm.</li>\n</ul>"}}, {"id": "DSA-007", "sort": 136, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK3", "sup": false, "title": "Binary search", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["DSA-006"], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "9b123604d4568ca6", "substeps": [], "sec": {"exp": "<p>Binary search thu hẹp khoảng tìm nhờ dữ liệu có thứ tự. Mỗi bước so sánh giữa và quyết định nửa nào còn có thể chứa target.</p>", "ex": "<p>Trong [1,3,5,7,9], tìm 7: mid=5, đi phải; khoảng còn [7,9], so sánh tiếp và tìm thấy.</p>", "clar": "<p>Điều kiện sorted hoặc predicate đơn điệu là nền tảng, không phải chi tiết tùy chọn. Cần invariant cho khoảng có thể chứa kết quả.</p>", "ext": "<p><code class=\"inline-code\">lower_bound</code> tìm vị trí đầu tiên không nhỏ hơn value, hữu ích khi có duplicate.</p>", "check": "<p>Một dãy chưa sort có thể dùng binary search đúng vì tình cờ một test cho kết quả không?</p>", "sync": "<ul>\n<li>Tiền đề: dữ liệu được sắp xếp và điều kiện thu hẹp khoảng đúng.</li>\n<li>Bài: trace <code class=\"inline-code\">left</code>, <code class=\"inline-code\">mid</code>, <code class=\"inline-code\">right</code>; tìm có/không có.</li>\n<li>Qua bài: giải thích vì sao mỗi vòng bỏ được một phần dữ liệu.</li>\n</ul>"}}, {"id": "DSA-008", "sort": 137, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK3", "sup": false, "title": "Prefix sum", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "c4c5228c34013377", "substeps": [], "sec": {"exp": "<p>Prefix sum lưu tổng tiền tố, cho phép tính tổng đoạn bằng hiệu hai tổng tiền tố thay vì cộng lại từng phần tử mỗi truy vấn.</p>", "ex": "<p>Nếu prefix[i] là tổng a[0..i), tổng nửa mở [l,r) là prefix[r]-prefix[l].</p>", "clar": "<p>Phải thống nhất quy ước index; dùng prefix có n+1 phần tử thường làm công thức đoạn rõ hơn. Giá trị tổng có thể cần kiểu rộng hơn kiểu từng phần tử.</p>", "ext": "<p>Có thể mở rộng sang 2D prefix sum cho truy vấn hình chữ nhật.</p>", "check": "<p>Với a=[2,4,1], tính tổng đoạn [1,3) theo quy ước nửa mở.</p>", "sync": "<ul>\n<li>Tính tổng tiền tố để trả lời truy vấn tổng đoạn.</li>\n<li>Bài: so sánh cộng lại mỗi đoạn với dùng prefix sum.</li>\n<li>Qua bài: xử lý chỉ số và quy ước đoạn nhất quán.</li>\n</ul>"}}, {"id": "DSA-009", "sort": 138, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK3", "sup": false, "title": "Two pointers và sliding window nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "e81fa9033593227a", "substeps": [], "sec": {"exp": "<p>Two pointers dùng hai vị trí di chuyển có lý do; sliding window giữ một khoảng liên tục và cập nhật khi biên di chuyển. Độ đúng dựa trên đặc tính bài toán, không chỉ mẫu code.</p>", "ex": "<p>Trên dãy tăng, cặp tổng target: nếu tổng nhỏ hơn target thì tăng left; nếu lớn hơn thì giảm right. Cửa sổ k phần tử cập nhật bằng cách cộng phần tử vào và trừ phần tử ra.</p>", "clar": "<p>Hai pointers không tự động đúng trên mọi dãy; thuật toán cặp tổng cần sorted hoặc tính chất tương đương. Sliding-window cho điều kiện tổng thường dễ hơn khi số không âm.</p>", "ext": "<p>Trước khi dùng pattern, chứng minh vì sao loại bỏ một phần phạm vi không mất lời giải.</p>", "check": "<p>Nêu điều kiện cần để cách tăng/giảm pointer trong bài cặp tổng có hiệu lực.</p>", "sync": "<ul>\n<li>Dùng hai vị trí khi dữ liệu/cấu trúc bài cho phép; cửa sổ trượt.</li>\n<li>Bài: tìm cặp có tổng mục tiêu trên dãy đã sắp xếp hoặc tính tổng cửa sổ kích thước cố định.</li>\n<li>Qua bài: giải thích điều kiện khiến cách làm hợp lệ.</li>\n</ul>"}}, {"id": "DSA-010", "sort": 139, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK3", "sup": false, "title": "Chuỗi và tần suất", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "b5deb090e82c4b6c", "substeps": [], "sec": {"exp": "<p>Tần suất đếm số lần một phần tử xuất hiện; hash map phù hợp khi cần nhiều tra cứu theo key. Với văn bản, quy tắc chuẩn hóa phải rõ.</p>", "ex": "<p>Đếm từ bằng <code class=\"inline-code\">unordered_map&lt;string,int&gt; freq; ++freq[word];</code> sau khi token hóa đầu vào theo quy tắc.</p>", "clar": "<p>Chữ hoa/thường, dấu câu, Unicode và khoảng trắng có thể làm thay đổi kết quả; “hai từ giống nhau” cần định nghĩa.</p>", "ext": "<p>Có thể dùng sort rồi đếm liền kề để so sánh cách làm với hashing.</p>", "check": "<p>Hai chuỗi “Code” và “code” có cùng từ không trong quy tắc hiện tại?</p>", "sync": "<ul>\n<li>Xử lý ký tự, tần suất, chuẩn hóa đầu vào phù hợp bài.</li>\n<li>Bài: kiểm tra anagram hoặc đếm ký tự theo quy ước rõ.</li>\n<li>Qua bài: test ký tự lặp, chuỗi rỗng và khác biệt hoa/thường nếu liên quan.</li>\n</ul>"}}, {"id": "DSA-011", "sort": 140, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK3", "sup": false, "title": "Stack", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "3951fe90150f376d", "substeps": [], "sec": {"exp": "<p>Stack tuân LIFO; chỉ thao tác phần tử trên cùng. Nó phù hợp lưu trạng thái cần xử lý ngược thứ tự.</p>", "ex": "<p>Dấu ngoặc: gặp <code class=\"inline-code\">(</code> thì push; gặp <code class=\"inline-code\">)</code> thì phải có <code class=\"inline-code\">(</code> tương ứng ở top rồi pop; cuối cùng stack phải rỗng.</p>", "clar": "<p>Phải xử lý đóng ngoặc khi stack rỗng. Nếu có nhiều loại ngoặc, top cần khớp đúng loại.</p>", "ext": "<p>Undo, call stack và DFS là các ứng dụng tương tự.</p>", "check": "<p>Trace stack sau khi đọc <code class=\"inline-code\">(()</code> và cho biết cân bằng không.</p>", "sync": "<ul>\n<li>LIFO, push/pop/top; kiểm tra ngoặc và undo ở mức mô hình.</li>\n<li>Bài: dấu ngoặc cân bằng.</li>\n<li>Qua bài: trace trạng thái stack từng bước.</li>\n</ul>"}}, {"id": "DSA-012", "sort": 141, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK3", "sup": false, "title": "Queue và deque", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "67d2bc54bd00232b", "substeps": [], "sec": {"exp": "<p>Queue tuân FIFO; deque cho phép thêm/xóa ở hai đầu. Cấu trúc hữu ích cho hàng chờ, lịch xử lý và BFS.</p>", "ex": "<p>Queue nhận A, B, C rồi dequeue sẽ lấy A trước.</p>", "clar": "<p>Kiểm tra empty trước front/pop; thao tác cụ thể phụ thuộc container C++ được dùng.</p>", "ext": "<p>Priority queue khác queue FIFO: lấy phần tử ưu tiên nhất chứ không nhất thiết phần tử đến trước.</p>", "check": "<p>Nếu enqueue 1,2,3 rồi dequeue hai lần, còn gì trong queue?</p>", "sync": "<ul>\n<li>FIFO; enqueue/dequeue; ví dụ xử lý tác vụ.</li>\n<li>Bài: mô phỏng hàng chờ hoặc BFS sau này.</li>\n<li>Qua bài: chọn đúng thứ tự xử lý.</li>\n</ul>"}}, {"id": "DSA-013", "sort": 142, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK3", "sup": false, "title": "Linked list ở mức khái niệm", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "ec40d94c00c36ba7", "substeps": [], "sec": {"exp": "<p>Linked list gồm node chứa dữ liệu và liên kết sang node khác. Nó không yêu cầu các node nằm liên tiếp trong bộ nhớ, nhưng truy cập index cần đi qua liên kết.</p>", "ex": "<p>Danh sách A→B→C: chèn X sau A cần nối A→X và X→B, với cập nhật pointer cẩn thận.</p>", "clar": "<p>Chèn xóa rẻ O(1) chỉ khi đã có node/vị trí thích hợp; tìm vị trí vẫn O(n). Vector thường có locality tốt và dễ dùng hơn nhiều tình huống.</p>", "ext": "<p>Linked list là công cụ học pointer/lifetime, không phải cấu trúc luôn tốt hơn vector.</p>", "check": "<p>Vẽ các liên kết trước và sau khi chèn node vào giữa danh sách.</p>", "sync": "<ul>\n<li>Node, liên kết, chèn/xóa và trade-off so với mảng/vector.</li>\n<li>Bài: vẽ node và con trỏ cho danh sách 3 phần tử.</li>\n<li>Qua bài: giải thích lợi ích/chi phí; không học thuộc cách code trước khi hiểu sơ đồ.</li>\n</ul>"}}, {"id": "DSA-014", "sort": 143, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK3", "sup": false, "title": "Hash table và hashing", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "0c258da463f18bef", "substeps": [], "sec": {"exp": "<p>Hash table dùng hàm hash ánh xạ key tới vùng/bucket; collision xảy ra khi key khác nhau va vào cùng vị trí/bucket. Hashing cho tra cứu trung bình nhanh nếu phân bố và cài đặt phù hợp.</p>", "ex": "<p><code class=\"inline-code\">unordered_map</code> đếm điểm theo student ID; hai key khác nhau có thể có cùng hash/bucket nhưng container vẫn phải phân biệt chúng.</p>", "clar": "<p>Hash collision là bình thường, không nhất thiết bug. Không cam kết mọi thao tác O(1) trong worst case; hash key phải đáp ứng yêu cầu container.</p>", "ext": "<p>Load factor, rehash và hash DoS là chủ đề mở rộng.</p>", "check": "<p>Collision nghĩa là hai key phải được coi là bằng nhau không?</p>", "sync": "<ul>\n<li>Key, hash, collision, bucket; tra cứu trung bình nhanh nhưng có điều kiện.</li>\n<li>Bài: đếm tần suất bằng <code class=\"inline-code\">unordered_map</code>; đối chiếu map.</li>\n<li>Qua bài: giải thích collision và không khẳng định mọi thao tác luôn O(1).</li>\n</ul>"}}, {"id": "DSA-015", "sort": 144, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK3", "sup": false, "title": "Set, map và thứ tự", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "fe9b656a308f25d2", "substeps": [], "sec": {"exp": "<p>Set giữ key duy nhất; map gắn key với value. <code class=\"inline-code\">std::map</code> giữ thứ tự theo comparator; <code class=\"inline-code\">unordered_map</code> không cam kết thứ tự.</p>", "ex": "<p>Loại duplicate ID: insert ID vào set, kiểm tra thao tác insert có thêm mới không. Đếm lỗi: key là loại lỗi, value là số lần.</p>", "clar": "<p><code class=\"inline-code\">map[key]</code> có thể tạo phần tử mới; nếu chỉ muốn kiểm tra tồn tại, dùng <code class=\"inline-code\">find</code>/<code class=\"inline-code\">contains</code> theo chuẩn đang dùng.</p>", "ext": "<p>Cân nhắc key uniqueness, cần ordering, lookup pattern và chi phí.</p>", "check": "<p>Chọn set, map hay vector để loại ID trùng và nêu lý do.</p>", "sync": "<ul>\n<li>Giá trị duy nhất, key-value, thứ tự theo implementation; chọn cấu trúc theo yêu cầu.</li>\n<li>Bài: loại trùng; đếm từ; liệt kê khóa theo thứ tự.</li>\n<li>Qua bài: biện minh lựa chọn cấu trúc.</li>\n</ul>"}}, {"id": "DSA-016", "sort": 145, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK4", "sup": false, "title": "Đệ quy và call stack", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-DM-003"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "06df127e4b7afd9f", "substeps": [], "sec": {"exp": "<p>Recursion dùng call stack để lưu trạng thái của mỗi lời gọi. Mỗi recursive case cần làm bài toán nhỏ hơn và đến base case; độ sâu quá lớn có thể làm tràn stack.</p>", "ex": "<p><code class=\"inline-code\">sum(n)=n+sum(n-1)</code> với base <code class=\"inline-code\">sum(0)=0</code> cho n không âm. Trace sum(3): 3+sum(2)…</p>", "clar": "<p>Recursion không phải lúc nào cũng tối ưu; nhiều lời gọi lặp lại cùng bài con có thể khiến thời gian tăng nhanh.</p>", "ext": "<p>Memoization tránh tính lại bài con giống nhau khi quan hệ truy hồi có overlap.</p>", "check": "<p>Base case của sum(n) với n≥0 là gì và vì sao phải có?</p>", "sync": "<ul>\n<li>Base case, recursive case, mỗi frame; độ sâu và nguy cơ stack overflow.</li>\n<li>Bài: trace factorial/tổng dãy nhỏ rồi giải bài tương tự.</li>\n<li>Qua bài: đưa được base case và chứng minh kích thước bài toán giảm.</li>\n</ul>"}}, {"id": "DSA-017", "sort": 146, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK4", "sup": false, "title": "Chia để trị và merge sort/quicksort ở mức ý tưởng", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-DM-003"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "16986e0220e5ea85", "substeps": [{"substep_id": "DSA-017.part-1", "title": "part-1: divide-and-conquer", "check": "Mô hình chia bài toán thành bài con, giải và kết hợp kết quả."}, {"substep_id": "DSA-017.part-2", "title": "part-2: merge sort", "check": "Trace thao tác chia đôi và merge hai dãy đã sắp xếp; chi phí O(n log n) và bộ nhớ phụ."}, {"substep_id": "DSA-017.part-3", "title": "part-3: quicksort", "check": "Trace partition quanh pivot; phân biệt average case và worst-case O(n²)."}], "sec": {"exp": "<p>Divide-and-conquer chia bài thành các bài con, giải và kết hợp kết quả. Merge sort chia rồi trộn có thứ tự; quicksort phân vùng quanh pivot rồi sort các phần.</p>", "ex": "<p>Merge hai dãy đã sort [1,4] và [2,3] thành [1,2,3,4] bằng cách chọn phần tử đầu nhỏ hơn mỗi lần.</p>", "clar": "<p>Quicksort có worst-case O(n²) ở cách chọn pivot xấu; merge sort thường O(n log n) nhưng cần bộ nhớ bổ sung cho mảng.</p>", "ext": "<p>Phân tích recurrence giải thích tăng trưởng của thuật toán chia để trị.</p>", "check": "<p>Vì sao merge sort cần thao tác merge sau khi sort các nửa?</p>", "sync": "<ul>\n<li>Chia bài, giải phần nhỏ, ghép kết quả; partition/merge ở mức thích hợp.</li>\n<li>Bài: vẽ cách chia/ghép dãy.</li>\n<li>Qua bài: giải thích vì sao các phần nhỏ cùng nhau giải quyết bài ban đầu.</li>\n</ul>"}}, {"id": "DSA-018", "sort": 147, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK4", "sup": false, "title": "Cây, thuật ngữ và biểu diễn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-DSA-001"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "db3a478b8cb83e7c", "substeps": [], "sec": {"exp": "<p>Cây có quan hệ cha–con; root không có parent; leaf không có child. Depth là số cạnh từ root; height của node/tree có quy ước cần xác định rõ.</p>", "ex": "<p>Với root A có hai con B,C; B có con D, depth(D)=2 nếu root depth 0.</p>", "clar": "<p>Một số tài liệu định nghĩa height theo số cạnh, số node hoặc height cây rỗng khác nhau; theo một quy ước nhất quán.</p>", "ext": "<p>Tree traversal và BST/heap dựa trên khái niệm cấu trúc cây.</p>", "check": "<p>Vẽ cây 5 node, đánh dấu root, leaf và depth.</p>", "sync": "<ul>\n<li>Root, parent/child, leaf, depth/height; cây nhị phân.</li>\n<li>Bài: vẽ cây từ dữ liệu mẫu và đếm node/leaf.</li>\n<li>Qua bài: dùng đúng thuật ngữ và xác định đường đi.</li>\n</ul>"}}, {"id": "DSA-019", "sort": 148, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK4", "sup": false, "title": "Duyệt cây", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-DSA-001"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "df3ef5d123ec822b", "substeps": [], "sec": {"exp": "<p>Preorder thăm node trước các con; inorder thăm trái, node, phải; postorder thăm các con trước node trong cây nhị phân. Thứ tự duyệt phụ thuộc cấu trúc và quy tắc.</p>", "ex": "<p>Cây root 2, trái 1, phải 3: preorder 2,1,3; inorder 1,2,3; postorder 1,3,2.</p>", "clar": "<p>Inorder chỉ tạo thứ tự tăng với BST hợp lệ theo comparator, không với mọi cây.</p>", "ext": "<p>Traversal áp dụng cho serialize, expression tree và bài toán tổng hợp cây.</p>", "check": "<p>Tính ba thứ tự duyệt cây root 4, left 2, right 6.</p>", "sync": "<ul>\n<li>Preorder, inorder, postorder; liên hệ đệ quy.</li>\n<li>Bài: liệt kê kết quả duyệt một cây nhỏ.</li>\n<li>Qua bài: trace được bằng tay rồi viết hàm cho một dạng.</li>\n</ul>"}}, {"id": "DSA-020", "sort": 149, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK4", "sup": false, "title": "Binary search tree và heap", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "4158afa6db4d6e91", "substeps": [{"substep_id": "DSA-020.part-1", "title": "part-1: BST invariant & operations", "check": "Quan hệ thứ tự trái < cha < phải và suy biến khi cây lệch."}, {"substep_id": "DSA-020.part-2", "title": "part-2: heap / priority queue", "check": "Quan hệ ưu tiên cha–con tại root; không trộn invariant của heap với BST."}], "sec": {"exp": "<p>BST sắp xếp key theo quan hệ trái/cha/phải; heap bảo đảm quan hệ ưu tiên cha–con nhưng không sort toàn bộ dãy. Cả hai giải quyết nhu cầu khác nhau.</p>", "ex": "<p>BST tìm key dựa vào nhỏ hơn/lớn hơn; max-heap giữ phần tử lớn nhất tại root. Priority queue thường dùng heap.</p>", "clar": "<p>BST không tự bảo đảm cân bằng; trường hợp suy biến có thể thành O(n). Heap không cho tìm key bất kỳ hiệu quả như BST nói chung.</p>", "ext": "<p>Balanced trees và heap operations là phần mở rộng khi cần.</p>", "check": "<p>Cấu trúc nào phù hợp lấy phần tử ưu tiên lớn nhất lặp đi lặp lại?</p>", "sync": "<ul>\n<li>BST theo quy tắc thứ tự; heap phục vụ ưu tiên; không đồng nhất chúng.</li>\n<li>Bài: chèn vài khóa vào BST và xác định phần tử lớn nhất; mô phỏng priority queue.</li>\n<li>Qua bài: chọn cấu trúc theo thao tác cần hỗ trợ.</li>\n</ul>"}}, {"id": "DSA-021", "sort": 150, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK4", "sup": false, "title": "Đồ thị và danh sách kề/ma trận kề", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-DSA-003"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "57a13ea9eaf6ccfd", "substeps": [], "sec": {"exp": "<p>Đồ thị biểu diễn đỉnh và cạnh; adjacency list lưu hàng xóm của mỗi đỉnh, adjacency matrix dùng ô ma trận thể hiện cạnh. Lựa chọn phụ thuộc mật độ đồ thị và thao tác.</p>", "ex": "<p>Trong đồ thị 1—2—3, danh sách kề của 2 là [1,3]; ma trận kề có ô (1,2),(2,1),(2,3),(3,2) bằng 1 với đồ thị vô hướng.</p>", "clar": "<p>Với đồ thị có hướng, u→v không tự suy ra v→u. Với trọng số, representation cần lưu cả trọng số.</p>", "ext": "<p>Adjacency list thường tiết kiệm hơn cho đồ thị thưa.</p>", "check": "<p>Biểu diễn một mạng đường đi 4 địa điểm bằng adjacency list.</p>", "sync": "<ul>\n<li>Node/edge, có hướng/vô hướng, có trọng số/không trọng số.</li>\n<li>Bài: biểu diễn một bản đồ bằng danh sách kề.</li>\n<li>Qua bài: chuyển qua lại được giữa hình và representation.</li>\n</ul>"}}, {"id": "DSA-022", "sort": 151, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK4", "sup": false, "title": "BFS", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-DSA-003"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "ef1792ef33e53666", "substeps": [], "sec": {"exp": "<p>BFS dùng queue để duyệt theo lớp khoảng cách cạnh trong đồ thị không trọng số. <code class=\"inline-code\">visited</code> ngăn xử lý lặp và đảm bảo thuật toán kết thúc trên đồ thị hữu hạn.</p>", "ex": "<p>Bắt đầu A, hàng xóm B,C; BFS xử lý A rồi B,C rồi các node được phát hiện từ chúng theo thứ tự queue.</p>", "clar": "<p>BFS tìm đường ngắn nhất theo số cạnh trong đồ thị không trọng số nếu dùng quy trình chuẩn; với cạnh trọng số tùy ý, BFS không đủ để tìm đường rẻ nhất.</p>", "ext": "<p>Lưu parent/distance để dựng lại đường đi.</p>", "check": "<p>Vì sao đánh dấu visited lúc enqueue thường tránh đưa cùng node vào queue nhiều lần?</p>", "sync": "<ul>\n<li>Queue, visited, duyệt theo lớp; đường ngắn nhất trên đồ thị không trọng số ở điều kiện phù hợp.</li>\n<li>Bài: lần BFS trên đồ thị 5–7 đỉnh.</li>\n<li>Qua bài: nêu được vai trò của visited và thứ tự hàng đợi.</li>\n</ul>"}}, {"id": "DSA-023", "sort": 152, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK4", "sup": false, "title": "DFS", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-DSA-003"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "7c7b03c16a4df8aa", "substeps": [], "sec": {"exp": "<p>DFS đi sâu theo một nhánh rồi quay lui; có thể cài bằng recursion hoặc stack. Nó tìm cấu trúc/khả năng liên thông chứ không tự đảm bảo đường ngắn nhất.</p>", "ex": "<p>Từ A, DFS có thể thăm B rồi D trước C tùy thứ tự hàng xóm. Ghi rõ thứ tự adjacency để kết quả trace có xác định.</p>", "clar": "<p>Kết quả DFS order có thể khác theo thứ tự hàng xóm; nhiều thứ tự vẫn hợp lệ. Recursion depth có thể là vấn đề trên đồ thị rất sâu.</p>", "ext": "<p>Connected components, cycle detection và topological sorting là mở rộng.</p>", "check": "<p>So sánh mục đích BFS/DFS và nêu trường hợp BFS cho đường ngắn nhất không trọng số.</p>", "sync": "<ul>\n<li>Stack/recursion, visited, thành phần liên thông ở mức cơ bản.</li>\n<li>Bài: trace DFS và so sánh với BFS.</li>\n<li>Qua bài: không nhầm thứ tự khám phá với “đường ngắn nhất”.</li>\n</ul>"}}, {"id": "DSA-024", "sort": 153, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK4", "sup": false, "title": "Greedy", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "8a756f3101d6fc71", "substeps": [], "sec": {"exp": "<p>Greedy chọn quyết định cục bộ tại mỗi bước. Để đúng cho bài tối ưu, cần chứng minh lựa chọn cục bộ dẫn tới lời giải toàn cục; trực giác không đủ.</p>", "ex": "<p>Chọn nhiều hoạt động không chồng lấn có thể dùng chiến lược kết thúc sớm nhất dưới điều kiện chuẩn; coin change chỉ tối ưu với một số hệ mệnh giá, không phải tất cả.</p>", "clar": "<p>Greedy thất bại ở vài hệ tiền là ví dụ tại sao phải chứng minh tính chất. Luôn phân biệt “có vẻ hợp lý” và “được chứng minh đúng”.</p>", "ext": "<p>So sánh greedy với DP trên một bài nhỏ giúp hiểu trade-off.</p>", "check": "<p>Nêu một tình huống cho thấy tham lam chọn đồng lớn nhất có thể không tối ưu.</p>", "sync": "<ul>\n<li>Chọn lựa cục bộ; cần lập luận điều kiện để lựa chọn là đúng.</li>\n<li>Bài: một ví dụ coin change nếu mệnh giá phù hợp; so sánh với trường hợp greedy không tối ưu.</li>\n<li>Qua bài: không coi greedy là phương pháp đúng cho mọi tối ưu hóa.</li>\n</ul>"}}, {"id": "DSA-025", "sort": 154, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK4", "sup": false, "title": "Quy hoạch động nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "25cf8c597a57f6fd", "substeps": [], "sec": {"exp": "<p>Dynamic programming lưu kết quả bài con để tránh tính lặp. Cần định nghĩa state, base cases và transition bằng ý nghĩa rõ của <code class=\"inline-code\">dp[i]</code>.</p>", "ex": "<p>Fibonacci: <code class=\"inline-code\">dp[0]=0</code>, <code class=\"inline-code\">dp[1]=1</code>, <code class=\"inline-code\">dp[i]=dp[i-1]+dp[i-2]</code>; tính từ nhỏ lên.</p>", "clar": "<p>DP không phải chỉ thêm mảng vào recursion. State phải chứa đủ thông tin để tính trạng thái sau; transition sai làm toàn bộ dãy sai.</p>", "ext": "<p>Tối ưu bộ nhớ bằng cách chỉ lưu trạng thái cần thiết sau khi hiểu công thức.</p>", "check": "<p>Viết bằng lời ý nghĩa của <code class=\"inline-code\">dp[i]</code> trong bài đếm cách leo bậc thang.</p>", "sync": "<ul>\n<li>Bài toán con chồng lặp, trạng thái, chuyển trạng thái, base case.</li>\n<li>Bài: Fibonacci memoization/tabulation, sau đó một bài đếm cách đơn giản.</li>\n<li>Qua bài: nói rõ <code class=\"inline-code\">dp[i]</code> có ý nghĩa gì trước khi viết chuyển trạng thái.</li>\n</ul>"}}, {"id": "DSA-026", "sort": 155, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK4", "sup": false, "title": "Backtracking nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "96ddbc95f2c9abfd", "substeps": [], "sec": {"exp": "<p>Backtracking thử một lựa chọn, đi sâu, rồi hoàn tác để thử lựa chọn khác. Nó hữu ích khi cần liệt kê/tìm cấu hình và có thể cắt nhánh không thể dẫn tới nghiệm.</p>", "ex": "<p>Sinh tập con của {a,b}: tại mỗi phần tử quyết định chọn hoặc không chọn; khi hết phần tử, ghi một subset.</p>", "clar": "<p>Phải khôi phục trạng thái sau một nhánh; nếu không, nhánh sau bị nhiễm dữ liệu. Độ phức tạp có thể tăng theo số cấu hình.</p>", "ext": "<p>Pruning giảm phần không cần xét khi điều kiện loại nhánh là đúng.</p>", "check": "<p>Nêu trạng thái, lựa chọn, base case cho bài sinh tập con.</p>", "sync": "<ul>\n<li>Quyết định → thử → kiểm tra → quay lui; cắt nhánh khi có điều kiện đúng.</li>\n<li>Bài: sinh tập con hoặc dãy lựa chọn nhỏ.</li>\n<li>Qua bài: phân biệt trạng thái hiện tại, lựa chọn và điều kiện dừng.</li>\n</ul>"}}, {"id": "DSA-027", "sort": 156, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK4", "sup": false, "title": "Độ đúng và chứng minh thực dụng", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "98756a63e2d7b48d", "substeps": [], "sec": {"exp": "<p>Độ đúng nghĩa là thuật toán trả kết quả theo đặc tả với mọi input hợp lệ. Lập luận có thể dùng invariant, quy nạp hoặc phân tích từng trường hợp; test là bằng chứng bổ trợ chứ không thay chứng minh tổng quát.</p>", "ex": "<p>Chứng minh linear search: duyệt mỗi phần tử đúng một lần; nếu target xuất hiện ở vị trí k, thuật toán gặp nó không muộn hơn khi kiểm tra k; nếu hết dãy thì không có phần tử khớp.</p>", "clar": "<p>Đừng nhầm “không tìm thấy trong các test” với “không tồn tại trong mọi input”. Đặc tả và assumptions cần viết rõ.</p>", "ext": "<p>Proof sketch 4–6 câu là kỹ năng thực tế cho review thuật toán.</p>", "check": "<p>Hãy đưa lập luận cho trường hợp target không có trong dãy.</p>", "sync": "<ul>\n<li>Dùng ví dụ, invariant, quy nạp hoặc lập luận đổi trạng thái phù hợp.</li>\n<li>Bài: viết 4–6 câu chứng minh tìm kiếm tuyến tính hoặc binary search đúng ở mức cơ bản.</li>\n<li>Qua bài: tránh chỉ nói “em chạy thử thấy đúng”.</li>\n</ul>"}}, {"id": "DSA-028", "sort": 157, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK4", "sup": false, "title": "Đọc giới hạn và chọn thuật toán", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f5c589bb2eb8e097", "substeps": [], "sec": {"exp": "<p>Constraint của n và giới hạn thời gian/bộ nhớ gợi ý độ phức tạp phù hợp. Chọn thuật toán phải cân bằng correctness, chi phí triển khai và giới hạn dữ liệu.</p>", "ex": "<p>Nếu n nhỏ, hai vòng lặp có thể đủ; nếu n lớn và cần tra cứu nhiều lần, sort/hash có thể phù hợp tùy điều kiện.</p>", "clar": "<p>Không chọn chỉ dựa một con số n; cần biết số truy vấn, miền giá trị, memory limit và yêu cầu thứ tự.</p>", "ext": "<p>Ước lượng số thao tác trước khi cài đặt, rồi benchmark nếu cần.</p>", "check": "<p>Thông tin nào ngoài n có thể ảnh hưởng việc chọn thuật toán?</p>", "sync": "<ul>\n<li>So sánh n nhỏ/n lớn; phân biệt correctness và performance.</li>\n<li>Bài: chọn giữa duyệt đôi, sort + search, hash map với lý do.</li>\n<li>Qua bài: giải thích được lựa chọn và giới hạn còn lại.</li>\n</ul>"}}, {"id": "DSA-029", "sort": 158, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK4", "sup": false, "title": "Giải vấn đề có quy trình", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "80cfef7d0163fedc", "substeps": [], "sec": {"exp": "<p>Quy trình giải vấn đề có thể lặp lại: hiểu đề, làm ví dụ, tạo brute force, tìm tối ưu có lý do, code, test, phân tích và review. Nó biến việc giải bài từ đoán mò thành quy trình.</p>", "ex": "<p>Với bài đếm cặp tổng target: viết giải pháp O(n²) trước, rồi xem có thể dùng map hoặc sort/two pointers theo điều kiện không.</p>", "clar": "<p>Đừng tối ưu trước khi có giải pháp đúng và test đáng tin. Brute force có thể dùng làm oracle cho input nhỏ để kiểm chứng giải pháp nhanh.</p>", "ext": "<p>Lưu ghi chú về invariant và lỗi giúp kiến thức áp dụng cho bài sau.</p>", "check": "<p>Trình bày một bài toán theo đủ các bước trong quy trình này.</p>", "sync": "<ul>\n<li>Đề → ví dụ → brute force → tối ưu có lý do → code → test → phân tích.</li>\n<li>Bài: giải một bài tổng hợp và viết ghi chú review.</li>\n<li>Qua bài: người học có thể diễn đạt cả cách nghĩ, không chỉ code cuối.</li>\n</ul>"}}, {"id": "DSA-030", "sort": 159, "pfx": "DSA", "subj": "DSA", "subjName": "Cấu Trúc Dữ Liệu & Thuật Toán", "cat": "Algorithms & Data Structures", "uitMap": "IT003 (Cấu trúc dữ liệu và giải thuật)", "part": "PHẦN D — CẤU TRÚC DỮ LIỆU VÀ THUẬT TOÁN (DSA)", "stage": "9. Điều kiện trước khi học DSA", "sem": "HK4", "sup": false, "title": "Bộ đánh giá DSA nền tảng", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "af691c985e6e523d", "substeps": [], "sec": {"exp": "<p>Bài đánh giá tổng hợp đo độ đúng, edge cases, giải thích, Big-O và chất lượng code. Điểm thấp nên dẫn về nội dung cần củng cố, không chỉ ra một điểm số chung.</p>", "ex": "<p>Một bài tìm kiếm được chấm theo kết quả khi có/không có target, vector rỗng, duplicates, lập luận độ phức tạp và code dễ đọc.</p>", "clar": "<p>Không chuyển sang advanced topics chỉ vì đã hoàn thành đủ câu. Phải xem những nhóm lỗi nào còn lặp lại.</p>", "ext": "<p>Có thể lưu lời giải trước/sau review để nhìn tiến bộ theo chất lượng reasoning.</p>", "check": "<p>Sau một bài sai, bạn sẽ ghi lại nguyên nhân và kế hoạch sửa thế nào?</p>", "sync": "<ul>\n<li>6 bài: mảng/vòng lặp, tìm kiếm, stack/queue, hashing, cây/đồ thị hoặc DP theo nội dung đã học.</li>\n<li>Chấm theo correctness, edge cases, giải thích, độ phức tạp và chất lượng code.</li>\n<li>Chỉ chuyển sang bài nâng cao khi có thể tự giải thích lỗi và cách sửa.</li>\n</ul>"}}, {"id": "TOOL-001", "sort": 160, "pfx": "TOOL", "subj": "TOOL", "subjName": "Công Cụ Phát Triển: Terminal, Git & Linux", "cat": "Developer Tooling", "uitMap": "MIT Missing Semester / Kỹ năng thực hành", "part": "PHẦN E — CÔNG CỤ PHÁT TRIỂN: TERMINAL, GIT VÀ LINUX", "stage": "10. Công cụ không nên học như một danh sách lệnh rời rạc", "sem": "HK1", "sup": false, "title": "Đường dẫn, thư mục và file", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "7e3188d7ec8d1202", "substeps": [], "sec": {"exp": "<p>Đường dẫn tuyệt đối mô tả vị trí từ gốc/drive; đường dẫn tương đối tính từ thư mục hiện tại. Phần mở rộng thường gợi ý loại file nhưng không luôn quyết định định dạng thật.</p>", "ex": "<p>Nếu đang ở <code class=\"inline-code\">project/</code>, đường dẫn <code class=\"inline-code\">src/main.cpp</code> trỏ tới thư mục con <code class=\"inline-code\">src</code>; đường dẫn tuyệt đối phụ thuộc hệ điều hành.</p>", "clar": "<p>“Không tìm thấy file” có thể do working directory sai dù file tồn tại ở nơi khác. Phân biệt tên file, path và cwd.</p>", "ext": "<p>Ghi lệnh chạy trong README bằng đường dẫn tương đối khi phù hợp.</p>", "check": "<p>Làm sao xác định chương trình đang tìm file từ thư mục nào?</p>", "sync": "<ul>\n<li>Hiểu thư mục hiện tại, đường dẫn tương đối/tuyệt đối, tên file và phần mở rộng.</li>\n<li>Bài: tìm project và giải thích compiler đang chạy ở thư mục nào.</li>\n<li>Qua: tự tìm file bị “mất” do mở sai thư mục.</li>\n</ul>"}}, {"id": "TOOL-002", "sort": 161, "pfx": "TOOL", "subj": "TOOL", "subjName": "Công Cụ Phát Triển: Terminal, Git & Linux", "cat": "Developer Tooling", "uitMap": "MIT Missing Semester / Kỹ năng thực hành", "part": "PHẦN E — CÔNG CỤ PHÁT TRIỂN: TERMINAL, GIT VÀ LINUX", "stage": "10. Công cụ không nên học như một danh sách lệnh rời rạc", "sem": "HK1", "sup": false, "title": "Terminal và lệnh căn bản", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "4e186f5c9179f77d", "substeps": [], "sec": {"exp": "<p>Terminal nhận lệnh và hiển thị output; lệnh <code class=\"inline-code\">pwd</code>, <code class=\"inline-code\">ls</code>/<code class=\"inline-code\">dir</code>, <code class=\"inline-code\">cd</code> giúp biết vị trí và di chuyển thư mục. Cú pháp khác nhau giữa shell/OS.</p>", "ex": "<p><code class=\"inline-code\">pwd</code> xem thư mục hiện tại, <code class=\"inline-code\">cd project</code> vào project, <code class=\"inline-code\">ls</code> xem file trong môi trường Unix-like; trên Windows có lệnh/alias tương ứng.</p>", "clar": "<p>Không chạy lệnh xóa hoặc thay đổi hàng loạt khi chưa hiểu thư mục hiện tại. Đường dẫn có khoảng trắng cần quoting phù hợp shell.</p>", "ext": "<p>Script hóa lệnh build/run giúp tái lập workflow.</p>", "check": "<p>Trước khi chạy lệnh tác động file, hãy xác nhận cwd và đối tượng lệnh nhắm tới.</p>", "sync": "<ul>\n<li><code class=\"inline-code\">pwd</code>, <code class=\"inline-code\">ls</code>/<code class=\"inline-code\">dir</code>, <code class=\"inline-code\">cd</code>, tạo/xem file theo môi trường; lệnh có thể khác theo OS.</li>\n<li>Bài: di chuyển qua 3 thư mục và chạy program.</li>\n<li>Qua: biết mình đang ở đâu trước khi thực hiện lệnh.</li>\n</ul>"}}, {"id": "TOOL-003", "sort": 162, "pfx": "TOOL", "subj": "TOOL", "subjName": "Công Cụ Phát Triển: Terminal, Git & Linux", "cat": "Developer Tooling", "uitMap": "MIT Missing Semester / Kỹ năng thực hành", "part": "PHẦN E — CÔNG CỤ PHÁT TRIỂN: TERMINAL, GIT VÀ LINUX", "stage": "10. Công cụ không nên học như một danh sách lệnh rời rạc", "sem": "HK1", "sup": false, "title": "Input, output, pipe và exit code nhập môn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "174c7d490c5ed877", "substeps": [], "sec": {"exp": "<p>stdin là input chuẩn, stdout là output chuẩn và stderr dành cho thông báo lỗi theo quy ước; exit code báo trạng thái kết thúc của tiến trình. Pipe chuyển output của lệnh trước thành input lệnh sau.</p>", "ex": "<p><code class=\"inline-code\">program &lt; input.txt</code> có thể đưa file vào stdin; <code class=\"inline-code\">command1 | command2</code> truyền dòng output. Cú pháp cụ thể phụ thuộc shell.</p>", "clar": "<p>Không phải mọi chương trình đọc stdin; exit code 0 thường biểu thị thành công theo quy ước nhưng ý nghĩa chính xác do chương trình định nghĩa.</p>", "ext": "<p><code class=\"inline-code\">2&gt;</code> thường chuyển stderr trong shell phổ biến; học sau khi đã hiểu stream.</p>", "check": "<p>Vì sao stderr hữu ích khi stdout chứa dữ liệu mà ta muốn lưu?</p>", "sync": "<ul>\n<li>Khái niệm stdin/stdout/stderr, pipe; exit code để báo trạng thái.</li>\n<li>Bài: chạy chương trình với file input nếu toolchain hỗ trợ.</li>\n<li>Qua: giải thích output bình thường khác thông báo lỗi.</li>\n</ul>"}}, {"id": "TOOL-004", "sort": 163, "pfx": "TOOL", "subj": "TOOL", "subjName": "Công Cụ Phát Triển: Terminal, Git & Linux", "cat": "Developer Tooling", "uitMap": "MIT Missing Semester / Kỹ năng thực hành", "part": "PHẦN E — CÔNG CỤ PHÁT TRIỂN: TERMINAL, GIT VÀ LINUX", "stage": "10. Công cụ không nên học như một danh sách lệnh rời rạc", "sem": "HK1", "sup": false, "title": "Git là gì và trạng thái làm việc", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "37aa5c8e3f27d2a3", "substeps": [], "sec": {"exp": "<p>Git quản lý lịch sử thay đổi; working tree là file hiện tại, staging area là tập thay đổi chuẩn bị cho commit, commit là snapshot được ghi vào lịch sử. Git không đồng nghĩa GitHub/Git hosting.</p>", "ex": "<p>Sửa <code class=\"inline-code\">main.cpp</code>, chạy <code class=\"inline-code\">git status</code>, đưa file vào staging rồi xem trạng thái trước commit.</p>", "clar": "<p>Git local có thể hoạt động không cần kết nối mạng; remote là bản repo ở nơi khác. Commit không tự đẩy code lên remote.</p>", "ext": "<p>Nhớ mô hình working tree→staging→commit trước khi học branch/merge.</p>", "check": "<p>Khác biệt giữa staged và committed changes là gì?</p>", "sync": "<ul>\n<li>Working tree, staging area, commit; Git không đồng nghĩa với GitHub.</li>\n<li>Bài: khởi tạo repo, xem <code class=\"inline-code\">status</code>.</li>\n<li>Qua: mô tả được file nằm ở trạng thái nào.</li>\n</ul>"}}, {"id": "TOOL-005", "sort": 164, "pfx": "TOOL", "subj": "TOOL", "subjName": "Công Cụ Phát Triển: Terminal, Git & Linux", "cat": "Developer Tooling", "uitMap": "MIT Missing Semester / Kỹ năng thực hành", "part": "PHẦN E — CÔNG CỤ PHÁT TRIỂN: TERMINAL, GIT VÀ LINUX", "stage": "10. Công cụ không nên học như một danh sách lệnh rời rạc", "sem": "HK1", "sup": false, "title": "`add`, `commit`, `log`, `diff`", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "bbe1a6a543c0d0af", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">add</code> đưa thay đổi vào staging; <code class=\"inline-code\">commit</code> ghi snapshot; <code class=\"inline-code\">log</code> xem lịch sử; <code class=\"inline-code\">diff</code> xem khác biệt. Commit nhỏ có chủ đích dễ review và rollback hơn.</p>", "ex": "<p>Sửa một hàm, xem <code class=\"inline-code\">git diff</code>, stage đúng file, commit với message “Add score validation”.</p>", "clar": "<p>Commit message không nên chỉ là “update”; chỉ stage những thay đổi mình muốn ghi. <code class=\"inline-code\">git diff</code> mặc định có thể xem thay đổi chưa stage; có biến thể cho staged diff.</p>", "ext": "<p>Dùng <code class=\"inline-code\">git status</code> thường xuyên để biết repo đang ở trạng thái nào.</p>", "check": "<p>Trước commit, lệnh nào giúp kiểm tra chính xác nội dung sắp ghi?</p>", "sync": "<ul>\n<li>Commit ghi lại một thay đổi có ý nghĩa; diff đọc nội dung thay đổi.</li>\n<li>Bài: commit lần đầu, sửa một file, xem diff và commit lần hai.</li>\n<li>Qua: lịch sử có message mô tả nội dung thật.</li>\n</ul>"}}, {"id": "TOOL-006", "sort": 165, "pfx": "TOOL", "subj": "TOOL", "subjName": "Công Cụ Phát Triển: Terminal, Git & Linux", "cat": "Developer Tooling", "uitMap": "MIT Missing Semester / Kỹ năng thực hành", "part": "PHẦN E — CÔNG CỤ PHÁT TRIỂN: TERMINAL, GIT VÀ LINUX", "stage": "10. Công cụ không nên học như một danh sách lệnh rời rạc", "sem": "HK1", "sup": false, "title": "`.gitignore` và file không nên commit", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f4be990af65e3c91", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">.gitignore</code> loại những file không nên theo dõi, như build outputs hoặc local secrets. Secret đã commit cần được xem là lộ; chỉ xóa ở commit sau không đảm bảo mất khỏi lịch sử.</p>", "ex": "<p>Ignore thư mục build và file <code class=\"inline-code\">.env</code> chứa cấu hình bí mật; tạo <code class=\"inline-code\">.env.example</code> chỉ với placeholder nếu cần hướng dẫn.</p>", "clar": "<p><code class=\"inline-code\">.gitignore</code> không tự bỏ theo dõi file đã tracked. Password/token không được đưa vào repo công khai dù repo hiện tại là private nếu không cần thiết.</p>", "ext": "<p>Secret scanning và secret rotation là bước vận hành quan trọng.</p>", "check": "<p>Nếu token đã push lên remote, chỉ xóa dòng khỏi file hiện tại đã đủ an toàn không?</p>", "sync": "<ul>\n<li>Bỏ qua binary/build output/secret theo dự án; không đưa password/token lên repo.</li>\n<li>Bài: tạo <code class=\"inline-code\">.gitignore</code> phù hợp và kiểm tra trạng thái.</li>\n<li>Qua: hiểu rằng xóa file sau khi đã commit secret không nhất thiết làm secret biến mất khỏi lịch sử.</li>\n</ul>"}}, {"id": "TOOL-007", "sort": 166, "pfx": "TOOL", "subj": "TOOL", "subjName": "Công Cụ Phát Triển: Terminal, Git & Linux", "cat": "Developer Tooling", "uitMap": "MIT Missing Semester / Kỹ năng thực hành", "part": "PHẦN E — CÔNG CỤ PHÁT TRIỂN: TERMINAL, GIT VÀ LINUX", "stage": "10. Công cụ không nên học như một danh sách lệnh rời rạc", "sem": "HK2", "sup": false, "title": "Remote, push, pull và README", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f3bfa1702de5acfa", "substeps": [], "sec": {"exp": "<p>Remote liên kết repo local với repo host; push gửi commit lên remote, pull thường lấy và tích hợp thay đổi theo cấu hình; README giải thích mục tiêu và cách chạy project.</p>", "ex": "<p>Thêm origin, push branch, viết README gồm prerequisites, build/run và test commands.</p>", "clar": "<p>Pull có thể merge/rebase tùy cấu hình; cần xem conflict chứ không giả định thao tác luôn tự động. README phải khớp project hiện tại.</p>", "ext": "<p>Một README tốt giúp người mới clone repo có thể tái lập kết quả.</p>", "check": "<p>README tối thiểu cần gì để người khác build/run?</p>", "sync": "<ul>\n<li>Remote repo; đồng bộ thay đổi; README cho người khác chạy dự án.</li>\n<li>Bài: đẩy project lên nền tảng Git hosting nếu có tài khoản.</li>\n<li>Qua: người khác theo README có thể build/run.</li>\n</ul>"}}, {"id": "TOOL-008", "sort": 167, "pfx": "TOOL", "subj": "TOOL", "subjName": "Công Cụ Phát Triển: Terminal, Git & Linux", "cat": "Developer Tooling", "uitMap": "MIT Missing Semester / Kỹ năng thực hành", "part": "PHẦN E — CÔNG CỤ PHÁT TRIỂN: TERMINAL, GIT VÀ LINUX", "stage": "10. Công cụ không nên học như một danh sách lệnh rời rạc", "sem": "HK2", "sup": false, "title": "Branch, merge và conflict", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "01f9019d75b84473", "substeps": [], "sec": {"exp": "<p>Branch tạo dòng phát triển riêng để thay đổi an toàn; merge tích hợp lịch sử. Conflict xảy ra khi Git không thể tự xác định cách kết hợp nội dung.</p>", "ex": "<p>Tạo branch <code class=\"inline-code\">feature/search</code>, sửa một hàm, merge vào branch chính; nếu cùng dòng bị thay đổi khác nhau, đọc conflict markers và chọn nội dung đúng.</p>", "clar": "<p>Đừng chỉ xóa <code class=\"inline-code\">&lt;&lt;&lt;&lt;</code>, <code class=\"inline-code\">====</code>, <code class=\"inline-code\">&gt;&gt;&gt;&gt;</code> rồi commit; cần hiểu cả hai thay đổi và chạy test sau khi resolve.</p>", "ext": "<p>Pull request/code review là workflow cộng tác trên hosting, không phải tính năng cốt lõi của Git local.</p>", "check": "<p>Sau khi giải conflict, cần làm gì trước khi commit merge?</p>", "sync": "<ul>\n<li>Nhánh là dòng phát triển; conflict cần hiểu hai thay đổi.</li>\n<li>Bài: tạo branch, đổi file, merge và giải quyết conflict giả lập.</li>\n<li>Qua: không xóa đoạn conflict markers mà không xem nội dung.</li>\n</ul>"}}, {"id": "TOOL-009", "sort": 168, "pfx": "TOOL", "subj": "TOOL", "subjName": "Công Cụ Phát Triển: Terminal, Git & Linux", "cat": "Developer Tooling", "uitMap": "MIT Missing Semester / Kỹ năng thực hành", "part": "PHẦN E — CÔNG CỤ PHÁT TRIỂN: TERMINAL, GIT VÀ LINUX", "stage": "10. Công cụ không nên học như một danh sách lệnh rời rạc", "sem": "HK2", "sup": false, "title": "Linux: quyền, process và filesystem căn bản", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "2449461fc04315b9", "substeps": [], "sec": {"exp": "<p>Linux cung cấp filesystem, permissions và process model. Quyền xác định ai có thể đọc/ghi/thực thi; process là một chương trình đang chạy với PID và trạng thái.</p>", "ex": "<p>Nếu script không chạy được, xem quyền execute và đường dẫn; nếu server treo, xác định process thay vì xóa file dự án.</p>", "clar": "<p>Không giải quyết vấn đề quyền bằng <code class=\"inline-code\">sudo</code> hoặc quyền rộng bừa bãi; dùng quyền tối thiểu.</p>", "ext": "<p>Lệnh <code class=\"inline-code\">ps</code>, <code class=\"inline-code\">top</code>, <code class=\"inline-code\">chmod</code> hữu ích nhưng nên học chính xác theo môi trường.</p>", "check": "<p>Vì sao không nên cấp quyền rộng nhất cho mọi file?</p>", "sync": "<ul>\n<li>Đường dẫn, quyền truy cập, process; dùng lệnh cơ bản theo môi trường học.</li>\n<li>Bài: chạy program, xem file log, kiểm tra exit status.</li>\n<li>Qua: hiểu được quy trình build/run trong môi trường terminal.</li>\n</ul>"}}, {"id": "TOOL-010", "sort": 169, "pfx": "TOOL", "subj": "TOOL", "subjName": "Công Cụ Phát Triển: Terminal, Git & Linux", "cat": "Developer Tooling", "uitMap": "MIT Missing Semester / Kỹ năng thực hành", "part": "PHẦN E — CÔNG CỤ PHÁT TRIỂN: TERMINAL, GIT VÀ LINUX", "stage": "10. Công cụ không nên học như một danh sách lệnh rời rạc", "sem": "HK2", "sup": false, "title": "Debug toolchain và README tái lập", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "62faf9b1f831a16d", "substeps": [], "sec": {"exp": "<p>Toolchain bao gồm compiler, linker, library và build configuration. README tái lập ghi điều kiện môi trường và lệnh build/run/test để người khác làm lại.</p>", "ex": "<p>Một README ghi phiên bản C++ standard, cách cài dependency, lệnh build và input mẫu; bạn khác chạy theo và so sánh output.</p>", "clar": "<p>“Chạy trên máy tôi” không đủ làm bằng chứng tái lập; khác version, cwd hoặc dependency có thể gây khác biệt.</p>", "ext": "<p>CI container giúp cố định một phần môi trường sau khi đã hiểu quy trình local.</p>", "check": "<p>Người khác cần thông tin nào để chạy project mà không hỏi bạn?</p>", "sync": "<ul>\n<li>Ghi yêu cầu môi trường, lệnh build, cách chạy/test; tránh phụ thuộc cấu hình cá nhân.</li>\n<li>Bài: đưa project cho bạn khác chạy theo README.</li>\n<li>Qua: sửa được thiếu bước trong hướng dẫn.</li>\n</ul>"}}, {"id": "DB-001", "sort": 170, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK3", "sup": false, "title": "Vì sao cần cơ sở dữ liệu", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "83caa8affe8085ce", "substeps": [], "sec": {"exp": "<p>Database tổ chức dữ liệu để truy vấn, cập nhật, ràng buộc và chia sẻ nhất quán hơn cách quản lý file tùy tiện. Chọn database khi yêu cầu truy vấn/liên kết/đồng thời vượt quá một file đơn giản.</p>", "ex": "<p>Danh sách sách lưu trong text file có thể ổn cho vài bản ghi; khi nhiều người cùng mượn/trả, cần kiểm tra mã duy nhất và lịch sử quan hệ, database phù hợp hơn.</p>", "clar": "<p>Database không tự làm thiết kế dữ liệu đúng; schema, constraints, transaction và quyền vẫn cần quyết định.</p>", "ext": "<p>Phân biệt hệ quản trị (DBMS) với bản thân dữ liệu/schema.</p>", "check": "<p>Nêu một lý do file văn bản khó đáp ứng khi nhiều người cập nhật cùng lúc.</p>", "sync": "<ul>\n<li>Bài: so sánh danh sách trong file với dữ liệu nhiều người cần truy vấn/cập nhật.</li>\n<li>Đạt: giải thích được nhu cầu lưu trữ, truy vấn, nhất quán.</li>\n</ul>"}}, {"id": "DB-002", "sort": 171, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK3", "sup": false, "title": "Bảng, hàng, cột và kiểu dữ liệu", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "988dd6977e4a3468", "substeps": [], "sec": {"exp": "<p>Bảng là tập hàng theo các cột; mỗi cột có kiểu/ý nghĩa. Schema mô tả cấu trúc, còn row là một bản ghi.</p>", "ex": "<p><code class=\"inline-code\">Student(id, name, score)</code> có một row cho mỗi sinh viên, <code class=\"inline-code\">id</code> là văn bản/kiểu phù hợp và <code class=\"inline-code\">score</code> là số trong miền quy định.</p>", "clar": "<p>Chọn kiểu theo ý nghĩa, không chỉ theo chuỗi dễ nhập; trường ngày nên dùng kiểu date/time phù hợp DBMS. Null có semantics khác với chuỗi rỗng.</p>", "ext": "<p>Ràng buộc và quan hệ giữa bảng sẽ làm mô hình bền vững hơn.</p>", "check": "<p>Vì sao lưu điểm số vào cột text thường kém phù hợp cho truy vấn số học?</p>", "sync": "<ul>\n<li>Bài: thiết kế bảng Student/Book; chọn kiểu dữ liệu hợp lý.</li>\n<li>Đạt: không lưu mọi thứ vào một cột văn bản lớn nếu cần truy vấn riêng.</li>\n</ul>"}}, {"id": "DB-003", "sort": 172, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK3", "sup": false, "title": "`SELECT`, `FROM`, `WHERE`", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "83d5bbb8c9dbe98e", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">SELECT</code> chỉ rõ cột cần lấy, <code class=\"inline-code\">FROM</code> chọn nguồn dữ liệu, <code class=\"inline-code\">WHERE</code> lọc các hàng trước khi trả kết quả. Điều kiện SQL cần đúng logic và chú ý NULL.</p>", "ex": "<p><code class=\"inline-code\">SELECT name, score FROM Student WHERE score &gt;= 5;</code> trả tên/điểm các sinh viên đạt theo ngưỡng ví dụ.</p>", "clar": "<p>SQL dùng logic ba giá trị khi NULL xuất hiện: so sánh với NULL thường không thành TRUE/FALSE thường; dùng <code class=\"inline-code\">IS NULL</code>. Đừng dùng <code class=\"inline-code\">SELECT *</code> vô tội vạ trong code lâu dài.</p>", "ext": "<p>Query planner quyết định cách thực thi; thứ tự logic không đồng nhất thứ tự vật lý chạy.</p>", "check": "<p>Viết query lấy sách đang có sẵn theo trạng thái.</p>", "sync": "<ul>\n<li>Bài: lọc theo điểm, trạng thái hoặc ngày.</li>\n<li>Đạt: giải thích thứ tự logic truy vấn ở mức căn bản và test với vài dòng dữ liệu.</li>\n</ul>"}}, {"id": "DB-004", "sort": 173, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK3", "sup": false, "title": "`ORDER BY`, `LIMIT`, `DISTINCT`", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "a96ba2c4c06e51b7", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">ORDER BY</code> sắp kết quả; <code class=\"inline-code\">LIMIT</code> giới hạn số hàng trên DBMS hỗ trợ cú pháp này; <code class=\"inline-code\">DISTINCT</code> loại các dòng kết quả trùng.</p>", "ex": "<p><code class=\"inline-code\">SELECT name FROM Book ORDER BY title LIMIT 10;</code> trong DBMS hỗ trợ LIMIT lấy một số hàng đầu theo title.</p>", "clar": "<p>Không có <code class=\"inline-code\">ORDER BY</code> thì không nên dựa vào thứ tự kết quả. <code class=\"inline-code\">DISTINCT</code> áp dụng lên tổ hợp cột được chọn, không chỉ một cột tùy ý.</p>", "ext": "<p>Pagination cần thứ tự ổn định, thường bổ sung khóa phụ để tie-break.</p>", "check": "<p>Nếu hai quyển cùng title, <code class=\"inline-code\">DISTINCT title</code> hiển thị mấy title?</p>", "sync": "<ul>\n<li>Bài: top kết quả và lọc trùng.</li>\n<li>Đạt: hiểu thứ tự sắp xếp và khi nào DISTINCT làm thay đổi kết quả.</li>\n</ul>"}}, {"id": "DB-005", "sort": 174, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK3", "sup": false, "title": "`INSERT`, `UPDATE`, `DELETE`", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f2b95821f78bb007", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">INSERT</code> thêm row; <code class=\"inline-code\">UPDATE</code> sửa row; <code class=\"inline-code\">DELETE</code> xóa row. Với UPDATE/DELETE, điều kiện WHERE phải được kiểm tra kỹ để không thay đổi toàn bảng ngoài ý muốn.</p>", "ex": "<p><code class=\"inline-code\">UPDATE Book SET status='Borrowed' WHERE id='B001';</code> chỉ cập nhật bản ghi B001 nếu id match.</p>", "clar": "<p>Thử query SELECT với điều kiện trước khi chạy lệnh phá hủy trên dữ liệu thật. Dùng transaction/backup khi thao tác rủi ro.</p>", "ext": "<p>Prepared statements bảo vệ parameter values và tránh SQL injection trong ứng dụng.</p>", "check": "<p>Điều gì xảy ra nếu chạy <code class=\"inline-code\">DELETE FROM Book;</code> không có WHERE?</p>", "sync": "<ul>\n<li>Bài: thêm/cập nhật/xóa một bản ghi; chú trọng <code class=\"inline-code\">WHERE</code> ở update/delete.</li>\n<li>Đạt: không chạy lệnh thay đổi toàn bộ bảng ngoài ý định.</li>\n</ul>"}}, {"id": "DB-006", "sort": 175, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK3", "sup": false, "title": "Aggregate: `COUNT`, `SUM`, `AVG`, `MIN`, `MAX`", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "0ae144e2843a4386", "substeps": [], "sec": {"exp": "<p>Aggregate tính tóm tắt trên nhiều hàng: COUNT số lượng, SUM tổng, AVG trung bình, MIN/MAX giá trị cực tiểu/cực đại. Cần hiểu cách NULL được xử lý theo hàm và DBMS.</p>", "ex": "<p><code class=\"inline-code\">SELECT AVG(score) FROM Student;</code> tính trung bình score theo quy tắc SQL của hệ quản trị; COUNT(*) đếm hàng.</p>", "clar": "<p><code class=\"inline-code\">COUNT(column)</code> thường không đếm NULL ở cột đó; <code class=\"inline-code\">COUNT(*)</code> đếm hàng. AVG bỏ qua NULL trong tập giá trị thông thường.</p>", "ext": "<p>Aggregates tạo báo cáo, metrics và hỗ trợ phân tích dữ liệu.</p>", "check": "<p>Phân biệt kết quả của <code class=\"inline-code\">COUNT(*)</code> và <code class=\"inline-code\">COUNT(nickname)</code> nếu nickname có NULL.</p>", "sync": "<ul>\n<li>Bài: thống kê số sách và điểm trung bình.</li>\n<li>Đạt: phân biệt dữ liệu hàng lẻ với kết quả nhóm.</li>\n</ul>"}}, {"id": "DB-007", "sort": 176, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK3", "sup": false, "title": "`GROUP BY` và `HAVING`", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "15a53f98c49a22ad", "substeps": [], "sec": {"exp": "<p><code class=\"inline-code\">GROUP BY</code> gom hàng theo cột/biểu thức; aggregate tính một kết quả cho mỗi nhóm. <code class=\"inline-code\">WHERE</code> lọc hàng trước grouping; <code class=\"inline-code\">HAVING</code> lọc nhóm sau aggregate.</p>", "ex": "<p>Đếm sách theo thể loại: <code class=\"inline-code\">SELECT genre, COUNT(<em>) FROM Book GROUP BY genre HAVING COUNT(</em>) &gt; 2;</code>.</p>", "clar": "<p>Cột trong SELECT phải phù hợp với quy tắc grouping của DBMS. Đừng dùng HAVING chỉ vì nó hoạt động: WHERE thường đúng chỗ cho điều kiện trên từng hàng.</p>", "ext": "<p>Group by nhiều cột tạo nhóm theo tổ hợp giá trị.</p>", "check": "<p>Điều kiện “chỉ thể loại có hơn 2 sách” đặt ở WHERE hay HAVING?</p>", "sync": "<ul>\n<li>Bài: đếm sách theo thể loại hoặc lỗi theo loại.</li>\n<li>Đạt: biết điều kiện lọc nhóm khác điều kiện lọc hàng ở điểm nào.</li>\n</ul>"}}, {"id": "DB-008", "sort": 177, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK3", "sup": false, "title": "Khóa chính và khóa ngoại", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "d8f88f9108d5c963", "substeps": [], "sec": {"exp": "<p>Primary key xác định duy nhất mỗi row và thường không null; foreign key đảm bảo giá trị tham chiếu phù hợp tới hàng cha theo schema.</p>", "ex": "<p>Borrowing có <code class=\"inline-code\">student_id</code> tham chiếu Student(id) và <code class=\"inline-code\">book_id</code> tham chiếu Book(id), giúp không mượn bằng ID không tồn tại.</p>", "clar": "<p>Foreign key không tự giải quyết mọi quy tắc nghiệp vụ như “sách chỉ có một người mượn”; cần constraint/transaction và schema phù hợp.</p>", "ext": "<p>Chọn hành vi ON DELETE/UPDATE (restrict/cascade…) theo ý nghĩa dữ liệu, không mặc định cascade.</p>", "check": "<p>Vai trò của primary key và foreign key khác nhau ở đâu?</p>", "sync": "<ul>\n<li>Bài: thiết kế Student, Borrowing, Book; thể hiện quan hệ.</li>\n<li>Đạt: ngăn dữ liệu tham chiếu không tồn tại theo thiết kế.</li>\n</ul>"}}, {"id": "DB-009", "sort": 178, "pfx": "DB", "subj": "DB", "subjName": "Cơ Sở Dữ Liệu & SQL", "cat": "Data & Persistence", "uitMap": "IT004 (Cơ sở dữ liệu)", "part": "PHẦN F — CƠ SỞ DỮ LIỆU VÀ SQL", "stage": "11. SQL theo thứ tự từ dữ liệu đến thiết kế", "sem": "HK3", "sup": false, "title": "`JOIN`"
