ình và tài liệu kỹ thuật", "sem": "HK2", "sup": false, "title": "Từ vựng của code", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "c54c1e657f9a5499", "substeps": [], "sec": {"exp": "<p>Từ vựng code cần học trong ngữ cảnh. <code class=\"inline-code\">variable</code> là biến; <code class=\"inline-code\">value</code> là giá trị; <code class=\"inline-code\">type</code> là kiểu; <code class=\"inline-code\">function</code> là hàm; <code class=\"inline-code\">parameter</code> là tên đầu vào trong định nghĩa; <code class=\"inline-code\">argument</code> là giá trị truyền lúc gọi; <code class=\"inline-code\">return</code> trả kết quả; <code class=\"inline-code\">condition</code> điều kiện; <code class=\"inline-code\">loop</code> vòng lặp; <code class=\"inline-code\">array</code> mảng.</p>", "ex": "<p>“The function takes two parameters and returns a value.” Khi gọi <code class=\"inline-code\">sum(3,5)</code>, 3 và 5 là arguments; tham số trong định nghĩa có thể tên a,b.</p>", "clar": "<p>Type/value không đồng nghĩa: biến kiểu int có thể giữ nhiều value int khác nhau. Trong hội thoại, “array” đôi lúc dùng rộng nhưng trong C++ cần phân biệt array và vector.</p>", "ext": "<p>Bổ sung <code class=\"inline-code\">index</code> (chỉ số), <code class=\"inline-code\">element</code> (phần tử), <code class=\"inline-code\">scope</code> (phạm vi), <code class=\"inline-code\">reference</code> (tham chiếu), <code class=\"inline-code\">pointer</code> (con trỏ) khi các lesson C++ mở ra.</p>", "check": "<p>Giải thích bằng tiếng Việt sự khác nhau giữa parameter và argument.</p>", "sync": "<ul>\n<li><strong>Từ:</strong> variable, value, type, function, parameter, argument, return, condition, loop, array.</li>\n<li><strong>Bài:</strong> nối từ–nghĩa và chọn từ đúng trong câu.</li>\n<li><strong>Qua:</strong> phân biệt các cặp dễ nhầm như parameter/argument và value/type ở ví dụ.</li>\n</ul>"}}, {"id": "EN-007", "sort": 285, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "EN-B — Từ vựng lập trình và tài liệu kỹ thuật", "sem": "HK2", "sup": false, "title": "Từ vựng của lỗi và debugging", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "2d672ea9c5750324", "substeps": [], "sec": {"exp": "<p>Từ vựng debugging mô tả quá trình: <code class=\"inline-code\">compile</code> biên dịch; <code class=\"inline-code\">run</code> chạy; <code class=\"inline-code\">crash</code> sập bất ngờ; <code class=\"inline-code\">error</code> lỗi; <code class=\"inline-code\">warning</code> cảnh báo; <code class=\"inline-code\">bug</code> lỗi phần mềm; <code class=\"inline-code\">expected</code> kỳ vọng; <code class=\"inline-code\">actual</code> thực tế; <code class=\"inline-code\">reproduce</code> tái hiện; <code class=\"inline-code\">fix</code> sửa; <code class=\"inline-code\">breakpoint</code> điểm dừng trong debugger.</p>", "ex": "<p>“Expected: 5. Actual: 4.” nói chương trình được kỳ vọng cho 5 nhưng thực tế cho 4. “The program crashes when input is empty.” nêu tình huống tái hiện.</p>", "clar": "<p>Warning không nhất thiết làm build thất bại; bug không luôn gây crash. “Reproduce” nghĩa là làm vấn đề xảy ra lại theo các bước đã biết.</p>", "ext": "<p>Các cụm nên học theo câu: “The build failed”, “I reproduced the bug”, “Set a breakpoint”, “The test passes/fails”.</p>", "check": "<p>Viết một câu tiếng Anh có <code class=\"inline-code\">expected</code> và <code class=\"inline-code\">actual</code>.</p>", "sync": "<ul>\n<li><strong>Từ:</strong> compile, run, crash, error, warning, bug, expected, actual, reproduce, fix, breakpoint.</li>\n<li><strong>Bài:</strong> đọc error message ngắn và điền từ phù hợp.</li>\n<li><strong>Qua:</strong> diễn giải được một lỗi bằng câu tiếng Anh đơn giản.</li>\n</ul>"}}, {"id": "EN-008", "sort": 286, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "EN-B — Từ vựng lập trình và tài liệu kỹ thuật", "sem": "HK2", "sup": false, "title": "Đọc README và hướng dẫn cài đặt", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "4c15c9709be9337e", "substeps": [], "sec": {"exp": "<p>README thường có <code class=\"inline-code\">Prerequisites</code> (điều kiện cần), <code class=\"inline-code\">Install</code> (cài), <code class=\"inline-code\">Build</code> (biên dịch/tạo artifact), <code class=\"inline-code\">Run</code> (chạy), <code class=\"inline-code\">Configure</code> (cấu hình), <code class=\"inline-code\">Usage</code> (cách dùng), <code class=\"inline-code\">Example</code> (ví dụ), <code class=\"inline-code\">Troubleshooting</code> (khắc phục lỗi). Đọc heading và command trước, sau đó mới dịch từ lạ.</p>", "ex": "<p>Nếu README nói “Install compiler. Build with <code class=\"inline-code\">cmake --build build</code>. Run the executable”, hãy xác định lần lượt công cụ, lệnh build và cách chạy.</p>", "clar": "<p><code class=\"inline-code\">Build</code> và <code class=\"inline-code\">run</code> là bước khác nhau; lệnh có thể phụ thuộc OS, thư mục và dependency. Không chạy lệnh không hiểu có thể xóa/thay dữ liệu.</p>", "ext": "<p>Tự viết README cho một project và nhờ người khác làm theo mà không hỏi miệng.</p>", "check": "<p>Tìm trong README mục cho biết phần mềm cần gì trước khi cài.</p>", "sync": "<ul>\n<li><strong>Học:</strong> prerequisites, install, build, run, configure, usage, example, troubleshooting.</li>\n<li><strong>Bài:</strong> đọc README ngắn và trả lời: cần gì, chạy lệnh nào, output là gì.</li>\n<li><strong>Qua:</strong> tìm được các bước chạy không cần dịch từng từ.</li>\n</ul>"}}, {"id": "EN-009", "sort": 287, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "EN-B — Từ vựng lập trình và tài liệu kỹ thuật", "sem": "HK2", "sup": false, "title": "Đọc API documentation", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f3594e8499d039b5", "substeps": [], "sec": {"exp": "<p>Từ API: <code class=\"inline-code\">request</code> yêu cầu; <code class=\"inline-code\">response</code> phản hồi; <code class=\"inline-code\">endpoint</code> điểm truy cập API; <code class=\"inline-code\">payload</code> dữ liệu gửi; <code class=\"inline-code\">status code</code> mã trạng thái; <code class=\"inline-code\">authentication</code> xác minh danh tính; <code class=\"inline-code\">optional</code> không bắt buộc; <code class=\"inline-code\">required</code> bắt buộc.</p>", "ex": "<p>“The endpoint requires <code class=\"inline-code\">userId</code> and accepts an optional <code class=\"inline-code\">nickname</code>.” Có thể bỏ nickname nhưng phải cung cấp userId theo contract.</p>", "clar": "<p>Required/optional là tính chất của field trong contract; không suy ra database column tương ứng luôn có cùng nullability nếu không đọc tài liệu.</p>", "ext": "<p>Học thêm <code class=\"inline-code\">path parameter</code>, <code class=\"inline-code\">query parameter</code>, <code class=\"inline-code\">header</code>, <code class=\"inline-code\">body</code>, <code class=\"inline-code\">rate limit</code> khi đọc API docs.</p>", "check": "<p>Phân biệt endpoint, request và payload.</p>", "sync": "<ul>\n<li><strong>Học:</strong> request, response, endpoint, payload, status code, authentication, optional, required.</li>\n<li><strong>Bài:</strong> đọc mô tả endpoint nhỏ và xác định input/response.</li>\n<li><strong>Qua:</strong> phân biệt trường bắt buộc và tùy chọn.</li>\n</ul>"}}, {"id": "EN-010", "sort": 288, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "EN-B — Từ vựng lập trình và tài liệu kỹ thuật", "sem": "HK2", "sup": false, "title": "Đọc câu điều kiện trong tài liệu", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "f9b280341f6acaf9", "substeps": [], "sec": {"exp": "<p>Từ chỉ mức bắt buộc và điều kiện có thể thay đổi ý nghĩa yêu cầu: <code class=\"inline-code\">must</code> bắt buộc; <code class=\"inline-code\">should</code> khuyến nghị thường mạnh nhưng không tuyệt đối như must; <code class=\"inline-code\">may</code> được phép/có thể; <code class=\"inline-code\">unless</code> trừ khi; <code class=\"inline-code\">only if</code> chỉ khi; <code class=\"inline-code\">at least</code> ít nhất.</p>", "ex": "<p>“The field is optional, but if supplied it must be unique.” Nghĩa: có thể bỏ field; nếu đưa vào thì giá trị phải không trùng.</p>", "clar": "<p>Đừng dịch từng chữ mà bỏ cấu trúc “if supplied”. <code class=\"inline-code\">may</code> có thể mang nghĩa khả năng hoặc cho phép tùy ngữ cảnh.</p>", "ext": "<p>Chuyển câu tài liệu thành checklist điều kiện giúp tránh bỏ sót constraint.</p>", "check": "<p>Diễn giải “You may omit this field unless the request is a creation request.” và đánh dấu điều kiện.</p>", "sync": "<ul>\n<li><strong>Học:</strong> <code class=\"inline-code\">if</code>, <code class=\"inline-code\">unless</code>, <code class=\"inline-code\">when</code>, <code class=\"inline-code\">must</code>, <code class=\"inline-code\">should</code>, <code class=\"inline-code\">may</code>, <code class=\"inline-code\">only if</code>, <code class=\"inline-code\">at least</code>.</li>\n<li><strong>Bài:</strong> chuyển một yêu cầu tiếng Anh sang checklist.</li>\n<li><strong>Qua:</strong> không bỏ sót từ điều kiện/giới hạn làm đổi nghĩa.</li>\n</ul>"}}, {"id": "EN-011", "sort": 289, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "EN-C — Viết trong quy trình phát triển phần mềm", "sem": "HK4", "sup": false, "title": "Commit message", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "c6fb0888520ba7be", "substeps": [], "sec": {"exp": "<p>Commit message tóm tắt thay đổi cụ thể bằng động từ rõ và phạm vi vừa phải. Nó là bản đồ lịch sử, không phải nhật ký cảm xúc hoặc mô tả cả dự án.</p>", "ex": "<p>Thay <code class=\"inline-code\">fix</code> bằng <code class=\"inline-code\">Validate empty student IDs</code>; thay <code class=\"inline-code\">update</code> bằng <code class=\"inline-code\">Add tests for score boundaries</code>.</p>", "clar": "<p>Không tuyên bố việc chưa làm. Một commit nên tập trung vào một nhóm thay đổi liên quan để review/rollback tốt hơn.</p>", "ext": "<p>Có thể học quy ước Conventional Commits nếu nhóm/project yêu cầu; không coi một convention là bắt buộc cho mọi nơi.</p>", "check": "<p>Viết commit message cho thay đổi “thêm kiểm tra điểm phải từ 0 đến 10”.</p>", "sync": "<ul>\n<li><strong>Học:</strong> viết tiêu đề ngắn nói việc đã đổi; động từ rõ.</li>\n<li><strong>Bài:</strong> chuyển 5 commit mơ hồ như “fix” thành message mô tả thay đổi.</li>\n<li><strong>Qua:</strong> người xem history biết commit thay đổi gì.</li>\n</ul>"}}, {"id": "EN-012", "sort": 290, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "EN-C — Viết trong quy trình phát triển phần mềm", "sem": "HK4", "sup": false, "title": "Bug report / issue", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "324da0447e535b43", "substeps": [], "sec": {"exp": "<p>Bug report hữu ích có title, environment/version, steps to reproduce, expected, actual và logs/screenshot đã loại secret. Mục tiêu là giúp người khác xác nhận và chẩn đoán.</p>", "ex": "<p>Title: “Empty title crashes book form”. Steps: mở form, để trống title, submit. Expected: validation message. Actual: app crashes.</p>", "clar": "<p>Không chỉ nói “broken”. Chỉ thu thập log có ích và loại password/token/personal data. Nếu chưa biết nguyên nhân, mô tả quan sát chứ không khẳng định suy đoán.</p>", "ext": "<p>Một template issue chuẩn giúp triage nhất quán.</p>", "check": "<p>Viết ba bước tái hiện cho một lỗi input trống.</p>", "sync": "<ul>\n<li><strong>Học:</strong> title, environment, steps to reproduce, expected, actual, logs.</li>\n<li><strong>Bài:</strong> viết issue cho bug được mô tả.</li>\n<li><strong>Qua:</strong> người khác có thể tái hiện hoặc biết cần hỏi thông tin nào.</li>\n</ul>"}}, {"id": "EN-013", "sort": 291, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "EN-C — Viết trong quy trình phát triển phần mềm", "sem": "HK4", "sup": false, "title": "README và mô tả project", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "3efda02415816502", "substeps": [], "sec": {"exp": "<p>README project giới thiệu purpose, features, prerequisites, setup, tests và limitations. Câu ngắn, thông tin chính xác hữu ích hơn văn xuôi cầu kỳ.</p>", "ex": "<p>“This tool counts errors in a log file. It supports UTF-8 text logs with one event per line. Run <code class=\"inline-code\">./analyzer sample.log</code>.”</p>", "clar": "<p>Không nói “supports all logs” nếu chỉ test một format; ghi những giới hạn đã biết. Lệnh cần khớp project và OS được hỗ trợ.</p>", "ext": "<p>Thêm sample input/output, architecture overview và contribution instructions khi cần.</p>", "check": "<p>Viết 3 câu giới thiệu project và nêu một giới hạn trung thực.</p>", "sync": "<ul>\n<li><strong>Học:</strong> purpose, features, prerequisites, setup, tests, limitations.</li>\n<li><strong>Bài:</strong> viết README project của mình bằng câu ngắn.</li>\n<li><strong>Qua:</strong> ngữ pháp có thể chưa hoàn hảo nhưng thông tin chính rõ và trung thực.</li>\n</ul>"}}, {"id": "EN-014", "sort": 292, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "EN-C — Viết trong quy trình phát triển phần mềm", "sem": "HK4", "sup": false, "title": "Giải thích giải pháp kỹ thuật", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "edeaece17bdc5b1f", "substeps": [], "sec": {"exp": "<p>Giải thích quyết định kỹ thuật cần nêu lựa chọn, lý do, phương án khác và trade-off. Mẫu câu có thể đơn giản nhưng phải có nội dung kiểm chứng.</p>", "ex": "<p>“I chose a vector because the application mostly iterates over a small list. A map could improve lookup by key, but it adds different ordering and complexity.”</p>", "clar": "<p>Không liệt kê công nghệ như lý do tự thân. Nêu giả định; nếu chưa benchmark, không khẳng định tối ưu nhanh hơn bằng số liệu.</p>", "ext": "<p>Tập nói 1–2 phút về một quyết định trong project giúp chuẩn bị code review/interview.</p>", "check": "<p>Viết một câu bắt đầu “An alternative is…” cho lựa chọn database/file.</p>", "sync": "<ul>\n<li><strong>Học:</strong> <code class=\"inline-code\">I chose X because…</code>, <code class=\"inline-code\">An alternative is…</code>, <code class=\"inline-code\">The trade-off is…</code>, <code class=\"inline-code\">This test checks…</code>.</li>\n<li><strong>Bài:</strong> viết 5 câu giải thích quyết định dùng vector/map hoặc một lựa chọn trong project.</li>\n<li><strong>Qua:</strong> nêu lý do và đánh đổi, không chỉ liệt kê tên công nghệ.</li>\n</ul>"}}, {"id": "EN-015", "sort": 293, "pfx": "EN", "subj": "EN", "subjName": "English Lab (Tiếng Anh Kỹ Thuật)", "cat": "English Lab", "uitMap": "ENG01–ENG03 & Đọc/Viết tài liệu kỹ thuật", "part": "PHẦN J — TIẾNG ANH CÓ QUIZ TƯƠNG TÁC", "stage": "EN-C — Viết trong quy trình phát triển phần mềm", "sem": "HK4", "sup": false, "title": "Đọc bài viết và tổng kết ngắn", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "1e60fc3e6a2a3e62", "substeps": [], "sec": {"exp": "<p>Khi đọc bài kỹ thuật, xác định mục tiêu/ý chính, điều kiện, ví dụ và giới hạn; tra từ khóa quyết định nghĩa thay vì dịch từng từ. Tóm tắt giữ lại ý chính theo lời mình.</p>", "ex": "<p>Sau một đoạn nói về binary search, tóm tắt: “Binary search needs sorted data. It halves the search interval after each comparison. It runs in logarithmic time under its assumptions.”</p>", "clar": "<p>Tóm tắt phải phản ánh nội dung nguồn, không thêm kết luận không được hỗ trợ. Phân biệt tác giả nêu sự thật, ví dụ và ý kiến.</p>", "ext": "<p>Tạo glossary cá nhân: term, nghĩa, câu gốc tự viết và lesson liên quan.</p>", "check": "<p>Tóm tắt một đoạn technical documentation bằng 3 câu và đánh dấu từ điều kiện.</p>", "sync": "<ul>\n<li><strong>Học:</strong> tìm ý chính, từ khóa, ví dụ và giới hạn; không cần dịch toàn bộ văn bản.</li>\n<li><strong>Bài:</strong> đọc một đoạn tài liệu phù hợp rồi tóm tắt bằng 3–5 câu tiếng Việt hoặc tiếng Anh đơn giản.</li>\n<li><strong>Qua:</strong> nêu đúng ý chính và ít nhất một thuật ngữ quan trọng.</li>\n</ul>"}}, {"id": "PROJECT-01", "sort": 294, "pfx": "PROJECT", "subj": "PROJECT", "subjName": "Dự Án & Portfolio Theo Giai Đoạn", "cat": "Projects", "uitMap": "Đồ án / Capstone", "part": "PHẦN K — DỰ ÁN THEO TỪNG GIAI ĐOẠN", "stage": "27. Nguyên tắc dự án", "sem": "HK1", "sup": false, "title": "Quản lý điểm sinh viên (cuối giai đoạn C4–C7)", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": ["SUP-SE-005", "SUP-SE-006", "SUP-SEC-001"], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "e6868df209ee03e5", "substeps": [], "sec": {"exp": "<p>Mục tiêu là tích hợp input/output, điều kiện, loop, hàm, vector/array và validation trong phạm vi nhỏ.</p>", "ex": "<p>MVP: thêm/list/tìm sinh viên; tính min/max/average; từ chối điểm ngoài [0,10]; test danh sách rỗng theo quy ước và mã không tồn tại.</p>", "clar": "<p>Chưa cần GUI, database hay framework. Định nghĩa cách xử lý ID trùng và dữ liệu rỗng trước khi code; không tự ý đặt quy tắc nghiệp vụ khi đề chưa nói.</p>", "ext": "<p>Phiên bản sau có thể thêm file persistence, sau đó tách module và test tự động; mỗi đợt chỉ thêm một nhóm chức năng.</p>", "check": "<p>Người khác có thể chạy theo README và xác nhận 5 ca test nào?</p>", "sync": "<ul>\n<li>Tạo một bản ghi sinh viên với mã, tên và điểm.</li>\n<li>Nhập nhiều sinh viên; tính min/max/trung bình.</li>\n<li>Tìm sinh viên theo mã.</li>\n<li>Báo lỗi khi điểm không nằm trong miền hợp lệ đã quy định.</li>\n</ul>"}}, {"id": "PROJECT-02", "sort": 295, "pfx": "PROJECT", "subj": "PROJECT", "subjName": "Dự Án & Portfolio Theo Giai Đoạn", "cat": "Projects", "uitMap": "Đồ án / Capstone", "part": "PHẦN K — DỰ ÁN THEO TỪNG GIAI ĐOẠN", "stage": "27. Nguyên tắc dự án", "sem": "HK2", "sup": false, "title": "Quản lý thư viện (sau OOP cơ bản)", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "079745415f6ed221", "substeps": [], "sec": {"exp": "<p>Dự án thư viện đưa struct/class, invariants, composition, validation, tách module và lưu dữ liệu vào bài toán thống nhất.</p>", "ex": "<p>MVP có Book(id,title,status), thêm sách, tìm, mượn/trả và lưu qua lần chạy. Test thêm trùng ID, ID không tồn tại, mượn sách đang mượn và file hỏng.</p>", "clar": "<p>Viết quy tắc trước: ID duy nhất, trạng thái nào hợp lệ, có xóa sách đang mượn không. Không dùng inheritance nếu quan hệ “is-a” không đúng.</p>", "ext": "<p>Bổ sung lịch sử mượn, transaction/DB chỉ sau khi bản console có hành vi đúng và được test.</p>", "check": "<p>Nêu ba invariant và chỉ ra test ngăn vi phạm từng invariant.</p>", "sync": "<ul>\n<li>Quản lý sách với mã duy nhất, tên và trạng thái.</li>\n<li>Tìm kiếm, thêm, cập nhật và liệt kê.</li>\n<li>Quản lý mượn/trả theo quy tắc đơn giản do người học viết trước.</li>\n<li>Dữ liệu lưu được qua lần chạy.</li>\n</ul>"}}, {"id": "PROJECT-03", "sort": 296, "pfx": "PROJECT", "subj": "PROJECT", "subjName": "Dự Án & Portfolio Theo Giai Đoạn", "cat": "Projects", "uitMap": "Đồ án / Capstone", "part": "PHẦN K — DỰ ÁN THEO TỪNG GIAI ĐOẠN", "stage": "27. Nguyên tắc dự án", "sem": "HK3", "sup": false, "title": "C++ Log Analyzer (sau STL và kiến thức cấu trúc dữ liệu)", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "ed0fefb8d3dafb48", "substeps": [], "sec": {"exp": "<p>Log analyzer rèn parsing, container, test, xử lý lỗi và benchmark. Input format phải được định nghĩa để kết quả có thể kiểm chứng.</p>", "ex": "<p>Với mỗi dòng <code class=\"inline-code\">timestamp level endpoint</code>, kiểm tra đủ trường, đếm theo level/endpoint và in top N. Lưu báo cáo số dòng hợp lệ/bị bỏ.</p>", "clar": "<p>Không âm thầm biến dòng lỗi thành dữ liệu mặc định. Benchmark cần cùng dataset, nhiều lần đo, environment và giới hạn; không khẳng định speedup từ một lần chạy.</p>", "ext": "<p>So sánh vector scan với map/hash hoặc đọc toàn bộ file với streaming khi có câu hỏi rõ ràng.</p>", "check": "<p>Người khác có thể tái lập phép đo thế nào và dữ liệu lỗi được xử lý ra sao?</p>", "sync": "<ul>\n<li>Đọc log có định dạng được mô tả; xử lý dòng không đúng định dạng.</li>\n<li>Đếm sự kiện theo loại/endpoint; tìm mục phổ biến; in báo cáo.</li>\n<li>So sánh ít nhất hai cách xử lý hoặc cấu trúc dữ liệu trên input tương tự.</li>\n<li>Đo nhiều cỡ dữ liệu; ghi máy/môi trường, cách chạy và giới hạn phép đo.</li>\n</ul>"}}, {"id": "PROJECT-04", "sort": 297, "pfx": "PROJECT", "subj": "PROJECT", "subjName": "Dự Án & Portfolio Theo Giai Đoạn", "cat": "Projects", "uitMap": "Đồ án / Capstone", "part": "PHẦN K — DỰ ÁN THEO TỪNG GIAI ĐOẠN", "stage": "27. Nguyên tắc dự án", "sem": "HK4", "sup": false, "title": "Ứng dụng client/API/database (năm 2)", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "9b69810d325c18b9", "substeps": [], "sec": {"exp": "<p>Ứng dụng client/API/database kiểm tra luồng end-to-end từ yêu cầu người dùng đến dữ liệu. Không cần production scale; cần một luồng hoàn chỉnh và test.</p>", "ex": "<p>Chọn quản lý sách/tasks: client gửi request; API xác thực input; database lưu; client hiển thị kết quả. Viết schema và ít nhất 5 thao tác/query có ý nghĩa.</p>", "clar": "<p>Lỗi network, 4xx/5xx, trường optional và transaction cần được quy định. Không cần auth/deploy nếu nó làm vượt thời gian và chưa đủ nền tảng.</p>", "ext": "<p>Thêm authentication, migration, CI hoặc deploy từng bước khi bài tương ứng đã học.</p>", "check": "<p>Vẽ request flow và nêu test cho happy path lẫn input sai.</p>", "sync": "<ul>\n<li>Một use case rõ, ví dụ quản lý sách, việc cần làm hoặc kho hàng.</li>\n<li>Client đơn giản gửi request; API xử lý; database giữ dữ liệu.</li>\n<li>Có schema và ít nhất 5 truy vấn/operation được giải thích.</li>\n<li>Có test cho input sai và một luồng tích hợp.</li>\n</ul>"}}, {"id": "PROJECT-05", "sort": 298, "pfx": "PROJECT", "subj": "PROJECT", "subjName": "Dự Án & Portfolio Theo Giai Đoạn", "cat": "Projects", "uitMap": "Đồ án / Capstone", "part": "PHẦN K — DỰ ÁN THEO TỪNG GIAI ĐOẠN", "stage": "27. Nguyên tắc dự án", "sem": "HK5", "sup": false, "title": "Specialty MVP (năm 3)", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reviewed_against_source", "srcRef": "Audited & patched in Verification Master v1.2 (AUD-003..008)", "hash": "abcd7e15d0e2a9f2", "substeps": [], "sec": {"exp": "<p>Specialty MVP chứng minh người học có thể biến một nhu cầu thành luồng giá trị nhỏ, trong hướng chuyên môn đã chọn.</p>", "ex": "<p>Trước khi code, ghi user, 2–4 user journeys, acceptance criteria, data/component boundaries, non-goals, rủi ro và milestones.</p>", "clar": "<p>MVP không phải bản nháp vô kiểm soát; phạm vi nhỏ nhưng hành vi chính phải chạy, test được và có giới hạn được nói rõ.</p>", "ext": "<p>Dùng phản hồi người dùng/reviewer để xác định cải tiến, không thêm feature chỉ vì thấy tutorial.</p>", "check": "<p>Xác định một luồng đầu-cuối có thể demo, cùng tiêu chí pass/fail.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">PROJECT-05</code>.</li>\n<li><strong>Mục tiêu:</strong> xây MVP nhỏ thuộc một nhánh chuyên môn đã chọn, chứng minh một luồng giá trị đầu-cuối có thể chạy và kiểm tra.</li>\n<li><strong>Bằng chứng:</strong> scope/non-goals, user journeys, acceptance criteria, cách chạy, test, README, known limitations và giải thích quyết định kỹ thuật.</li>\n<li><strong>Điều kiện đạt:</strong> reviewer hoặc người học khác có thể chạy lại theo README; luồng chính đạt acceptance criteria; người học giải thích phần tự viết và các phần có AI hỗ trợ.</li>\n<li>Quy mô điều chỉnh theo thời gian thực tế; không yêu cầu dự án lớn hoặc hoàn chỉnh thương mại.</li>\n</ul>"}}, {"id": "PROJECT-06", "sort": 299, "pfx": "PROJECT", "subj": "PROJECT", "subjName": "Dự Án & Portfolio Theo Giai Đoạn", "cat": "Projects", "uitMap": "Đồ án / Capstone", "part": "PHẦN K — DỰ ÁN THEO TỪNG GIAI ĐOẠN", "stage": "27. Nguyên tắc dự án", "sem": "HK6", "sup": false, "title": "Dự án nhóm có review/CI (năm 3)", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "c21d2ad295199871", "substeps": [], "sec": {"exp": "<p>Dự án nhóm kiểm tra quy trình cộng tác: issue, branch, pull request/code review, automated build/test, release và retrospective. Có thể thay bằng cá nhân nếu không có nhóm.</p>", "ex": "<p>Chia tasks theo owner; mỗi PR mô tả thay đổi và test; CI chạy; ghi lại một conflict/bug và cách giải quyết.</p>", "clar": "<p>Đóng góp cá nhân phải trung thực. Không tính merge thành công là chất lượng nếu test chưa chạy hoặc review chỉ hình thức.</p>", "ext": "<p>Retrospective nên chọn 1–2 thay đổi quy trình cụ thể để thử ở dự án sau.</p>", "check": "<p>Cho xem bằng chứng đóng góp, review, CI và một bài học cải tiến.</p>", "sync": "<ul>\n<li>2–4 người nếu điều kiện cho phép; có thể thay bằng dự án cá nhân có review từ người khác nếu không lập nhóm được.</li>\n<li>Issues/tasks có người phụ trách; nhánh riêng; pull request có mô tả và test.</li>\n<li>Build/test tự động; lịch sử lỗi/sửa lỗi; release/demo.</li>\n<li>Thể hiện đóng góp cá nhân trung thực.</li>\n</ul>"}}, {"id": "PROJECT-07", "sort": 300, "pfx": "PROJECT", "subj": "PROJECT", "subjName": "Dự Án & Portfolio Theo Giai Đoạn", "cat": "Projects", "uitMap": "Đồ án / Capstone", "part": "PHẦN K — DỰ ÁN THEO TỪNG GIAI ĐOẠN", "stage": "27. Nguyên tắc dự án", "sem": "HK8", "sup": false, "title": "Capstone năm cuối", "estStatus": "not_estimated", "depStatus": "needs_review", "reqPrereqs": [], "provPrereqs": [], "recBg": [], "unlocks": [], "verStatus": "reasoned_only", "srcRef": "SE_Roadmap_Master & SE_Content_Companion_Master v2.0", "hash": "0902135d113cb039", "substeps": [], "sec": {"exp": "<p>Capstone tổng hợp yêu cầu, architecture, data model, code quality, tests, security, demo, đo lường và báo cáo giới hạn. Quy mô nên phù hợp nguồn lực thực tế.</p>", "ex": "<p>Chọn vấn đề thật vừa sức; định nghĩa success criteria; xây vertical slice; thêm test; demo theo README; đo ít nhất một thuộc tính phù hợp và ghi điều chưa đo.</p>", "clar": "<p>Một báo cáo mạnh không tuyên bố app hoàn hảo; nêu assumptions, limitations, known issues, rủi ro và phương án khác.</p>", "ext": "<p>Có thể kèm architecture decision record, threat model, test report và postmortem ngắn.</p>", "check": "<p>Người review có thể tái tạo demo và kiểm tra tuyên bố chính bằng bằng chứng nào?</p>", "sync": "<ul>\n<li>Problem statement, người dùng và tiêu chí chấp nhận.</li>\n<li>Kiến trúc và data model phù hợp quy mô.</li>\n<li>Code có cấu trúc, Git history có ý nghĩa.</li>\n<li>Automated tests cho hành vi quan trọng.</li>\n</ul>"}}, {"id": "SUP-LA-001", "sort": 301, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Vector và phép toán vector", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": [], "recBg": ["MATH-001", "MATH-003"], "unlocks": ["SUP-LA-002", "SUP-LA-003", "SUP-LA-004", "SUP-LA-005", "SUP-LA-010", "SUP-LA-014"], "verStatus": "mapped_to_textbook_unverified_syllabus", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "a374b9bbe4955160", "substeps": [], "sec": {"exp": "<p>Biểu diễn vector; cộng vector; nhân vô hướng; diễn giải vector như đối tượng có tọa độ.</p>", "ex": "<p>Cho u=(1, 2), v=(3, −1). Khi đó u+v=(1+3, 2−1)=(4, 1), còn 2u=(2, 4). Chỉ cộng các tọa độ tương ứng khi hai vector có cùng số chiều.</p>", "clar": "<p>Đây là module bổ sung. Không coi nó là yêu cầu chính thức của UIT nếu chưa đối chiếu đề cương đúng khóa/học kỳ. Với công thức, thuật toán hoặc hành vi phụ thuộc môi trường, kiểm tra điều kiện áp dụng trước khi kết luận.</p>", "ext": "<p>Tạo một biến thể mới từ ví dụ, viết giả định và kiểm tra bằng lời giải độc lập hoặc test có thể lặp lại. Đối chiếu một giáo trình đại học hoặc tài liệu chính thức được liệt kê trong hồ sơ nguồn.</p>", "check": "<p>Tự giải thích khái niệm chính không nhìn nội dung, làm ví dụ khác số liệu/tình huống và nêu một trường hợp không áp dụng được.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-001</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">MATH-001/MATH-003</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Tính toán và diễn giải 3 vector; kiểm tra kích thước/chiều.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">mapped to user-uploaded textbook; current-term syllabus unverified</code>; chưa có nghĩa là đã kiểm thử/duyệt bởi giảng viên.</li>\n</ul>"}}, {"id": "SUP-LA-002", "sort": 302, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Ma trận và hệ phương trình tuyến tính", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": [], "recBg": ["SUP-LA-001"], "unlocks": ["SUP-LA-003", "SUP-LA-005", "SUP-LA-010"], "verStatus": "mapped_to_textbook_unverified_syllabus", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "701d531d1a8ff02b", "substeps": [], "sec": {"exp": "<p>Ma trận, kích thước, phép nhân tương thích; biểu diễn hệ phương trình tuyến tính dưới dạng ma trận.</p>", "ex": "<p>Xét 2x+y=5 và x−y=1. Cộng hai phương trình được 3x=6 nên x=2; thế lại x−y=1 được y=1. Thế (2,1) vào cả hai phương trình đều đúng, vì vậy nghiệm đã được kiểm tra độc lập.</p>", "clar": "<p>Đây là module bổ sung. Không coi nó là yêu cầu chính thức của UIT nếu chưa đối chiếu đề cương đúng khóa/học kỳ. Với công thức, thuật toán hoặc hành vi phụ thuộc môi trường, kiểm tra điều kiện áp dụng trước khi kết luận.</p>", "ext": "<p>Tạo một biến thể mới từ ví dụ, viết giả định và kiểm tra bằng lời giải độc lập hoặc test có thể lặp lại. Đối chiếu một giáo trình đại học hoặc tài liệu chính thức được liệt kê trong hồ sơ nguồn.</p>", "check": "<p>Tự giải thích khái niệm chính không nhìn nội dung, làm ví dụ khác số liệu/tình huống và nêu một trường hợp không áp dụng được.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-002</cod  "check": "<p>Tự giải thích khái niệm chính không nhìn nội dung, làm ví dụ khác số liệu/tình huống và nêu một trường hợp không áp dụng được.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-004</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-001</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Tính dot product và nhận diện ví dụ trực giao.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">mapped to user-uploaded textbook; current-term syllabus unverified</code>; chưa có nghĩa là đã kiểm thử/duyệt bởi giảng viên.</li>\n</ul>"}}, {"id": "SUP-LA-005", "sort": 305, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Các loại ma trận, phép toán và chuyển vị", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-001", "SUP-LA-002"], "recBg": [], "unlocks": ["SUP-LA-006", "SUP-LA-007", "SUP-LA-016"], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "d178e34e74f8f257", "substeps": [], "sec": {"exp": "<p>Ma trận là bảng hệ số có m hàng, n cột. Cộng ma trận và nhân vô hướng thao tác theo từng vị trí; phép nhân ma trận lại ghép hàng của ma trận bên trái với cột của ma trận bên phải. Với A kích thước m×n và B kích thước n×p, tích AB tồn tại và có kích thước m×p. Chuyển vị Aᵀ đổi hàng thành cột. Giáo trình cũng giới thiệu ma trận vuông, không, chéo, đơn vị, tam giác, đối xứng và phản đối xứng.</p>", "ex": "<p>A = [[1,2],[0,1]], B = [[2,1],[3,4]]. Khi đó AB = [[1×2+2×3, 1×1+2×4],[0×2+1×3, 0×1+1×4]] = [[8,9],[3,4]]. Kích thước tích vẫn là 2×2. Ngược lại, nếu A có 3 cột còn B có 2 hàng thì AB không xác định.</p>", "clar": "<p>Nhân ma trận không giao hoán nói chung: AB có thể khác BA, và một tích có thể tồn tại trong khi tích theo thứ tự ngược không tồn tại. Không nhân từng vị trí để thay cho phép nhân ma trận.</p>", "ext": "<p>Kiểm tra (AB)ᵀ = BᵀAᵀ và thử dựng phản ví dụ cho AB ≠ BA. Phân biệt phần tử aᵢⱼ với cả hàng/cột.</p>", "check": "<p>Nếu A có kích thước 2×3 và B có kích thước 3×4, kích thước AB là gì? Viết công thức hàng–cột cho phần tử c₁₂.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-005</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-001/SUP-LA-002</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Phân loại ma trận; thực hiện phép cộng, nhân vô hướng, nhân ma trận và chuyển vị với kiểm tra kích thước.</li>\n<li><strong>Tiêu chí qua bài:</strong> Nêu đúng điều kiện kích thước; tính đúng ít nhất 4 tích ma trận nhỏ; nhận diện đúng các loại ma trận cơ bản.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 1, §1.1; PDF pp. 7–20; trang in 1–14.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-LA-006", "sort": 306, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Định thức, phần bù đại số và khai triển Laplace", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-005"], "recBg": [], "unlocks": ["SUP-LA-007", "SUP-LA-008", "SUP-LA-009", "SUP-LA-019", "SUP-LA-020"], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "93d5f26126131683", "substeps": [], "sec": {"exp": "<p>Định thức chỉ được định nghĩa cho ma trận vuông. Với [[a,b],[c,d]], det = ad−bc. Ở cấp lớn hơn, giáo trình xây dựng định thức qua ma trận con, định thức con/phần bù đại số và khai triển Laplace theo hàng hoặc cột. Các tính chất cho phép nhận diện định thức bằng 0 khi có hàng/cột không, hai hàng/cột trùng, và chuyển đổi hàng có ảnh hưởng được kiểm soát đến giá trị định thức.</p>", "ex": "<p>A = [[2,1],[3,5]] có det(A)=2×5−1×3=7. Vì det(A) ≠ 0, A khả nghịch; kết luận này đúng với ma trận vuông A. Với ma trận cấp 3, chọn hàng/cột có nhiều số 0 để khai triển Laplace giúp giảm số hạng.</p>", "clar": "<p>Định thức không phải phép toán áp dụng cho ma trận chữ nhật. Khi đổi hàng, nhân một hàng với hằng số hoặc cộng bội một hàng vào hàng khác, phải theo dõi đúng quy tắc ảnh hưởng lên định thức.</p>", "ext": "<p>Đối chiếu khai triển Laplace với khử Gauss khi cấp ma trận lớn; ưu tiên phương pháp rút gọn khi tính tay theo yêu cầu lớp, không nhầm tính chất định thức với tính chất hạng.</p>", "check": "<p>Tính det([[1,4],[2,7]]). Giá trị này cho biết điều gì về tính khả nghịch của ma trận?</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-006</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-005</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Tính định thức cấp 2–3, dùng khai triển Laplace và vận dụng được các tính chất để rút gọn bài tính.</li>\n<li><strong>Tiêu chí qua bài:</strong> Tính đúng định thức cấp 2 và một bài cấp 3; giải thích được ít nhất ba tính chất hay dùng.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 1, §1.2; PDF pp. 21–34; trang in 15–28.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-LA-007", "sort": 307, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Phép biến đổi hàng, dạng bậc thang và hạng ma trận", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-005", "SUP-LA-006"], "recBg": [], "unlocks": ["SUP-LA-008", "SUP-LA-009", "SUP-LA-011"], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "bc337f28ab0d7c17", "substeps": [], "sec": {"exp": "<p>Ba phép biến đổi hàng sơ cấp là đổi chỗ hai hàng, nhân một hàng với số khác 0 và cộng vào một hàng bội của hàng khác. Các phép này tạo ra ma trận tương đương hàng, giúp đưa ma trận về dạng bậc thang. Hạng có thể đọc từ số hàng khác hàng-không trong dạng bậc thang (tương đương số pivot).</p>", "ex": "<p>Với [[1,2],[2,4]], thực hiện R₂ ← R₂−2R₁ được [[1,2],[0,0]], nên hạng bằng 1. Hai hàng ban đầu phụ thuộc tuyến tính, không phải hạng 2.</p>", "clar": "<p>Không được nhân hàng với 0 vì thao tác này không khả nghịch và không phải phép biến đổi sơ cấp. Hạng không tăng vì chỉ nhìn số cột hay số hàng ban đầu.</p>", "ext": "<p>Phân biệt dạng bậc thang và dạng bậc thang rút gọn; kết nối pivot/free variables với số nghiệm của hệ tuyến tính.</p>", "check": "<p>Tìm hạng của [[1,0,2],[0,1,3],[1,1,5]] bằng phép biến đổi hàng.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-007</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-005/SUP-LA-006</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Rút gọn ma trận về dạng bậc thang, xác định pivot và tìm hạng.</li>\n<li><strong>Tiêu chí qua bài:</strong> Ghi rõ từng phép biến đổi; xác định pivot và hạng chính xác trong các ma trận nhỏ.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 1, §1.3; PDF pp. 35–44; trang in 29–38.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-LA-008", "sort": 308, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Ma trận khả nghịch và cách tìm ma trận nghịch đảo", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-006", "SUP-LA-007"], "recBg": [], "unlocks": ["SUP-LA-009", "SUP-LA-016"], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "40bf85d68880bbc8", "substeps": [], "sec": {"exp": "<p>Ma trận vuông A khả nghịch nếu tồn tại A⁻¹ sao cho AA⁻¹=A⁻¹A=I. Giáo trình liên hệ tính khả nghịch với định thức khác 0, tương đương hàng với ma trận đơn vị và các điều kiện hạng. Cách khử hàng ghép [A|I] rồi rút gọn khối trái về I; khối phải sẽ thành A⁻¹ nếu thao tác thành công.</p>", "ex": "<p>A=[[1,2],[3,4]], det(A)=−2. Công thức nghịch đảo cấp 2 cho A⁻¹ = (1/−2)[[4,−2],[−3,1]] = [[−2,1],[1.5,−0.5]]. Nhân lại A·A⁻¹ cho I₂.</p>", "clar": "<p>Chỉ ma trận vuông mới có nghịch đảo hai phía cùng dạng. Nếu det(A)=0, ma trận không khả nghịch; không được chia cho định thức bằng 0.</p>", "ext": "<p>So sánh phương pháp Gauss–Jordan với công thức phụ hợp; dùng phép nhân lại làm kiểm tra độc lập.</p>", "check": "<p>Ma trận [[2,4],[1,2]] có nghịch đảo không? Hãy giải thích bằng định thức hoặc hạng.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-008</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-006/SUP-LA-007</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Kiểm tra khả nghịch và tìm A⁻¹ bằng khử hàng hoặc công thức phụ hợp khi phù hợp.</li>\n<li><strong>Tiêu chí qua bài:</strong> Phân biệt khả nghịch/không khả nghịch, tính được nghịch đảo ma trận 2×2 và kiểm tra tích bằng ma trận đơn vị.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 1, §1.4; PDF pp. 45–57; trang in 39–51.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-LA-009", "sort": 309, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Giải hệ tuyến tính: Cramer, Gauss, tương thích và hệ thuần nhất", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-006", "SUP-LA-007", "SUP-LA-008"], "recBg": [], "unlocks": [], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "9c784855b9b8b10b", "substeps": [], "sec": {"exp": "<p>Hệ tuyến tính viết thành AX=b. Quy tắc Cramer áp dụng cho hệ vuông khi det(A) ≠ 0. Phương pháp Gauss dùng ma trận mở rộng để đưa hệ về dạng bậc thang và đọc nghiệm. Điều kiện tương thích được liên hệ với hạng ma trận hệ số và ma trận mở rộng; hệ thuần nhất AX=0 luôn có nghiệm không, nhưng có thể còn nghiệm khác không.</p>", "ex": "<p>Hệ 2x+y=5, x−y=1 có nghiệm x=2,y=1. Với hệ tổng quát, nếu rút gọn ma trận mở rộng tạo hàng [0 0 … 0 | c] với c≠0 thì hệ vô nghiệm. Nếu không có hàng mâu thuẫn và còn ít nhất một biến tự do, hệ có vô số nghiệm.</p>", "clar": "<p>Không dùng Cramer khi ma trận hệ số không vuông hoặc định thức bằng 0. Không kết luận “vô nghiệm” chỉ vì có biến tự do; phải kiểm tra hàng mâu thuẫn.</p>", "ext": "<p>Dùng hạng để phát biểu điều kiện Kronecker–Capelli; mô tả số chiều của không gian nghiệm hệ thuần nhất thông qua số biến tự do/rank khi điều kiện phù hợp.</p>", "check": "<p>Sau khi khử Gauss, hệ có hàng [0,0,0|5]. Hệ có nghiệm không? Nếu ma trận có 4 ẩn và 2 pivot, cần kiểm tra điều gì để mô tả số nghiệm?</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-009</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-006/SUP-LA-007/SUP-LA-008</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Chọn phương pháp giải thích hợp, phân loại hệ vô nghiệm/duy nhất/vô số nghiệm và biểu diễn nghiệm tự do.</li>\n<li><strong>Tiêu chí qua bài:</strong> Giải được hệ nhỏ bằng Gauss, thế lại để kiểm tra, và phân loại đúng các trường hợp có nghiệm.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 2, §§2.1–2.4; PDF pp. 75–94; trang in 69–88.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-LA-010", "sort": 310, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Không gian véc tơ và không gian con", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-001", "SUP-LA-002"], "recBg": [], "unlocks": ["SUP-LA-011", "SUP-LA-012"], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "1bedd8f93ae136b9", "substeps": [], "sec": {"exp": "<p>Không gian véc tơ là tập hợp có phép cộng vector và nhân vector với vô hướng thỏa các tiên đề như đóng, kết hợp, phần tử không, đối, phân phối. Không gian con là tập con không rỗng vẫn đóng dưới tổ hợp tuyến tính; với không gian con, kiểm tra 0 thuộc tập và αu+βv thuộc tập cho mọi u,v trong tập và α,β là tiêu chí thực dụng.</p>", "ex": "<p>W={(x,y)∈R² : x+y=0} là không gian con vì (0,0)∈W; nếu x+y=0 và u+v=0 thì với α,β, tổng tọa độ của α(x,y)+β(u,v) vẫn là 0.</p>", "clar": "<p>Tập hợp có hình dạng “đường thẳng” chưa chắc là không gian con; nếu không đi qua gốc thì thường không đóng dưới phép nhân vô hướng.</p>", "ext": "<p>Giáo trình dùng các ví dụ trong Rⁿ và không gian véc tơ trừu tượng. Sau khi hiểu R²/R³, thử các không gian đa thức hoặc ma trận.</p>", "check": "<p>Tập W={(x,y): x+y=1} có là không gian con của R² không? Hãy kiểm tra vector không.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-010</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-001/SUP-LA-002</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Kiểm tra tập với phép cộng và nhân vô hướng có phải không gian véc tơ/không gian con trong các ví dụ cơ bản.</li>\n<li><strong>Tiêu chí qua bài:</strong> Áp dụng được kiểm tra đóng dưới tổ hợp tuyến tính; chỉ ra phản ví dụ đơn giản khi tập không phải không gian con.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 3, §3.1; PDF pp. 101–114; trang in 95–108.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-LA-011", "sort": 311, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Độc lập tuyến tính và phụ thuộc tuyến tính", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-003", "SUP-LA-007", "SUP-LA-010"], "recBg": [], "unlocks": ["SUP-LA-012"], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "38bd1d5a7f8cf61b", "substeps": [], "sec": {"exp": "<p>Một tập vector độc lập tuyến tính nếu tổ hợp tuyến tính bằng vector không chỉ xảy ra khi tất cả hệ số đều bằng 0. Nếu tồn tại một nghiệm không tầm thường thì tập phụ thuộc. Đưa các vector làm cột của ma trận và giải Ax=0 là cách kiểm tra thực dụng.</p>", "ex": "<p>v₁=(1,0), v₂=(2,0) phụ thuộc vì 2v₁−v₂=0 với hệ số không cùng bằng 0. Hai vector (1,0) và (0,1) độc lập vì a(1,0)+b(0,1)=(0,0) buộc a=b=0.</p>", "clar": "<p>Độc lập không có nghĩa các vector khác nhau đôi một; có ba vector đôi một khác nhau vẫn có thể phụ thuộc. Với nhiều vector hơn số chiều trong Rⁿ, chúng luôn phụ thuộc.</p>", "ext": "<p>Liên hệ độc lập tuyến tính với pivot, rank và số chiều; phân biệt “tập sinh” với “tập độc lập”.</p>", "check": "<p>Trong R², ba vector bất kỳ có thể độc lập tuyến tính cùng lúc không? Vì sao?</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-011</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-003/SUP-LA-007/SUP-LA-010</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Xác định phụ thuộc/độc lập tuyến tính bằng hệ số tổ hợp và bằng khử hàng.</li>\n<li><strong>Tiêu chí qua bài:</strong> Lập được phương trình tổ hợp tuyến tính bằng 0, giải hệ và giải thích kết luận.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 3, §3.2; PDF pp. 115–120; trang in 109–114.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-LA-012", "sort": 312, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Cơ sở, số chiều và tọa độ theo cơ sở", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-010", "SUP-LA-011"], "recBg": [], "unlocks": ["SUP-LA-013", "SUP-LA-015", "SUP-LA-017", "SUP-LA-018"], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "b669c482c96e9dbb", "substeps": [], "sec": {"exp": "<p>Cơ sở là một tập vector vừa độc lập tuyến tính vừa sinh ra toàn bộ không gian. Số chiều là số vector trong một cơ sở hữu hạn. Tọa độ [v]ᴮ là các hệ số cần để viết v thành tổ hợp tuyến tính của các vector cơ sở; nó phụ thuộc cơ sở đang dùng, không phải bản thân vector thay đổi.</p>", "ex": "<p>B={(1,1),(1,−1)} là cơ sở của R². Với v=(3,1), giải a+b=3 và a−b=1 cho a=2,b=1; do đó [v]ᴮ=(2,1)ᵀ.</p>", "clar": "<p>Tọa độ theo cơ sở B không nhất thiết giống tọa độ chuẩn. Một tập sinh có thể phụ thuộc; tập độc lập có thể chưa sinh toàn bộ không gian.</p>", "ext": "<p>Tập tọa độ và ma trận đổi cơ sở; khi dùng công thức, luôn ghi rõ quy ước ma trận chuyển từ B sang B′ để tránh đảo chiều P.</p>", "check": "<p>Với cơ sở B={(1,0),(1,1)}, tìm tọa độ của v=(3,2).</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-012</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-010/SUP-LA-011</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Kiểm tra cơ sở, xác định số chiều và tìm tọa độ vector theo cơ sở được cho.</li>\n<li><strong>Tiêu chí qua bài:</strong> Kiểm tra độc lập + sinh; giải được tọa độ vector trong một cơ sở nhỏ; tái tạo lại vector từ tọa độ.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 3, §§3.3–3.4; PDF pp. 121–147; trang in 115–141.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-LA-013", "sort": 313, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Ánh xạ tuyến tính, nhân, ảnh và ma trận biểu diễn", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-012"], "recBg": [], "unlocks": ["SUP-LA-016", "SUP-LA-018"], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "a41b657b17e2ac7f", "substeps": [], "sec": {"exp": "<p>Ánh xạ T tuyến tính nếu T(u+v)=T(u)+T(v) và T(αu)=αT(u). Nhân Ker(T) gồm vector được gửi về 0; ảnh Im(T) là tập kết quả có thể đạt. Trong cơ sở đã chọn, ma trận biểu diễn ánh xạ cho phép tính tọa độ đầu ra bằng phép nhân ma trận với tọa độ đầu vào.</p>", "ex": "<p>T(x,y)=(x+2y,3x−y) có ma trận chuẩn [[1,2],[3,−1]]. Với (1,0), T(1,0)=(1,3), cũng chính là cột thứ nhất của ma trận; với (0,1), đầu ra là cột thứ hai (2,−1).</p>", "clar": "<p>Kernel không phải tập đầu ra; image không phải tập đầu vào. Ma trận biểu diễn phụ thuộc các cơ sở dùng ở miền và đối miền.</p>", "ext": "<p>Liên kết dim Ker(T)+rank(T)=dim(domain) trong không gian hữu hạn chiều; hiểu đổi cơ sở và ma trận đồng dạng theo ngữ cảnh chương.</p>", "check": "<p>Với T(x,y)=(x+y, x+y), tìm một vector khác 0 trong Ker(T) và nêu một vector thuộc Im(T).</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-013</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-012</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Kiểm tra tính tuyến tính; tìm kernel/image trong ví dụ nhỏ và lập ma trận của ánh xạ theo cơ sở.</li>\n<li><strong>Tiêu chí qua bài:</strong> Kiểm tra điều kiện tuyến tính, lập ma trận theo cơ sở chuẩn và giải được kernel/image của ví dụ 2D đơn giản.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 4, §§4.1–4.3; PDF pp. 167–179; trang in 161–173.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-LA-014", "sort": 314, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Không gian Euclide: tích vô hướng, chuẩn, khoảng cách và góc", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-001", "SUP-LA-003"], "recBg": [], "unlocks": ["SUP-LA-015"], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "ae92d2eb73ba9216", "substeps": [], "sec": {"exp": "<p>Tích vô hướng trên Rⁿ được tính bằng tổng tích các tọa độ tương ứng trong mô hình chuẩn của giáo trình. Chuẩn là độ dài, khoảng cách giữa x,y là chuẩn của x−y; góc giữa vector khác 0 liên hệ với tích vô hướng qua cosθ=(x·y)/(||x||||y||). Cauchy–Schwarz giới hạn |x·y|; hai vector trực giao khi tích vô hướng bằng 0.</p>", "ex": "<p>u=(1,2), v=(2,−1): u·v=1×2+2×(−1)=0, nên u và v trực giao. ||u||=√5, ||v||=√5; từ dot product bằng 0 suy ra góc giữa chúng là π/2.</p>", "clar": "<p>Công thức góc không dùng trực tiếp khi một vector là vector không vì mẫu số bằng 0. Trực giao là khái niệm theo tích vô hướng đang định nghĩa.</p>", "ext": "<p>Không gian Euclide tổng quát có tích vô hướng thỏa các tính chất tương ứng; trong ứng dụng dữ liệu, cosine similarity dùng chuẩn hóa nhưng cần hiểu dữ liệu và giả định.</p>", "check": "<p>Tính khoảng cách giữa (1,2) và (4,6); sau đó kiểm tra tích vô hướng của (1,0) và (0,1).</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-014</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-001/SUP-LA-003</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Tính inner product, norm, distance, angle và áp dụng Cauchy–Schwarz/Pythagore trong ví dụ.</li>\n<li><strong>Tiêu chí qua bài:</strong> Tính đúng tích vô hướng, chuẩn và khoảng cách; giải thích ý nghĩa điều kiện trực giao.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 5, §5.1; PDF pp. 189–192; trang in 183–186.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-LA-015", "sort": 315, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Tập trực giao, cơ sở trực chuẩn và Gram–Schmidt", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-012", "SUP-LA-014"], "recBg": [], "unlocks": [], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "27095a9201b7cfd8", "substeps": [], "sec": {"exp": "<p>Một tập trực giao có các vector khác nhau đôi một trực giao. Nếu mọi vector còn có chuẩn 1 thì là cơ sở trực chuẩn. Gram–Schmidt tạo ra các vector trực giao từ một tập độc lập bằng cách trừ đi các thành phần chiếu lên những vector đã xây dựng; cuối cùng chuẩn hóa nếu cần.</p>", "ex": "<p>Từ v₁=(1,1), v₂=(1,0), đặt u₁=v₁. Thành phần chiếu của v₂ lên u₁ là ((v₂·u₁)/(u₁·u₁))u₁=(1/2)(1,1). Vậy u₂=(1/2,−1/2), trực giao với u₁; có thể nhân u₂ với 2 để dùng (1,−1) làm vector cùng phương.</p>", "clar": "<p>Gram–Schmidt không cứu được tập phụ thuộc để tạo một cơ sở có đủ số vector ban đầu; phép chia cho chuẩn chỉ được làm với vector khác 0.</p>", "ext": "<p>Sau khi có tập trực giao, chiếu vector lên không gian con bằng tổng các thành phần chiếu theo cơ sở trực giao/chuẩn. Đây là ý tưởng nền của least squares nhưng phần này không tự động thay syllabus.</p>", "check": "<p>Kiểm tra (1,1) và (1,−1) có trực giao không; sau đó chuẩn hóa cả hai.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-015</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-012/SUP-LA-014</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Kiểm tra tính trực giao/chuẩn hóa và thực hiện Gram–Schmidt với hai hoặc ba vector độc lập nhỏ.</li>\n<li><strong>Tiêu chí qua bài:</strong> Tính đúng một bước chiếu, xác minh tích vô hướng bằng 0 và giải thích vì sao span được bảo toàn.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 5, §5.2; PDF pp. 193–200; trang in 187–194.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-LA-016", "sort": 316, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Giá trị riêng, véc tơ riêng và đa thức đặc trưng", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-005", "SUP-LA-008", "SUP-LA-013"], "recBg": [], "unlocks": ["SUP-LA-017"], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "115d431603e629c9", "substeps": [], "sec": {"exp": "<p>λ là giá trị riêng nếu có vector v khác 0 sao cho Av=λv; tương đương (A−λI)v=0 có nghiệm khác 0. Đa thức đặc trưng được xây từ det(A−λI) (hoặc quy ước dấu tương đương det(λI−A)); mỗi nghiệm thuộc trường đang xét là một giá trị riêng. Không gian riêng là kernel của A−λI.</p>", "ex": "<p>A=[[2,1],[0,3]] là tam giác trên nên các giá trị riêng là 2 và 3. Với λ=2, giải (A−2I)v=0 cho vector riêng cùng phương với (1,0); với λ=3, có vector riêng cùng phương với (1,1).</p>", "clar": "<p>Vector riêng phải khác vector không. Một ma trận thực không nhất thiết có đủ giá trị riêng thực; cần lưu ý trường R hay C và quy ước đa thức đặc trưng trong đề.</p>", "ext": "<p>Phân biệt bội đại số của nghiệm đa thức đặc trưng và số chiều không gian riêng (bội hình học); đây là yếu tố quyết định khả năng chéo hóa.</p>", "check": "<p>Với A=diag(4,−1), hãy nêu giá trị riêng và một vector riêng cho mỗi giá trị.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-016</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-005/SUP-LA-008/SUP-LA-013</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Tìm các eigenvalues từ phương trình đặc trưng và eigenvectors qua hệ tuyến tính tương ứng.</li>\n<li><strong>Tiêu chí qua bài:</strong> Lập đúng det(A−λI), tìm nghiệm và giải hệ lấy vector riêng không bằng 0.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 6, §6.1; PDF pp. 208–216; trang in 202–210.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-LA-017", "sort": 317, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Ma trận đồng dạng và điều kiện chéo hóa", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-012", "SUP-LA-016"], "recBg": [], "unlocks": [], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "315be0dd78411982", "substeps": [], "sec": {"exp": "<p>Ma trận A chéo hóa được nếu tồn tại ma trận khả nghịch P và ma trận chéo D sao cho A=PDP⁻¹; cột P là các vector riêng độc lập còn đường chéo D chứa giá trị riêng tương ứng. Có n giá trị riêng phân biệt là một điều kiện đủ thường dùng, nhưng không phải điều kiện cần duy nhất.</p>", "ex": "<p>Với A=[[2,1],[0,3]], có thể lấy P=[[1,1],[0,1]], D=diag(2,3). Kiểm tra AP=PD: cả hai bằng [[2,3],[0,3]], do đó A=PDP⁻¹.</p>", "clar": "<p>Không được đặt cột trong P tùy ý hoặc xếp giá trị riêng ở D sai thứ tự so với vector riêng. Một ma trận có giá trị riêng lặp vẫn có thể chéo hóa, nhưng cần đủ vector riêng độc lập.</p>", "ext": "<p>Nếu A=PDP⁻¹ thì Aⁿ=PDⁿP⁻¹ với n nguyên không âm; đây là lý do chéo hóa hữu ích khi tính lũy thừa ma trận.</p>", "check": "<p>Một ma trận 3×3 có ba vector riêng độc lập. Điều đó cho phép kết luận gì về khả năng chéo hóa?</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-017</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-012/SUP-LA-016</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Xét khả năng chéo hóa bằng số lượng vector riêng độc lập và kiểm tra A=PDP⁻¹.</li>\n<li><strong>Tiêu chí qua bài:</strong> Tạo đúng P,D, kiểm tra khả nghịch của P và xác minh đẳng thức AP=PD.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 6, §6.2; PDF pp. 217–229; trang in 211–223.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-LA-018", "sort": 318, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Dạng song tuyến tính, dạng đối xứng và ma trận biểu diễn", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-012", "SUP-LA-013"], "recBg": [], "unlocks": ["SUP-LA-019", "SUP-LA-020"], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "415b11f82b0739ae", "substeps": [], "sec": {"exp": "<p>Dạng song tuyến tính f(x,y) tuyến tính theo từng đối số khi giữ đối số còn lại cố định. Với cơ sở đã chọn, f được biểu diễn bằng ma trận B sao cho f(x,y)=xᵀBy theo vector tọa độ tương ứng. Dạng đối xứng thỏa f(x,y)=f(y,x), tương ứng ma trận biểu diễn đối xứng trong cơ sở đó.</p>", "ex": "<p>f(x,y)=2x₁y₁+x₁y₂+3x₂y₁+4x₂y₂ có ma trận B=[[2,1],[3,4]] vì các hệ số là các phần tử của xᵀBy. B không đối xứng vì B₁₂≠B₂₁, nên dạng này không đối xứng trong cơ sở chuẩn.</p>", "clar": "<p>Ma trận biểu diễn phụ thuộc cơ sở. Hãy phân biệt đổi tọa độ với đổi biểu diễn dạng; không tráo thứ tự hai đối số mà không kiểm tra tính đối xứng.</p>", "ext": "<p>Dùng phép đổi cơ sở đúng quy ước của giáo trình để hiểu cách ma trận dạng song tuyến tính biến đổi; viết rõ ma trận chuyển cơ sở là từ cơ sở nào sang cơ sở nào.</p>", "check": "<p>Lập ma trận B cho f(x,y)=x₁y₁+5x₁y₂+5x₂y₁−2x₂y₂ và quyết định f có đối xứng không.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-018</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-012/SUP-LA-013</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Kiểm tra tính song tuyến tính/đối xứng và lập ma trận biểu diễn theo cơ sở.</li>\n<li><strong>Tiêu chí qua bài:</strong> Lấy đúng hệ số vào ma trận, kiểm tra đối xứng và giải thích vai trò của cơ sở.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 7, §7.1; PDF pp. 233–236; trang in 227–230.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-LA-019", "sort": 319, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Dạng toàn phương và đưa về dạng chính tắc", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-006", "SUP-LA-018"], "recBg": [], "unlocks": ["SUP-LA-020"], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "2405b6fab9518d89", "substeps": [], "sec": {"exp": "<p>Dạng toàn phương thu được khi cho hai đối số của một dạng song tuyến tính đối xứng trùng nhau. Trong tọa độ, q(x)=xᵀAx với ma trận đối xứng theo quy ước của biểu diễn. Giáo trình trình bày việc đưa dạng toàn phương về dạng chính tắc, gồm phương pháp Lagrange và thuật toán Jacobi; việc đổi biến phải được lưu lại để kiểm tra tính tương đương.</p>", "ex": "<p>q(x,y)=x²+2xy+3y²=(x+y)²+2y². Đặt u=x+y, v=y, ta được q=u²+2v². Đây là một phép đổi biến tuyến tính khả nghịch vì x=u−v, y=v.</p>", "clar": "<p>Khi từ các hệ số của hạng chéo lập ma trận đối xứng A, hệ số của xy được chia đều vào A₁₂ và A₂₁ vì xᵀAx tạo ra 2A₁₂xy. Không ghi dạng chính tắc mà quên điều kiện đổi biến.</p>", "ext": "<p>So sánh hoàn thành bình phương/Lagrange với Jacobi theo trình tự được dạy. Mỗi lần biến đổi phải cho phép quay về biến ban đầu.</p>", "check": "<p>Đưa q(x,y)=x²−2xy+2y² về dạng tổng bình phương qua đổi biến thích hợp.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-019</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-006/SUP-LA-018</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Biểu diễn q(x)=xᵀAx và thực hiện phép đổi biến đưa ví dụ nhỏ về dạng chính tắc theo phương pháp trong giáo trình.</li>\n<li><strong>Tiêu chí qua bài:</strong> Lập được ma trận biểu diễn, ghi phép đổi biến và kiểm tra hai biểu thức tương đương bằng khai triển ngược.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 7, §7.2; PDF pp. 237–244; trang in 231–238.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-LA-020", "sort": 320, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK1", "sup": true, "title": "Chỉ số quán tính, tính xác định và tiêu chuẩn Sylvester", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": ["SUP-LA-006", "SUP-LA-018", "SUP-LA-019"], "recBg": [], "unlocks": [], "verStatus": "reviewed_against_source", "srcRef": "MA003-TEXTBOOK-2019 (Cao Thanh Tình et al., 2019)", "hash": "7e4db0bf0482dff1", "substeps": [], "sec": {"exp": "<p>Sau khi đưa dạng toàn phương về dạng chính tắc, số hệ số dương và âm xác định cặp chỉ số quán tính theo định nghĩa của giáo trình. Dạng xác định dương thỏa q(x)&gt;0 với mọi x khác 0; xác định âm thỏa q(x)&lt;0; nếu đổi dấu theo hướng khác nhau thì có thể là bất định. Giáo trình nêu luật quán tính, các điều kiện về dấu và hệ quả mang tên định lý Sylvester.</p>", "ex": "<p>q(x,y)=x²+y² có q(x,y)&gt;0 với mọi (x,y)≠(0,0), nên xác định dương. q(x,y)=x²−y² dương khi |x|&gt;|y| và âm khi |y|&gt;|x|, nên bất định.</p>", "clar": "<p>Phải kiểm tra giả thiết (đặc biệt tính đối xứng và dạng ma trận của q) trước khi áp dụng tiêu chuẩn. Khi dùng “định thức con chính”, theo sát định nghĩa và quy ước trình bày trong giáo trình/giảng viên; không trộn với định thức con bất kỳ.</p>", "ext": "<p>Lưu một bảng dấu các định thức và kết luận riêng cho xác định dương/âm. Nếu kết luận từ dạng chính tắc, kiểm tra tất cả hệ số và các hệ số 0.</p>", "check": "<p>Phân loại q(x,y)=4x²+2y² và q(x,y)=x²−3y². Nêu phương pháp/định lý nào làm cơ sở kết luận.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-LA-020</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">SUP-LA-006/SUP-LA-018/SUP-LA-019</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Phân loại dạng toàn phương và áp dụng định lý thích hợp với đúng giả thiết.</li>\n<li><strong>Tiêu chí qua bài:</strong> Phân loại đúng các ví dụ chuẩn; nêu đúng điều kiện và không áp dụng định lý vượt ngoài giả thiết.</li>\n<li><strong>Nguồn trong giáo trình:</strong> Chương 7, §§7.3–7.4; PDF pp. 245–249; trang in 239–243.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">reviewed_against_source</code> cho khung/chủ đề chương; ví dụ là diễn giải mới, chưa được thẩm định bởi giảng viên UIT; syllabus đúng khóa/học kỳ chưa xác minh.</li>\n</ul>"}}, {"id": "SUP-PS-001", "sort": 321, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK3", "sup": true, "title": "Mô tả dữ liệu và độ phân tán", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": [], "recBg": ["CPP-033"], "unlocks": ["SUP-PS-004"], "verStatus": "supplemental_needs_course_mapping", "srcRef": "SE_Verification_and_Sources_MA003_final_20261011.md", "hash": "ab955f0681996580", "substeps": [], "sec": {"exp": "<p>Phân biệt population/sample; mean, median, range, variance/standard deviation ở mức đúng theo định nghĩa được dạy.</p>", "ex": "<p>Dataset [2, 3, 3, 10] có mean=18/4=4.5 và median=3. Giá trị 10 kéo mean lên mạnh hơn median; chọn thước đo trung tâm cần xét dạng phân bố và câu hỏi đang trả lời.</p>", "clar": "<p>Đây là module bổ sung. Không coi nó là yêu cầu chính thức của UIT nếu chưa đối chiếu đề cương đúng khóa/học kỳ. Với công thức, thuật toán hoặc hành vi phụ thuộc môi trường, kiểm tra điều kiện áp dụng trước khi kết luận.</p>", "ext": "<p>Tạo một biến thể mới từ ví dụ, viết giả định và kiểm tra bằng lời giải độc lập hoặc test có thể lặp lại. Đối chiếu một giáo trình đại học hoặc tài liệu chính thức được liệt kê trong hồ sơ nguồn.</p>", "check": "<p>Tự giải thích khái niệm chính không nhìn nội dung, làm ví dụ khác số liệu/tình huống và nêu một trường hợp không áp dụng được.</p>", "sync": "<ul>\n<li><strong>Mã chuẩn:</strong> <code class=\"inline-code\">SUP-PS-001</code>.</li>\n<li><strong>Kiến thức nền:</strong> <code class=\"inline-code\">CPP-033/034 hoặc kiến thức bảng tính cơ bản</code>.</li>\n<li><strong>Bằng chứng hoàn thành:</strong> Tóm tắt dataset nhỏ và giải thích vì sao mean bị ảnh hưởng bởi outlier.</li>\n<li><strong>Trạng thái:</strong> <code class=\"inline-code\">supplemental; needs course mapping</code>; chưa có nghĩa là đã kiểm thử/duyệt bởi giảng viên.</li>\n</ul>"}}, {"id": "SUP-PS-002", "sort": 322, "pfx": "SUP", "subj": "SUP", "subjName": "Module Bổ Sung (MA003 Đại Số Tuyến Tính & Mở Rộng)", "cat": "Supplemental Modules", "uitMap": "MA003 (Đại số tuyến tính 2019) / MA005 / Mở rộng", "part": "PHẦN Q — CÁC MODULE BỔ SUNG VÀ MA TRẬN PHỦ KIẾN THỨC", "stage": "51.2. Nội dung tối thiểu theo module", "sem": "HK3", "sup": true, "title": "Không gian mẫu và xác suất cơ bản", "estStatus": "not_estimated", "depStatus": "provisional", "reqPrereqs": [], "provPrereqs": [], "recBg": ["DM-008"], "unlocks": ["SUP-PS-003", "SUP-DM-005"], "verStatus": "supplemental_needs_course_mapping", "srcRef": "SE_Verification_and_Sources_MA003_final_20261011.md", "hash": "bd0260c80a44ff5b", "substeps": [], "sec": {"exp": "<p>Không gian mẫu, biến cố, xác suất trường hợp đồng khả năng; phân biệt phép đếm với giả định xác suất.</p>", "ex": "<p>Với một xúc xắc công bằng, sample space là {1,2,3,4,5,6}. Biến cố “ra số chẵn” gồm {2,4,6}, nên P(chẵn)=3/6=1/2 vì sáu kết quả được giả định đồng khả năng.</p>", "clar": "<p>Đây là module bổ sung. Không coi nó là yêu cầu chính thức của UIT nếu chưa đối chiếu đề cương đúng khóa/học kỳ. Với công thức, thuật toán hoặc hành vi phụ thuộc môi trường, kiểm tra điều kiện áp dụng trước khi kết luận.</p>", "ext": "<p>Tạo một biến thể mới từ ví dụ, viết giả định và kiểm tra bằng lời giải đ
