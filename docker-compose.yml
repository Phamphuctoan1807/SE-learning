version: "3.9"

services:
  se-learning-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: se-learning-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - SESSION_COOKIE_SECURE=true
    volumes:
      - se_learning_data:/tmp
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  se_learning_data:
